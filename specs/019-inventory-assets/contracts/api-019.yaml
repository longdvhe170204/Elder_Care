openapi: 3.1.0
info:
  title: Elder Care – Feature 019 (mua sắm, tài sản, lịch xe)
  version: 1.0.0-design
  description: |
    Hợp đồng REST của feature 019 (M11 billing.internal.procurement, M03 roombedallocation.internal.asset, roombedallocation.internal.vehicle). Kho nguyên liệu (M08 nutrition.kho) bỏ theo Q-392. Quy ước chung theo research R-03 của 000:
    tiền tố /api/v1, lỗi RFC 9457 có errorCode và unmetConditions[], Idempotency-Key cho mọi lệnh ghi.
    Hệ thống không tạo yêu cầu mua sắm (Q-306).
    Lệnh của Phụ trách bộ phận bị chặn khi bộ phận chưa có Phụ trách bộ phận (DEPARTMENT_LEAD_MISSING; Q-292).
    Truy vết: mỗi operation có x-fr (FR của spec 019) và x-br khi có.
    Bản dịch tiếng Anh chủ dự án duyệt 2026-11-06 (glossary mục 25).
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - { name: procurement-requests, description: 'UC-94, UC-95' }
  - { name: assets, description: 'UC-89' }
  - { name: vehicle-schedules, description: 'UC-90' }

paths:
  /procurement-requests:
    get:
      tags: [procurement-requests]
      summary: Yêu cầu mua sắm (bộ phận của tôi; Quản lý viện, Kế toán theo vai trò)
      x-fr: [FR-008]
      parameters: [ { name: status, in: query, schema: { type: string } }, { name: departmentId, in: query, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProcurementRequest' } } } } } }
    post:
      tags: [procurement-requests]
      summary: Lập yêu cầu mua sắm Nháp (Phụ trách bộ phận; Điều dưỡng chỉ loại MEDICATION, FR-008d); yêu cầu bổ sung tham chiếu yêu cầu gốc
      x-fr: [FR-008, FR-008a, FR-008d]
      x-br: [BR-M11-17]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProcurementRequestWrite' } } } }
      responses: { '201': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }
  /procurement-medication-lines:
    get:
      tags: [procurement-requests]
      summary: Dòng thuốc của yêu cầu mua sắm loại thuốc đã ghi đã mua, chưa có lần tiếp nhận Đạt, của người cao tuổi người xem được tiếp nhận thuốc (bổ sung 2026-11-11, Q-410, chủ dự án duyệt)
      description: "Cho màn tiếp nhận thuốc cung ứng của 006; chỉ thông tin thuốc, không giá, lý do, người duyệt. Cần quyền Tiếp nhận thuốc (MEDICATION_RECEIPT, CREATE), lọc theo phạm vi từng người cao tuổi; id gửi ở requestLineId của POST /supplied-medication-intakes."
      x-fr: [FR-008d]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProcurementMedicationLine' } } } } }, '403': { $ref: '#/components/responses/Problem' } }
  /procurement-requests/{id}:
    put:
      tags: [procurement-requests]
      summary: Sửa yêu cầu Nháp
      x-fr: [FR-008]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProcurementRequestWrite' } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /procurement-requests/{id}/{command}:
    post:
      tags: [procurement-requests]
      summary: Lệnh trên yêu cầu mua sắm theo bảng FR-008
      description: |
        submit, withdraw, cancel (Phụ trách bộ phận / người lập); approve (có thể giảm, lý do khi giảm), reject (Quản lý viện);
        record-purchased (số tiền thực tế, ngày, nhà cung cấp, chứng từ; vượt quá CFG-M11-07 bị chặn); confirm-match, return-for-reconciliation, record-discrepancy (Kế toán, không phải người ghi đã mua);
        resolve-discrepancy (Quản lý viện: chấp nhận hoặc yêu cầu hoàn tiền).
      x-fr: [FR-008, FR-008a, FR-008b]
      x-br: [BR-M11-17, BR-M11-18, BR-M11-19]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: command, in: path, required: true, schema: { type: string, enum: [submit, withdraw, cancel, approve, reject, record-purchased, confirm-match, return-for-reconciliation, record-discrepancy, resolve-discrepancy] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ProcurementRequestCommand' } } } }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }

  /assets:
    get:
      tags: [assets]
      summary: Tài sản theo bộ phận, loại, trạng thái, dấu quá hạn
      x-fr: [FR-011, FR-014]
      parameters: [ { name: departmentId, in: query, schema: { type: integer, format: int64 } }, { name: typeId, in: query, schema: { type: integer, format: int64 } }, { name: status, in: query, schema: { type: string } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Asset' } } } } } }
    post:
      tags: [assets]
      summary: Ghi tăng tài sản (không phải loại giường); mua mới gắn yêu cầu mua sắm Đã duyệt và nguyên giá
      x-fr: [FR-011, FR-008c]
      x-br: [DBR-32, DBR-36]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssetWrite' } } } }
      responses: { '201': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /asset-types:
    get:
      tags: [assets]
      summary: 'Danh mục loại tài sản, gồm loại đã ngừng (bổ sung 2026-11-10, chủ dự án duyệt: tên loại, chọn loại khi ghi tăng, lọc xe)'
      x-fr: [FR-011]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AssetType' } } } } } }
    post:
      tags: [assets]
      summary: Tạo, sửa, ngừng loại tài sản (Quản lý viện)
      x-fr: [FR-011]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssetTypeWrite' } } } }
      responses: { '200': { description: OK } }
  /assets/{id}:
    get:
      tags: [assets]
      summary: Chi tiết tài sản và lịch sử (vị trí, bộ phận, bảo trì, hư hỏng)
      x-fr: [FR-012]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AssetDetail' } } } }, '403': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' } }
    put:
      tags: [assets]
      summary: Sửa thông tin mô tả (nhóm 1); Phụ trách bộ phận Chăm sóc bổ sung trường của tài sản giường
      x-fr: [FR-011]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssetWrite' } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /assets/{id}/{command}:
    post:
      tags: [assets]
      summary: Lệnh trên tài sản theo bảng FR-013
      description: |
        put-into-use (vị trí; không phải giường), relocate (lý do; giường đã từng phân bổ bị chặn),
        report-damage (mô tả; giường có người: mức ảnh hưởng bắt buộc, dấu chờ chuyển người), start-maintenance, record-maintenance-result (Đạt/Không đạt; thuê ngoài có chi phí gắn yêu cầu mua sắm),
        remove-transfer-flag (Trưởng tầng, Quản lý viện; lý do; mất an toàn cần nội dung đã sửa và người sửa),
        request-disposal (Phụ trách bộ phận; tạo yêu cầu phê duyệt loại M03.ASSET_DISPOSAL của 000, Quản lý viện duyệt qua endpoint chung của 000),
        transfer-department (Quản lý viện), link-bed-preparation-damage (xác nhận hư hỏng từ 003).
      x-fr: [FR-012, FR-013, FR-015, FR-016]
      x-br: [BR-M03-15, BR-M03-17, BR-M03-18]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: command, in: path, required: true, schema: { type: string, enum: [put-into-use, relocate, report-damage, start-maintenance, record-maintenance-result, remove-transfer-flag, request-disposal, transfer-department, link-bed-preparation-damage] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssetCommand' } } } }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }
  /vehicle-schedules:
    get:
      tags: [vehicle-schedules]
      summary: Lịch xe theo xe, khoảng
      x-fr: [FR-017]
      parameters: [ { name: vehicleId, in: query, schema: { type: integer, format: int64 } }, { name: from, in: query, schema: { type: string, format: date-time } }, { name: to, in: query, schema: { type: string, format: date-time } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VehicleSchedule' } } } } } }
    post:
      tags: [vehicle-schedules]
      summary: Đặt lịch xe (Trưởng tầng, Hành chính, Quản lý viện)
      x-fr: [FR-017, FR-018]
      x-br: [BR-M03-16]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VehicleScheduleWrite' } } } }
      responses: { '201': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /vehicle-schedules/{id}/{command}:
    post:
      tags: [vehicle-schedules]
      summary: "reschedule, cancel (lý do), record-departure, record-return – người đặt, Quản lý viện"
      x-fr: [FR-017, FR-018]
      x-br: [BR-M03-16]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: command, in: path, required: true, schema: { type: string, enum: [reschedule, cancel, record-departure, record-return] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/VehicleScheduleCommand' } } } }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }

components:
  securitySchemes:
    session: { type: http, scheme: bearer, description: 'Token phiên opaque của 002 (A-02)' }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  responses:
    Problem:
      description: Lỗi theo RFC 9457 (research R-03 của 000)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Blocked:
      description: 'STATE_CHANGED, DEPARTMENT_LEAD_MISSING, NOT_DEPARTMENT_LEAD, PROCUREMENT_REQUEST_REQUIRED, PROCUREMENT_REQUEST_NOT_USABLE, SOURCE_ALREADY_LINKED, SELF_APPROVAL_NOT_ALLOWED, APPROVED_AMOUNT_EXCEEDED, RECEIPT_REQUIRED, PURCHASE_RECORDER_CANNOT_RECONCILE, RECEIPT_MISMATCH, HAS_LINKED_SOURCES, ACQUISITION_COST_REQUIRED, BED_ASSET_TYPE_NOT_ALLOWED, BED_OCCUPIED, BED_HAS_ALLOCATION_HISTORY, IMPACT_LEVEL_REQUIRED, VEHICLE_SCHEDULE_OVERLAP, VEHICLE_NOT_AVAILABLE, VEHICLE_INSPECTION_OR_INSURANCE_OVERDUE'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Reason: { type: string, minLength: 1, maxLength: 2000 }
    Problem:
      type: object
      properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string }, errorCode: { type: string }, unmetConditions: { type: array, items: { type: object } } }
    ProcurementRequestLine: { type: object, required: [name, quantity, estimatedUnitPrice], properties: { id: { type: integer, format: int64, readOnly: true, description: 'Id dòng (bổ sung 2026-11-08, chủ dự án duyệt): 006 gửi ở requestLineId của lần tiếp nhận thuốc cung ứng; bỏ qua khi lập, sửa' }, name: { type: string }, quantity: { type: number }, estimatedUnitPrice: { type: integer, format: int64 }, residentId: { type: integer, format: int64 }, prescriptionId: { type: integer, format: int64 }, activeIngredient: { type: string }, strength: { type: string }, dosageForm: { type: string }, unit: { type: string } }, description: 'Với MEDICATION: residentId, prescriptionId (đơn nguồn viện chưa kết thúc), activeIngredient, strength, dosageForm, unit bắt buộc' }
    ProcurementMedicationLine: { type: object, description: 'Q-410 (bổ sung 2026-11-11)', properties: { id: { type: integer, format: int64 }, procurementRequestId: { type: integer, format: int64 }, residentId: { type: integer, format: int64 }, prescriptionId: { type: integer, format: int64 }, medicationName: { type: string }, activeIngredient: { type: string }, strength: { type: string }, dosageForm: { type: string }, quantity: { type: number }, unit: { type: string } } }
    ProcurementRequestWrite:
      type: object
      required: [departmentId, type, lines, reason]
      properties: { departmentId: { type: integer, format: int64 }, type: { type: string, enum: [INGREDIENT, ASSET, SERVICE, MEDICATION, OTHER] }, priority: { type: string, enum: [NORMAL, URGENT], description: 'Bắt buộc khi type = MEDICATION (FR-008d)' }, neededBy: { type: string, format: date-time, description: 'Bắt buộc khi type = MEDICATION' }, relatedFileIds: { type: array, items: { type: integer, format: int64 }, description: 'Tài liệu liên quan, không bắt buộc (FR-008d)' }, lines: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ProcurementRequestLine' } }, reason: { type: string }, neededOn: { type: string, format: date }, reference: { type: object }, originalRequestId: { type: integer, format: int64 } }
    ProcurementRequest:
      allOf:
        - { $ref: '#/components/schemas/ProcurementRequestWrite' }
        - type: object
          properties: { id: { type: integer, format: int64 }, estimatedTotal: { type: integer, format: int64 }, approvedAmount: { type: integer, format: int64 }, actualAmount: { type: integer, format: int64 }, status: { type: string, enum: [DRAFT, PENDING_APPROVAL, APPROVED, PENDING_RECONCILIATION, DISCREPANCY, RECONCILED, REJECTED, CANCELLED] }, linkedSourceTotal: { type: integer, format: int64 }, received: { type: [boolean, 'null'], readOnly: true, description: 'Chỉ loại MEDICATION: mọi dòng có lần tiếp nhận Đạt, đọc từ billing.api.spi.ProcurementIntakePort do 006 cài, sửa 2026-11-08; thiếu nguồn thì null (FR-008d, 11.7)' }, version: { type: integer, readOnly: true, description: 'Phiên bản cho If-Match của PUT (bổ sung 2026-11-10, chủ dự án duyệt)' }, createdByStaffId: { type: integer, format: int64, readOnly: true, description: 'Người lập (bổ sung 2026-11-10)' }, allowedCommands: { type: array, readOnly: true, items: { type: string }, description: 'Lệnh người xem làm được, chỉ để hiện nút (constitution XI); update là sửa Nháp (bổ sung 2026-11-10)' } }
    ProcurementRequestCommand:
      type: object
      properties: { reason: { type: string }, approvedAmount: { type: integer, format: int64 }, actualAmount: { type: integer, format: int64 }, purchasedOn: { type: string, format: date }, supplier: { type: string }, receiptFileIds: { type: array, items: { type: integer, format: int64 } }, discrepancyAmount: { type: integer, format: int64 }, resolution: { type: string, enum: [ACCEPT_DISCREPANCY, REQUEST_REFUND] } }
    Asset:
      type: object
      properties: { id: { type: integer, format: int64 }, code: { type: string }, typeId: { type: integer, format: int64 }, name: { type: string }, departmentId: { type: integer, format: int64 }, status: { type: string, enum: [READY, IN_USE, DAMAGED, UNDER_MAINTENANCE, DISPOSED] }, location: { type: string }, bedId: { type: integer, format: int64 }, flags: { type: array, items: { type: string } }, version: { type: integer, readOnly: true, description: 'Phiên bản cho If-Match của PUT (bổ sung 2026-11-10, chủ dự án duyệt)' }, allowedCommands: { type: array, readOnly: true, items: { type: string }, description: 'Lệnh người xem làm được, chỉ để hiện nút (constitution XI); update là sửa mô tả (bổ sung 2026-11-10)' } }
    AssetDetail:
      description: 'Chi tiết tài sản (FR-012; bổ sung 2026-11-10, chủ dự án duyệt): trường của Asset cộng lịch sử; lần bảo trì, hư hỏng kèm dấu đã đính chính, đã Hủy ghi nhận (đính chính chỉ ghi chú)'
      allOf:
        - { $ref: '#/components/schemas/Asset' }
        - type: object
          properties:
            locations: { type: array, items: { type: object, properties: { type: { type: string, enum: [AREA, FLOOR, ROOM, PARKING_LOT, ASSET_STORAGE] }, id: { type: integer, format: int64 }, from: { type: string, format: date-time }, to: { type: string, format: date-time }, command: { type: string }, actorStaffId: { type: integer, format: int64 }, reason: { type: string } } } }
            departmentTransfers: { type: array, items: { type: object, properties: { fromDepartmentId: { type: integer, format: int64 }, toDepartmentId: { type: integer, format: int64 }, at: { type: string, format: date-time }, actorStaffId: { type: integer, format: int64 }, reason: { type: string } } } }
            maintenances: { type: array, items: { type: object, properties: { id: { type: integer, format: int64 }, kind: { type: string, enum: [MAINTENANCE, INSPECTION, VEHICLE_INSPECTION, INSURANCE] }, result: { type: string, enum: [PASS, FAIL] }, date: { type: string, format: date }, content: { type: string }, performedBy: { type: string }, outsourced: { type: boolean }, cost: { type: integer, format: int64 }, procurementRequestId: { type: integer, format: int64 }, startedAt: { type: string, format: date-time }, confirmedAt: { type: string, format: date-time }, corrected: { type: boolean }, voided: { type: boolean } } } }
            damages: { type: array, items: { type: object, properties: { id: { type: integer, format: int64 }, description: { type: string }, source: { type: string, enum: [DAMAGE_REPORT, BED_PREPARATION] }, impactLevel: { type: string, enum: [UNSAFE, STILL_SAFE] }, awaitingTransfer: { type: boolean }, removalReason: { type: string }, repairDescription: { type: string }, repairedBy: { type: string }, reportedAt: { type: string, format: date-time }, confirmedAt: { type: string, format: date-time }, corrected: { type: boolean }, voided: { type: boolean } } } }
    AssetWrite:
      type: object
      required: [code, typeId, name, departmentId, source]
      properties: { code: { type: string }, typeId: { type: integer, format: int64 }, name: { type: string }, departmentId: { type: integer, format: int64 }, source: { type: string, enum: [PURCHASED, DONATED, TRANSFERRED_IN] }, sourceDescription: { type: string }, procurementRequestId: { type: integer, format: int64 }, acquisitionCost: { type: integer, format: int64 }, inServiceOn: { type: string, format: date }, maintenanceIntervalDays: { type: integer }, maintenanceDueOn: { type: string, format: date }, licensePlate: { type: string }, seatCount: { type: integer }, vehicleInspectionDueOn: { type: string, format: date }, insuranceDueOn: { type: string, format: date } }
    AssetType:
      type: object
      properties: { id: { type: integer, format: int64 }, code: { type: [string, 'null'], description: 'Mã loại hệ thống BED (Giường), VEHICLE (Xe), V019_05; loại do Quản lý viện tạo thì null' }, name: { type: string }, status: { type: string, enum: [ACTIVE, INACTIVE] } }
    AssetTypeWrite:
      type: object
      required: [name]
      properties: { id: { type: integer, format: int64 }, name: { type: string }, status: { type: string } }
    AssetCommand:
      type: object
      properties:
        reason: { type: string }
        location: { type: object, properties: { type: { type: string, enum: [AREA, FLOOR, ROOM, PARKING_LOT, ASSET_STORAGE] }, id: { type: integer, format: int64 } } }
        description: { type: string }
        impactLevel: { type: string, enum: [UNSAFE, STILL_SAFE] }
        result: { type: string, enum: [PASS, FAIL] }
        maintenanceKind: { type: string, enum: [MAINTENANCE, INSPECTION, VEHICLE_INSPECTION, INSURANCE], description: 'Loại lần của start-maintenance; mặc định MAINTENANCE (FR-014; bổ sung 2026-11-06, chủ dự án duyệt)' }
        nextDueOn: { type: string, format: date, description: 'Hạn kế tiếp khi ghi kết quả Đạt của lần đăng kiểm, bảo hiểm (bắt buộc); bảo trì, kiểm định tính bằng ngày + chu kỳ' }
        date: { type: string, format: date }
        content: { type: string }
        performedBy: { type: string }
        outsourced: { type: boolean }
        cost: { type: integer, format: int64 }
        procurementRequestId: { type: integer, format: int64 }
        repairDescription: { type: string }
        repairedBy: { type: string }
