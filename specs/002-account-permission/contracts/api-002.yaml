openapi: 3.1.0
info:
  title: Elder Care – Feature 002 (tài khoản và phân quyền)
  version: 1.0.0-design
  description: |
    Hợp đồng REST của feature 002. Quy ước chung theo research R-03 của feature 000:
    tiền tố /api/v1, lỗi RFC 9457 có errorCode, If-Match cho lệnh sửa, Idempotency-Key cho lệnh ghi.
    Tên định danh tiếng Anh theo glossary.md của 000, mục 7 (dịch 2026-10-19; bản tên logic tiếng Việt ở lịch sử git).
    Xác thực: token phiên opaque (research A-02). Web gửi bằng cookie HttpOnly kèm header X-Requested-From;
    app gửi Authorization: Bearer. Mọi yêu cầu gửi X-Device-Id.
    Truy vết: mỗi operation có x-fr (FR của spec 002) và x-br khi có.
servers:
  - url: /api/v1
tags:
  - name: auth
    description: UC-70; mục B
  - name: accounts
    description: UC-68; mục A, B, G
  - name: permissions
    description: UC-68; mục C
  - name: professional-activities
    description: Mục E
  - name: offline
    description: Mục F (FR-041a, FR-041c)

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Đăng nhập
      description: |
        Sai tên đăng nhập và sai mật khẩu trả cùng mã LOGIN_FAILED (FR-014).
        Mật khẩu đúng nhưng tài khoản không Hoạt động: ACCOUNT_TEMPORARILY_LOCKED (kèm unlocksAt) hoặc ACCOUNT_CONTACT_FACILITY.
        Đăng nhập kết thúc mọi phiên đang mở trên cùng thiết bị (FR-014a, BR-M15-15).
      x-fr: [FR-007, FR-008, FR-010, FR-014, FR-014a, FR-015]
      x-br: [BR-M15-05, BR-M15-15, BR-M15-24]
      security: []
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, channel]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                channel: { type: string, enum: [WEB, STAFF_APP, FAMILY_APP, RESIDENT_APP], description: 'RESIDENT_APP gắn thiết bị và trả thêm deviceToken (FR-069, FR-070)' }
      responses:
        '200':
          description: Đăng nhập thành công. Web nhận cookie phiên; app nhận token trong body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: 'Chỉ trả cho kênh app' }
                  deviceToken: { type: string, description: 'Chỉ kênh RESIDENT_APP, trả một lần khi gắn thiết bị (A-15)' }
                  mustChangePassword: { type: boolean }
                  user: { $ref: '#/components/schemas/UserInfo' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { description: 'DEVICE_ALREADY_BOUND: thiết bị đang gắn với tài khoản người cao tuổi khác (FR-014a, research A-15; bổ sung 2026-10-21, chủ dự án duyệt)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '423': { description: 'ACCOUNT_TEMPORARILY_LOCKED hoặc ACCOUNT_CONTACT_FACILITY', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /auth/logout:
    post:
      tags: [auth]
      summary: Kết thúc phiên hiện tại
      x-fr: [FR-013]
      responses: { '204': { description: Đã đăng xuất } }
  /auth/change-password:
    post:
      tags: [auth]
      summary: Người dùng tự đổi mật khẩu (bắt buộc ở lần đầu, FR-006)
      x-fr: [FR-006]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        '204': { description: Đã đổi; cờ buộc đổi mật khẩu được gỡ }
        '422': { description: 'PASSWORD_POLICY_NOT_MET (research A-03, A-13)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /me:
    get:
      tags: [auth]
      summary: Thông tin người dùng hiện tại
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserInfo' } } } }
  /me/permissions:
    get:
      tags: [auth]
      summary: Tập khóa quyền hiện hành của người dùng, để client ẩn hiện chức năng
      description: Chỉ dùng cho hiển thị; backend luôn kiểm tra lại (FR-042, constitution XI).
      x-fr: [FR-042]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EffectivePermission' } }

  /accounts:
    get:
      tags: [accounts]
      summary: Danh sách tài khoản (Quản lý viện; Hành chính chỉ thấy tài khoản người thân)
      x-fr: [FR-001, FR-051]
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [STAFF, FAMILY_MEMBER] } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, TEMPORARILY_LOCKED, INACTIVE, LOCKED] } }
        - { name: q, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AccountPage' } } } }
    post:
      tags: [accounts]
      summary: Tạo tài khoản nhân viên (chỉ Quản lý viện)
      x-fr: [FR-002, FR-003, FR-004, FR-004a, FR-006]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staffId, username, roles]
              properties:
                staffId: { type: integer, format: int64 }
                username: { type: string }
                roles: { type: array, minItems: 1, items: { $ref: '#/components/schemas/StaffRoleCode' } }
      responses:
        '201':
          description: Đã tạo; mật khẩu tạm chỉ trả một lần
          content: { application/json: { schema: { $ref: '#/components/schemas/AccountWithTemporaryPassword' } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { description: 'PROFILE_ALREADY_HAS_ACCOUNT, STAFF_RESIGNED, POSITION_NOT_SYSTEM_USER', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /family-accounts:
    post:
      tags: [accounts]
      summary: Tạo tài khoản người thân (Hành chính hoặc Quản lý viện)
      x-fr: [FR-050, FR-051, FR-052]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [familyMemberId, username, verification]
              properties:
                familyMemberId: { type: integer, format: int64 }
                username: { type: string }
                verification: { $ref: '#/components/schemas/Verification' }
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/AccountWithTemporaryPassword' } } } }
        '409': { description: 'RELATIONSHIP_ENDED, INVALID_VERIFICATION', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /accounts/{id}:
    get:
      tags: [accounts]
      summary: Chi tiết tài khoản, kèm allowedCommands
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } }
        '404': { $ref: '#/components/responses/Problem' }
  /accounts/{id}/lock:
    post:
      tags: [accounts]
      summary: Khóa tài khoản (Quản lý viện)
      description: Từ chối nếu làm viện không còn Quản lý viện Hoạt động (FR-012). Người đang là Phụ trách bộ phận phải có replacementDepartmentLead (Q-292).
      x-fr: [FR-011, FR-012, FR-013]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/Reason' }
                replacementDepartmentLead: { type: integer, format: int64 }
      responses:
        '200': { $ref: '#/components/responses/AccountOk' }
        '409': { description: 'NO_MANAGER_LEFT, REPLACEMENT_LEAD_REQUIRED', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { $ref: '#/components/responses/Problem' }
  /accounts/{id}/unlock:
    post:
      tags: [accounts]
      summary: Mở khóa tài khoản Đã khóa (Quản lý viện)
      x-fr: [FR-011]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/ReasonBody' }
      responses:
        '200': { $ref: '#/components/responses/AccountOk' }
        '409': { description: 'LOCK_CAUSE_STILL_EXISTS', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /accounts/{id}/early-unlock:
    post:
      tags: [accounts]
      summary: Mở khóa sớm tài khoản đang Khóa tạm
      description: Quản lý viện; hoặc Trưởng tầng, Người phụ trách ca với tài khoản nhân viên cùng tầng/khu và cùng ca, sau khi xác minh trực tiếp (FR-019c). Hành chính không được (CHK008).
      x-fr: [FR-019c]
      x-br: [BR-M15-05]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, verifiedInPerson]
              properties:
                reason: { $ref: '#/components/schemas/Reason' }
                verifiedInPerson: { type: boolean, const: true }
      responses:
        '200': { $ref: '#/components/responses/AccountOk' }
        '403': { $ref: '#/components/responses/Problem' }
  /early-unlock-candidates:
    get:
      tags: [accounts]
      summary: Tài khoản nhân viên đang Khóa tạm người dùng được mở khóa sớm (bổ sung 2026-10-27, màn app nhân viên)
      description: Cùng luật với lệnh early-unlock. Quản lý viện thấy mọi tài khoản nhân viên Khóa tạm; Trưởng tầng, Người phụ trách ca thấy người cùng tầng và ca; người khác nhận danh sách trống.
      x-fr: [FR-019c]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EarlyUnlockCandidatePage' } } } }
  /accounts/{id}/reactivate:
    post:
      tags: [accounts]
      summary: Kích hoạt lại tài khoản người thân Không hoạt động
      x-fr: [FR-011, FR-051, FR-052]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, verification]
              properties:
                reason: { $ref: '#/components/schemas/Reason' }
                verification: { $ref: '#/components/schemas/Verification' }
      responses:
        '200': { $ref: '#/components/responses/AccountOk' }
        '409': { $ref: '#/components/responses/Problem' }
  /accounts/{id}/reset-password:
    post:
      tags: [accounts]
      summary: Cấp lại mật khẩu (nhân viên - Quản lý viện; người thân - Hành chính, Quản lý viện)
      x-fr: [FR-006, FR-051, FR-052]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/Reason' }
                verification: { $ref: '#/components/schemas/Verification' }
      responses:
        '200': { description: 'Mật khẩu tạm, chỉ trả một lần', content: { application/json: { schema: { type: object, properties: { temporaryPassword: { type: string } } } } } }
  /accounts/{id}/assign-role:
    post:
      tags: [permissions]
      summary: Gán thêm vai trò (Quản lý viện)
      x-fr: [FR-017, FR-026, FR-027]
      x-br: [BR-M15-04, BR-M15-17]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatchPermission' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, reason]
              properties:
                role: { $ref: '#/components/schemas/StaffRoleCode' }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200': { $ref: '#/components/responses/AccountPermissionsOk' }
        '409': { description: 'RESIDENT_ACCOUNT_HAS_NO_ROLES (bổ sung 2026-10-18)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { $ref: '#/components/responses/Problem' }
  /accounts/{id}/remove-role:
    post:
      tags: [permissions]
      summary: 'Gỡ vai trò (Quản lý viện); không gỡ vai trò cuối cùng; không làm mất Quản lý viện cuối cùng; tài khoản người cao tuổi: 409 RESIDENT_ACCOUNT_HAS_NO_ROLES (bổ sung 2026-10-18)'
      x-fr: [FR-004, FR-012, FR-026, FR-027]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatchPermission' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, reason]
              properties:
                role: { $ref: '#/components/schemas/StaffRoleCode' }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200': { $ref: '#/components/responses/AccountPermissionsOk' }
        '409': { $ref: '#/components/responses/Problem' }
  /accounts/{id}/permissions:
    get:
      tags: [permissions]
      summary: Tập quyền của tài khoản, hiện hành hoặc tại một thời điểm quá khứ (Quản lý viện)
      x-fr: [FR-026a]
      x-br: [BR-M15-16]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: asOf, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AccountPermissions' } } }
  /accounts/{id}/restrict:
    post:
      tags: [permissions]
      summary: Thu hẹp quyền theo tài khoản
      x-fr: [FR-025, FR-026]
      x-br: [BR-M15-18]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatchPermission' } ]
      requestBody: { $ref: '#/components/requestBodies/RestrictBody' }
      responses:
        '200': { $ref: '#/components/responses/AccountPermissionsOk' }
        '409': { description: 'EXCEEDS_MAXIMUM_PERMISSION, NO_MANAGER_LEFT', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /accounts/{id}/restore-permission:
    post:
      tags: [permissions]
      summary: Khôi phục một quyền đã thu hẹp theo tài khoản về mức ma trận
      x-fr: [FR-025]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatchPermission' } ]
      requestBody: { $ref: '#/components/requestBodies/RestoreBody' }
      responses: { '200': { $ref: '#/components/responses/AccountPermissionsOk' } }
  /accounts/{id}/grant-care-plan-approval:
    post:
      tags: [permissions]
      summary: Gán quyền Duyệt kế hoạch chăm sóc cho tài khoản Điều dưỡng (ngoại lệ duy nhất vượt ma trận, Q-07)
      x-fr: [FR-024]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatchPermission' } ]
      requestBody: { $ref: '#/components/requestBodies/ReasonBody' }
      responses: { '200': { $ref: '#/components/responses/AccountPermissionsOk' } }
  /accounts/{id}/revoke-care-plan-approval:
    post:
      tags: [permissions]
      summary: Gỡ quyền Duyệt kế hoạch chăm sóc đã gán thêm
      x-fr: [FR-024]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatchPermission' } ]
      requestBody: { $ref: '#/components/requestBodies/ReasonBody' }
      responses: { '200': { $ref: '#/components/responses/AccountPermissionsOk' } }
  /roles:
    get:
      tags: [permissions]
      summary: Danh sách 9 vai trò
      x-fr: [FR-016]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RoleInfo' } } } } }
  /roles/{code}/permissions:
    get:
      tags: [permissions]
      summary: Quyền tối đa (ma trận) và quyền hiện hành của vai trò sau thu hẹp
      x-fr: [FR-018, FR-020]
      parameters: [ { $ref: '#/components/parameters/RoleCode' } ]
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/RolePermissions' } } }
  /roles/{code}/restrict:
    post:
      tags: [permissions]
      summary: Thu hẹp quyền theo vai trò
      x-fr: [FR-025, FR-026]
      x-br: [BR-M15-18]
      parameters: [ { $ref: '#/components/parameters/RoleCode' }, { $ref: '#/components/parameters/IfMatchPermission' } ]
      requestBody: { $ref: '#/components/requestBodies/RestrictBody' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RolePermissions' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
  /roles/{code}/restore-permission:
    post:
      tags: [permissions]
      summary: Khôi phục quyền đã thu hẹp theo vai trò
      x-fr: [FR-025]
      parameters: [ { $ref: '#/components/parameters/RoleCode' }, { $ref: '#/components/parameters/IfMatchPermission' } ]
      requestBody: { $ref: '#/components/requestBodies/RestoreBody' }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RolePermissions' } } } } }

  /professional-activities:
    get:
      tags: [professional-activities]
      summary: Danh mục nghiệp vụ chuyên môn
      x-fr: [FR-036]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProfessionalActivity' } } } } }
    post:
      tags: [professional-activities]
      summary: Thêm mục (Quản lý viện)
      x-fr: [FR-036]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProfessionalActivityInput' } } }
      responses:
        '201':
          description: Đã tạo
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ProfessionalActivity' } } }
  /professional-activities/{id}:
    put:
      tags: [professional-activities]
      summary: Sửa mục (Quản lý viện)
      x-fr: [FR-036]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProfessionalActivityInput' } } }
      responses: { '200': { $ref: '#/components/responses/ProfessionalActivityOk' } }
  /professional-activities/{id}/deactivate:
    post:
      tags: [professional-activities]
      summary: Ngừng hiệu lực; mục mặc định không ngừng được
      x-fr: [FR-036]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/ReasonBody' }
      responses:
        '200': { $ref: '#/components/responses/ProfessionalActivityOk' }
        '409': { description: 'DEFAULT_ITEM', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /sync:
    post:
      tags: [offline]
      summary: Đồng bộ lô bản ghi ngoại tuyến của app nhân viên
      description: Kết quả từng bản ghi theo research A-11 (BR-M15-20). Nếu tài khoản không còn Hoạt động, phản hồi kèm sessionEnded = true.
      x-fr: [FR-041a, FR-041c]
      x-br: [BR-M15-20]
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lastConnectedAt, records]
              properties:
                lastConnectedAt: { type: string, format: date-time }
                records:
                  type: array
                  items:
                    type: object
                    required: [idempotencyKey, recordType, deviceTime, content]
                    properties:
                      idempotencyKey: { type: string, format: uuid }
                      recordType: { type: string, example: M04.CARE_TASK_RESULT }
                      deviceTime: { type: string, format: date-time }
                      content: { type: object }
      responses:
        '200':
          description: Kết quả từng bản ghi
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionEnded: { type: boolean }
                  residentsInScope: { type: array, items: { type: integer, format: int64 } }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        idempotencyKey: { type: string, format: uuid }
                        result: { type: string, enum: [ACCEPTED, ACCEPTED_WITH_FLAG, PENDING_REVIEW, REJECTED] }
                        reason: { type: string }
                        reference: { type: string }
  /pending-review-records:
    get:
      tags: [offline]
      summary: Bản ghi chờ xem lại thuộc quyền quyết định của người dùng
      x-fr: [FR-041c]
      parameters: [ { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PendingReviewRecordPage' } } } }
  /pending-review-records/{id}/accept:
    post:
      tags: [offline]
      summary: Chấp nhận; bản ghi có hiệu lực từ lúc chấp nhận
      x-fr: [FR-041c]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200': { $ref: '#/components/responses/PendingReviewRecordOk' }
        '409': { description: 'ALREADY_PROCESSED', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /pending-review-records/{id}/reject:
    post:
      tags: [offline]
      summary: Từ chối, lý do bắt buộc; bản ghi được lưu nhưng không có hiệu lực
      x-fr: [FR-041c]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/ReasonBody' }
      responses: { '200': { $ref: '#/components/responses/PendingReviewRecordOk' } }

  # --- Bổ sung 2026-10-18: tài khoản người cao tuổi (mục H; Q-365, Q-368, Q-370, Q-371) ---
  /resident-accounts:
    post:
      tags: [accounts]
      summary: Tạo tài khoản người cao tuổi theo lời chính người cao tuổi (Hành chính hoặc Quản lý viện)
      description: Người cao tuổi phải Đang lưu trú và chưa có tài khoản. Không có consent thì 422 (FR-067).
      x-fr: [FR-067, FR-068]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [residentId, username, consent]
              properties:
                residentId: { type: integer, format: int64 }
                username: { type: string }
                consent: { $ref: '#/components/schemas/ResidentConsent' }
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/AccountWithTemporaryPassword' } } } }
        '409': { description: 'ALREADY_HAS_ACCOUNT, NOT_IN_RESIDENCE', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /accounts/{id}/login-qr-code:
    post:
      tags: [accounts]
      summary: Tạo mã QR đăng nhập dùng một lần (Hành chính, Quản lý viện, Điều dưỡng có phạm vi)
      description: Mã hết hạn sau CFG-M15-11; tạo mã mới làm mã cũ chưa dùng hết hiệu lực. Chỉ tài khoản người cao tuổi.
      x-fr: [FR-069]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '201':
          description: Mã chỉ trả một lần
          content: { application/json: { schema: { type: object, properties: { code: { type: string }, expiresAt: { type: string, format: date-time } } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { description: 'NOT_RESIDENT_ACCOUNT, ACCOUNT_LOCKED', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /auth/qr-login:
    post:
      tags: [auth]
      summary: Người cao tuổi đăng nhập bằng mã QR; gắn thiết bị
      description: |
        Một transaction: kiểm mã, gỡ thiết bị đang gắn (kết thúc phiên trên đó), gắn X-Device-Id, tạo phiên kênh RESIDENT_APP
        (không hết theo thời gian) và token thiết bị cho nút SOS (research A-15).
      x-fr: [FR-069, FR-070, FR-013a]
      x-br: [BR-M15-24]
      security: []
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses:
        '200':
          description: Đã đăng nhập và gắn thiết bị
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  deviceToken: { type: string, description: Trả một lần; app lưu trong kho an toàn }
                  user: { $ref: '#/components/schemas/UserInfo' }
        '401': { description: 'INVALID_QR_CODE (đã dùng, hết hạn, đã vô hiệu)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'DEVICE_ALREADY_BOUND (thiết bị đang gắn với tài khoản người cao tuổi khác)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '423': { $ref: '#/components/responses/Problem' }
  /accounts/{id}/unbind-device:
    post:
      tags: [accounts]
      summary: Gỡ thiết bị đang gắn (Hành chính hoặc Quản lý viện), ví dụ khi người cao tuổi báo mất máy
      x-fr: [FR-070]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/ReasonBody' }
      responses:
        '200': { $ref: '#/components/responses/AccountOk' }
        '409': { description: 'NO_BOUND_DEVICE', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /accounts/{id}/lock-resident:
    post:
      tags: [accounts]
      summary: Khóa tài khoản người cao tuổi theo yêu cầu của chính người cao tuổi hoặc có lý do (Hành chính, Quản lý viện)
      description: |
        Người thân đề nghị khóa thì Hành chính lập yêu cầu loại M15.RESIDENT_ACCOUNT_LOCK qua API yêu cầu phê duyệt của 000;
        tài khoản chỉ khóa khi Quản lý viện duyệt (research A-16). Khóa do kết thúc lưu trú không qua endpoint này.
      x-fr: [FR-072]
      x-br: [BR-M15-23]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [basis, reason]
              properties:
                basis: { type: string, enum: [RESIDENT_REQUESTED, WITH_REASON] }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200': { $ref: '#/components/responses/AccountOk' }
        '412': { $ref: '#/components/responses/Problem' }
  /accounts/{id}/unlock-resident:
    post:
      tags: [accounts]
      summary: Mở khóa tài khoản người cao tuổi khi chính người cao tuổi yêu cầu
      x-fr: [FR-073]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [consent], properties: { consent: { $ref: '#/components/schemas/ResidentConsent' } } } } }
      responses:
        '200': { $ref: '#/components/responses/AccountOk' }
        '409': { description: 'LOCK_CAUSE_STILL_EXISTS (khóa do kết thúc lưu trú)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: Token phiên opaque (research A-02). Web dùng cookie session cùng header X-Requested-From.
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    RoleCode: { name: code, in: path, required: true, schema: { type: string, enum: [AC-01, AC-02, AC-03, AC-04, AC-05, AC-07, AC-09, AC-10, AC-14, AC-16] } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    IfMatchPermission: { name: If-Match, in: header, required: true, description: 'permission_version của tài khoản hoặc vai trò (FR-026)', schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    DeviceId: { name: X-Device-Id, in: header, required: true, schema: { type: string, format: uuid } }
    Cursor: { name: cursor, in: query, description: Khóa trang kế tiếp, schema: { type: string } }
  headers:
    ETag: { schema: { type: string } }
  requestBodies:
    ReasonBody:
      required: true
      content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { $ref: '#/components/schemas/Reason' } } } } }
    RestrictBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [function, operation, kind, reason]
            properties:
              function: { type: string, description: 'Mã dòng Phụ lục 27, ví dụ COST_ADJUSTMENT' }
              operation: { $ref: '#/components/schemas/Operation' }
              kind: { type: string, enum: [REMOVE_OPERATION, LOWER_SCOPE] }
              metricGroup: { type: string, description: 'Chỉ với DASHBOARD_REPORT (feature 016 FR-010a)' }
              channel: { type: string, enum: [DASHBOARD, REPORT] }
              reason: { $ref: '#/components/schemas/Reason' }
    RestoreBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [restrictionId, reason]
            properties:
              restrictionId: { type: integer, format: int64 }
              reason: { $ref: '#/components/schemas/Reason' }
  responses:
    Problem:
      description: Lỗi theo RFC 9457 (research R-03 của 000)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    AccountOk:
      description: OK
      headers: { ETag: { $ref: '#/components/headers/ETag' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } }
    AccountPermissionsOk:
      description: OK
      headers: { ETag: { $ref: '#/components/headers/ETag' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/AccountPermissions' } } }
    ProfessionalActivityOk:
      description: OK
      headers: { ETag: { $ref: '#/components/headers/ETag' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ProfessionalActivity' } } }
    PendingReviewRecordOk:
      description: OK
      headers: { ETag: { $ref: '#/components/headers/ETag' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/PendingReviewRecord' } } }
  schemas:
    Reason: { type: string, minLength: 1, maxLength: 2000 }
    Operation: { type: string, enum: [VIEW, CREATE, UPDATE, CONFIRM, APPROVE, FINALIZE, PROFESSIONAL] }
    StaffRoleCode: { type: string, enum: [AC-01, AC-02, AC-03, AC-04, AC-05, AC-07, AC-09, AC-14] }
    Verification:
      type: object
      required: [method]
      description: FR-052. CALLBACK_REGISTERED_NUMBER phải trùng số trong hồ sơ người thân (012).
      properties:
        method: { type: string, enum: [IN_PERSON_ID_DOCUMENT, CALLBACK_REGISTERED_NUMBER] }
        idDocumentNumber: { type: string }
        calledPhoneNumber: { type: string }
    ResidentConsent:
      type: object
      required: [method, withStaffId]
      description: Bổ sung 2026-10-18 (FR-067, FR-073). Người cao tuổi yêu cầu hoặc đồng ý trực tiếp với nhân viên nào.
      properties:
        method: { type: string, enum: [REQUESTED, AGREED] }
        withStaffId: { type: integer, format: int64 }
    UserInfo:
      type: object
      properties:
        accountId: { type: integer, format: int64 }
        type: { type: string, enum: [STAFF, FAMILY_MEMBER, RESIDENT] }
        fullName: { type: string }
        roles: { type: array, items: { type: string } }
        mustChangePassword: { type: boolean }
    Account:
      type: object
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        fullName: { type: string, description: 'Họ tên theo hồ sơ liên kết (T032a; bổ sung 2026-10-20, chủ dự án duyệt)' }
        type: { type: string, enum: [STAFF, FAMILY_MEMBER, RESIDENT] }
        staffId: { type: integer, format: int64 }
        familyMemberId: { type: integer, format: int64 }
        residentId: { type: integer, format: int64 }
        boundDevice: { type: object, description: 'Chỉ với tài khoản người cao tuổi (FR-070)', properties: { boundAt: { type: string, format: date-time }, deviceId: { type: string } } }
        status: { type: string, enum: [ACTIVE, TEMPORARILY_LOCKED, INACTIVE, LOCKED] }
        lockCause: { type: string }
        lockedUntil: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time }
        roles: { type: array, items: { type: string } }
        allowedCommands: { type: array, items: { type: string } }
    AccountWithTemporaryPassword:
      allOf:
        - { $ref: '#/components/schemas/Account' }
        - { type: object, properties: { temporaryPassword: { type: string } } }
    AccountPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Account' } }
        nextCursor: { type: string }
    RoleInfo:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        accountType: { type: string }
        executionScope: { type: string, enum: [ASSIGNED, FACILITY, RELATIONSHIP] }
    EffectivePermission:
      type: object
      properties:
        function: { type: string }
        operation: { $ref: '#/components/schemas/Operation' }
        scope: { type: string, enum: [FACILITY, ASSIGNED, RELATIONSHIP] }
        footnoteCodes: { type: array, items: { type: string } }
        source: { type: string, enum: [ROLE, DUTY, ADDITIONAL_GRANT] }
    RolePermissions:
      type: object
      properties:
        role: { type: string }
        maximum: { type: array, items: { $ref: '#/components/schemas/EffectivePermission' } }
        restrictions: { type: array, items: { $ref: '#/components/schemas/Restriction' } }
        current: { type: array, items: { $ref: '#/components/schemas/EffectivePermission' } }
    AccountPermissions:
      type: object
      properties:
        accountId: { type: integer, format: int64 }
        asOf: { type: string, format: date-time }
        status: { type: string }
        roles: { type: array, items: { type: string } }
        roleRestrictions: { type: array, items: { $ref: '#/components/schemas/Restriction' } }
        accountRestrictions: { type: array, items: { $ref: '#/components/schemas/Restriction' } }
        additionalGrants: { type: array, items: { $ref: '#/components/schemas/EffectivePermission' } }
        current: { type: array, items: { $ref: '#/components/schemas/EffectivePermission' } }
    Restriction:
      type: object
      properties:
        id: { type: integer, format: int64 }
        function: { type: string }
        operation: { $ref: '#/components/schemas/Operation' }
        kind: { type: string, enum: [REMOVE_OPERATION, LOWER_SCOPE] }
        effectiveFrom: { type: string, format: date-time }
        reason: { type: string }
    ProfessionalActivity:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        function: { type: string }
        requiredLicenseType: { type: string }
        requiredPracticeScopes: { type: array, items: { type: integer, format: int64 } }
        requiresFacilityScope: { type: boolean }
        isDefault: { type: boolean }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        version: { type: integer, description: 'Giá trị If-Match của lệnh sửa, ngừng hiệu lực (bổ sung 2026-10-21, chủ dự án duyệt)' }
    ProfessionalActivityInput:
      type: object
      required: [name, function, requiredLicenseType, requiresFacilityScope, reason]
      properties:
        name: { type: string }
        function: { type: string }
        requiredLicenseType: { type: string }
        requiredPracticeScopes: { type: array, items: { type: integer, format: int64 } }
        requiresFacilityScope: { type: boolean }
        reason: { $ref: '#/components/schemas/Reason' }
    # Bổ sung 2026-10-20 (T058): hợp đồng chưa có schema phản hồi của bản ghi chờ xem lại; cột theo data-model mục 5
    PendingReviewRecord:
      type: object
      properties:
        id: { type: integer, format: int64 }
        recordType: { type: string, example: M04.CARE_TASK_RESULT }
        content: { type: object, description: Nội dung gốc từ thiết bị }
        recorderId: { type: integer, format: int64, description: Tài khoản người ghi }
        recorderName: { type: string, description: 'Bổ sung 2026-10-27: họ tên người ghi để hiển thị' }
        deviceTime: { type: string, format: date-time }
        syncedAt: { type: string, format: date-time }
        lastConnectedAt: { type: string, format: date-time }
        pendingReason: { type: string, enum: [LATER_THAN_SYNC, EARLIER_THAN_LAST_CONNECTION, EXCEEDS_CFG_M15_08] }
        floorAreaId: { type: integer, format: int64, description: 'Rỗng: không gắn tầng, Quản lý viện quyết định' }
        floorAreaName: { type: string, description: 'Bổ sung 2026-10-27: tên tầng/khu vực để hiển thị (M03 cài FloorAreaNameApi); rỗng khi không gắn tầng' }
        status: { type: string, enum: [PENDING_REVIEW, ACCEPTED, REJECTED] }
        decidedBy: { type: integer, format: int64 }
        decidedAt: { type: string, format: date-time }
        rejectionReason: { type: string }
        reference: { type: string, description: Tham chiếu bản ghi thật khi đã chấp nhận }
        version: { type: integer, format: int64, description: 'Bổ sung 2026-10-27: phiên bản dòng, gửi lại trong If-Match' }
    EarlyUnlockCandidate:
      type: object
      description: Bổ sung 2026-10-27 (FR-019c)
      properties:
        accountId: { type: integer, format: int64 }
        fullName: { type: string }
        lockedUntil: { type: string, format: date-time }
        version: { type: integer, format: int64, description: 'Gửi lại trong If-Match của early-unlock' }
    EarlyUnlockCandidatePage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/EarlyUnlockCandidate' } }
    PendingReviewRecordPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PendingReviewRecord' } }
        nextCursor: { type: string }
    Problem:
      type: object
      description: RFC 9457 cùng errorCode (000 R-03), giống schema Problem của api-000. Với 403 có failedLayer, license (FR-043).
      required: [type, title, status, errorCode]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errorCode: { type: string }
        unmetConditions: { type: array, items: { type: object, properties: { code: { type: string }, description: { type: string }, basis: { type: string, description: "BR/FR, ví dụ BR-M12-03" }, module: { type: string, description: "Feature sở hữu điều kiện, ví dụ 013" }, waivable: { type: boolean, description: "Miễn được qua yêu cầu phê duyệt (004)" } } } }
        currentValue: { description: 'Khi 412: tài nguyên hiện hành' }
        candidates: { type: array, description: "POSSIBLE_DUPLICATE_PROFILE, DUPLICATE_HEALTH_ITEM (001)", items: { type: object } }
        failedLayer: { type: string, enum: [ROLE, SCOPE, LEGAL, SOURCE_DATA] }
        license: { type: object, properties: { name: { type: string }, expiryDate: { type: string, format: date } } }
        unlocksAt: { type: string, format: date-time, description: 'Khi 423 ACCOUNT_TEMPORARILY_LOCKED (FR-014)' }
security:
  - session: []
