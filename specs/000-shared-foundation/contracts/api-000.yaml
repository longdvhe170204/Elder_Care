openapi: 3.1.0
info:
  title: Elder Care – Feature 000 (nền tảng dùng chung)
  version: 1.0.0-design
  description: |
    Hợp đồng REST của feature 000. Quy ước chung: research R-03.
    Mọi endpoint cần xác thực (feature 002). Người thân (AC-10) bị từ chối ở mọi endpoint của file này.
    Truy vết: mỗi operation có x-fr (FR của spec 000) và x-br khi có.
servers:
  - url: /api/v1
tags:
  - name: tham-so
    description: Mục B – UC-69
  - name: yeu-cau-phe-duyet
    description: Mục D – UC-14
  - name: dinh-chinh
    description: Mục C
  - name: nhat-ky
    description: Mục E
  - name: kiem-thu
    description: Chỉ có ở profile test/demo (NFR-13)

paths:
  /tham-so:
    get:
      tags: [tham-so]
      summary: Danh sách tham số với giá trị hiện hành và mặc định
      x-fr: [FR-011]
      parameters:
        - { name: module, in: query, schema: { type: string, example: M15 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ThamSo' } }
        '403': { $ref: '#/components/responses/Loi' }
  /tham-so/{ma}:
    get:
      tags: [tham-so]
      summary: Chi tiết một tham số
      x-fr: [FR-011, FR-012]
      parameters: [ { $ref: '#/components/parameters/MaThamSo' } ]
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThamSo' }
        '404': { $ref: '#/components/responses/Loi' }
  /tham-so/{ma}/doi-gia-tri:
    post:
      tags: [tham-so]
      summary: Đổi giá trị (kể cả khôi phục mặc định)
      description: Chỉ Quản lý viện (BR-M15-04). Có hiệu lực ngay sau commit (FR-016).
      x-fr: [FR-013, FR-014, FR-015, FR-016, FR-020, FR-021, FR-022]
      x-br: [BR-M15-04]
      parameters:
        - { $ref: '#/components/parameters/MaThamSo' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lyDo]
              properties:
                giaTri: { description: 'Giá trị mới, theo kiểu của tham số. Bỏ trống khi khoiPhucMacDinh = true' }
                khoiPhucMacDinh: { type: boolean, default: false }
                lyDo: { $ref: '#/components/schemas/LyDo' }
      responses:
        '200':
          description: Đã lưu
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThamSo' }
        '403': { $ref: '#/components/responses/Loi' }
        '412': { description: 'Giá trị đã bị đổi; body chứa giaTriHienHanh (FR-021)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } } }
        '422': { description: 'THIEU_LY_DO hoặc GIA_TRI_KHONG_HOP_LE (FR-015)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } } }
  /tham-so/{ma}/lich-su:
    get:
      tags: [tham-so]
      summary: Lịch sử giá trị; hoặc giá trị tại một thời điểm quá khứ
      x-fr: [FR-012, FR-019]
      parameters:
        - { $ref: '#/components/parameters/MaThamSo' }
        - { name: taiThoiDiem, in: query, schema: { type: string, format: date-time }, description: 'Có thì trả đúng một dòng hiện hành tại thời điểm đó' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LichSuThamSo' } }

  /yeu-cau-phe-duyet:
    post:
      tags: [yeu-cau-phe-duyet]
      summary: Lập yêu cầu (trạng thái Nháp)
      x-fr: [FR-031, FR-032]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loai, noiDung, ngayHieuLucMongMuon, lyDo]
              properties:
                loai: { type: string, example: M02.THAY_DOI_LUU_TRU }
                noiDung: { type: object, description: 'Schema do module sở hữu loại định nghĩa' }
                ngayHieuLucMongMuon: { type: string, format: date }
                lyDo: { $ref: '#/components/schemas/LyDo' }
                guiDuyetNgay: { type: boolean, default: false, description: 'Lập và gửi duyệt trong một lệnh' }
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/YeuCau' } } } }
        '403': { $ref: '#/components/responses/Loi' }
        '422': { $ref: '#/components/responses/Loi' }
    get:
      tags: [yeu-cau-phe-duyet]
      summary: Danh sách yêu cầu trong phạm vi người dùng
      parameters:
        - { name: hop, in: query, schema: { type: string, enum: [CUA_TOI, CHO_TOI_DUYET, TAT_CA_TRONG_PHAM_VI] } }
        - { name: trangThai, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: loai, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Sau' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TrangYeuCau' } } } }
  /yeu-cau-phe-duyet/{id}:
    get:
      tags: [yeu-cau-phe-duyet]
      summary: Chi tiết yêu cầu
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/YeuCau' } } }
        '404': { $ref: '#/components/responses/Loi' }
  /yeu-cau-phe-duyet/{id}/sua-noi-dung:
    post:
      tags: [yeu-cau-phe-duyet]
      summary: Sửa nội dung khi còn Nháp
      x-fr: [FR-033]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [noiDung, lyDo]
              properties:
                noiDung: { type: object }
                ngayHieuLucMongMuon: { type: string, format: date }
                lyDo: { $ref: '#/components/schemas/LyDo' }
      responses:
        '200': { $ref: '#/components/responses/DaChuyen' }
        '403': { $ref: '#/components/responses/Loi' }
        '409': { $ref: '#/components/responses/XungDot' }
        '412': { $ref: '#/components/responses/SaiPhienBan' }
        '422': { $ref: '#/components/responses/Loi' }
  /yeu-cau-phe-duyet/{id}/gui-duyet:
    post:
      tags: [yeu-cau-phe-duyet]
      summary: Gửi duyệt (Nháp → Chờ duyệt)
      x-fr: [FR-033]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200': { $ref: '#/components/responses/DaChuyen' }
        '403': { $ref: '#/components/responses/Loi' }
        '409': { $ref: '#/components/responses/XungDot' }
        '412': { $ref: '#/components/responses/SaiPhienBan' }
        '422': { $ref: '#/components/responses/Loi' }
  /yeu-cau-phe-duyet/{id}/duyet:
    post:
      tags: [yeu-cau-phe-duyet]
      summary: Duyệt (Chờ duyệt → Đã duyệt (chờ hiệu lực)); áp dụng ngay nếu ngày hiệu lực ≤ hôm nay
      description: Quyền, phạm vi và giới hạn vai trò của loại yêu cầu (`gioiHanVaiTroDuyet`, bổ sung theo plan 004) xét tại lúc quyết định; không đạt thì 403.
      x-fr: [FR-034, FR-034a, FR-035, FR-037, FR-040]
      x-br: [BR-M15-01]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                yKien: { type: string, maxLength: 2000, description: 'Bắt buộc khi tự duyệt (FR-035)' }
      responses:
        '200': { $ref: '#/components/responses/DaChuyen' }
        '403': { $ref: '#/components/responses/Loi' }
        '409': { $ref: '#/components/responses/XungDot' }
        '412': { $ref: '#/components/responses/SaiPhienBan' }
        '422': { $ref: '#/components/responses/Loi' }
  /yeu-cau-phe-duyet/{id}/tu-choi:
    post:
      tags: [yeu-cau-phe-duyet]
      summary: Từ chối
      description: Cùng điều kiện người duyệt như lệnh Duyệt (kể cả `gioiHanVaiTroDuyet`); không đạt thì 403.
      x-fr: [FR-034, FR-036, FR-040]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [yKien], properties: { yKien: { $ref: '#/components/schemas/LyDo' } } }
      responses:
        '200': { $ref: '#/components/responses/DaChuyen' }
        '403': { $ref: '#/components/responses/Loi' }
        '409': { $ref: '#/components/responses/XungDot' }
        '412': { $ref: '#/components/responses/SaiPhienBan' }
        '422': { $ref: '#/components/responses/Loi' }
  /yeu-cau-phe-duyet/{id}/huy:
    post:
      tags: [yeu-cau-phe-duyet]
      summary: Hủy (Nháp/Chờ duyệt bởi người yêu cầu; Đã duyệt bởi người có quyền duyệt)
      x-fr: [FR-031]
      x-br: [BR-M15-08]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [lyDo], properties: { lyDo: { $ref: '#/components/schemas/LyDo' } } }
      responses:
        '200': { $ref: '#/components/responses/DaChuyen' }
        '403': { $ref: '#/components/responses/Loi' }
        '409': { $ref: '#/components/responses/XungDot' }
        '412': { $ref: '#/components/responses/SaiPhienBan' }
        '422': { $ref: '#/components/responses/Loi' }

  /dinh-chinh/{loaiBanGhi}/{idBanGhiGoc}:
    get:
      tags: [dinh-chinh]
      summary: Chuỗi đính chính của một bản ghi gốc và giá trị hiện hành
      x-fr: [FR-027, FR-028]
      parameters:
        - { name: loaiBanGhi, in: path, required: true, schema: { type: string, example: M07.LIEU_THUOC } }
        - { name: idBanGhiGoc, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ChuoiDinhChinh' } } } }
        '404': { $ref: '#/components/responses/Loi' }
    post:
      tags: [dinh-chinh]
      summary: Tạo bản đính chính (cách A/B → 201; cách C → 202 kèm yêu cầu phê duyệt)
      description: |
        Mỗi module có thể có endpoint riêng gọn hơn (ví dụ POST /lieu-thuoc/{id}/dinh-chinh) nhưng phải gọi cùng DinhChinhApi.
      x-fr: [FR-023, FR-024, FR-025, FR-026, FR-029]
      parameters:
        - { name: loaiBanGhi, in: path, required: true, schema: { type: string } }
        - { name: idBanGhiGoc, in: path, required: true, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kieu, lyDo]
              properties:
                kieu: { type: string, enum: [SUA_NOI_DUNG, HUY_GHI_NHAN] }
                noiDungDung: { type: object, description: 'Bắt buộc khi SUA_NOI_DUNG; schema do provider của loại' }
                lyDo: { $ref: '#/components/schemas/LyDo' }
      responses:
        '201': { description: Đã lưu (cách A hoặc B), content: { application/json: { schema: { $ref: '#/components/schemas/DinhChinh' } } } }
        '202': { description: 'Cách C: đã tạo yêu cầu phê duyệt loại M15.DINH_CHINH ở Chờ duyệt', content: { application/json: { schema: { $ref: '#/components/schemas/YeuCau' } } } }
        '403': { description: KHONG_DUOC_DINH_CHINH, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } } }
        '409': { description: 'BAN_GHI_DA_HUY_GHI_NHAN, BAN_GHI_CHUA_XAC_NHAN, KHONG_HO_TRO_DINH_CHINH (chi phí đã chốt, giao dịch số dư)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } } }
        '422': { $ref: '#/components/responses/Loi' }

  /nhat-ky:
    get:
      tags: [nhat-ky]
      summary: Tra cứu nhật ký toàn viện (chỉ Quản lý viện)
      x-fr: [FR-049]
      parameters:
        - { name: doiTuongLoai, in: query, schema: { type: string } }
        - { name: doiTuongId, in: query, schema: { type: string } }
        - { name: nguoiThucHienId, in: query, schema: { type: integer, format: int64 } }
        - { name: hanhDong, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: tu, in: query, schema: { type: string, format: date-time } }
        - { name: den, in: query, schema: { type: string, format: date-time } }
        - { name: tuDuyet, in: query, schema: { type: boolean }, description: 'Lọc riêng lần tự duyệt (FR-035)' }
        - { $ref: '#/components/parameters/Sau' }
      responses:
        '200': { description: 'Sắp theo thời điểm giảm dần', content: { application/json: { schema: { $ref: '#/components/schemas/TrangNhatKy' } } } }
        '403': { $ref: '#/components/responses/Loi' }
  /nhat-ky/doi-tuong/{doiTuongLoai}/{doiTuongId}:
    get:
      tags: [nhat-ky]
      summary: Lịch sử thay đổi của một đối tượng (Quản lý viện; nhân viên trong phạm vi, có che trường)
      x-fr: [FR-049]
      x-br: [BR-M15-01, BR-M15-11]
      parameters:
        - { name: doiTuongLoai, in: path, required: true, schema: { type: string } }
        - { name: doiTuongId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Sau' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TrangNhatKy' } } } }
        '404': { description: 'Đối tượng ngoài phạm vi hoặc không tồn tại', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } } }

  /kiem-thu/dong-ho:
    get:
      tags: [kiem-thu]
      summary: Đọc đồng hồ hệ thống (chỉ profile test/demo)
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DongHo' } } } } }
    post:
      tags: [kiem-thu]
      summary: Đặt hoặc tua đồng hồ giả lập (chỉ profile test/demo)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                datThoiDiem: { type: string, format: date-time }
                tua: { type: string, description: 'ISO-8601 duration, ví dụ PT49H' }
                chayJob: { type: array, items: { type: string, enum: [AP_DUNG_YEU_CAU_DEN_HAN, NHAC_YEU_CAU_CHO_DUYET, LOAI_BO_DU_LIEU_HET_HAN] } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DongHo' } } } } }

components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    MaThamSo: { name: ma, in: path, required: true, schema: { type: string, pattern: '^CFG-M[0-9]{2}-[0-9]{2}$' } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string }, description: 'ETag (phiên bản) mà người dùng đang xem' }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string, format: uuid } }
    Sau: { name: sau, in: query, schema: { type: string }, description: 'Con trỏ phân trang theo khóa' }
  headers:
    ETag: { schema: { type: string }, description: 'Phiên bản hiện tại' }
  responses:
    Loi:
      description: Lỗi theo RFC 9457
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } }
    DaChuyen:
      description: Đã chuyển trạng thái
      content: { application/json: { schema: { $ref: '#/components/schemas/YeuCau' } } }
    XungDot:
      description: 'DA_DUOC_XU_LY (FR-040), DIEU_KIEN_CHUA_THOA, TRANG_THAI_KHONG_HOP_LE, KHONG_DUOC_TU_DUYET'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } }
    SaiPhienBan:
      description: Sai phiên bản (If-Match); body có giaTriHienHanh
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } }
  schemas:
    LyDo: { type: string, minLength: 1, maxLength: 2000, description: 'Không được chỉ có khoảng trắng' }
    Loi:
      type: object
      required: [type, title, status, maLoi]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        maLoi: { type: string, example: DIEU_KIEN_CHUA_THOA }
        dieuKienChuaThoa:
          type: array
          description: FR-006
          items: { type: object, properties: { ma: { type: string, example: BR-M03-06 }, moTa: { type: string } } }
        giaTriHienHanh: { description: 'Khi 412: tài nguyên hiện hành (FR-021)' }
    ThamSo:
      type: object
      properties:
        ma: { type: string, example: CFG-M15-05 }
        moTa: { type: string }
        kieu: { type: string, enum: [THOI_LUONG, SO_NGUYEN, TY_LE, SO_TIEN, GIO_TRONG_NGAY, BANG] }
        donVi: { type: string }
        rangBuoc: { type: object }
        giaTriMacDinh: {}
        giaTriHienHanh: {}
        dungTai: { type: string }
        phienBan: { type: integer }
        doiLuc: { type: string, format: date-time }
    LichSuThamSo:
      type: object
      properties:
        giaTri: {}
        hieuLucTu: { type: string, format: date-time }
        hieuLucDen: { type: [string, 'null'], format: date-time, description: 'Suy ra từ dòng kế tiếp' }
        nguoiThucHien: { $ref: '#/components/schemas/NguoiThucHien' }
        lyDo: { type: string }
        laKhoiPhucMacDinh: { type: boolean }
    NguoiThucHien:
      type: object
      properties:
        loai: { type: string, enum: [NGUOI_DUNG, BO_LAP_LICH] }
        id: { type: [integer, 'null'] }
        hoTen: { type: string }
        vaiTro: { type: string, example: AC-01 }
    YeuCau:
      type: object
      properties:
        id: { type: integer, format: int64 }
        maHienThi: { type: string }
        loai: { type: string }
        trangThai: { type: string, enum: [NHAP, CHO_DUYET, DA_DUYET, DA_AP_DUNG, AP_DUNG_KHONG_THANH, TU_CHOI, HUY], description: 'Loại yêu cầu có thể khai báo thêm trạng thái (data-model mục 3)' }
        noiDung: { type: object }
        nguoiYeuCau: { $ref: '#/components/schemas/NguoiThucHien' }
        taoLuc: { type: string, format: date-time }
        lyDo: { type: string }
        ngayHieuLucMongMuon: { type: string, format: date }
        ngayHieuLucThucTe: { type: [string, 'null'], format: date }
        thoiDiemGuiDuyet: { type: [string, 'null'], format: date-time }
        nguoiQuyetDinh: { $ref: '#/components/schemas/NguoiThucHien' }
        thoiDiemQuyetDinh: { type: [string, 'null'], format: date-time }
        yKienQuyetDinh: { type: [string, 'null'] }
        tuDuyet: { type: boolean }
        lyDoKetThuc: { type: [string, 'null'] }
        thoiDiemApDung: { type: [string, 'null'], format: date-time }
        apDungBu: { type: boolean }
        ketQuaApDung: { type: [object, 'null'], properties: { loai: { type: string }, id: { type: string } } }
        lenhDuocPhep: { type: array, items: { type: string }, description: 'Lệnh người xem hiện được làm, để client ẩn/hiện nút (kiểm tra thật vẫn ở backend); duyet, tu-choi xét cả gioiHanVaiTroDuyet của loại yêu cầu' }
        phienBan: { type: integer }
    TrangYeuCau:
      type: object
      properties:
        muc: { type: array, items: { $ref: '#/components/schemas/YeuCau' } }
        sau: { type: [string, 'null'] }
    DinhChinh:
      type: object
      properties:
        id: { type: integer, format: int64 }
        soThuTu: { type: integer }
