openapi: 3.1.0
info:
  title: Elder Care – Feature 000 (nền tảng dùng chung)
  version: 1.0.0-design
  description: |
    Hợp đồng REST của feature 000. Quy ước chung: research R-03. Tên định danh tiếng Anh theo glossary.md (dịch 2026-10-19; bản tên logic tiếng Việt ở lịch sử git).
    Mọi endpoint cần xác thực (feature 002). Người thân (AC-10) bị từ chối ở mọi endpoint của file này.
    Truy vết: mỗi operation có x-fr (FR của spec 000) và x-br khi có.
servers:
  - url: /api/v1
tags:
  - name: parameters
    description: Mục B – UC-69
  - name: approval-requests
    description: Mục D – UC-14
  - name: corrections
    description: Mục C
  - name: audit-logs
    description: Mục E
  - name: testing
    description: Chỉ có ở profile test/demo (NFR-13)

paths:
  /parameters:
    get:
      tags: [parameters]
      summary: Danh sách tham số với giá trị hiện hành và mặc định
      x-fr: [FR-011]
      parameters:
        - { name: module, in: query, schema: { type: string, example: M15 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Parameter' } }
        '403': { $ref: '#/components/responses/Problem' }
  /parameters/{code}:
    get:
      tags: [parameters]
      summary: Chi tiết một tham số
      x-fr: [FR-011, FR-012]
      parameters: [ { $ref: '#/components/parameters/ParameterCode' } ]
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parameter' }
        '404': { $ref: '#/components/responses/Problem' }
  /parameters/{code}/change-value:
    post:
      tags: [parameters]
      summary: Đổi giá trị (kể cả khôi phục mặc định)
      description: Chỉ Quản lý viện (BR-M15-04). Có hiệu lực ngay sau commit (FR-016).
      x-fr: [FR-013, FR-014, FR-015, FR-016, FR-020, FR-021, FR-022]
      x-br: [BR-M15-04]
      parameters:
        - { $ref: '#/components/parameters/ParameterCode' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                value: { description: 'Giá trị mới, theo kiểu của tham số. Bỏ trống khi restoreDefault = true' }
                restoreDefault: { type: boolean, default: false }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Đã lưu
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parameter' }
        '403': { $ref: '#/components/responses/Problem' }
        '412': { description: 'Giá trị đã bị đổi; body chứa currentValue (FR-021)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'REASON_REQUIRED hoặc INVALID_VALUE (FR-015)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /parameters/{code}/history:
    get:
      tags: [parameters]
      summary: Lịch sử giá trị; hoặc giá trị tại một thời điểm quá khứ
      x-fr: [FR-012, FR-019]
      parameters:
        - { $ref: '#/components/parameters/ParameterCode' }
        - { name: asOf, in: query, schema: { type: string, format: date-time }, description: 'Có thì trả đúng một dòng hiện hành tại thời điểm đó' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ParameterHistoryEntry' } }

  /approval-requests:
    post:
      tags: [approval-requests]
      summary: Lập yêu cầu (trạng thái Nháp)
      x-fr: [FR-031, FR-032]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, content, requestedEffectiveDate, reason]
              properties:
                type: { type: string, example: M02.RESIDENCY_CHANGE }
                content: { type: object, description: 'Schema do module sở hữu loại định nghĩa' }
                requestedEffectiveDate: { type: string, format: date }
                reason: { $ref: '#/components/schemas/Reason' }
                submitImmediately: { type: boolean, default: false, description: 'Lập và gửi duyệt trong một lệnh' }
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRequest' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      tags: [approval-requests]
      summary: Danh sách yêu cầu trong phạm vi người dùng
      parameters:
        - { name: inbox, in: query, schema: { type: string, enum: [MINE, AWAITING_MY_APPROVAL, ALL_IN_SCOPE] } }
        - { name: status, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: type, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRequestPage' } } } }
  /approval-requests/{id}:
    get:
      tags: [approval-requests]
      summary: Chi tiết yêu cầu
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRequest' } } }
        '404': { $ref: '#/components/responses/Problem' }
  /approval-requests/{id}/edit-content:
    post:
      tags: [approval-requests]
      summary: Sửa nội dung khi còn Nháp
      x-fr: [FR-033]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, reason]
              properties:
                content: { type: object }
                requestedEffectiveDate: { type: string, format: date }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200': { $ref: '#/components/responses/Transitioned' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionMismatch' }
        '422': { $ref: '#/components/responses/Problem' }
  /approval-requests/{id}/submit:
    post:
      tags: [approval-requests]
      summary: Gửi duyệt (Nháp → Chờ duyệt)
      x-fr: [FR-033]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200': { $ref: '#/components/responses/Transitioned' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionMismatch' }
        '422': { $ref: '#/components/responses/Problem' }
  /approval-requests/{id}/approve:
    post:
      tags: [approval-requests]
      summary: Duyệt (Chờ duyệt → Đã duyệt (chờ hiệu lực)); áp dụng ngay nếu ngày hiệu lực ≤ hôm nay
      description: Quyền, phạm vi và giới hạn vai trò của loại yêu cầu (`approverRoleRestriction`, bổ sung theo plan 004) xét tại lúc quyết định; không đạt thì 403.
      x-fr: [FR-034, FR-034a, FR-035, FR-037, FR-040]
      x-br: [BR-M15-01]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string, maxLength: 2000, description: 'Bắt buộc khi tự duyệt (FR-035)' }
      responses:
        '200': { $ref: '#/components/responses/Transitioned' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionMismatch' }
        '422': { $ref: '#/components/responses/Problem' }
  /approval-requests/{id}/reject:
    post:
      tags: [approval-requests]
      summary: Từ chối
      description: Cùng điều kiện người duyệt như lệnh Duyệt (kể cả `approverRoleRestriction`); không đạt thì 403.
      x-fr: [FR-034, FR-036, FR-040]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [comment], properties: { comment: { $ref: '#/components/schemas/Reason' } } }
      responses:
        '200': { $ref: '#/components/responses/Transitioned' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionMismatch' }
        '422': { $ref: '#/components/responses/Problem' }
  /approval-requests/{id}/cancel:
    post:
      tags: [approval-requests]
      summary: Hủy (Nháp/Chờ duyệt bởi người yêu cầu; Đã duyệt bởi người có quyền duyệt)
      x-fr: [FR-031]
      x-br: [BR-M15-08]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { $ref: '#/components/schemas/Reason' } } }
      responses:
        '200': { $ref: '#/components/responses/Transitioned' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionMismatch' }
        '422': { $ref: '#/components/responses/Problem' }

  /corrections/{recordType}/{originalRecordId}:
    get:
      tags: [corrections]
      summary: Chuỗi đính chính của một bản ghi gốc và giá trị hiện hành
      x-fr: [FR-027, FR-028]
      parameters:
        - { name: recordType, in: path, required: true, schema: { type: string, example: M07.MEDICATION_DOSE } }
        - { name: originalRecordId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CorrectionChain' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [corrections]
      summary: Tạo bản đính chính (cách A/B → 201; cách C → 202 kèm yêu cầu phê duyệt)
      description: |
        Mỗi module có thể có endpoint riêng gọn hơn (ví dụ POST /medication-doses/{id}/corrections) nhưng phải gọi cùng CorrectionApi.
      x-fr: [FR-023, FR-024, FR-025, FR-026, FR-029]
      parameters:
        - { name: recordType, in: path, required: true, schema: { type: string } }
        - { name: originalRecordId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, reason]
              properties:
                type: { type: string, enum: [AMEND_CONTENT, VOID] }
                correctedContent: { type: object, description: 'Bắt buộc khi AMEND_CONTENT; schema do provider của loại' }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '201': { description: Đã lưu (cách A hoặc B), content: { application/json: { schema: { $ref: '#/components/schemas/Correction' } } } }
        '202': { description: 'Cách C: đã tạo yêu cầu phê duyệt loại M15.CORRECTION ở Chờ duyệt', content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRequest' } } } }
        '403': { description: CORRECTION_NOT_ALLOWED, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'RECORD_VOIDED, RECORD_NOT_CONFIRMED, CORRECTION_NOT_SUPPORTED (chi phí đã chốt, giao dịch số dư)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Problem' }

  /audit-logs:
    get:
      tags: [audit-logs]
      summary: Tra cứu nhật ký toàn viện (chỉ Quản lý viện)
      x-fr: [FR-049]
      parameters:
        - { name: entityType, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string } }
        - { name: actorId, in: query, schema: { type: integer, format: int64 } }
        - { name: action, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: selfApproved, in: query, schema: { type: boolean }, description: 'Lọc riêng lần tự duyệt (FR-035)' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: 'Sắp theo thời điểm giảm dần', content: { application/json: { schema: { $ref: '#/components/schemas/AuditLogPage' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /audit-logs/entities/{entityType}/{entityId}:
    get:
      tags: [audit-logs]
      summary: Lịch sử thay đổi của một đối tượng (Quản lý viện; nhân viên trong phạm vi, có che trường)
      x-fr: [FR-049]
      x-br: [BR-M15-01, BR-M15-11]
      parameters:
        - { name: entityType, in: path, required: true, schema: { type: string } }
        - { name: entityId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuditLogPage' } } } }
        '404': { description: 'Đối tượng ngoài phạm vi hoặc không tồn tại', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /testing/clock:
    get:
      tags: [testing]
      summary: Đọc đồng hồ hệ thống (chỉ profile test/demo)
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Clock' } } } } }
    post:
      tags: [testing]
      summary: Đặt hoặc tua đồng hồ giả lập (chỉ profile test/demo)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                setTo: { type: string, format: date-time }
                advanceBy: { type: string, description: 'ISO-8601 duration, ví dụ PT49H' }
                runJobs: { type: array, items: { type: string, enum: [APPLY_DUE_REQUESTS, REMIND_PENDING_REQUESTS, PURGE_EXPIRED_DATA, MARK_INACTIVE_ACCOUNTS, WARN_EXPIRING_LICENSES, LOCK_AFTER_RESIDENCY_END] } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Clock' } } } } }

components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    ParameterCode: { name: code, in: path, required: true, schema: { type: string, pattern: '^CFG-M[0-9]{2}-[0-9]{2}$' } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string }, description: 'ETag (phiên bản) mà người dùng đang xem' }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string, format: uuid } }
    Cursor: { name: cursor, in: query, schema: { type: string }, description: 'Con trỏ phân trang theo khóa' }
  headers:
    ETag: { schema: { type: string }, description: 'Phiên bản hiện tại' }
  responses:
    Problem:
      description: Lỗi theo RFC 9457
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Transitioned:
      description: Đã chuyển trạng thái
      content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRequest' } } }
    Conflict:
      description: 'ALREADY_PROCESSED (FR-040), CONDITION_NOT_MET, INVALID_STATE, SELF_APPROVAL_NOT_ALLOWED'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    VersionMismatch:
      description: Sai phiên bản (If-Match); body có currentValue
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Reason: { type: string, minLength: 1, maxLength: 2000, description: 'Không được chỉ có khoảng trắng' }
    Problem:
      type: object
      required: [type, title, status, errorCode]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errorCode: { type: string, example: CONDITION_NOT_MET }
        unmetConditions:
          type: array
          description: FR-006
          items: { type: object, properties: { code: { type: string, example: BR-M03-06 }, description: { type: string } } }
        currentValue: { description: 'Khi 412: tài nguyên hiện hành (FR-021)' }
        failedLayer: { type: string, enum: [ROLE, SCOPE, LEGAL, SOURCE_DATA], description: 'Khi 403 của lớp quyền (002 FR-043)' }
        license: { type: object, description: 'Khi 403 LEGAL_CONDITION_NOT_MET (002 FR-043)', properties: { name: { type: string }, expiryDate: { type: string, format: date } } }
        unlocksAt: { type: string, format: date-time, description: 'Khi 423 ACCOUNT_TEMPORARILY_LOCKED (002 FR-014)' }
    Parameter:
      type: object
      properties:
        code: { type: string, example: CFG-M15-05 }
        description: { type: string }
        type: { type: string, enum: [DURATION, INTEGER, PERCENTAGE, MONEY, TIME_OF_DAY, TABLE] }
        unit: { type: string }
        constraints: { type: object }
        defaultValue: {}
        currentValue: {}
        usedIn: { type: string }
        version: { type: integer }
        changedAt: { type: string, format: date-time }
    ParameterHistoryEntry:
      type: object
      properties:
        value: {}
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: [string, 'null'], format: date-time, description: 'Suy ra từ dòng kế tiếp' }
        actor: { $ref: '#/components/schemas/Actor' }
        reason: { type: string }
        isDefaultRestore: { type: boolean }
    Actor:
      type: object
      properties:
        type: { type: string, enum: [USER, SCHEDULER, BOOTSTRAP, ANONYMOUS], description: 'ANONYMOUS: lần đăng nhập thất bại, chưa xác định người (002 FR-015, chủ dự án duyệt 2026-10-20)' }
        id: { type: [integer, 'null'] }
        fullName: { type: string }
        role: { type: string, example: AC-01 }
    ApprovalRequest:
      type: object
      properties:
        id: { type: integer, format: int64 }
        displayCode: { type: string }
        type: { type: string }
        status: { type: string, enum: [DRAFT, PENDING_APPROVAL, APPROVED, APPLIED, APPLY_FAILED, REJECTED, CANCELLED], description: 'Loại yêu cầu có thể khai báo thêm trạng thái (data-model mục 3)' }
        content: { type: object }
        requester: { $ref: '#/components/schemas/Actor' }
        createdAt: { type: string, format: date-time }
        reason: { type: string }
        requestedEffectiveDate: { type: string, format: date }
        actualEffectiveDate: { type: [string, 'null'], format: date }
        submittedAt: { type: [string, 'null'], format: date-time }
        decidedBy: { $ref: '#/components/schemas/Actor' }
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionComment: { type: [string, 'null'] }
        selfApproved: { type: boolean }
        closingReason: { type: [string, 'null'] }
        appliedAt: { type: [string, 'null'], format: date-time }
        catchUpApplied: { type: boolean }
        applicationResult: { type: [object, 'null'], properties: { type: { type: string }, id: { type: string } } }
        allowedCommands: { type: array, items: { type: string }, description: 'Lệnh người xem hiện được làm, để client ẩn/hiện nút (kiểm tra thật vẫn ở backend); approve, reject xét cả approverRoleRestriction của loại yêu cầu' }
        version: { type: integer }
    ApprovalRequestPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ApprovalRequest' } }
        nextCursor: { type: [string, 'null'] }
    Correction:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sequenceNo: { type: integer }
        type: { type: string, enum: [AMEND_CONTENT, VOID] }
        correctedContent: { type: [object, 'null'] }
        reason: { type: string }
        actor: { $ref: '#/components/schemas/Actor' }
        creationMethod: { type: string, enum: [A, B, C] }
        approvalRequestId: { type: [integer, 'null'] }
        recordedAt: { type: string, format: date-time }
    CorrectionChain:
      type: object
      properties:
        recordType: { type: string }
        originalRecordId: { type: integer, format: int64 }
        corrected: { type: boolean }
        voided: { type: boolean }
        originalContent: { type: object }
        currentContent: { type: object }
        corrections: { type: array, items: { $ref: '#/components/schemas/Correction' }, description: 'Theo thời gian tăng dần' }
    FieldValue:
      description: 'Giá trị thật, hoặc {"changed": true} khi người xem không được xem trường (FR-049)'
    AuditLogEntry:
      type: object
      properties:
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        deviceTime: { type: [string, 'null'], format: date-time }
        actor: { $ref: '#/components/schemas/Actor' }
        action: { type: string }
        entity: { type: object, properties: { type: { type: string }, id: { type: string } } }
