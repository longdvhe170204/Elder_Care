openapi: 3.1.0
info:
  title: Elder Care – Feature 013 (đồ gửi)
  version: 1.0.0-design
  description: |
    Hợp đồng REST của feature 013 (module M12). Quy ước chung theo research R-03 của 000:
    tiền tố /api/v1, lỗi RFC 9457 có errorCode và unmetConditions[], Idempotency-Key cho mọi lệnh ghi.
    Tên định danh tiếng Anh theo glossary.md của 000, mục 19 (dịch 2026-11-05; chủ dự án duyệt 2026-11-05 kèm sửa 013-1, 013-2 của plan 013 điểm 19; bản tên logic tiếng Việt ở lịch sử git).
    Mọi lệnh chỉ trực tuyến (FR-031). Lệnh bàn giao gửi kèm phiên bản của từng đồ (FR-011b; research K-03);
    phiên bản cũ → 409 STATE_CHANGED kèm trạng thái mới.
    Đính chính bản ghi bàn giao dùng endpoint đính chính chung của 000 với loại M12.BELONGING_HANDOVER;
    đề nghị xử lý đồ không người nhận dùng yêu cầu phê duyệt của 000 với loại M12.UNCLAIMED_BELONGING_DISPOSAL.
    Người thân dùng /family-portal/**: chỉ người đại diện và người có quyền "được phép đón" đang hiệu lực (BR-M12-09).
    Truy vết: mỗi operation có x-fr (FR của spec 013) và x-br khi có.
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - { name: belonging-catalogs, description: 'Mục A' }
  - { name: belongings, description: 'UC-65; mục B, C, D, F' }
  - { name: belonging-returns, description: 'UC-65; mục E' }
  - { name: residency-ending, description: 'Mục G' }
  - { name: belonging-inventory-checks, description: 'Mục H2' }
  - { name: family-portal, description: 'FR-030' }

paths:
  /belongings/types:
    get:
      tags: [belonging-catalogs]
      summary: Loại đồ (kèm dấu đồ có giá trị theo CFG-M12-01 hiện hành)
      x-fr: [FR-001]
      responses: { '200': { description: OK } }
    post:
      tags: [belonging-catalogs]
      summary: Tạo loại đồ (Quản lý viện)
      x-fr: [FR-001]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BelongingType' } } } }
      responses: { '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CreatedId' } } } } }
  /belongings/types/{id}:
    put:
      tags: [belonging-catalogs]
      summary: Sửa, ngừng loại đồ; đổi dấu "cần đồng ý khi giao sử dụng" bắt buộc lý do, lưu lịch sử
      x-fr: [FR-001, FR-015a]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BelongingType' } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /belongings/condition-levels:
    get:
      tags: [belonging-catalogs]
      summary: Danh mục mức tình trạng
      x-fr: [FR-001a]
      responses: { '200': { description: OK } }
    post:
      tags: [belonging-catalogs]
      summary: Thêm, sửa, ngừng mức tình trạng (Quản lý viện); có id là sửa mức đó, status INACTIVE là ngừng (như vị trí lưu giữ)
      x-fr: [FR-001a]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, order], properties: { id: { type: integer, format: int64 }, name: { type: string }, order: { type: integer }, unusable: { type: boolean }, status: { type: string } } } } } }
      responses: { '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CreatedId' } } } } }
  /belongings/storage-locations:
    get:
      tags: [belonging-catalogs]
      summary: Vị trí lưu giữ
      x-fr: [FR-002]
      responses: { '200': { description: OK } }
    post:
      tags: [belonging-catalogs]
      summary: Tạo, sửa, ngừng vị trí (Hành chính, Quản lý viện); ngừng bị chặn khi còn đồ Đang giữ hoặc Hư hỏng
      x-fr: [FR-002]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { id: { type: integer, format: int64 }, name: { type: string }, description: { type: string }, floorAreaId: { type: integer, format: int64 }, status: { type: string } } } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }

  /residents/{residentId}/belongings:
    get:
      tags: [belongings]
      summary: Đồ gửi của người cao tuổi với trạng thái, người giữ, vị trí, bản ghi gần nhất
      x-fr: [FR-011]
      parameters: [ { $ref: '#/components/parameters/ResidentId' }, { name: status, in: query, schema: { type: string } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Belonging' } } } } } }
    post:
      tags: [belongings]
      summary: Tiếp nhận đồ gửi (tùy chọn giao ngay cho người cao tuổi sử dụng)
      x-fr: [FR-003, FR-004, FR-005, FR-006, FR-007, FR-008]
      x-br: [BR-M12-01, BR-M12-05, BR-M12-06, DBR-22]
      parameters: [ { $ref: '#/components/parameters/ResidentId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BelongingIntake' } } } }
      responses: { '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Belonging' } } } }, '409': { $ref: '#/components/responses/Blocked' }, '422': { $ref: '#/components/responses/Problem' } }
  /belongings/{id}:
    get:
      tags: [belongings]
      summary: Chi tiết đồ gửi và lịch sử bàn giao (cả đồ tách cùng lần tiếp nhận)
      x-fr: [FR-011, FR-012]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BelongingDetail' } } } } }
  /belongings/handovers:
    post:
      tags: [belongings]
      summary: Lệnh bàn giao trên một hoặc nhiều đồ
      description: |
        type: GIVE_FOR_USE, TAKE_BACK, TRANSFER_CUSTODY, REPORT_LOST, RECORD_DAMAGE, FOUND. Số lượng nhỏ hơn hiện có → tách đồ (FR-012);
        đếm thiếu → tách và Báo thất lạc phần thiếu (FR-013). Giảm mức tình trạng cần conditionHandling (FR-015).
        REPORT_LOST, RECORD_DAMAGE có incident { method NEW | LINK | NONE } (FR-021); NEW ghi sự cố 007 trong cùng lệnh.
        Chặn: GIVER_NOT_HOLDER, HOLDER_NOT_ABSENT, PHOTO_REQUIRED, SELF_CUSTODY_CONSENT_REQUIRED, CONDITION_HANDLING_REQUIRED, RESIDENT_FINAL_STATE.
      x-fr: [FR-008, FR-011, FR-011b, FR-012, FR-013, FR-014, FR-015, FR-015a, FR-021, FR-024]
      x-br: [BR-M12-01, BR-M12-02, BR-M12-05, BR-M12-06]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HandoverCommand' } } } }
      responses: { '200': { description: Các bản ghi bàn giao đã tạo }, '409': { $ref: '#/components/responses/Blocked' }, '422': { $ref: '#/components/responses/Problem' } }
  /belongings/handovers/{id}/link-incident:
    post:
      tags: [belongings]
      summary: Liên kết sự cố ghi sau với bản ghi Báo thất lạc / Ghi hư hỏng (một lần)
      x-fr: [FR-021, FR-024]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [incidentId], properties: { incidentId: { type: integer, format: int64 } } } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /staff/{staffId}/held-belongings:
    get:
      tags: [belongings]
      summary: Đồ có giá trị nhân viên đang giữ (cho người lập bàn giao ca)
      x-fr: [FR-014a]
      parameters: [ { name: staffId, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK } }
  /self-custody-consents:
    post:
      tags: [belongings]
      summary: Hành chính ghi đồng ý cho tự giữ theo bản ký scan của người đại diện
      x-fr: [FR-015a, FR-017b]
      x-br: [BR-M12-06]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecordSelfCustodyConsent' } } } }
      responses: { '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CreatedId' } } } }, '409': { $ref: '#/components/responses/Blocked' } }
  /self-custody-consents/{id}/withdraw:
    post:
      tags: [belongings]
      summary: Rút đồng ý (Hành chính ghi bản ký của người đại diện hiện tại); đồ đang sử dụng → báo thu lại
      x-fr: [FR-015a]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason, representativeId, signedFormFileId], properties: { reason: { $ref: '#/components/schemas/Reason' }, representativeId: { type: integer, format: int64 }, signedFormFileId: { type: integer, format: int64 } } } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }

  /belongings/returns:
    post:
      tags: [belonging-returns]
      summary: Trả một hoặc nhiều đồ cho cùng người nhận (chữ ký, xác minh danh tính, tình trạng lúc trả)
      description: |
        Người có quyền nhận: xác minh giấy tờ; người cao tuổi với đồ không thuộc loại cần đồng ý (Q-253); người khác: recipientConfirmationId Hiệu lực.
        Điều dưỡng: chỉ đồ không có giá trị và người có quyền nhận hoặc người cao tuổi thuộc Q-253; lẫn đồ có giá trị → chặn toàn bộ.
        Không đạt → ghi lần chặn trả và 409 RETURN_BLOCKED.
      x-fr: [FR-008, FR-016, FR-016a, FR-017, FR-018, FR-019, FR-020]
      x-br: [BR-M12-04, BR-M12-05]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReturnCommand' } } } }
      responses: { '201': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }
  /recipient-confirmations:
    get:
      tags: [belonging-returns]
      summary: Yêu cầu xác nhận người nhận khác (lọc người cao tuổi, trạng thái)
      x-fr: [FR-017]
      parameters: [ { name: residentId, in: query, schema: { type: integer, format: int64 } }, { name: status, in: query, schema: { type: string } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RecipientConfirmation' } } } } } }
    post:
      tags: [belonging-returns]
      summary: Lập yêu cầu xác nhận người nhận khác (Hành chính); kèm bản ký của người đại diện thì Hiệu lực ngay
      x-fr: [FR-017, FR-017b]
      x-br: [BR-M12-04]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateRecipientConfirmation' } } } }
      responses: { '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CreatedId' } } } }, '409': { $ref: '#/components/responses/Blocked' } }
  /recipient-confirmations/{id}/contact-evidence:
    post:
      tags: [belonging-returns]
      summary: Ghi một lần liên hệ người đại diện (thời điểm, kênh, kết quả) làm bằng chứng cho duyệt thay
      x-fr: [FR-017a]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContactAttempt' } } } }
      responses: { '201': { description: OK } }
  /recipient-confirmations/{id}/{command}:
    post:
      tags: [belonging-returns]
      summary: "approve-on-behalf (duyệt thay; Quản lý viện; FR-017a (a) hoặc (b); lý do; không phải người lập), cancel (hủy; Hành chính; lý do)"
      x-fr: [FR-017a, FR-017b]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: command, in: path, required: true, schema: { type: string, enum: [approve-on-behalf, cancel] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { $ref: '#/components/schemas/Reason' }, basis: { type: string, enum: [REPRESENTATIVE_UNREACHABLE, NO_REPRESENTATIVE] } } } } } }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }

  /residents/{residentId}/belongings/ending-condition:
    get:
      tags: [residency-ending]
      summary: Điều kiện (b) kết thúc lưu trú và mục "xử lý đồ gửi" kèm căn cứ
      x-fr: [FR-025, FR-026]
      x-br: [BR-M12-03]
      parameters: [ { $ref: '#/components/parameters/ResidentId' } ]
      responses: { '200': { description: OK } }

  /belonging-inventory-checks:
    get:
      tags: [belonging-inventory-checks]
      summary: Kỳ kiểm kê hiện tại, vị trí có đồ có giá trị Đang giữ và phiếu của kỳ (không gợi ý vị trí nào cần lập trước)
      x-fr: [FR-028a, FR-028c]
      parameters: [ { name: periodCode, in: query, schema: { type: string } } ]
      responses: { '200': { description: OK } }
    post:
      tags: [belonging-inventory-checks]
      summary: Lập phiếu kiểm kê cho một vị trí (Hành chính); phiếu gồm mọi đồ có giá trị Đang giữ tại vị trí
      x-fr: [FR-028a]
      x-br: [BR-M12-07]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [storageLocationId], properties: { storageLocationId: { type: integer, format: int64 } } } } } }
      responses: { '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CreatedId' } } } }, '409': { $ref: '#/components/responses/Blocked' } }
  /belonging-inventory-checks/{id}:
    get:
      tags: [belonging-inventory-checks]
      summary: Chi tiết phiếu kiểm kê
      x-fr: [FR-028b]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK } }
  /belonging-inventory-checks/{id}/{command}:
    post:
      tags: [belonging-inventory-checks]
      summary: "complete (hoàn thành: kết quả từng đồ, đồ thừa, đồ không rõ chủ), cancel (hủy: mọi đồ đã rời vị trí; lý do)"
      x-fr: [FR-028b]
      x-br: [BR-M12-07]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: command, in: path, required: true, schema: { type: string, enum: [complete, cancel] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryCheckResult' } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }

  /family-portal/residents/{residentId}/belongings:
    get:
      tags: [family-portal]
      summary: Đồ gửi, trạng thái, lịch sử bàn giao, ảnh cho người đại diện và người có quyền được phép đón
      x-fr: [FR-030]
      x-br: [BR-M12-09]
      parameters: [ { $ref: '#/components/parameters/ResidentId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PortalBelonging' } } } } }, '403': { $ref: '#/components/responses/Problem' } }
  /family-portal/recipient-confirmations/{id}:
    get:
      tags: [family-portal]
      summary: Người đại diện đọc yêu cầu xác nhận người nhận khác (họ tên, giấy tờ người nhận, đồ trong yêu cầu) trước khi quyết định
      x-fr: [FR-017, FR-030]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RecipientConfirmation' } } } }, '403': { $ref: '#/components/responses/Problem' } }
  /family-portal/recipient-confirmations/{id}/{command}:
    post:
      tags: [family-portal]
      summary: Người đại diện xác nhận (confirm) hoặc từ chối (reject, lý do) yêu cầu xác nhận người nhận khác
      x-fr: [FR-017, FR-030]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: command, in: path, required: true, schema: { type: string, enum: [confirm, reject] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { $ref: '#/components/schemas/Reason' } } } } } }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }
  /family-portal/self-custody-consents:
    post:
      tags: [family-portal]
      summary: Người đại diện ghi đồng ý cho tự giữ một đồ thuộc loại cần đồng ý
      x-fr: [FR-015a, FR-030]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [belongingId], properties: { belongingId: { type: integer, format: int64 } } } } } }
      responses: { '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CreatedId' } } } }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }
  /family-portal/self-custody-consents/{id}/withdraw:
    post:
      tags: [family-portal]
      summary: Người đại diện hiện tại rút đồng ý (lý do)
      x-fr: [FR-015a, FR-030]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/ReasonBody' }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' } }

components:
  securitySchemes:
    session: { type: http, scheme: bearer, description: 'Token phiên opaque của 002 (A-02)' }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    ResidentId: { name: residentId, in: path, required: true, schema: { type: integer, format: int64 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  requestBodies:
    ReasonBody:
      required: true
      content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { $ref: '#/components/schemas/Reason' } } } } }
  responses:
    Problem:
      description: Lỗi theo RFC 9457 (research R-03 của 000)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Blocked:
      description: 'STATE_CHANGED, RESIDENT_FINAL_STATE, STORAGE_LOCATION_INACTIVE, PHOTO_REQUIRED, SELF_CUSTODY_CONSENT_REQUIRED, GIVER_NOT_REPRESENTATIVE, GIVER_NOT_HOLDER, HOLDER_NOT_ABSENT, CONDITION_HANDLING_REQUIRED, UNUSABLE_LEVEL_ONLY_VIA_RECORD_DAMAGE, INCIDENT_ALREADY_LINKED, INVALID_INCIDENT, RETURN_BLOCKED, INVALID_RECIPIENT_CONFIRMATION, NURSING_STAFF_VALUABLE_ITEM, ALREADY_REJECTED, ON_BEHALF_APPROVAL_NOT_ELIGIBLE, SELF_APPROVAL_NOT_ALLOWED, BELONGINGS_AT_LOCATION, NO_VALUABLE_BELONGINGS, INVENTORY_CHECK_EXISTS_FOR_PERIOD, INVENTORY_RESULT_REQUIRED, BELONGINGS_STILL_IN_CHECK'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    CreatedId:
      type: object
      description: Mã bản ghi vừa lập (không đổi hành vi, chỉ khai thân phản hồi 201 mà backend đã trả).
      properties: { id: { type: integer, format: int64 } }
    SelfCustodyConsentSummary:
      type: object
      description: Bản đồng ý cho tự giữ đang Hiệu lực của đồ (FR-015a); null khi không có.
      properties: { id: { type: integer, format: int64 }, status: { type: string }, method: { type: string }, representativeId: { type: integer, format: int64 } }
    HandoverEntry:
      type: object
      properties: { id: { type: integer, format: int64 }, belongingId: { type: integer, format: int64 }, kind: { type: string }, targetStatus: { type: string }, giverType: { type: string }, giverName: { type: string }, recipientType: { type: string }, recipientName: { type: string }, occurredAt: { type: string, format: date-time }, quantity: { type: number }, cashAmount: { type: number }, conditionLevelId: { type: integer, format: int64 }, conditionDescription: { type: string }, storageLocationId: { type: integer, format: int64 }, reason: { type: string }, photoFileIds: { type: array, items: { type: integer, format: int64 } }, incidentId: { type: integer, format: int64 }, recordedAt: { type: string, format: date-time } }
    BelongingDetail:
      type: object
      properties:
        belonging: { $ref: '#/components/schemas/Belonging' }
        handovers: { type: array, items: { $ref: '#/components/schemas/HandoverEntry' } }
        selfCustodyConsent: { $ref: '#/components/schemas/SelfCustodyConsentSummary' }
    PortalBelonging:
      type: object
      properties:
        id: { type: integer, format: int64 }
        typeId: { type: integer, format: int64 }
        description: { type: string }
        quantity: { type: number }
        cashAmount: { type: integer, format: int64 }
        status: { type: string, enum: [HELD, IN_USE, RETURNED, LOST, DAMAGED, DISPOSED] }
        holder: { type: string }
        history: { type: array, items: { type: object, properties: { id: { type: integer, format: int64 }, kind: { type: string }, targetStatus: { type: string }, occurredAt: { type: string, format: date-time }, quantity: { type: number }, cashAmount: { type: integer, format: int64 }, conditionDescription: { type: string }, photoFileIds: { type: array, items: { type: integer, format: int64 } } } } }
        selfCustodyConsent: { $ref: '#/components/schemas/SelfCustodyConsentSummary' }
    Reason: { type: string, minLength: 1, maxLength: 2000 }
    Problem:
      type: object
      description: RFC 9457 cùng errorCode (000 R-03), giống schema Problem của api-004, api-012 (khớp ProblemBody chung; đổi 2026-11-06 từ bản rút gọn, chờ A review).
      required: [type, title, status, errorCode]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errorCode: { type: string }
        unmetConditions: { type: array, items: { type: object, properties: { code: { type: string }, description: { type: string }, basis: { type: string, description: "BR/FR, ví dụ BR-M12-03" }, module: { type: string, description: "Feature sở hữu điều kiện, ví dụ 013" }, waivable: { type: boolean, description: "Miễn được qua yêu cầu phê duyệt (004)" } } } }
        currentValue: { description: 'Khi 412: tài nguyên hiện hành' }
        candidates: { type: array, description: "POSSIBLE_DUPLICATE_PROFILE, DUPLICATE_HEALTH_ITEM (001)", items: { type: object } }
        failedLayer: { type: string, enum: [ROLE, SCOPE, LEGAL, SOURCE_DATA] }
        license: { type: object, properties: { name: { type: string }, expiryDate: { type: string, format: date } } }
        unlocksAt: { type: string, format: date-time, description: 'Khi 423 ACCOUNT_TEMPORARILY_LOCKED (FR-014)' }
    BelongingType:
      type: object
      required: [name]
      properties: { id: { type: integer, format: int64, readOnly: true }, name: { type: string }, hasCashAmount: { type: boolean }, requiresConsentForUse: { type: boolean }, valuable: { type: boolean, readOnly: true }, status: { type: string }, reason: { type: string } }
    ItemCondition:
      type: object
      required: [levelId]
      properties: { levelId: { type: integer, format: int64 }, description: { type: string } }
    Giver:
      type: object
      required: [type]
      properties: { type: { type: string, enum: [FAMILY_MEMBER, OTHER_PERSON, RESIDENT, STAFF] }, id: { type: integer, format: int64 }, fullName: { type: string }, idDocument: { type: string } }
    BelongingIntake:
      type: object
      required: [typeId, description, condition, giver, at]
      properties:
        typeId: { type: integer, format: int64 }
        description: { type: string }
        quantity: { type: number }
        cashAmount: { type: integer, format: int64 }
        unit: { type: string }
        condition: { $ref: '#/components/schemas/ItemCondition' }
        giver: { $ref: '#/components/schemas/Giver' }
        at: { type: string, format: date-time }
        storageLocationId: { type: integer, format: int64 }
        photoFileIds: { type: array, items: { type: integer, format: int64 } }
        note: { type: string }
        giveForUseNow: { type: boolean }
        consentSignedFormFileId: { type: integer, format: int64, description: 'Bắt buộc khi giao ngay đồ thuộc loại cần đồng ý' }
    Belonging:
      type: object
      properties: { id: { type: integer, format: int64 }, residentId: { type: integer, format: int64 }, typeId: { type: integer, format: int64 }, description: { type: string }, quantity: { type: number }, cashAmount: { type: integer, format: int64 }, status: { type: string, enum: [HELD, IN_USE, RETURNED, LOST, DAMAGED, DISPOSED] }, holder: { type: string }, storageLocationId: { type: integer, format: int64 }, originalBelongingId: { type: integer, format: int64 }, lastHandoverAt: { type: string, format: date-time }, version: { type: integer } }
    HandoverCommand:
      type: object
      required: [type, items]
      properties:
        type: { type: string, enum: [GIVE_FOR_USE, TAKE_BACK, TRANSFER_CUSTODY, REPORT_LOST, RECORD_DAMAGE, FOUND] }
        items: { type: array, minItems: 1, items: { type: object, required: [belongingId, version], properties: { belongingId: { type: integer, format: int64 }, version: { type: integer }, quantity: { type: number }, countedQuantity: { type: number }, condition: { $ref: '#/components/schemas/ItemCondition' }, photoFileIds: { type: array, items: { type: integer, format: int64 } }, incident: { $ref: '#/components/schemas/IncidentOption' } } } }
        giver: { $ref: '#/components/schemas/Giver' }
        recipientStaffId: { type: integer, format: int64 }
        storageLocationId: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        reason: { type: string }
        holderAbsent: { type: boolean }
        conditionHandling: { type: string, enum: [ACKNOWLEDGE, RECORD_DAMAGE] }
        discoveredAt: { type: string, format: date-time }
    IncidentOption:
      type: object
      required: [method]
      properties: { method: { type: string, enum: [NEW, LINK, NONE] }, incidentId: { type: integer, format: int64 }, level: { type: string, enum: [LOW, MEDIUM, CRITICAL] }, description: { type: string }, place: { type: string } }
    ReturnCommand:
      type: object
      required: [items, recipient]
      properties:
        items: { type: array, minItems: 1, items: { type: object, required: [belongingId, version, condition], properties: { belongingId: { type: integer, format: int64 }, version: { type: integer }, quantity: { type: number, description: 'Số lượng trả (số tiền với tiền mặt); trống là toàn bộ; nhỏ hơn hiện có thì phần trả tách thành đồ mới (FR-012)' }, condition: { $ref: '#/components/schemas/ItemCondition' }, photoFileIds: { type: array, items: { type: integer, format: int64 } } } } }
        recipient: { type: object, required: [type], properties: { type: { type: string, enum: [FAMILY_MEMBER, RESIDENT, OTHER_PERSON] }, familyMemberId: { type: integer, format: int64 }, fullName: { type: string }, presentedIdDocument: { type: object, properties: { type: { type: string }, number: { type: string } } } } }
        recipientConfirmationId: { type: integer, format: int64 }
        signatureFileId: { type: integer, format: int64, description: 'Bản ký của người nhận; chỉ được trống khi người nhận là người cao tuổi không ký và có noSignatureReason (FR-019)' }
        noSignatureReason: { type: string, description: 'Bắt buộc khi người nhận là người cao tuổi không ký (FR-019)' }
        conditionOpinion: { type: string }
    CreateRecipientConfirmation:
      type: object
      required: [residentId, recipientName, recipientIdDocument, belongingIds]
      properties: { residentId: { type: integer, format: int64 }, recipientName: { type: string }, recipientIdDocument: { type: string }, recipientIsResident: { type: boolean }, belongingIds: { type: array, minItems: 1, items: { type: integer, format: int64 } }, signedForm: { type: object, properties: { representativeId: { type: integer, format: int64 }, fileId: { type: integer, format: int64 } } } }
    RecipientConfirmation:
      allOf:
        - { $ref: '#/components/schemas/CreateRecipientConfirmation' }
        - type: object
          properties: { id: { type: integer, format: int64 }, status: { type: string, enum: [PENDING_CONFIRMATION, EFFECTIVE, REJECTED, CANCELLED, USED, EXPIRED] }, method: { type: string }, expiresAt: { type: string, format: date-time } }
    ContactAttempt:
      type: object
      required: [familyMemberId, channel, at, result]
      properties: { familyMemberId: { type: integer, format: int64 }, channel: { type: string, enum: [PHONE_CALL, TEXT_MESSAGE, PORTAL_NOTIFICATION] }, at: { type: string, format: date-time }, result: { type: string } }
    RecordSelfCustodyConsent:
      type: object
      required: [belongingId, representativeId, signedFormFileId]
      properties: { belongingId: { type: integer, format: int64 }, representativeId: { type: integer, format: int64 }, signedFormFileId: { type: integer, format: int64 } }
    InventoryCheckResult:
      type: object
      properties:
        lines: { type: array, items: { type: object, required: [belongingId, result], properties: { belongingId: { type: integer, format: int64 }, result: { type: string, enum: [MATCHED, CONDITION_MISMATCH, NOT_FOUND] }, newCondition: { $ref: '#/components/schemas/ItemCondition' }, recordDamage: { type: boolean }, photoFileIds: { type: array, items: { type: integer, format: int64 } }, incident: { $ref: '#/components/schemas/IncidentOption' } } } }
        found: { type: array, items: { type: object, required: [belongingId], properties: { belongingId: { type: integer, format: int64 }, photoFileIds: { type: array, items: { type: integer, format: int64 } } } }, description: 'Đồ Thất lạc tìm thấy tại vị trí; đồ có giá trị cần ảnh (BR-M12-05)' }
        unknownOwnerItems: { type: array, items: { type: object, properties: { description: { type: string }, photoFileIds: { type: array, items: { type: integer, format: int64 } } } } }
        reason: { type: string, description: 'Khi hủy phiếu' }
