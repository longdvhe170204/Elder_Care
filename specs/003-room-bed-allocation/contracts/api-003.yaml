          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentLocation"
        "404":
          $ref: "#/components/responses/Problem"
      x-implementation-phase: 4
  /lich-su-vi-tri/nguoi-cao-tuoi/{nctId}:
    get:
      tags: [tra-cuu]
      summary: Người A ở giường nào tại T, hoặc trong khoảng [tu, den)
      description: Dùng giá trị sau đính chính; dòng đã đính chính có daDinhChinh (CHK017). Không kèm thông tin sức khỏe.
      x-fr: [FR-035, FR-037]
      parameters:
        - { name: nctId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: thoiDiem, in: query, schema: { type: string, format: date-time } }
        - { name: tu, in: query, schema: { type: string, format: date-time } }
        - { name: den, in: query, schema: { type: string, format: date-time } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DongViTri' } } } } }, '403': { $ref: '#/components/responses/Loi' } }
  /lich-su-vi-tri/giuong:
    get:
      tags: [tra-cuu]
      summary: Mỗi giường của phòng/tầng/khu vực có ai tại T hoặc trong ngày D
      x-fr: [FR-035, FR-037]
      parameters:
        - { name: phongId, in: query, schema: { type: integer, format: int64 } }
        - { name: tangId, in: query, schema: { type: integer, format: int64 } }
        - { name: khuVucId, in: query, schema: { type: integer, format: int64 } }
        - { name: thoiDiem, in: query, schema: { type: string, format: date-time } }
        - { name: ngay, in: query, schema: { type: string, format: date } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DongGiuong' } } } } } }
  /lich-su-vi-tri/cung-phong:
    get:
      tags: [tra-cuu]
      summary: Những ai ở cùng phòng với A trong khoảng [tu, den)
      description: Kèm khoảng chồng, khoảng A và người kia vắng mặt (FR-036), dấu có nhập bù đang chờ duyệt (FR-027).
      x-fr: [FR-035, FR-036, FR-037]
      x-br: [BR-M05-10]
      parameters:
        - { name: nctId, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: tu, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: den, in: query, required: true, schema: { type: string, format: date-time } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NguoiCungPhong' } } } } } }

  # ---------------- Bán trú ----------------
  /khu-nghi-ban-tru:
    get:
      tags: [ban-tru]
      summary: Khu nghỉ bán trú của viện
      x-fr: [FR-038]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/KhuNghiBanTru' } } } } } }
    post:
      tags: [ban-tru]
      summary: Khai báo khu nghỉ bán trú (Quản lý viện)
      description: 'Đã có khu Hiệu lực: 409 DA_CO_KHU_NGHI (FR-038). Sức chứa mỗi buổi là CFG-M03-01, không nhập ở đây.'
      x-fr: [FR-038]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/KhuNghiBanTruGhi' } } } }
      responses: { '201': { description: Đã tạo }, '409': { $ref: '#/components/responses/Loi' } }
  /khu-nghi-ban-tru/{id}:
    put:
      tags: [ban-tru]
      summary: Sửa khu nghỉ (kể cả dời tầng/khu vực gắn vào)
      x-fr: [FR-038]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/KhuNghiBanTruGhi' } } } }
      responses: { '200': { description: OK } }
  /khu-nghi-ban-tru/{id}/ngung-hieu-luc:
    post:
      tags: [ban-tru]
      summary: Ngừng hiệu lực khu nghỉ
      description: Còn lịch đến tương lai thì 409 liệt kê người có lịch (Edge Case).
      x-fr: [FR-038]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/LoiChan' } }
  /khu-nghi-ban-tru/so-dang-ky:
    get:
      tags: [ban-tru]
      summary: Số đăng ký và chỗ còn lại theo buổi
      description: Đếm theo lịch đăng ký của 004, không tính Vắng có báo (FR-039).
      x-fr: [FR-039, FR-040]
      parameters:
        - { name: tuNgay, in: query, required: true, schema: { type: string, format: date } }
        - { name: denNgay, in: query, required: true, schema: { type: string, format: date } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ChoTheoBuoi' } } } } } }
  /buoi-ban-tru:
    get:
      tags: [ban-tru]
      summary: Danh mục buổi
      x-fr: [FR-038]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BuoiBanTru' } } } } } }
    post:
      tags: [ban-tru]
      summary: Thêm buổi (Quản lý viện)
      description: 'Khung giờ chồng buổi Hiệu lực khác: 409 KHUNG_GIO_CHONG (FR-038). Sau khi lưu, lịch đến được đếm lại (BR-M03-25).'
      x-fr: [FR-038, FR-040]
      x-br: [BR-M03-25]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BuoiBanTruGhi' } } } }
      responses: { '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/KetQuaDoiBuoi' } } } }, '409': { $ref: '#/components/responses/Loi' } }
  /buoi-ban-tru/{id}:
    put:
      tags: [ban-tru]
      summary: Sửa khung giờ buổi
      description: Lịch đến đã đăng ký được đếm lại theo khung mới; buổi vượt sức chứa được cảnh báo, không hủy lịch (FR-040, BR-M03-25).
      x-fr: [FR-038, FR-040]
      x-br: [BR-M03-25]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BuoiBanTruGhi' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/KetQuaDoiBuoi' } } } }, '409': { $ref: '#/components/responses/Loi' } }
  /buoi-ban-tru/{id}/ngung-hieu-luc:
    post:
      tags: [ban-tru]
      summary: Ngừng hiệu lực buổi
      x-fr: [FR-038, FR-040]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: OK } }

  /room-types/{id}/reactivate:
    post:
      summary: Kích hoạt lại mục danh mục
      x-fr:
        - FR-005
      x-implementation-phase: 3
      parameters:
        - &a1
          $ref: "#/components/parameters/Id"
        - &a2
          $ref: "#/components/parameters/IfMatch"
        - &a3
          $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/Reason"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomType"
        "409":
          $ref: "#/components/responses/Problem"
  /bed-transfer-reasons/{id}/reactivate:
    post:
      summary: Kích hoạt lại mục danh mục
      x-fr:
        - FR-005
      x-implementation-phase: 3
      parameters:
        - *a1
        - *a2
        - *a3
      requestBody:
        $ref: "#/components/requestBodies/Reason"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BedTransferReason"
        "409":
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    phien: { type: http, scheme: bearer, description: 'Token phiên opaque của 002 (A-02)' }
  parameters:
    CatalogStatus:
      name: status
      in: query
      schema:
        type: string
        enum:
          - ACTIVE
          - INACTIVE
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    Sau: { name: sau, in: query, description: Khóa trang kế tiếp, schema: { type: string } }
    TrangThaiDanhMuc: { name: trangThai, in: query, schema: { type: string, enum: [HIEU_LUC, NGUNG_HIEU_LUC] } }
  headers:
    ETag: { schema: { type: string } }
  requestBodies:
    Reason:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - reason
            properties:
              reason:
                $ref: "#/components/schemas/Reason"
    LyDo:
      required: true
      content: { application/json: { schema: { type: object, required: [lyDo], properties: { lyDo: { $ref: '#/components/schemas/LyDo' } } } } }
    DinhChinh:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [kieu, lyDo]
            properties:
              kieu: { type: string, enum: [SUA_NOI_DUNG, HUY_GHI_NHAN] }
              noiDungDung: { type: object, additionalProperties: true, description: 'Phân bổ: giuongId, batDau, ketThuc. Xác nhận sẵn sàng: daKhuKhuan, daDungBaoHo, ghiChu' }
              lyDo: { $ref: '#/components/schemas/LyDo' }
    ChuyenGiuong:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [giuongMoiId, lyDoChuyenId, lyDo]
            properties:
              giuongMoiId: { type: integer, format: int64 }
              lyDoChuyenId: { type: integer, format: int64, description: 'Danh mục lý do chuyển; cờ yTeAnToan quyết định FR-030' }
              lyDo: { $ref: '#/components/schemas/LyDo' }
              thoiDiemChuyen: { type: string, format: date-time, description: 'Mặc định là bây giờ; quá khứ là nhập bù (FR-027)' }
  responses:
    Problem:
      description: Lỗi theo RFC 9457 (research R-03 của 000)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BlockedProblem:
      description: DIEU_KIEN_CHUA_THOA (đủ danh sách, mỗi phần tử có mã PB_* hoặc mã chặn khác),
        CHUYEN_KHONG_HOP_LE, DA_CO_PHAN_BO
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Loi:
      description: Lỗi theo RFC 9457 (research R-03 của 000)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } }
    LoiChan:
      description: 'DIEU_KIEN_CHUA_THOA (đủ danh sách, mỗi phần tử có mã PB_* hoặc mã chặn khác), CHUYEN_KHONG_HOP_LE, DA_CO_PHAN_BO'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } }
    GiuongOk:
      description: Đã chuyển trạng thái giường
      content: { application/json: { schema: { $ref: '#/components/schemas/Giuong' } } }
  schemas:
    Area:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        status:
          type: string
        version:
          type: integer
    AreaWrite:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 100
        reason:
          $ref: "#/components/schemas/Reason"
    Reason:
      type: string
      minLength: 1
      maxLength: 2000
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errorCode:
          type: string
        unmetConditions:
          type: array
          items:
            $ref: "#/components/schemas/UnmetCondition"
        blockingObjects:
          type: array
          description: "FR-005, FR-006: giường, người cao tuổi, phân công gây chặn"
          items:
            type: object
            properties:
              type:
                type: string
              id:
                type: integer
                format: int64
              label:
                type: string
        currentValue:
          type: object
    UnmetCondition:
      type: object
      properties:
        code:
          type: string
          description: >
            PB_MUC_CHAM_SOC (a), PB_LOAI_LUU_TRU (b), PB_GIOI_TINH (c), PB_CACH_LY (d), PB_TRANG_THAI_GIUONG (e),

            PB_GIU_CHO_NGUOI_KHAC (f), PB_CHONG_THOI_GIAN (g), PB_TRANG_THAI_NCT (h), PB_CHO_CHUYEN_NGUOI (i),

            PB_CHO_SAN_SANG_TRUOC_HAN (FR-011a), GIUONG_DAT_TRUOC_CHUA_SAN_SANG (FR-023), CHUA_GHI_KHU_KHUAN
            (BR-M03-10),

            KHOANG_VANG (FR-027 c), NGOAI_PHAM_VI …
        description:
          type: string
        basis:
          type: string
          description: BR/FR, ví dụ BR-M03-01
    Floor:
      type: object
      properties:
        id:
          type: integer
          format: int64
        areaId:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        buildingName:
          type: string
        status:
          type: string
    FloorWrite:
      type: object
      required:
        - areaId
        - code
        - name
      properties:
        areaId:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        buildingName:
          type: string
    RoomType:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        standardBeds:
          type: integer
        defaultCareLevels:
          type: array
          items:
            $ref: "#/components/schemas/CareLevelCode"
        servesLongTerm:
          type: boolean
        servesShortTerm:
          type: boolean
        status:
          type: string
    CareLevelCode:
      type: string
      enum:
        - BASIC
        - FREQUENT
        - SPECIAL
    RoomTypeWrite:
      type: object
      required:
        - name
        - standardBeds
        - defaultCareLevels
      properties:
        name:
          type: string
        standardBeds:
          type: integer
          minimum: 1
        defaultCareLevels:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CareLevelCode"
        servesLongTerm:
          type: boolean
          default: true
        servesShortTerm:
          type: boolean
          default: true
    Room:
      type: object
      properties:
        id:
          type: integer
          format: int64
        floorId:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        roomTypeId:
          type: integer
          format: int64
        allowedCareLevels:
          type: array
          items:
            $ref: "#/components/schemas/CareLevelCode"
        genderPolicy:
          type: string
          enum:
            - MALE
            - FEMALE
            - UNRESTRICTED
        isolated:
          type: boolean
        isolationBlocked:
          type: boolean
          description: Đang cách ly hoặc thuộc vùng khoanh vùng (FR-009)
        status:
          type: string
    RoomWrite:
      type: object
      required:
        - floorId
        - code
        - name
        - roomTypeId
        - genderPolicy
      properties:
        floorId:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        roomTypeId:
          type: integer
          format: int64
        allowedCareLevels:
          type: array
          items:
            $ref: "#/components/schemas/CareLevelCode"
        genderPolicy:
          type: string
          enum:
            - MALE
            - FEMALE
            - UNRESTRICTED
        reason:
          $ref: "#/components/schemas/Reason"
    BedTransferReason:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        medicalSafety:
          type: boolean
        fixed:
          type: boolean
        status:
          type: string
    BedTransferReasonWrite:
      type: object
      required:
        - code
        - name
        - medicalSafety
      properties:
        code:
          type: string
        name:
          type: string
        medicalSafety:
          type: boolean
    BedStatus:
      type: string
      enum:
        - EMPTY
        - OCCUPIED
        - HELD
        - AWAITING_READY
        - UNDER_MAINTENANCE
        - SUSPENDED
        - RETIRED
    BedBoard:
      type: object
      properties:
        beds:
          type: array
          items:
            $ref: "#/components/schemas/Bed"
        residentsWithoutBed:
          type: array
          items:
            $ref: "#/components/schemas/ResidentSummary"
    Bed:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        location:
          $ref: "#/components/schemas/Location"
        holdReason:
          type: string
          enum:
            - ABSENT_RESIDENT
            - WAITING_RECORD
        heldForResidentId:
          type: integer
          format: int64
        holdUntil:
          type: string
          format: date-time
        readyDeadline:
          type: string
          format: date-time
        readinessOverdue:
          type: boolean
        awaitingResidentTransfer:
          type: boolean
        futureAllocationFrom:
          type: string
          format: date-time
          description: '"đã có phân bổ từ <thời điểm>"'
        occupant:
          $ref: "#/components/schemas/ResidentSummary"
        flags:
          type: array
          items:
            type: string
            enum:
              - ROOM_UNSUITABLE
              - AWAITING_DOCTOR_CONFIRMATION
              - AWAITING_REQUEST
              - AWAITING_SAME_PRICE
        allowedCommands:
          type: array
          items:
            type: string
          description: Chỉ để hiển thị nút (constitution XI)
        state:
          $ref: "#/components/schemas/BedStatus"
    Location:
      type: object
      properties:
        area:
          type: string
        floor:
          type: string
        room:
          type: string
        label:
          type: string
          description: '"Khu A – Tầng 2 – P201 – G1" (FR-003)'
        bedId:
          type: integer
          format: int64
        roomId:
          type: integer
          format: int64
        floorId:
          type: integer
          format: int64
        bed:
          type: string
    ResidentSummary:
      type: object
      description: Họ tên, giới tính, mức chăm sóc; không có thông tin sức khỏe (FR-022, CHK041)
      properties:
        residentId:
          type: integer
          format: int64
        fullName:
          type: string
        gender:
          type: string
        careLevel:
          $ref: "#/components/schemas/CareLevelCode"
    BedWrite:
      type: object
      required:
        - roomId
        - code
      properties:
        roomId:
          type: integer
          format: int64
        code:
          type: string
          maxLength: 20
    BedCreation:
      type: object
      properties:
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
        bed:
          $ref: "#/components/schemas/Bed"
    Warning:
      type: object
      properties:
        code:
          type: string
          description: VUOT_SO_GIUONG_TIEU_CHUAN, TRO_VE_PHONG_CACH_LY, DA_DAT_DAU_CHO_LAP_YEU_CAU…
        description:
          type: string
    LyDo: { type: string, minLength: 1, maxLength: 2000 }
    MaMucChamSoc: { type: string, enum: [CO_BAN, THUONG_XUYEN, DAC_BIET] }
    TrangThaiGiuong: { type: string, enum: [TRONG, DANG_SU_DUNG, DANG_GIU_CHO, CHO_SAN_SANG, DANG_BAO_TRI, TAM_NGUNG, KHONG_SU_DUNG] }
    TrangThaiPhanBo: { type: string, enum: [TUONG_LAI, DANG_HIEU_LUC, DA_DONG, DA_HUY] }
    Loi:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        maLoi: { type: string }
        dieuKienChuaThoa: { type: array, items: { $ref: '#/components/schemas/DieuKien' } }
        doiTuongGayChan: { type: array, description: 'FR-005, FR-006: giường, người cao tuổi, phân công gây chặn', items: { type: object, properties: { loai: { type: string }, id: { type: integer, format: int64 }, nhan: { type: string } } } }
        giaTriHienHanh: { type: object }
    DieuKien:
      type: object
      properties:
        ma:
          type: string
          description: |
            PB_MUC_CHAM_SOC (a), PB_LOAI_LUU_TRU (b), PB_GIOI_TINH (c), PB_CACH_LY (d), PB_TRANG_THAI_GIUONG (e),
            PB_GIU_CHO_NGUOI_KHAC (f), PB_CHONG_THOI_GIAN (g), PB_TRANG_THAI_NCT (h), PB_CHO_CHUYEN_NGUOI (i),
            PB_CHO_SAN_SANG_TRUOC_HAN (FR-011a), GIUONG_DAT_TRUOC_CHUA_SAN_SANG (FR-023), CHUA_GHI_KHU_KHUAN (BR-M03-10),
            KHOANG_VANG (FR-027 c), NGOAI_PHAM_VI …
        moTa: { type: string }
        canCu: { type: string, description: 'BR/FR, ví dụ BR-M03-01' }
    CanhBao:
      type: object
      properties:
        ma: { type: string, description: 'VUOT_SO_GIUONG_TIEU_CHUAN, TRO_VE_PHONG_CACH_LY, DA_DAT_DAU_CHO_LAP_YEU_CAU…' }
        moTa: { type: string }
    KhuVuc:
      type: object
      properties: { id: { type: integer, format: int64 }, ma: { type: string }, ten: { type: string }, trangThai: { type: string }, phienBan: { type: integer } }
    KhuVucGhi:
      type: object
      required: [ma, ten]
      properties: { ma: { type: string, maxLength: 20 }, ten: { type: string, maxLength: 100 }, lyDo: { $ref: '#/components/schemas/LyDo' } }
    Tang:
      type: object
      properties: { id: { type: integer, format: int64 }, khuVucId: { type: integer, format: int64 }, ma: { type: string }, ten: { type: string }, tenToaNha: { type: string }, trangThai: { type: string } }
    TangGhi:
      type: object
      required: [khuVucId, ma, ten]
      properties: { khuVucId: { type: integer, format: int64 }, ma: { type: string }, ten: { type: string }, tenToaNha: { type: string } }
    LoaiPhong:
      type: object
      properties:
        id: { type: integer, format: int64 }
        ten: { type: string }
        soGiuongTieuChuan: { type: integer }
        mucMacDinh: { type: array, items: { $ref: '#/components/schemas/MaMucChamSoc' } }
        phucVuDaiHan: { type: boolean }
        phucVuNganNgay: { type: boolean }
        trangThai: { type: string }
    LoaiPhongGhi:
      type: object
      required: [ten, soGiuongTieuChuan, mucMacDinh]
      properties:
        ten: { type: string }
        soGiuongTieuChuan: { type: integer, minimum: 1 }
        mucMacDinh: { type: array, minItems: 1, items: { $ref: '#/components/schemas/MaMucChamSoc' } }
        phucVuDaiHan: { type: boolean, default: true }
        phucVuNganNgay: { type: boolean, default: true }
    Phong:
      type: object
      properties:
        id: { type: integer, format: int64 }
        tangId: { type: integer, format: int64 }
        ma: { type: string }
        ten: { type: string }
        loaiPhongId: { type: integer, format: int64 }
        mucChoPhep: { type: array, items: { $ref: '#/components/schemas/MaMucChamSoc' } }
        chinhSachGioiTinh: { type: string, enum: [NAM, NU, KHONG_GIOI_HAN] }
        dangCachLy: { type: boolean }
        chiuChanCachLy: { type: boolean, description: 'Đang cách ly hoặc thuộc vùng khoanh vùng (FR-009)' }
        trangThai: { type: string }
    PhongGhi:
      type: object
      required: [tangId, ma, ten, loaiPhongId, chinhSachGioiTinh]
      properties:
        tangId: { type: integer, format: int64 }
        ma: { type: string }
        ten: { type: string }
        loaiPhongId: { type: integer, format: int64 }
        mucChoPhep: { type: array, items: { $ref: '#/components/schemas/MaMucChamSoc' } }
        chinhSachGioiTinh: { type: string, enum: [NAM, NU, KHONG_GIOI_HAN] }
        lyDo: { $ref: '#/components/schemas/LyDo' }
    LyDoChuyen:
      type: object
      properties: { id: { type: integer, format: int64 }, ma: { type: string }, ten: { type: string }, yTeAnToan: { type: boolean }, coDinh: { type: boolean }, trangThai: { type: string } }
    LyDoChuyenGhi:
      type: object
      required: [ma, ten, yTeAnToan]
      properties: { ma: { type: string }, ten: { type: string }, yTeAnToan: { type: boolean } }
    GiuongGhi:
      type: object
      required: [phongId, ma]
      properties: { phongId: { type: integer, format: int64 }, ma: { type: string, maxLength: 20 } }
    Giuong:
      type: object
      properties:
        id: { type: integer, format: int64 }
        ma: { type: string }
        viTri: { $ref: '#/components/schemas/ViTri' }
        trangThai: { $ref: '#/components/schemas/TrangThaiGiuong' }
        lyDoGiuCho: { type: string, enum: [NGUOI_VANG, HO_SO_CHO] }
        giuChoNctId: { type: integer, format: int64 }
        hanGiuCho: { type: string, format: date-time }
        hanXacNhanSanSang: { type: string, format: date-time }
        quaHanXacNhan: { type: boolean }
        mangDauChoChuyenNguoi: { type: boolean }
        phanBoTuongLaiTu: { type: string, format: date-time, description: '"đã có phân bổ từ <thời điểm>"' }
        nguoiDangNam: { $ref: '#/components/schemas/NguoiNgan' }
        dau: { type: array, items: { type: string, enum: [PHONG_KHONG_PHU_HOP, CHO_BS_XAC_NHAN, CHO_LAP_YEU_CAU, CHO_VE_CUNG_GIA] } }
        lenhDuocPhep: { type: array, items: { type: string }, description: 'Chỉ để hiển thị nút (constitution XI)' }
    KetQuaTaoGiuong:
      type: object
      properties: { giuong: { $ref: '#/components/schemas/Giuong' }, canhBao: { type: array, items: { $ref: '#/components/schemas/CanhBao' } } }
    BangGiuong:
      type: object
      properties:
        giuong: { type: array, items: { $ref: '#/components/schemas/Giuong' } }
        danhSachChuaCoGiuong: { type: array, items: { $ref: '#/components/schemas/NguoiNgan' } }
    TongHopGiuong:
      type: object
      properties:
        theoTrangThai: { type: object, additionalProperties: { type: integer } }
        coTheDung: { type: integer, description: 'Không tính Tạm ngừng sử dụng, Đang bảo trì, Không sử dụng' }
        trongTheoDieuKien: { type: integer }
    DieuKienXacNhanSanSang:
      type: object
      properties:
        duocThucHien: { type: boolean }
        canKhuKhuan: { type: boolean }
        nguoiVuaRoi: { $ref: '#/components/schemas/NguoiNgan' }
        dieuKienChuaThoa: { type: array, items: { $ref: '#/components/schemas/DieuKien' } }
    DongLichSuGiuong:
      type: object
      properties:
        id: { type: integer, format: int64 }
        tu: { $ref: '#/components/schemas/TrangThaiGiuong' }
        den: { $ref: '#/components/schemas/TrangThaiGiuong' }
        suKien: { type: string }
        thoiDiem: { type: string, format: date-time }
        thoiDiemDuKien: { type: string, format: date-time }
        thucHienTre: { type: boolean }
        nguoiThucHien: { type: string, description: 'Họ tên hoặc "Bộ lập lịch hệ thống"' }
        lyDo: { type: string }
        canCu: { type: object, properties: { loai: { type: string }, id: { type: integer, format: int64 } } }
        daKhuKhuan: { type: boolean }
        daDungBaoHo: { type: boolean }
        ghiChu: { type: string }
        daDinhChinh: { type: boolean }
    DongCachLy:
      type: object
      properties: { hanhDong: { type: string, enum: [DAT, GO] }, thoiDiem: { type: string, format: date-time }, nguoiThucHien: { type: string }, lyDo: { type: string }, suCoId: { type: integer, format: int64 } }
    ViTri:
      type: object
      properties:
        khuVuc: { type: string }
        tang: { type: string }
        phong: { type: string }
        giuong: { type: string }
        nhan: { type: string, description: '"Khu A – Tầng 2 – P201 – G1" (FR-003)' }
        giuongId: { type: integer, format: int64 }
        phongId: { type: integer, format: int64 }
        tangId: { type: integer, format: int64 }
    NguoiNgan:
      type: object
      description: Họ tên, giới tính, mức chăm sóc; không có thông tin sức khỏe (FR-022, CHK041)
      properties: { nctId: { type: integer, format: int64 }, hoTen: { type: string }, gioiTinh: { type: string }, mucChamSoc: { $ref: '#/components/schemas/MaMucChamSoc' } }
    GiuongPhuHop:
      type: object
      properties:
        viTri: { $ref: '#/components/schemas/ViTri' }
        trangThai: { $ref: '#/components/schemas/TrangThaiGiuong' }
        phanBoTuongLaiTu: { type: string, format: date-time }
        batDauSomNhat: { type: string, format: date-time, description: 'Giường Chờ sẵn sàng: hạn xác nhận (FR-011a)' }
        nguoiCungPhong: { type: array, items: { $ref: '#/components/schemas/NguoiNgan' } }
    PhanBo:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nctId: { type: integer, format: int64 }
        viTri: { $ref: '#/components/schemas/ViTri' }
        trangThai: { $ref: '#/components/schemas/TrangThaiPhanBo' }
        batDau: { type: string, format: date-time }
        batDauDuKien: { type: string, format: date-time }
        ketThuc: { type: string, format: date-time }
        ketThucDuKien: { type: string, format: date-time }
        lyDoBatDau: { type: string }
        lyDoKetThuc: { type: string }
        lyDoHuy: { type: string }
        nguoiMo: { type: string }
        nguoiDong: { type: string }
        canCu: { type: object, properties: { loai: { type: string }, id: { type: integer, format: int64 } } }
        phanBoTruocId: { type: integer, format: int64 }
        mucDaKiemTra: { $ref: '#/components/schemas/MaMucChamSoc' }
        nguonMuc: { type: string, enum: [HIEN_HANH, HOP_DONG, LUOT_DANG_KY] }
        bacSiChiDinh: { type: string }
        nhapBu: { type: boolean }
        thoiDiemNhapThuc: { type: string, format: date-time }
        thoiDiemDuKien: { type: string, format: date-time }
        thucHienTre: { type: boolean }
        choGiuongSanSang: { type: boolean }
        dau: { type: array, items: { type: string, enum: [PHONG_KHONG_PHU_HOP, CHO_BS_XAC_NHAN, CHO_LAP_YEU_CAU, CHO_VE_CUNG_GIA] } }
        bacSiXacNhan: { type: object, properties: { hoTen: { type: string }, thoiDiem: { type: string, format: date-time }, lyDo: { type: string } } }
        daDinhChinh: { type: boolean }
    KetQuaChuyenGiuong:
      type: object
      properties:
        phanBoCu: { $ref: '#/components/schemas/PhanBo' }
        phanBoMoi: { $ref: '#/components/schemas/PhanBo' }
        canhBao: { type: array, items: { $ref: '#/components/schemas/CanhBao' } }
    YeuCauNhapBu:
      type: object
      properties: { yeuCauPheDuyetId: { type: integer, format: int64 }, trangThai: { type: string } }
    ViTriNguoiCaoTuoi:
      type: object
      properties:
        viTri: { $ref: '#/components/schemas/ViTri' }
        phanBoHienHanh: { $ref: '#/components/schemas/PhanBo' }
        phanBoTuongLai: { $ref: '#/components/schemas/PhanBo' }
        chuaCoGiuongTu: { type: string, format: date-time }
    DongViTri:
      type: object
      properties:
        phanBoId: { type: integer, format: int64 }
        viTri: { $ref: '#/components/schemas/ViTri' }
        tu: { type: string, format: date-time }
        den: { type: string, format: date-time }
        daDinhChinh: { type: boolean }
        coNhapBuChoDuyet: { type: boolean }
    DongGiuong:
      type: object
      properties:
        viTri: { $ref: '#/components/schemas/ViTri' }
        nguoi: { type: array, items: { type: object, properties: { nctId: { type: integer, format: int64 }, hoTen: { type: string }, tu: { type: string, format: date-time }, den: { type: string, format: date-time }, daDinhChinh: { type: boolean } } } }
    NguoiCungPhong:
      type: object
      properties:
        nctId: { type: integer, format: int64 }
        hoTen: { type: string }
        phong: { type: string }
        khoangChong: { type: array, items: { type: object, properties: { tu: { type: string, format: date-time }, den: { type: string, format: date-time } } } }
        khoangVang:
          type: array
          description: Khoảng A hoặc người này vắng mặt (Tạm vắng, Điều trị tại bệnh viện, Hoạt động bên ngoài; FR-036)
          items: { type: object, properties: { nctId: { type: integer, format: int64 }, loai: { type: string }, tu: { type: string, format: date-time }, den: { type: string, format: date-time } } }
        daDinhChinh: { type: boolean }
        coNhapBuChoDuyet: { type: boolean }
    KhuNghiBanTru:
      type: object
      properties: { id: { type: integer, format: int64 }, ma: { type: string }, ten: { type: string }, tangId: { type: integer, format: int64 }, khuVucId: { type: integer, format: int64 }, sucChuaMoiBuoi: { type: integer, description: 'Giá trị hiện hành của CFG-M03-01' }, trangThai: { type: string } }
    KhuNghiBanTruGhi:
      type: object
      required: [ma, ten]
      properties: { ma: { type: string }, ten: { type: string }, tangId: { type: integer, format: int64 }, khuVucId: { type: integer, format: int64 } }
    BuoiBanTru:
      type: object
      properties: { id: { type: integer, format: int64 }, ten: { type: string }, gioBatDau: { type: string, example: '07:00' }, gioKetThuc: { type: string, example: '12:00' }, trangThai: { type: string } }
    BuoiBanTruGhi:
      type: object
      required: [ten, gioBatDau, gioKetThuc]
      properties: { ten: { type: string }, gioBatDau: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }, gioKetThuc: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' } }
    KetQuaDoiBuoi:
      type: object
      properties:
        buoi: { $ref: '#/components/schemas/BuoiBanTru' }
        buoiVuotSucChua: { type: array, items: { $ref: '#/components/schemas/ChoTheoBuoi' } }
    ChoTheoBuoi:
      type: object
      properties: { ngay: { type: string, format: date }, buoiId: { type: integer, format: int64 }, tenBuoi: { type: string }, soDangKy: { type: integer }, sucChua: { type: integer }, conLai: { type: integer } }

  # Schema HTTP Phase 4; giữ schema tên logic cho các phase sau.
    BedSummary:
      type: object
      properties:
        byState:
          type: object
          additionalProperties:
            type: integer
        usable:
          type: integer
          description: Không tính Tạm ngừng sử dụng, Đang bảo trì, Không sử dụng
        emptyMatching:
          type: integer
    SuitableBed:
      type: object
      properties:
        location:
          $ref: "#/components/schemas/Location"
        futureAllocationFrom:
          type: string
          format: date-time
        earliestStartAt:
          type: string
          format: date-time
          description: "Giường Chờ sẵn sàng: hạn xác nhận (FR-011a)"
        roommates:
          type: array
          items:
            $ref: "#/components/schemas/ResidentSummary"
        state:
          $ref: "#/components/schemas/BedStatus"
    BedAllocation:
      type: object
      properties:
        id:
          type: integer
          format: int64
        residentId:
          type: integer
          format: int64
        location:
          $ref: "#/components/schemas/Location"
        status:
          $ref: "#/components/schemas/AllocationStatus"
        startAt:
          type: string
          format: date-time
        plannedStartAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        expectedEnd:
          type: string
          format: date-time
        startReason:
          type: string
        endReason:
          type: string
        cancellationReason:
          type: string
        openedBy:
          type: string
        closedBy:
          type: string
        basis:
          type: object
          properties:
            type:
              type: string
            id:
              type: integer
              format: int64
        previousAllocationId:
          type: integer
          format: int64
        checkedCareLevel:
          $ref: "#/components/schemas/CareLevelCode"
        careLevelSource:
          type: string
          enum:
            - CURRENT
            - CONTRACT
            - REGISTRATION
        prescribingDoctor:
          type: string
        backfilled:
          type: boolean
        actualRecordedAt:
          type: string
          format: date-time
        plannedAt:
          type: string
          format: date-time
        executedLate:
          type: boolean
        waitingForBedReady:
          type: boolean
        flags:
          type: array
          items:
            type: string
            enum:
              - ROOM_UNSUITABLE
              - AWAITING_DOCTOR_CONFIRMATION
              - AWAITING_REQUEST
              - AWAITING_SAME_PRICE
        doctorConfirmation:
          type: object
          properties:
            fullName:
              type: string
            occurredAt:
              type: string
              format: date-time
            reason:
              type: string
        corrected:
          type: boolean
    ResidentLocation:
      type: object
      properties:
        location:
          $ref: "#/components/schemas/Location"
        currentAllocation:
          $ref: "#/components/schemas/BedAllocation"
        futureAllocation:
          $ref: "#/components/schemas/BedAllocation"
        withoutBedSince:
          type: string
          format: date-time
    AllocationStatus:
      type: string
      enum:
        - FUTURE
        - ACTIVE
        - CLOSED
        - CANCELLED
