        - BR-M03-02
        - BR-M03-19
        - BR-M03-20
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - residentId
                - bedId
                - reason
              properties:
                residentId:
                  type: integer
                  format: int64
                bedId:
                  type: integer
                  format: int64
                startAt:
                  type: string
                  format: date-time
                  description: Chỉ với người Đang tiếp nhận; bỏ qua khi bắt đầu ngay
                reason:
                  $ref: "#/components/schemas/Reason"
      responses:
        "201":
          description: Đã phân bổ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BedAllocation"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
