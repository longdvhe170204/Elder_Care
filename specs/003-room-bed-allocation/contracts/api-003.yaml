openapi: 3.1.0
info:
  title: Elder Care – Feature 003 (phòng, giường và phân bổ giường)
  version: 1.0.0-design
  description: |
    Hợp đồng REST của feature 003 (module M03, phần phòng và giường). Quy ước chung theo research R-03 của 000:
    tiền tố /api/v1, lỗi RFC 9457 có maLoi và dieuKienChuaThoa[], If-Match cho lệnh sửa danh mục,
    Idempotency-Key cho mọi lệnh ghi. Xác thực và giới hạn trường theo 002.
    Lệnh phân bổ, chuyển giường, đổi trạng thái giường không dùng If-Match: backend khóa dòng theo thứ tự
    và kiểm tra lại trên trạng thái mới (FR-020, FR-033, research G-03).
    Không có endpoint đặt trạng thái giường, sửa hay xóa phân bổ (FR-011, FR-026).
    Lệnh trạng thái người cao tuổi (Hoàn tất tiếp nhận, Cho tạm vắng…) thuộc api-001; 003 chỉ sở hữu
    chiTiet.doiPhanBoSangGiuongId của HOAN_TAT_TIEP_NHAN (research G-06).
    Truy vết: mỗi operation có x-fr (FR của spec 003) và x-br khi có.
servers:
  - url: /api/v1
security:
  - phien: []
tags:
  - name: co-cau
    description: UC-19; mục A (khu vực, tầng, loại phòng, phòng, giường, lý do chuyển)
  - name: giuong
    description: Trạng thái giường; mục C, H (Tạm ngừng sử dụng, Sử dụng lại, Xác nhận giường sẵn sàng UC-74)
  - name: cach-ly
    description: UC-37 (phần đặt, gỡ cách ly phòng); mục B
  - name: phan-bo
    description: UC-20, UC-21; mục D, E
  - name: tra-cuu
    description: Lịch sử vị trí; mục F
  - name: ban-tru
    description: Khu nghỉ bán trú, buổi; mục G

