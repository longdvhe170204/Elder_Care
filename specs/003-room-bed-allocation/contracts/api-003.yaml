        giường":

        phân bổ ACTIVE bắt đầu ngay (FR-025a). Đã có phân bổ đang hiệu lực: 409 ALREADY_ALLOCATED, dùng chuyển
        giường.

        Vi phạm: 409 UNMET_CONDITIONS với mọi mã ALLOCATION_* trong một lần (SC-002); giường vừa bị người khác
        lấy:

        ALLOCATION_TIME_OVERLAP "Giường đã được phân bổ trong khoảng thời gian này" (BR-M03-02).
