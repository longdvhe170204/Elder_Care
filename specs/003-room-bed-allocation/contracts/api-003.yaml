  # ---------------- Giường ----------------
  /beds:
    get:
      tags:
        - giuong
      summary: Bảng giường (Quản lý viện, Trưởng tầng, Hành chính)
      description: >
        Toàn bộ cơ cấu và trạng thái giường (FR-002). Mỗi giường có trạng thái, thuộc tính giữ chỗ, hạn xác nhận
        sẵn sàng,

        người đang nằm (họ tên), dấu (phòng không còn phù hợp, chờ bác sĩ xác nhận vùng cách ly, chờ chuyển
        người),

        phân bổ tương lai ("đã có phân bổ từ <thời điểm>"). Người mang dấu "chưa có giường" trả ở
        danhSachChuaCoGiuong (FR-025a).

        Vai trò khác: 403; họ thấy vị trí qua hồ sơ (001).
      x-fr:
        - FR-002
        - FR-013b
        - FR-024a
        - FR-025a
        - FR-034
