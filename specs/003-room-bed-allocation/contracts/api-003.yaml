          in: query
          schema:
            type: integer
            format: int64
        - name: floorId
          in: query
          schema:
            type: integer
            format: int64
        - name: roomId
          in: query
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/BedStatus"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
