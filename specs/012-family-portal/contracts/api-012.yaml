openapi: 3.1.0
info:
  title: Elder Care – Feature 012 (người thân và cổng thông tin gia đình)
  version: 1.0.0-design
  description: |
    Hợp đồng REST của feature 012 (module M10). Quy ước chung theo research R-03 của 000:
    tiền tố /api/v1, lỗi RFC 9457 có errorCode và unmetConditions[], Idempotency-Key cho mọi lệnh ghi.
    Tên định danh tiếng Anh theo glossary.md của 000, mục 18 (dịch 2026-11-03; bản tên logic tiếng Việt ở lịch sử git).
    Lệnh trên yêu cầu, ngoại lệ, lượt thăm, lượt ở lại, phản hồi khóa dòng và kiểm tra lại (research F-03); sửa hồ sơ người thân
    dùng If-Match (bản tin bỏ theo Q-396).
    Quy trình đón chỉ trực tuyến (FR-028). Người thân dùng các đường dẫn /family-portal/** và các lệnh được đánh dấu x-family-member;
    backend kiểm quan hệ Hiệu lực và quyền có tác dụng tại thời điểm gọi. Chi phí, mua hộ (010), số dư (017), đồ gửi (013),
    hoạt động và đồng ý về muộn (014), thông báo (009) do REST của feature sở hữu phục vụ.
    Truy vết: mỗi operation có x-fr (FR của spec 012) và x-br khi có.
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - { name: family-members, description: 'UC-55; mục A, B' }
  - { name: right-change-requests, description: 'UC-55; mục C' }
  - { name: pickups, description: 'UC-58; mục D' }
  - { name: visits, description: 'UC-57; mục E' }
  - { name: family-stays, description: 'Mục F' }
  - { name: family-portal, description: 'UC-56; mục G' }
  - { name: feedback, description: 'UC-59; mục I' }
  - { name: resident-channel, description: 'Mục G2' }

paths:
  /family-members:
    get:
      tags: [family-members]
      summary: Tìm hồ sơ người thân theo họ tên, số điện thoại, số giấy tờ (Hành chính)
      x-fr: [FR-001]
      parameters: [ { name: q, in: query, schema: { type: string } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FamilyMember' } } } } } }
    post:
      tags: [family-members]
      summary: Lập hồ sơ người thân (Hành chính)
      x-fr: [FR-001]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FamilyMember' } } } }
      responses: { '201': { description: OK }, '422': { $ref: '#/components/responses/Problem' } }
  /family-members/{id}:
    get:
      tags: [family-members]
      summary: Hồ sơ người thân và các quan hệ
      x-fr: [FR-001, FR-002]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } } } }
    put:
      tags: [family-members]
      summary: Sửa thông tin liên hệ (nhật ký trước/sau); bỏ giấy tờ bị chặn khi đang có quyền được phép đón
      x-fr: [FR-001, FR-007]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FamilyMember' } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' }, '412': { $ref: '#/components/responses/Problem' } }
  /residents/{residentId}/relationships:
    get:
      tags: [family-members]
      summary: Quan hệ của người cao tuổi, vai trò, quyền đang bật và quyền có tác dụng
      x-fr: [FR-002, FR-007, FR-011]
      x-br: [DBR-02, DBR-03]
      parameters: [ { $ref: '#/components/parameters/ResidentId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Relationship' } } } } } }
    post:
      tags: [family-members]
      summary: Lập quan hệ (mọi quyền tắt, trừ FR-009, FR-010); tùy chọn đặt liên hệ chính, người đại diện đầu tiên
      x-fr: [FR-002, FR-003, FR-005, FR-008]
      x-br: [DBR-02]
      parameters: [ { $ref: '#/components/parameters/ResidentId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateRelationship' } } } }
      responses: { '201': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /relationships/{id}/{command}:
    post:
      tags: [family-members]
      summary: Lệnh trên quan hệ
      description: |
        change-primary-contact (lý do; chuyển vai trò trong cùng lệnh); set-first-representative (lý do, bằng chứng; chỉ khi chưa có người đại diện);
        change-contact-order (lý do; FR-012); end (lý do; FR-006 tác động kèm). Vi phạm DBR-02 → DBR_02_VIOLATED.
        Đặt/thôi người đại diện khi đã có người đại diện dùng POST /right-change-requests.
      x-fr: [FR-004, FR-005, FR-006, FR-012]
      x-br: [DBR-02]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: command, in: path, required: true, schema: { type: string, enum: [change-primary-contact, set-first-representative, change-contact-order, end] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { $ref: '#/components/schemas/Reason' }, evidenceFileId: { type: integer, format: int64 }, contactOrder: { type: integer } } } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /residents/{residentId}/family-registration-forms:
    post:
      tags: [family-members]
      summary: Ghi phiếu đăng ký người thân (bản scan bắt buộc); mỗi quyền thành một yêu cầu Hiệu lực cách "bản ký"
      x-fr: [FR-008]
      x-br: [BR-M10-07]
      parameters: [ { $ref: '#/components/parameters/ResidentId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FamilyRegistrationForm' } } } }
      responses: { '201': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /residents/{residentId}/pickup-list:
    get:
      tags: [family-members]
      summary: Danh sách được phép đón tại một thời điểm (mặc định hiện tại); lịch sử cho nhân viên
      x-fr: [FR-007, FR-068]
      parameters: [ { $ref: '#/components/parameters/ResidentId' }, { name: at, in: query, schema: { type: string, format: date-time } } ]
      responses: { '200': { description: OK } }

  /right-change-requests:
    get:
      tags: [right-change-requests]
      summary: Yêu cầu thay đổi quyền (lọc người cao tuổi, trạng thái); người đại diện thấy yêu cầu cần mình xác nhận
      x-fr: [FR-013, FR-050]
      x-family-member: true
      parameters:
        - { name: residentId, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING_CONFIRMATION, EFFECTIVE, REJECTED, CANCELLED] } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RightChangeRequest' } } } } } }
    post:
      tags: [right-change-requests]
      summary: Lập yêu cầu thay đổi quyền, danh sách đón, dấu được tự về, đặt/thôi người đại diện
      description: |
        Người đại diện qua cổng hoặc Hành chính kèm bản ký → Hiệu lực ngay (FR-015 a, b). Tắt được phép đón / tắt tự về áp ngay khi lập (FR-017).
        Chặn DUPLICATE_PENDING_REQUEST (FR-018), ID_DOCUMENT_REQUIRED (FR-007), CONSENT_NOT_INCLUDED (FR-011), REQUEST_NOT_ALLOWED (FR-014).
      x-fr: [FR-013, FR-014, FR-015, FR-016, FR-017, FR-018]
      x-br: [BR-M10-07]
      x-family-member: true
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateRightChangeRequest' } } } }
      responses: { '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RightChangeRequest' } } } }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }
  /right-change-requests/{id}/{command}:
    post:
      tags: [right-change-requests]
      summary: "Xác nhận (người đại diện), duyệt (Quản lý viện, lý do), từ chối (lý do), hủy (người lập, lý do)"
      x-fr: [FR-005, FR-015, FR-016, FR-017, FR-020]
      x-br: [BR-M10-07]
      x-family-member: true
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: command, in: path, required: true, schema: { type: string, enum: [confirm, approve, reject, cancel] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { $ref: '#/components/schemas/Reason' }, evidenceFileId: { type: integer, format: int64 }, signedByFamilyMemberId: { type: integer, format: int64 }, discussedWithResident: { type: string, maxLength: 2000 } } } } } }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }

  /residents/{residentId}/pickups:
    post:
      tags: [pickups]
      summary: Ghi đón (chỉ trực tuyến); không đạt thì ghi lần chặn và trả PICKUP_BLOCKED
      description: |
        Loại TEMPORARY_ABSENCE, FAMILY_OUTING, DAY_CARE_DEPARTURE, SELF_RETURN, INSTITUTE_RETURN, RESIDENCY_END. Người thực hiện có quyền lệnh nguồn (FR-022).
        INSTITUTE_RETURN ghi điểm danh về của 005 trong cùng lệnh (Q-295). Bản ghi trả về dùng làm pickupRecordId của lệnh nguồn trong CFG-M10-09.
      x-fr: [FR-021, FR-022, FR-023, FR-026, FR-027, FR-028]
      x-br: [BR-M10-03]
      parameters: [ { $ref: '#/components/parameters/ResidentId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecordPickup' } } } }
      responses: { '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PickupRecord' } } } }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }
  /residents/{residentId}/pickup-records:
    get:
      tags: [pickups]
      summary: Bản ghi đón, lần chặn đón của người cao tuổi (nhân viên)
      x-fr: [FR-023, FR-026]
      parameters: [ { $ref: '#/components/parameters/ResidentId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PickupRecord' } } } } } }
  /residents/{residentId}/pickup-exceptions:
    post:
      tags: [pickups]
      summary: Lập yêu cầu ngoại lệ đón cho người ngoài danh sách
      x-fr: [FR-024, FR-025]
      x-br: [BR-M10-03]
      parameters: [ { $ref: '#/components/parameters/ResidentId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [fullName, idDocumentNumber, relationship, reason], properties: { fullName: { type: string }, idDocumentNumber: { type: string }, relationship: { type: string }, reason: { $ref: '#/components/schemas/Reason' } } } } } }
      responses: { '201': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /pickup-exceptions/{id}/{command}:
    post:
      tags: [pickups]
      summary: "Xác nhận (người đại diện qua cổng), duyệt (Quản lý viện), từ chối, hủy (lý do)"
      x-fr: [FR-024]
      x-family-member: true
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: command, in: path, required: true, schema: { type: string, enum: [confirm, approve, reject, cancel] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { $ref: '#/components/schemas/Reason' } } } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }

  /visit-slots:
    get:
      tags: [visits]
      summary: Khung thăm của một ngày và số chỗ còn (CFG-M10-04)
      x-fr: [FR-030]
      x-family-member: true
      parameters: [ { name: date, in: query, required: true, schema: { type: string, format: date } } ]
      responses: { '200': { description: OK } }
  /visits:
    get:
      tags: [visits]
      summary: Lượt thăm theo ngày, người cao tuổi; người thân chỉ thấy lượt của mình
      x-fr: [FR-039, FR-046]
      x-family-member: true
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: residentId, in: query, schema: { type: integer, format: int64 } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Visit' } } } } } }
    post:
      tags: [visits]
      summary: Đăng ký thăm; đạt FR-030 thì Đã duyệt ngay và giữ chỗ, không đạt thì 422 kèm mọi lý do, không tạo lượt
      x-fr: [FR-029, FR-030, FR-031]
      x-br: [BR-M10-02]
      x-family-member: true
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VisitRegistration' } } } }
      responses: { '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Visit' } } } }, '403': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
  /visits/{id}/{command}:
    post:
      tags: [visits]
      summary: "Hủy (người đăng ký trước giờ bắt đầu; Hành chính có lý do), vào (Hành chính, kiểm lại (c)(d), người thực tế), ra (giờ ra thực tế)"
      x-fr: [FR-033, FR-034, FR-035]
      x-family-member: true
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: command, in: path, required: true, schema: { type: string, enum: [cancel, check-in, check-out] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { $ref: '#/components/schemas/Reason' }, actualVisitors: { type: array, items: { $ref: '#/components/schemas/Companion' } }, checkOutAt: { type: string, format: date-time } } } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }

  /family-stays:
    get:
      tags: [family-stays]
      summary: Lượt ở lại theo người cao tuổi, trạng thái
      x-fr: [FR-045]
      parameters: [ { name: residentId, in: query, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FamilyStay' } } } } } }
    post:
      tags: [family-stays]
      summary: Đăng ký ở lại (Hành chính); chặn chồng thời gian theo CFG-M10-10, khoanh vùng, trạng thái
      x-fr: [FR-040, FR-041]
      x-br: [BR-M10-04]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FamilyStayRegistration' } } } }
      responses: { '201': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /family-stays/{id}/{command}:
    post:
      tags: [family-stays]
      summary: Lệnh trên lượt ở lại theo bảng FR-045
      description: |
        confirm, reject (Trưởng tầng được giao; không có thì Quản lý viện; xác nhận cần ý kiến người cùng phòng khi phòng có ≥ 2 giường đang dùng);
        start (Hành chính, Trưởng tầng); cancel, extend (Hành chính, lý do); end (Hành chính, Trưởng tầng; thời điểm kết thúc thực tế).
      x-fr: [FR-040, FR-041, FR-042, FR-043, FR-045]
      x-br: [BR-M10-04]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: command, in: path, required: true, schema: { type: string, enum: [confirm, reject, start, cancel, extend, end] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { $ref: '#/components/schemas/Reason' }, roommateOpinion: { type: object }, newExpectedEndAt: { type: string, format: date-time }, at: { type: string, format: date-time } } } } } }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }

  /family-portal/residents:
    get:
      tags: [family-portal]
      summary: Người cao tuổi mà người thân đang đăng nhập có quan hệ Hiệu lực, kèm quyền có tác dụng
      x-fr: [FR-046]
      x-br: [BR-M10-01]
      x-family-member: true
      responses: { '200': { description: OK } }
  /family-portal/residents/{residentId}/general:
    get:
      tags: [family-portal]
      summary: "Thông tin chung: họ tên, ảnh, phòng, trạng thái, lượt vắng, lịch đến/về, lượt thăm và phản hồi của mình, thực đơn chung (bản tin bỏ theo Q-396)"
      x-fr: [FR-046, FR-047]
      x-family-member: true
      parameters: [ { $ref: '#/components/parameters/ResidentId' } ]
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' } }
  /family-portal/residents/{residentId}/health/{section}:
    get:
      tags: [family-portal]
      summary: Phần sức khỏe (chỉ khi quyền xem sức khỏe có tác dụng); mỗi lần mở ghi nhật ký lượt xem
      x-fr: [FR-046, FR-047, FR-048]
      x-br: [BR-M10-01, DBR-03]
      x-family-member: true
      parameters:
        - { $ref: '#/components/parameters/ResidentId' }
        - { name: section, in: path, required: true, schema: { type: string, enum: [allergies-conditions, vital-signs, weight, medications, incidents, care-results, eating, diet, medical-appointments] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses: { '200': { description: OK }, '403': { description: 'NO_HEALTH_VIEW_RIGHT hoặc RIGHT_NOT_EFFECTIVE', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } } }
  /family-portal/residents/{residentId}/contract:
    get:
      tags: [family-portal]
      summary: Hợp đồng, phụ lục, đặt cọc, tiến trình kết thúc lưu trú (chỉ người đại diện)
      x-fr: [FR-046]
      x-family-member: true
      parameters: [ { $ref: '#/components/parameters/ResidentId' } ]
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' } }
  /health-view-logs:
    get:
      tags: [family-portal]
      summary: Tra cứu nhật ký lượt xem sức khỏe (Quản lý viện)
      x-fr: [FR-048]
      parameters:
        - { name: residentId, in: query, schema: { type: integer, format: int64 } }
        - { name: familyMemberId, in: query, schema: { type: integer, format: int64 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' } }

  /feedback:
    get:
      tags: [feedback]
      summary: Phản hồi (người phụ trách, Quản lý viện gồm danh sách quá hạn; người thân thấy phản hồi của mình)
      x-fr: [FR-058, FR-063]
      x-family-member: true
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: overdue, in: query, schema: { type: boolean } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Feedback' } } } } } }
    post:
      tags: [feedback]
      summary: Gửi phản hồi (người thân qua cổng; Hành chính ghi thay); đặt người phụ trách, mức, hạn
      x-fr: [FR-058, FR-059, FR-061, FR-062]
      x-br: [BR-M10-05]
      x-family-member: true
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SubmitFeedback' } } } }
      responses: { '201': { description: OK } }
  /feedback/{id}:
    get:
      tags: [feedback]
      summary: Chi tiết phản hồi; bản cho người gửi chỉ có phần trả lời mà họ được thấy (FR-058)
      x-fr: [FR-058, FR-065]
      x-family-member: true
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FeedbackDetail' } } } } }
  /feedback/{id}/assignable-staff:
    get:
      tags: [feedback]
      summary: Người nhận giao lại được (bổ sung 2026-11-05, chủ dự án duyệt) - tài khoản nhân viên Hoạt động có quyền Tạo, Sửa ở dòng "Phản hồi" trong phạm vi của người cao tuổi (Trưởng tầng, Điều dưỡng, Hành chính)
      x-fr: [FR-060]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AssignableStaff' } } } } }, '403': { $ref: '#/components/responses/Problem' } }
  /feedback/{id}/{command}:
    post:
      tags: [feedback]
      summary: Lệnh trên phản hồi theo bảng FR-066
      description: |
        start-handling, reply (hướng xử lý và nội dung; cảnh báo khi người gửi không có quyền sức khỏe có tác dụng), add-note (người phụ trách);
        reassign (Trưởng tầng, Hành chính, Quản lý viện; lý do); change-priority (người phụ trách; lý do; tính lại hạn);
        agree-to-close, reopen (người gửi; mở lại có lý do; với người cao tuổi: Hành chính, Điều dưỡng có phạm vi ghi thay, FR-058a).
        change-type (người phụ trách; Mong muốn → Góp ý, Hỏi đáp; lý do), link-opinion (người phụ trách; mục ý kiến có nguồn người cao tuổi), bổ sung 2026-10-18 (FR-058b, BR-M10-12).
      x-fr: [FR-059, FR-060, FR-061, FR-062, FR-064, FR-065, FR-066]
      x-br: [BR-M10-05]
      x-family-member: true
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: command, in: path, required: true, schema: { type: string, enum: [start-handling, reply, add-note, reassign, change-priority, agree-to-close, reopen, change-type, link-opinion] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { $ref: '#/components/schemas/Reason' }, handlingDirection: { type: string }, content: { type: string }, assigneeId: { type: integer, format: int64 }, priority: { type: string, enum: [HIGH, NORMAL] }, newType: { type: string, enum: [SUGGESTION, QUESTION] }, opinion: { type: object, description: 'link-opinion: VISIT_PICKUP_WISH gắn mục mong muốn đã có (itemId); INTEREST (bổ sung 2026-11-10, A duyệt) ghi mục sở thích mới ở 014 nguồn người cao tuổi (FeedbackPreferenceCommandApi, cùng transaction) rồi gắn vào phản hồi: interestGroupId, level, description, confirmReplacement (409 PREFERENCE_REPLACEMENT_CONFIRMATION_REQUIRED khi nhóm đã có mục hiện hành)', properties: { itemType: { type: string, enum: [VISIT_PICKUP_WISH, INTEREST] }, itemId: { type: integer, format: int64 }, interestGroupId: { type: integer, format: int64 }, level: { type: string, enum: [LIKE, DISLIKE] }, description: { type: string, maxLength: 1000 }, confirmReplacement: { type: boolean } } }, fileIds: { type: array, items: { type: integer, format: int64 } } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FeedbackDetail' } } } }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }

  /residents/{residentId}/visit-pickup-wishes:
    get:
      tags: [family-members]
      summary: Mong muốn của người cao tuổi về khách thăm, người đón (Hiệu lực và lịch sử) kèm quyền trái mong muốn đang hiệu lực (bổ sung 2026-10-18)
      x-fr: [FR-020a, FR-020b]
      parameters: [ { name: residentId, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { effective: { type: array, items: { $ref: '#/components/schemas/VisitPickupWish' } }, history: { type: array, items: { $ref: '#/components/schemas/VisitPickupWish' } }, conflictingRights: { type: array, items: { type: object, properties: { relationshipId: { type: integer, format: int64 }, right: { type: string, enum: [REGISTER_VISITS, PICKUP_ALLOWED] }, wishId: { type: integer, format: int64 } } } } } } } } } }
    post:
      tags: [family-members]
      summary: Ghi mong muốn (Hành chính, Trưởng tầng, Điều dưỡng có phạm vi); mong muốn Hiệu lực cùng người, cùng loại chuyển Được thay thế
      x-fr: [FR-020a]
      x-br: [BR-M01-14]
      parameters: [ { name: residentId, in: path, required: true, schema: { type: integer, format: int64 } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, wanted, source]
              properties:
                relationshipId: { type: integer, format: int64 }
                fullName: { type: string }
                idDocumentNumber: { type: string }
                type: { type: string, enum: [VISIT, PICKUP] }
                wanted: { type: boolean }
                source: { $ref: '#/components/schemas/OpinionSource' }
      responses: { '201': { description: Đã ghi, content: { application/json: { schema: { $ref: '#/components/schemas/VisitPickupWish' } } } }, '403': { description: Ngoài phạm vi hoặc không có quyền }, '422': { description: 'Thiếu người được nói tới; INVALID_OPINION_SOURCE' } }
  # ---------------- Kênh người cao tuổi (bổ sung 2026-10-18; mục G2, research F-18) ----------------
  # Chỉ tài khoản AC-16; người cao tuổi lấy từ tài khoản đăng nhập, không có residentId trong đường dẫn (FR-084).
  /resident-channel/today:
    get:
      tags: [resident-channel]
      summary: Lịch sinh hoạt hôm nay của chính người cao tuổi (hoạt động, lượt thăm, lịch đến/về bán trú)
      x-fr: [FR-083]
      x-br: [BR-M10-11]
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' } }
  /resident-channel/menu:
    get:
      tags: [resident-channel]
      summary: Thực đơn tuần đã công bố và suất ăn dự kiến của mình (món, món thay thế; không có chế độ ăn, dị ứng)
      x-fr: [FR-083, FR-084]
      x-br: [BR-M10-11]
      parameters: [ { name: week, in: query, schema: { type: string, format: date } } ]
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' } }
  /resident-channel/activities:
    get:
      tags: [resident-channel]
      summary: Buổi hoạt động sắp tới của tầng mình và toàn viện, kèm mình đã có tên chưa
      x-fr: [FR-083]
      x-br: [BR-M10-11]
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' } }
  /resident-channel/visits:
    get:
      tags: [resident-channel]
      summary: "Lượt thăm Đã duyệt của mình: ngày, khung giờ, người thăm"
      x-fr: [FR-083]
      x-br: [BR-M10-11]
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' } }
  /resident-channel/belongings:
    get:
      tags: [resident-channel]
      summary: "Đồ gửi của mình ở Đang giữ hoặc Đang được sử dụng: tên, trạng thái, ảnh"
      x-fr: [FR-083]
      x-br: [BR-M10-11]
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' } }
  /resident-channel/feedback:
    get:
      tags: [resident-channel]
      summary: Phản hồi của chính người cao tuổi (kể cả được ghi thay); trả lời nhóm sức khỏe chỉ phần chung
      x-fr: [FR-058a, FR-086]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Feedback' } } } } } }
    post:
      tags: [resident-channel]
      summary: Người cao tuổi gửi phản hồi (Góp ý, Hỏi đáp, Khiếu nại, Mong muốn)
      x-fr: [FR-058, FR-058a, FR-058b, FR-059, FR-062]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [type, group, content], properties: { type: { type: string, enum: [SUGGESTION, COMPLAINT, QUESTION, WISH] }, group: { type: string, enum: [CARE, HEALTH_MEDICATION, EATING, COSTS_CONTRACT, OTHER] }, wishTopic: { type: string, enum: [VISITORS_PICKERS, OTHER], description: 'Bắt buộc khi type = WISH; hệ thống đặt group theo FR-059' }, content: { type: string } } } } } }
      responses: { '201': { description: OK } }

components:
  securitySchemes:
    session: { type: http, scheme: bearer, description: 'Token phiên opaque của 002 (A-02)' }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    ResidentId: { name: residentId, in: path, required: true, schema: { type: integer, format: int64 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  headers:
    ETag: { schema: { type: string } }
  requestBodies:
    ReasonBody:
      required: true
      content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { $ref: '#/components/schemas/Reason' } } } } }
  responses:
    Problem:
      description: Lỗi theo RFC 9457 (research R-03 của 000)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Blocked:
      description: 'STATE_CHANGED, DBR_02_VIOLATED, REPRESENTATIVE_ALREADY_EXISTS, IS_CONSENTER, DUPLICATE_PENDING_REQUEST, ID_DOCUMENT_REQUIRED, CONSENT_NOT_INCLUDED, REQUEST_NOT_ALLOWED, NOMINEE_NOT_CONFIRMED, PICKUP_BLOCKED, PICKUP_RECORD_ALREADY_USED, PICKUP_EXCEPTION_EXPIRED, SOURCE_COMMAND_PERMISSION_DENIED, OUTSIDE_VISIT_SLOT, VISIT_SLOT_FULL, ISOLATION_ACTIVE, RESIDENT_NOT_PRESENT, TOO_MANY_VISITORS, OUTSIDE_REGISTRATION_WINDOW, START_TIME_PASSED, FAMILY_STAY_OVERLAP, ROOMMATE_OPINION_REQUIRED (bốn mã của bản tin bỏ theo Q-396)'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    OpinionSource:
      type: object
      description: Như api-001.yaml OpinionSource (001 FR-023g); bổ sung 2026-10-18
      required: [type]
      properties:
        type: { type: string, enum: [RESIDENT, FAMILY_MEMBER, OBSERVING_STAFF] }
        familyMemberId: { type: [integer, 'null'], format: int64 }
    VisitPickupWish:
      type: object
      properties:
        id: { type: integer, format: int64 }
        relationshipId: { type: [integer, 'null'], format: int64 }
        fullName: { type: [string, 'null'] }
        type: { type: string, enum: [VISIT, PICKUP] }
        wanted: { type: boolean }
        source: { $ref: '#/components/schemas/OpinionSource' }
        recordedBy: { type: string }
        at: { type: string, format: date-time }
        status: { type: string, enum: [ACTIVE, SUPERSEDED] }
        supersededById: { type: [integer, 'null'], format: int64 }
    Reason: { type: string, minLength: 1, maxLength: 2000 }
    Problem:
      type: object
      description: RFC 9457 cùng errorCode (000 R-03), giống schema Problem của api-000, api-002, api-009, api-016 (khớp ProblemBody chung, BL-23).
      required: [type, title, status, errorCode]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errorCode: { type: string }
        unmetConditions: { type: array, items: { type: object, properties: { code: { type: string }, description: { type: string }, basis: { type: string, description: "BR/FR, ví dụ BR-M12-03" }, module: { type: string, description: "Feature sở hữu điều kiện, ví dụ 013" }, waivable: { type: boolean, description: "Miễn được qua yêu cầu phê duyệt (004)" } } } }
        currentValue: { description: 'Khi 412: tài nguyên hiện hành' }
        candidates: { type: array, description: "POSSIBLE_DUPLICATE_PROFILE, DUPLICATE_HEALTH_ITEM (001)", items: { type: object } }
        failedLayer: { type: string, enum: [ROLE, SCOPE, LEGAL, SOURCE_DATA] }
        license: { type: object, properties: { name: { type: string }, expiryDate: { type: string, format: date } } }
        unlocksAt: { type: string, format: date-time, description: 'Khi 423 ACCOUNT_TEMPORARILY_LOCKED (FR-014)' }
    FamilyRight: { type: string, enum: [VIEW_HEALTH, VIEW_COSTS, RECEIVE_URGENT, REGISTER_VISITS, PICKUP_ALLOWED, REQUEST_SERVICES] }
    FamilyMember:
      type: object
      required: [fullName, phoneNumber]
      properties: { id: { type: integer, format: int64, readOnly: true }, fullName: { type: string }, phoneNumber: { type: string }, idDocumentType: { type: string }, idDocumentNumber: { type: string }, address: { type: string }, version: { type: integer, readOnly: true } }
    CreateRelationship:
      type: object
      required: [familyMemberId, relationship]
      properties: { familyMemberId: { type: integer, format: int64 }, relationship: { type: string, enum: [SPOUSE, CHILD, GRANDCHILD, SIBLING, OTHER] }, primaryContact: { type: boolean }, setFirstRepresentative: { type: boolean }, evidenceFileId: { type: integer, format: int64 }, reason: { type: string } }
    Relationship:
      type: object
      properties:
        id: { type: integer, format: int64 }
        familyMember: { $ref: '#/components/schemas/FamilyMember' }
        relationship: { type: string }
        representative: { type: boolean }
        primaryContact: { type: boolean }
        contactOrder: { type: integer }
        rights: { type: object, additionalProperties: { type: object, properties: { enabled: { type: boolean }, effective: { type: boolean } } } }
        status: { type: string, enum: [ACTIVE, ENDED] }
    FamilyRegistrationForm:
      type: object
      required: [representativeId, scanFileId, lines]
      properties: { representativeId: { type: integer, format: int64 }, scanFileId: { type: integer, format: int64 }, lines: { type: array, items: { type: object, required: [relationshipId, right], properties: { relationshipId: { type: integer, format: int64 }, right: { $ref: '#/components/schemas/FamilyRight' } } } } }
    CreateRightChangeRequest:
      type: object
      required: [residentId, type, reason]
      properties:
        residentId: { type: integer, format: int64 }
        type: { type: string, enum: [RIGHT, SELF_RETURN, SET_REPRESENTATIVE, REMOVE_REPRESENTATIVE] }
        relationshipId: { type: integer, format: int64 }
        right: { $ref: '#/components/schemas/FamilyRight' }
        newValue: { type: boolean }
        newPicker: { type: object, properties: { fullName: { type: string }, phoneNumber: { type: string }, idDocumentType: { type: string }, idDocumentNumber: { type: string }, relationship: { type: string } } }
        withSignedForm: { type: boolean }
        signedByFamilyMemberId: { type: integer, format: int64 }
        evidenceFileId: { type: integer, format: int64 }
        reason: { $ref: '#/components/schemas/Reason' }
    RightChangeRequest:
      allOf:
        - { $ref: '#/components/schemas/CreateRightChangeRequest' }
        - type: object
          properties: { id: { type: integer, format: int64 }, status: { type: string, enum: [PENDING_CONFIRMATION, EFFECTIVE, REJECTED, CANCELLED] }, confirmationMethod: { type: string, enum: [PORTAL, SIGNED_FORM, MANAGER_APPROVAL] }, source: { type: string, enum: [COUNTER, PORTAL, REGISTRATION_FORM] }, appliedOnCreation: { type: boolean }, conflictingWishId: { type: [integer, 'null'], format: int64 } }
    RecordPickup:
      type: object
      required: [type, handoverStaffId]
      properties:
        type: { type: string, enum: [TEMPORARY_ABSENCE, FAMILY_OUTING, DAY_CARE_DEPARTURE, SELF_RETURN, INSTITUTE_RETURN, RESIDENCY_END] }
        familyMemberId: { type: integer, format: int64 }
        exceptionId: { type: integer, format: int64 }
        presentedIdDocument: { type: object, properties: { type: { type: string }, number: { type: string } } }
        handoverStaffId: { type: integer, format: int64 }
    PickupRecord:
      type: object
      properties: { id: { type: integer, format: int64 }, type: { type: string }, familyMemberId: { type: integer, format: int64 }, basis: { type: string, enum: [PICKUP_LIST, REPRESENTATIVE_EXCEPTION, MANAGER_EXCEPTION, SELF_RETURN] }, at: { type: string, format: date-time }, status: { type: string, enum: [UNUSED, USED, NOT_USED] }, expiresAt: { type: string, format: date-time } }
    Companion:
      type: object
      required: [fullName, relationship]
      properties: { fullName: { type: string }, relationship: { type: string }, phoneNumber: { type: string } }
    VisitRegistration:
      type: object
      required: [residentId, date, startTime, endTime]
      properties: { residentId: { type: integer, format: int64 }, familyMemberId: { type: integer, format: int64, description: 'Hành chính đăng ký thay' }, date: { type: string, format: date }, startTime: { type: string }, endTime: { type: string }, companions: { type: array, items: { $ref: '#/components/schemas/Companion' } } }
    Visit:
      allOf:
        - { $ref: '#/components/schemas/VisitRegistration' }
        - type: object
          properties: { id: { type: integer, format: int64 }, visitorCount: { type: integer }, status: { type: string, enum: [APPROVED, CHECKED_IN, CHECKED_OUT, NO_SHOW, CANCELLED] }, checkedInAt: { type: string, format: date-time }, checkedOutAt: { type: string, format: date-time }, cancellationReason: { type: string } }
    FamilyStayRegistration:
      type: object
      required: [familyMemberId, residentId, expectedStartAt, expectedEndAt, location, reason, mealRegistered]
      properties: { familyMemberId: { type: integer, format: int64 }, residentId: { type: integer, format: int64 }, expectedStartAt: { type: string, format: date-time }, expectedEndAt: { type: string, format: date-time }, location: { type: string }, reason: { type: string }, mealRegistered: { type: boolean } }
    FamilyStay:
      allOf:
        - { $ref: '#/components/schemas/FamilyStayRegistration' }
        - type: object
          properties: { id: { type: integer, format: int64 }, status: { type: string, enum: [PENDING_CONFIRMATION, CONFIRMED, REJECTED, STAYING, ENDED, CANCELLED] }, actualStartAt: { type: string, format: date-time }, actualEndAt: { type: string, format: date-time }, nightCount: { type: integer, readOnly: true } }
    SubmitFeedback:
      type: object
      required: [residentId, type, group, content]
      properties: { residentId: { type: integer, format: int64 }, senderType: { type: string, enum: [FAMILY_MEMBER, RESIDENT], default: FAMILY_MEMBER, description: 'RESIDENT: Hành chính, Điều dưỡng ghi thay (FR-058a, bổ sung 2026-10-18)' }, familyMemberId: { type: integer, format: int64, description: 'Hành chính ghi thay người thân' }, type: { type: string, enum: [SUGGESTION, COMPLAINT, QUESTION, WISH], description: 'WISH chỉ khi người gửi là người cao tuổi (FR-058b)' }, group: { type: string, enum: [CARE, HEALTH_MEDICATION, EATING, COSTS_CONTRACT, OTHER] }, wishTopic: { type: string, enum: [VISITORS_PICKERS, OTHER], description: 'Bắt buộc khi type = WISH; hệ thống đặt group theo FR-059' }, content: { type: string }, fileIds: { type: array, items: { type: integer, format: int64 } } }
    Feedback:
      allOf:
        - { $ref: '#/components/schemas/SubmitFeedback' }
        - type: object
          properties: { id: { type: integer, format: int64 }, status: { type: string, enum: [NEW, IN_PROGRESS, REPLIED, REOPENED, CLOSED] }, priority: { type: string, enum: [HIGH, NORMAL] }, dueAt: { type: string, format: date-time }, overdue: { type: boolean }, assignee: { type: string }, familyMemberName: { type: string, readOnly: true, description: 'Họ tên người thân gửi (bổ sung 2026-11-05)' }, submittedAt: { type: string, format: date-time, readOnly: true, description: 'Bổ sung 2026-11-05' } }
    FeedbackItem:
      type: object
      description: 'Mục của phản hồi (FR-065; bổ sung 2026-11-05). Người gửi chỉ thấy CONTENT, REPLY, HANDLING_DIRECTION, REOPEN'
      properties: { id: { type: integer, format: int64 }, type: { type: string, enum: [CONTENT, REPLY, HANDLING_DIRECTION, NOTE, REASSIGNMENT, PRIORITY_CHANGE, REOPEN, TYPE_CHANGE], description: 'TYPE_CHANGE: mục DOI_LOAI (data-model, bổ sung 2026-11-08)' }, content: { type: string }, fileIds: { type: array, items: { type: integer, format: int64 } }, byAccountId: { type: integer, format: int64 }, at: { type: string, format: date-time } }
    FeedbackDetail:
      description: 'Chi tiết phản hồi (bổ sung 2026-11-05, chủ dự án duyệt). senderHealthRightEffective chỉ cho nhân viên (cảnh báo lúc soạn trả lời); healthReplyHidden chỉ cho người gửi: trả lời là thông tin sức khỏe mà quyền xem sức khỏe không có tác dụng thì không có trong items (FR-058)'
      allOf:
