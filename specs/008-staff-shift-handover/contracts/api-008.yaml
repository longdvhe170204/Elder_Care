      responses: { '200': { description: OK } }

components:
  securitySchemes:
    session: { type: http, scheme: bearer, description: 'Token phiên opaque của 002 (A-02)' }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  headers:
    ETag: { schema: { type: string } }
  requestBodies:
    ReasonBody:
      required: true
      content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { $ref: '#/components/schemas/Reason' } } } } }
  responses:
    Problem:
      description: Lỗi theo RFC 9457 (research R-03 của 000)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    BlockingProblem:
      description: 'CONDITION_NOT_MET, SHIFT_OVERLAP, WARNING_CONFIRMATION_REQUIRED, SHIFT_LEAD_REQUIRED, FLOOR_MANAGER_REQUIRED, INVALID_ASSIGNMENTS, PRIMARY_STAFF_OVERLAP, REQUIRED_CREDENTIAL_MISSING, FLOOR_MANAGER_ASSIGNMENT_OVERLAP, OUTSIDE_ABSENCE_REPORTING_WINDOW, SHIFT_ALREADY_STARTED, HANDOVER_ALREADY_EXISTS, BEFORE_HANDOVER_PREPARATION_WINDOW, HANDOVER_ITEM_REMOVAL_NOT_ALLOWED, CRITICAL_ITEM_NOTE_REQUIRED, STATE_CHANGED, OUTSIDE_SHIFT_SCOPE, REPLACEMENT_LEAD_REQUIRED…'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Reason: { type: string, minLength: 1, maxLength: 2000 }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errorCode: { type: string }
        unmetConditions: { type: array, items: { type: object, properties: { code: { type: string }, description: { type: string }, basis: { type: string } } } }
        warnings: { type: array, items: { $ref: '#/components/schemas/Warning' } }
    Warning:
      type: object
      properties: { code: { type: string, enum: [CONTINUOUS_WORK_HOURS, REQUIRED_TRAINING_EXPIRED, BELOW_STAFFING_THRESHOLD, TASK_TYPE_REQUIREMENTS_NOT_MET, APPROVED_LEAVE_DAY, INSUFFICIENT_MINIMUM_COVERAGE] }, description: { type: string }, details: { type: object } }
    ResultWithWarnings:
      type: object
      properties: { id: { type: integer, format: int64 }, warnings: { type: array, items: { $ref: '#/components/schemas/Warning' } } }
    StaffProfile:
      type: object
      required: [fullName, position]
      properties:
        id: { type: integer, format: int64 }
        fullName: { type: string }
        position: { type: string }
        specialty: { type: string }
        startDate: { type: string, format: date }
        phoneNumber: { type: string }
        email: { type: string }
        status: { type: string, enum: [WORKING, RESIGNED], readOnly: true }
        accountId: { type: integer, format: int64, readOnly: true }
        source: { type: string, enum: [MANUAL, IMPORT], readOnly: true, description: 'Bổ sung 2026-10-22 (FR-001b)' }
        importBatchId: { type: [integer, 'null'], format: int64, readOnly: true }
        departmentId: { type: integer, format: int64 }
        hiddenFields: { type: array, items: { type: string } }
    StaffImportRow:
      type: object
      properties:
        rowNumber: { type: integer }
        fullName: { type: string }
        position: { type: string }
        phoneNumber: { type: string }
        startDate: { type: string, format: date }
        specialty: { type: string }
        email: { type: string }
    StaffImportRowError:
      type: object
      properties:
        rowNumber: { type: integer }
        column: { type: string }
        errorCode: { type: string, enum: [REQUIRED_CELL_MISSING, INVALID_DATE_FORMAT, INVALID_PHONE_NUMBER_FORMAT, INVALID_EMAIL_FORMAT, DUPLICATE_STAFF_PROFILE, DUPLICATE_FILE_ROW] }
        reason: { type: string }
        duplicateStaffId: { type: [integer, 'null'], format: int64 }
        duplicateRowNumber: { type: [integer, 'null'] }
    StaffImportPreview:
      type: object
      description: Bổ sung 2026-10-22 (FR-001b)
      properties:
        fileName: { type: string }
        rowCount: { type: integer }
        rows: { type: array, items: { $ref: '#/components/schemas/StaffImportRow' } }
        errors: { type: array, items: { $ref: '#/components/schemas/StaffImportRowError' } }
        canConfirm: { type: boolean }
    StaffImportResult:
      type: object
      properties:
        importBatchId: { type: integer, format: int64 }
        createdProfileCount: { type: integer }
        staffIds: { type: array, items: { type: integer, format: int64 } }
    Department:
      type: object
      required: [name]
      properties: { id: { type: integer, format: int64 }, name: { type: string }, leadStaffId: { type: integer, format: int64, readOnly: true }, active: { type: boolean } }
    CredentialType:
      type: object
      required: [name, group, hasExpiry]
      properties: { id: { type: integer, format: int64 }, name: { type: string }, group: { type: string, enum: [PROFESSIONAL_LICENSE, TRAINING] }, hasExpiry: { type: boolean }, requiredForRoles: { type: array, items: { type: string } }, hasPracticeScopes: { type: boolean }, active: { type: boolean } }
    Credential:
      type: object
      required: [credentialTypeId, issueDate]
      properties:
        id: { type: integer, format: int64 }
        credentialTypeId: { type: integer, format: int64 }
        credentialNumber: { type: string }
        issuingAuthority: { type: string }
        practiceScopes: { type: array, items: { type: string } }
        issueDate: { type: string, format: date }
        expiryDate: { type: string, format: date }
        scanFileId: { type: integer, format: int64 }
        replacesId: { type: integer, format: int64, readOnly: true }
        revokedFrom: { type: string, format: date, readOnly: true }
        validityStatus: { type: string, enum: [VALID, EXPIRED, REVOKED, REPLACED, NOT_YET_ISSUED], readOnly: true }
    ShiftTemplate:
      type: object
      required: [name, startTime, endTime, scopeType]
      properties: { id: { type: integer, format: int64 }, name: { type: string }, startTime: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }, endTime: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }, scopeType: { type: string, enum: [FLOOR, AREA, FACILITY] }, handoverRequired: { type: boolean }, active: { type: boolean } }
    ShiftSchedule:
      type: object
      properties: { id: { type: integer, format: int64 }, month: { type: string }, scopeType: { type: string }, scopeId: { type: integer, format: int64 }, status: { type: string, enum: [DRAFT, PUBLISHED] }, shifts: { type: array, items: { $ref: '#/components/schemas/Shift' } } }
    NewShift:
      type: object
      required: [shiftTemplateId, date]
      properties:
        shiftTemplateId: { type: integer, format: int64 }
        date: { type: string, format: date }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        staff: { type: array, items: { type: object, properties: { staffId: { type: integer, format: int64 }, onDutyDoctor: { type: boolean } } } }
        leadStaffId: { type: integer, format: int64 }
        confirmWarnings: { type: boolean }
        reason: { $ref: '#/components/schemas/Reason' }
    Shift:
      type: object
      properties:
        id: { type: integer, format: int64 }
        shiftTemplateId: { type: integer, format: int64 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { type: string, enum: [DRAFT, PUBLISHED, IN_PROGRESS, AWAITING_HANDOVER, CLOSED, CANCELLED] }
        leadStaffId: { type: integer, format: int64 }
        missingLead: { type: boolean }
        staff: { type: array, items: { type: object, properties: { staffId: { type: integer, format: int64 }, onDutyDoctor: { type: boolean }, absent: { type: boolean }, approvedLeave: { type: boolean } } } }
        staffingRatio: { $ref: '#/components/schemas/StaffingRatioCalculation' }
        allowedCommands: { type: array, items: { type: string } }
    SchedulePublicationPreview:
      type: object
      properties:
        unmetConditions: { type: array, items: { type: object } }
        invalidAssignments: { type: array, items: { type: object, properties: { assignmentId: { type: integer, format: int64 }, reason: { type: string } } } }
        warnings: { type: array, items: { $ref: '#/components/schemas/Warning' } }
    FloorManagerAssignment:
      type: object
      required: [staffId, floorAreaId, from]
      properties: { id: { type: integer, format: int64 }, staffId: { type: integer, format: int64 }, floorAreaId: { type: integer, format: int64 }, from: { type: string, format: date }, to: { type: string, format: date }, reason: { type: string } }
    NewAssignment:
      type: object
      required: [staffId, targetType, targetId, role, assignmentKind]
      properties:
        staffId: { type: integer, format: int64 }
        targetType: { type: string, enum: [FLOOR, AREA, ROOM, RESIDENT] }
        targetId: { type: integer, format: int64 }
        taskTypeId: { type: integer, format: int64 }
        role: { type: string }
        assignmentKind: { type: string, enum: [PRIMARY, SUPPORT] }
        assignedNurse: { type: boolean }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    Assignment:
      allOf:
        - $ref: '#/components/schemas/NewAssignment'
        - type: object
          properties: { id: { type: integer, format: int64 }, status: { type: string, enum: [DRAFT, SCHEDULED, ACTIVE, ENDED, CANCELLED] }, actualEndAt: { type: string, format: date-time }, source: { type: string, enum: [MANUAL, COPIED, SHIFT_SWAP_015] } }
    StaffingRatioCalculation:
      type: object
      properties: { at: { type: string, format: date-time }, event: { type: string }, totalWeight: { type: number }, staffCount: { type: integer }, ratio: { type: number }, threshold: { type: number }, meetsThreshold: { type: boolean } }
    HandoverSourceRecord:
      type: object
      properties:
        group: { type: string, enum: [TASK, DOSE, VITAL_SIGN, ALERT, INCIDENT, RESIDENT_CHANGE, BED_AWAITING_READINESS, STORED_BELONGING] }
        sourceType: { type: string }
        sourceId: { type: string }
        residentId: { type: integer, format: int64 }
        roomId: { type: integer, format: int64 }
        description: { type: string }
        currentStatus: { type: string }
        critical: { type: boolean }
        hasItem: { type: boolean }
        dataUnavailable: { type: boolean }
    HandoverItem:
      type: object
      required: [group, description]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        group: { type: string, enum: [TASK, DOSE, VITAL_SIGN, ALERT, INCIDENT, RESIDENT_CHANGE, BED_AWAITING_READINESS, STORED_BELONGING, FOLLOW_UP_ISSUE] }
        sourceType: { type: string }
        sourceId: { type: string }
        residentId: { type: integer, format: int64 }
        roomId: { type: integer, format: int64 }
        description: { type: string }
        note: { type: string }
        resolved: { type: boolean }
        section: { type: string, enum: [FINALIZED, AFTER_PREPARATION, RESOLVED_DURING_SHIFT], readOnly: true }
        statusAtFinalization: { type: string, readOnly: true }
        currentStatus: { type: string, readOnly: true }
        noteAuthor: { type: string, readOnly: true }
    Handover:
      type: object
      properties:
        id: { type: integer, format: int64 }
        shiftId: { type: integer, format: int64 }
        nextShiftId: { type: integer, format: int64 }
        handoverStaffId: { type: integer, format: int64 }
        status: { type: string, enum: [DRAFT, PREPARED, HAS_COMMENTS, CONFIRMED] }
        finalizedAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time }
        generalAssessment: { type: string }
        residentAssessments: { type: array, items: { type: object } }
        items: { type: array, items: { $ref: '#/components/schemas/HandoverItem' } }
        comments: { type: array, items: { type: object, properties: { id: { type: integer, format: int64 }, content: { type: string }, sender: { type: string }, at: { type: string, format: date-time }, replies: { type: array, items: { type: object } } } } }
        allowedCommands: { type: array, items: { type: string } }
        hiddenFields: { type: array, items: { type: string } }
