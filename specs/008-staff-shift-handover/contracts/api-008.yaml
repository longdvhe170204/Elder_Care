openapi: 3.1.0
info:
  title: Elder Care – Feature 008 (nhân sự, ca trực, bàn giao)
  version: 1.0.0-design
  description: |
    Hợp đồng REST của feature 008 (module M09). Quy ước chung theo research R-03 của 000:
    tiền tố /api/v1, lỗi RFC 9457 có errorCode và unmetConditions[], If-Match cho lệnh sửa nội dung
    (danh mục, hồ sơ nhân viên, lịch ca Nháp, mục bàn giao ở Bản nháp), Idempotency-Key cho mọi lệnh ghi.
    Lệnh chuyển trạng thái không dùng If-Match; backend khóa dòng và kiểm tra lại (research N-03); lệnh thứ hai trên cùng bàn giao trả 409 STATE_CHANGED.
    Cảnh báo không chặn (giờ làm liên tục FR-014, đào tạo bắt buộc FR-010) trả 409 WARNING_CONFIRMATION_REQUIRED; gửi lại với confirmWarnings = true và reason.
    Hoàn tất, gửi ý kiến, bổ sung, xác nhận bàn giao bắt buộc trực tuyến (FR-060); không có loại ngoại tuyến cho 008.
    Đổi ca, nghỉ đột xuất, xoay ca, phủ tối thiểu thuộc api-015; 015 dùng port nội bộ của M09 (research N-07).
    Đính chính bàn giao đi qua khung của api-000 với loại M09.BAN_GIAO.
    Trường nhóm hạn chế của hồ sơ nhân viên (FR-052) và lý do vắng ca (FR-053) bị bỏ khỏi phản hồi theo 002 và liệt kê trong hiddenFields.
    Truy vết: mỗi operation có x-fr (FR của spec 008) và x-br khi có.
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - { name: staff, description: 'UC-49; mục A' }
  - { name: credentials, description: 'UC-49; mục A' }
  - { name: shift-schedules, description: 'UC-50; mục B' }
  - { name: assignments, description: 'UC-51; mục C' }
  - { name: staffing-ratios, description: 'BR-M09-02; mục D' }
  - { name: handovers, description: 'UC-52, UC-53; mục E' }

paths:
  # ---------------- Nhân viên, bộ phận ----------------
  /staff:
    get:
      tags: [staff]
      summary: Danh sách nhân viên (Quản lý viện toàn bộ; Trưởng tầng nhóm công khai; nhân viên chỉ người cùng ca)
      x-fr: [FR-001, FR-052]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [WORKING, RESIGNED] } }
        - { name: departmentId, in: query, schema: { type: integer, format: int64 } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StaffProfile' } } } } } }
    post:
      tags: [staff]
      summary: Tạo hồ sơ nhân viên (Quản lý viện); trạng thái Đang làm việc
      x-fr: [FR-001, FR-003]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StaffProfile' } } } }
      responses: { '201': { description: Đã tạo }, '403': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
  /staff/import/template:
    get:
      tags: [staff]
      summary: Tải file mẫu import (.xlsx) (bổ sung 2026-10-22, Q-382)
      x-fr: [FR-001b]
      x-br: [BR-M09-18]
      responses: { '200': { description: File mẫu, content: { application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } } } }, '403': { $ref: '#/components/responses/Problem' } }
  /staff/import/preview:
    post:
      tags: [staff]
      summary: Tải file lên, kiểm tra từng dòng, trả xem trước; không ghi dữ liệu (Quản lý viện)
      description: 'Sai mẫu, sai loại file → 422 INVALID_IMPORT_TEMPLATE; quá CFG-M09-13 dòng → 422 IMPORT_ROW_LIMIT_EXCEEDED (research N-16).'
      x-fr: [FR-001b, FR-001c]
      x-br: [BR-M09-18]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StaffImportPreview' } } } }, '403': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
  /staff/import/confirm:
    post:
      tags: [staff]
      summary: Gửi lại cùng file để tạo mọi hồ sơ trong một lần; còn dòng lỗi thì không tạo gì
      description: 'Hệ thống không lưu file gốc (FR-001c) nên xác nhận đọc và kiểm tra lại file; có lỗi → 409 IMPORT_HAS_ROW_ERRORS kèm errors[].'
      x-fr: [FR-001b, FR-001c]
      x-br: [BR-M09-18]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } } }
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/StaffImportResult' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { description: 'IMPORT_HAS_ROW_ERRORS', content: { application/json: { schema: { $ref: '#/components/schemas/StaffImportPreview' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /staff/{id}:
    get:
      tags: [staff]
      summary: Hồ sơ nhân viên (giới hạn trường FR-052)
      x-fr: [FR-001, FR-052]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/StaffProfile' } } } } }
    put:
      tags: [staff]
      summary: Sửa thông tin mô tả (Quản lý viện); không có DELETE
      x-fr: [FR-001]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StaffProfile' } } } }
      responses: { '200': { description: OK }, '412': { $ref: '#/components/responses/Problem' } }
  /staff/{id}/terminate-employment:
    post:
      tags: [staff]
      summary: Cho nghỉ việc (Quản lý viện; lý do; hiệu lực không sớm hơn hiện tại)
      description: 'Người đang là Phụ trách bộ phận: bắt buộc replacementStaffId (409 REPLACEMENT_LEAD_REQUIRED). Tại thời điểm hiệu lực, trong một lần: khóa tài khoản, rút ca, kết thúc phân công và giao trưởng tầng, công việc thành chung, dấu thiếu người phụ trách, chuyển quyền bàn giao, tính lại tỷ lệ (FR-004).'
      x-fr: [FR-003, FR-004, FR-001a]
      x-br: [BR-M09-04]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason, effectiveAt], properties: { reason: { $ref: '#/components/schemas/Reason' }, effectiveAt: { type: string, format: date-time }, replacementStaffId: { type: integer, format: int64 } } } } } }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/BlockingProblem' }, '422': { $ref: '#/components/responses/Problem' } }
  /staff/{id}/rehire:
    post:
      tags: [staff]
      summary: Nhận lại làm việc (Quản lý viện; lý do); tài khoản không tự mở
      x-fr: [FR-003]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/ReasonBody' }
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Problem' } }
  /staff/{id}/change-department:
    post:
      tags: [staff]
      summary: Đổi bộ phận (Quản lý viện; lý do; người đang là Phụ trách bộ phận phải có người thay)
      x-fr: [FR-001a]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [departmentId, reason], properties: { departmentId: { type: integer, format: int64 }, reason: { $ref: '#/components/schemas/Reason' }, replacementStaffId: { type: integer, format: int64 } } } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/BlockingProblem' } }
  /departments:
    get:
      tags: [staff]
      summary: Danh mục bộ phận và Phụ trách bộ phận
      x-fr: [FR-001a]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Department' } } } } } }
    post:
      tags: [staff]
      summary: Thêm bộ phận (Quản lý viện); chưa có phụ trách thì Quản lý viện được nhắc
      x-fr: [FR-001a]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Department' } } } }
      responses: { '201': { description: OK } }
  /departments/{id}/assign-lead:
    post:
      tags: [staff]
      summary: Chỉ định / đổi Phụ trách bộ phận (Quản lý viện; người mới trong cùng lệnh)
      description: 'Người được chỉ định thuộc bộ phận, có tài khoản Hoạt động, không có vai trò Quản lý viện hoặc Kế toán; Hành chính – Kế toán chỉ nhận người vai trò Hành chính (Q-292, Q-293, Q-299).'
      x-fr: [FR-001a]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [staffId, reason], properties: { staffId: { type: integer, format: int64 }, reason: { $ref: '#/components/schemas/Reason' } } } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/BlockingProblem' } }

  # ---------------- Giấy phép, đào tạo ----------------
  /credential-types:
    get:
      tags: [credentials]
      summary: Danh mục loại giấy phép/đào tạo
      x-fr: [FR-005]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CredentialType' } } } } } }
    post:
      tags: [credentials]
      summary: Thêm loại (Quản lý viện)
      x-fr: [FR-005]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CredentialType' } } } }
      responses: { '201': { description: OK } }
  /practice-scopes:
    get:
      tags: [credentials]
      summary: Danh mục phạm vi hành nghề (dùng chung với 002, 007)
      x-fr: [FR-006]
      responses: { '200': { description: OK } }
  /staff/{id}/credentials:
    get:
      tags: [credentials]
      summary: Giấy phép, đào tạo của nhân viên và lịch sử, kèm tình trạng hiệu lực suy ra
      x-fr: [FR-006, FR-007, FR-052]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Credential' } } } } } }
    post:
      tags: [credentials]
      summary: Thêm giấy phép/đào tạo (Quản lý viện)
      x-fr: [FR-006]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credential' } } } }
      responses: { '201': { description: OK }, '422': { $ref: '#/components/responses/Problem' } }
  /credentials/{id}/renew:
    post:
      tags: [credentials]
      summary: Gia hạn (bản mới trỏ bản cũ; cảnh báo sắp hết hạn của bản cũ đóng)
      x-fr: [FR-006, FR-008]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credential' } } } }
      responses: { '201': { description: OK } }
  /credentials/{id}/revoke:
    post:
      tags: [credentials]
      summary: Ghi nhận thu hồi (lý do, ngày hiệu lực); tại mốc kết thúc phân công cần loại này (FR-009)
      x-fr: [FR-006, FR-009]
      x-br: [BR-M09-01]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [effectiveFrom, reason], properties: { effectiveFrom: { type: string, format: date }, reason: { $ref: '#/components/schemas/Reason' } } } } } }
      responses: { '200': { description: OK } }
  /credentials/{id}/correct:
    post:
      tags: [credentials]
      summary: Sửa sai (lý do; nhật ký trước/sau; ngày hết hạn sớm lên áp FR-009)
      x-fr: [FR-006, FR-009]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Credential' }, { type: object, required: [reason], properties: { reason: { $ref: '#/components/schemas/Reason' } } } ] } } } }
      responses: { '200': { description: OK } }

  # ---------------- Mẫu ca, lịch ca, ca ----------------
  /shift-templates:
    get:
      tags: [shift-schedules]
      summary: Mẫu ca
      x-fr: [FR-011]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ShiftTemplate' } } } } } }
    post:
      tags: [shift-schedules]
      summary: Thêm mẫu ca (Quản lý viện; ca qua ngày được; dài hơn 0, không quá 24 giờ)
      x-fr: [FR-011]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShiftTemplate' } } } }
      responses: { '201': { description: OK }, '422': { $ref: '#/components/responses/Problem' } }
  /shift-templates/{id}:
    put:
      tags: [shift-schedules]
      summary: Sửa mẫu ca (không ảnh hưởng ca đã tạo)
      x-fr: [FR-011]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShiftTemplate' } } } }
      responses: { '200': { description: OK } }
  /shift-schedules:
    get:
      tags: [shift-schedules]
      summary: Lịch ca theo tháng, phạm vi (Trưởng tầng tầng được giao; Quản lý viện; nhân viên chỉ ca của mình qua /me/shifts)
      x-fr: [FR-012, FR-033, FR-054]
      parameters: [ { name: month, in: query, required: true, schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' } }, { name: scopeId, in: query, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ShiftSchedule' } } } } } }
    post:
      tags: [shift-schedules]
      summary: Lập lịch Nháp cho tháng, phạm vi (lịch toàn viện chỉ Quản lý viện)
      x-fr: [FR-012, FR-016]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [month, scopeType], properties: { month: { type: string }, scopeType: { type: string, enum: [FLOOR, AREA, FACILITY] }, scopeId: { type: integer, format: int64 } } } } } }
      responses: { '201': { description: OK }, '409': { $ref: '#/components/responses/BlockingProblem' } }
  /shift-schedules/{id}/shifts:
    post:
      tags: [shift-schedules]
      summary: Tạo ca trong lịch Nháp (từ mẫu; giờ chỉnh riêng được)
      x-fr: [FR-012]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NewShift' } } } }
      responses: { '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ResultWithWarnings' } } } }, '409': { $ref: '#/components/responses/BlockingProblem' }, '412': { $ref: '#/components/responses/Problem' } }
  /shifts/{id}:
    get:
      tags: [shift-schedules]
      summary: Chi tiết ca (nhân viên, người phụ trách, Bác sĩ trực, tỷ lệ phục vụ, allowedCommands[])
      x-fr: [FR-012, FR-023, FR-034]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Shift' } } } } }
    put:
      tags: [shift-schedules]
      summary: Sửa ca, xếp/gỡ nhân viên, chỉ định người phụ trách, Bác sĩ trực (chỉ khi lịch Nháp)
      description: 'Chồng giờ: 409 SHIFT_OVERLAP (FR-013). Vượt CFG-M09-02 hoặc xếp vào ngày nghỉ có duyệt (015): 409 WARNING_CONFIRMATION_REQUIRED. Người phụ trách phải có tên trong ca, vai trò Trưởng tầng hoặc Điều dưỡng (FR-015).'
      x-fr: [FR-012, FR-013, FR-014, FR-015, FR-002, FR-010]
      x-br: [BR-M09-03]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NewShift' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ResultWithWarnings' } } } }, '409': { $ref: '#/components/responses/BlockingProblem' }, '412': { $ref: '#/components/responses/Problem' } }
    delete:
      tags: [shift-schedules]
      summary: Xóa ca (chỉ lịch Nháp; phân công Nháp xóa cùng)
      x-fr: [FR-012, FR-025]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses: { '204': { description: OK }, '409': { $ref: '#/components/responses/BlockingProblem' } }
  /shift-schedules/{id}/publication-preview:
    get:
      tags: [shift-schedules]
      summary: Điều kiện chặn và cảnh báo không chặn trước khi công bố (FR-014, FR-034, FR-010; phủ tối thiểu, nghỉ theo ngày của 015)
      x-fr: [FR-016]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SchedulePublicationPreview' } } } } }
  /shift-schedules/{id}/publish:
    post:
      tags: [shift-schedules]
      summary: Công bố lịch (Trưởng tầng được giao; Quản lý viện; lịch toàn viện chỉ Quản lý viện)
      description: |
        Chặn: ca thiếu người phụ trách; tầng chưa có Trưởng tầng cho cả tháng; phân công Nháp không đạt FR-028, FR-030 (kèm danh sách; assignmentIdsToRemove[] để loại trong cùng lệnh).
        Tự công bố: reason bắt buộc, nhật ký tuDuyet (Q-10); lý do dùng chung cho công bố khi thiếu phủ (015).
      x-fr: [FR-016, FR-027, FR-034, FR-055]
      x-br: [BR-M09-03]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { reason: { $ref: '#/components/schemas/Reason' }, assignmentIdsToRemove: { type: array, items: { type: integer, format: int64 } }, confirmWarnings: { type: boolean } } } } } }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/BlockingProblem' } }
  /shifts/{id}/add-staff:
    post:
      tags: [shift-schedules]
      summary: Bổ sung nhân viên vào ca đã công bố hoặc đang diễn ra (Trưởng tầng của tầng, Quản lý viện; lý do)
      x-fr: [FR-018, FR-013, FR-014]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [staffId, reason], properties: { staffId: { type: integer, format: int64 }, reason: { $ref: '#/components/schemas/Reason' }, confirmWarnings: { type: boolean } } } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/BlockingProblem' } }
  /shifts/{id}/change-lead:
