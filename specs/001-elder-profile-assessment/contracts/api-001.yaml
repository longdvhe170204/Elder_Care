openapi: 3.1.0
info:
  title: Elder Care – Feature 001 (hồ sơ và đánh giá người cao tuổi)
  version: 1.0.0-design
  description: |
    Hợp đồng REST của feature 001 (module M01). Quy ước chung theo research R-03 của feature 000:
    tiền tố /api/v1, lỗi RFC 9457 có maLoi và dieuKienChuaThoa[], If-Match cho lệnh sửa nháp và cập nhật,
    Idempotency-Key cho mọi lệnh ghi. Xác thực và giới hạn trường theo feature 002 (A-02, A-08):
    trường không được xem bị bỏ khỏi phản hồi và liệt kê trong truongBiAn.
    Lệnh trạng thái không dùng If-Match; backend khóa dòng và kiểm tra lại trên trạng thái mới (FR-048, research H-02).
    Truy vết: mỗi operation có x-fr (FR của spec 001) và x-br khi có.
servers:
  - url: /api/v1
tags:
  - name: ho-so
    description: UC-01, UC-02; mục A
  - name: trang-thai
    description: UC-08 cùng UC-15 → UC-18 (nội dung chi tiết do 004); mục F, G
  - name: ban-dong-y
    description: UC-03; mục B
  - name: suc-khoe
    description: UC-04; mục C
  - name: nguyen-vong
    description: UC-82; mục C1
  - name: danh-gia
    description: UC-05 → UC-07; mục D, E
  - name: danh-muc
    description: Danh mục nhóm 1 của M01
  - name: tep
    description: Tệp đính kèm dùng chung (common.tep, research H-13)

paths:
  /nguoi-cao-tuoi:
    get:
      tags: [ho-so]
      summary: Tra cứu hồ sơ trong phạm vi (UC-02)
      description: Kết quả lọc theo PhamViApi.boLoc của 002; Nhân viên bếp nhận 403 (FR-007).
      x-fr: [FR-007]
      x-br: [BR-M15-01]
      parameters:
        - { name: q, in: query, description: 'Họ tên, mã hồ sơ hoặc số giấy tờ', schema: { type: string } }
        - { name: trangThai, in: query, schema: { type: array, items: { $ref: '#/components/schemas/TrangThaiNct' } } }
        - { $ref: '#/components/parameters/Sau' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TrangHoSo' } } } }
        '403': { $ref: '#/components/responses/Loi' }
    post:
      tags: [ho-so]
      summary: Tạo hồ sơ người cao tuổi (Hành chính)
      description: |
        CCCD trùng hồ sơ chưa ở trạng thái cuối: 409 CCCD_DANG_DUNG kèm mã hồ sơ (DBR-01).
        Không có CCCD và trùng họ tên + ngày sinh: 409 CO_THE_TRUNG_HO_SO kèm danh sách; gửi lại với xacNhanKhongTrung=true (FR-005).
        CCCD trùng hồ sơ Kết thúc lưu trú / Hủy tiếp nhận: tạo và liên kết hosoTruoc (FR-004).
        CCCD trùng hồ sơ Qua đời: tạo, không liên kết, canhBao chứa CCCD_TRUNG_HO_SO_QUA_DOI.
      x-fr: [FR-001, FR-002, FR-003, FR-004, FR-005]
      x-br: [BR-M01-04]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ThongTinCaNhan'
                - type: object
                  properties:
                    xacNhanKhongTrung: { type: boolean, default: false }
      responses:
        '201':
          description: Đã tạo, trạng thái DANG_TIEP_NHAN
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/KetQuaTaoHoSo' } } }
        '409': { $ref: '#/components/responses/Loi' }
        '422': { $ref: '#/components/responses/Loi' }
  /nguoi-cao-tuoi/{id}:
    get:
      tags: [ho-so]
      summary: Xem hồ sơ
      description: |
        Nhân viên nhận HoSo: trường bị bỏ theo 19.3 (Hành chính không thấy mucSucKhoe; nguyện vọng chỉ coNguyenVong).
        Người thân nhận HoSoChoNguoiThan: không có luuYChamSoc; phần sức khỏe chỉ có khi thỏa chú thích ¹ (FR-022).
        Ngoài phạm vi: 404.
      x-fr: [FR-007, FR-008, FR-009, FR-022, FR-023e]
      x-br: [BR-M01-08, BR-M15-01]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { oneOf: [ { $ref: '#/components/schemas/HoSo' }, { $ref: '#/components/schemas/HoSoChoNguoiThan' } ] }
        '404': { $ref: '#/components/responses/Loi' }
  /nguoi-cao-tuoi/{id}/cap-nhat-thong-tin:
    post:
      tags: [ho-so]
      summary: Cập nhật thông tin cá nhân (Hành chính)
      x-fr: [FR-006]
      x-br: [BR-M01-05]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ThongTinCaNhan'
                - type: object
                  required: [lyDo]
                  properties: { lyDo: { $ref: '#/components/schemas/LyDo' } }
      responses:
        '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/HoSo' } } } }
        '409': { description: HO_SO_DA_DONG, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } } }
        '412': { $ref: '#/components/responses/Loi' }
  /nguoi-cao-tuoi/{id}/ho-so-lien-ket:
    get:
      tags: [ho-so]
      summary: Chuỗi hồ sơ trước của cùng người (FR-004)
      description: Mỗi phần tử chỉ trả khi người xem có quyền trên chính hồ sơ đó; còn lại chỉ có maHoSo và duocXem=false.
      x-fr: [FR-004]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HoSoLienKet' } } } } }
  /nguoi-cao-tuoi/{id}/lich-su-trang-thai:
    get:
      tags: [trang-thai]
      summary: Lịch sử trạng thái
      x-fr: [FR-046]
      x-br: [BR-M01-04]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LichSuTrangThai' } } } } }
  /nguoi-cao-tuoi/{id}/dieu-kien/{lenh}:
    get:
      tags: [trang-thai]
      summary: Xem trước điều kiện của một lệnh (không đổi dữ liệu)
      description: Chạy cùng bộ kiểm tra như lệnh thật (research H-02 mục 6). Dùng cho danh sách điều kiện tiếp nhận (004 FR-004).
      x-fr: [FR-045]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: lenh, in: path, required: true, schema: { $ref: '#/components/schemas/LenhNguoiDung' } }
      responses:
        '200': { description: 'Danh sách điều kiện; rỗng là đủ điều kiện', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DieuKien' } } } } }
  /nguoi-cao-tuoi/{id}/hoan-tat-tiep-nhan:
    post:
      tags: [trang-thai]
      summary: Hoàn tất tiếp nhận (Đang tiếp nhận → Đang lưu trú)
      description: |
        Thiếu điều kiện: 409 DIEU_KIEN_CHUA_THOA liệt kê đủ (FR-045). Thiếu bản đồng ý hoặc nguyện vọng không chặn;
        phản hồi có canhBao THIEU_BAN_DONG_Y, THIEU_NGUYEN_VONG (FR-012, FR-023d).
        chiTiet.doiPhanBoSangGiuongId: đổi phân bổ sang giường Trống khác ngay trong lệnh (003 FR-023, Q-50).
      x-fr: [FR-012, FR-023d, FR-034a, FR-044, FR-045, FR-046, FR-047]
      x-br: [BR-M01-04, BR-M01-06, BR-M02-22]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LenhTrangThai' }
      responses:
        '200': { $ref: '#/components/responses/LenhOk' }
        '403': { $ref: '#/components/responses/Loi' }
        '409': { $ref: '#/components/responses/LenhLoi409' }
        '422': { $ref: '#/components/responses/LenhLoi422' }
  /nguoi-cao-tuoi/{id}/huy-tiep-nhan:
    post:
      tags: [trang-thai]
      summary: Hủy tiếp nhận
      x-fr: [FR-044, FR-046, FR-047]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LenhTrangThai' }
      responses:
        '200': { $ref: '#/components/responses/LenhOk' }
        '403': { $ref: '#/components/responses/Loi' }
        '409': { $ref: '#/components/responses/LenhLoi409' }
        '422': { $ref: '#/components/responses/LenhLoi422' }
  /nguoi-cao-tuoi/{id}/cho-tam-vang:
    post:
      tags: [trang-thai]
      summary: Cho tạm vắng (Hành chính, Trưởng tầng; không qua duyệt)
      description: chiTiet theo schema của 004 (loại vắng, dự kiến trở lại, bản ghi đón, có mang thuốc).
      x-fr: [FR-044, FR-047, FR-047a]
      x-br: [BR-M01-06, BR-M10-03]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LenhTrangThai' }
      responses:
        '200': { $ref: '#/components/responses/LenhOk' }
        '403': { $ref: '#/components/responses/Loi' }
        '409': { $ref: '#/components/responses/LenhLoi409' }
        '422': { $ref: '#/components/responses/LenhLoi422' }
  /nguoi-cao-tuoi/{id}/ghi-nhan-tro-ve:
    post:
      tags: [trang-thai]
      summary: Ghi nhận trở về (từ Tạm vắng hoặc Điều trị tại bệnh viện)
      x-fr: [FR-040, FR-041, FR-044, FR-047a]
      x-br: [BR-M01-02, BR-M07-09]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LenhTrangThai' }
      responses:
        '200': { $ref: '#/components/responses/LenhOk' }
        '403': { $ref: '#/components/responses/Loi' }
        '409': { $ref: '#/components/responses/LenhLoi409' }
        '422': { $ref: '#/components/responses/LenhLoi422' }
  /nguoi-cao-tuoi/{id}/chuyen-vien:
    post:
      tags: [trang-thai]
      summary: Chuyển viện (Điều dưỡng, Bác sĩ)
      description: chiTiet.canCu bắt buộc - suCoId, hoặc chiDinh của Bác sĩ, hoặc thông tin gia đình / cơ sở y tế khi đang Tạm vắng (CHK016).
      x-fr: [FR-044, FR-047]
      x-br: [BR-M01-06]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LenhTrangThai' }
      responses:
        '200': { $ref: '#/components/responses/LenhOk' }
        '403': { $ref: '#/components/responses/Loi' }
        '409': { $ref: '#/components/responses/LenhLoi409' }
        '422': { $ref: '#/components/responses/LenhLoi422' }
  /nguoi-cao-tuoi/{id}/ket-thuc-luu-tru:
    post:
      tags: [trang-thai]
      summary: Kết thúc lưu trú (Hành chính, Bác sĩ)
      description: Điều kiện được miễn bởi yêu cầu ngoại lệ đã duyệt của 004; lịch sử ghi tham chiếu (US4 #10).
      x-fr: [FR-044, FR-045, FR-047]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LenhTrangThai' }
      responses:
        '200': { $ref: '#/components/responses/LenhOk' }
        '403': { $ref: '#/components/responses/Loi' }
        '409': { $ref: '#/components/responses/LenhLoi409' }
        '422': { $ref: '#/components/responses/LenhLoi422' }
  /nguoi-cao-tuoi/{id}/ghi-nhan-qua-doi:
    post:
      tags: [trang-thai]
      summary: Ghi nhận qua đời
      description: |
        Bác sĩ khi Đang lưu trú; Bác sĩ hoặc Hành chính khi Tạm vắng, Hoạt động bên ngoài, Điều trị tại bệnh viện.
        Hành chính bắt buộc chiTiet.bangChungTepId (FR-047b). Nội dung khác theo 004 FR-069.
      x-fr: [FR-044, FR-047, FR-047b]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LenhTrangThai' }
      responses:
        '200': { $ref: '#/components/responses/LenhOk' }
        '403': { $ref: '#/components/responses/Loi' }
        '409': { $ref: '#/components/responses/LenhLoi409' }
        '422': { $ref: '#/components/responses/LenhLoi422' }
  /nguoi-cao-tuoi/{id}/muc-cham-soc:
    get:
      tags: [trang-thai]
      summary: Mức chăm sóc tại một ngày (mặc định hôm nay) kèm căn cứ
      x-fr: [FR-052, FR-053]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: ngay, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MucChamSocTaiNgay' } } } }
  /nguoi-cao-tuoi/{id}/lich-su-muc-cham-soc:
    get:
      tags: [trang-thai]
      summary: Lịch sử mức chăm sóc
      x-fr: [FR-053]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MucChamSocTaiNgay' } } } } }

  /nguoi-cao-tuoi/{id}/ban-dong-y:
    get:
      tags: [ban-dong-y]
      summary: Bản đồng ý hiện hành và lịch sử
      x-fr: [FR-010, FR-016]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BanDongY' } } } } }
    post:
      tags: [ban-dong-y]
      summary: Ghi nhận bản đồng ý (Hành chính); thay thế bản Hiệu lực cũ trong cùng lệnh
      x-fr: [FR-010, FR-011, FR-013, FR-014a]
      x-br: [BR-M01-08]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nguoiDongYLoai, nguoiThanDuocXemSucKhoe, dongYHinhAnh, dongYThongBao, thoiDiemDongY, bangChungTepId]
              properties:
                nguoiDongYLoai: { type: string, enum: [NGUOI_CAO_TUOI, NGUOI_DAI_DIEN] }
                nguoiDongYNguoiThanId: { type: integer, format: int64 }
                lyDoDaiDien: { type: string }
                nguoiThanDuocXemSucKhoe: { type: array, items: { type: integer, format: int64 } }
                dongYHinhAnh: { type: boolean }
                dongYThongBao: { type: boolean }
                thoiDiemDongY: { type: string, format: date-time }
                bangChungTepId: { type: integer, format: int64 }
      responses:
        '201': { description: Đã ghi nhận, content: { application/json: { schema: { $ref: '#/components/schemas/BanDongY' } } } }
        '409': { description: 'HO_SO_DA_DONG, KHONG_PHAI_NGUOI_DAI_DIEN', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } } }
        '422': { $ref: '#/components/responses/Loi' }
  /ban-dong-y/{id}/rut-lai:
    post:
      tags: [ban-dong-y]
      summary: Rút lại đồng ý (được làm cả trên hồ sơ trạng thái cuối)
      x-fr: [FR-014, FR-014a, FR-015]
      x-br: [BR-M01-05, BR-M01-08]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lyDo, bangChungTepId]
              properties:
                lyDo: { $ref: '#/components/schemas/LyDo' }
                bangChungTepId: { type: integer, format: int64 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BanDongY' } } } }
        '409': { $ref: '#/components/responses/Loi' }

  /nguoi-cao-tuoi/{id}/ho-so-suc-khoe-ban-dau:
    get:
      tags: [suc-khoe]
      summary: Hồ sơ sức khỏe ban đầu (kèm đính chính hiện hành)
      x-fr: [FR-017]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/HoSoSucKhoeBanDau' } } } }
    put:
      tags: [suc-khoe]
      summary: Lập hoặc sửa bản nháp (Bác sĩ, Điều dưỡng); If-Match khi sửa
      x-fr: [FR-017]
      parameters: [ { $ref: '#/components/parameters/Id' }, { name: If-Match, in: header, required: false, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NoiDungHoSoSucKhoe' } } } }
      responses:
        '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/HoSoSucKhoeBanDau' } } } }
        '409': { description: 'DA_XAC_NHAN, HO_SO_DA_DONG', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } } }
        '412': { $ref: '#/components/responses/Loi' }
  /nguoi-cao-tuoi/{id}/ho-so-suc-khoe-ban-dau/xac-nhan:
    post:
      tags: [suc-khoe]
      summary: Bác sĩ xác nhận hồ sơ sức khỏe ban đầu
      x-fr: [FR-017]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HoSoSucKhoeBanDau' } } } }
  /ho-so-suc-khoe-ban-dau/{id}/dinh-chinh:
    post:
      tags: [suc-khoe]
      summary: Đính chính (chuyển tới DinhChinhApi của 000; trạng thái cuối luôn qua phê duyệt)
      x-fr: [FR-017, FR-049a]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/DinhChinh' }
      responses:
        '201': { description: 'Đã lưu (cách a, b) hoặc yêu cầu phê duyệt Chờ duyệt (cách c)', content: { application/json: { schema: { $ref: '#/components/schemas/KetQuaDinhChinh' } } } }
  /nguoi-cao-tuoi/{id}/muc-suc-khoe:
    get:
      tags: [suc-khoe]
      summary: Danh sách mục sức khỏe (người thân chỉ thấy mục Hiệu lực, FR-022)
      x-fr: [FR-018, FR-022]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: trangThai, in: query, schema: { type: string, enum: [HIEU_LUC, DA_LOAI_TRU, TAT_CA], default: HIEU_LUC } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MucSucKhoe' } } } } }
    post:
      tags: [suc-khoe]
      summary: Ghi nhận mục dị ứng, bệnh nền, tiền sử bệnh (Bác sĩ, Điều dưỡng)
      description: |
        Trùng mục Hiệu lực: 409 MUC_SUC_KHOE_TRUNG; gửi lại với xacNhanTrung=true (FR-021).
        Dị ứng loại "khác": phản hồi có canhBao DI_UNG_KHONG_KIEM_TRA_TU_DONG (FR-018a).
        Dị ứng từ danh mục: choKiemTra=true tới khi 006, 011 kiểm xong (BR-M01-12).
      x-fr: [FR-018, FR-018a, FR-019, FR-020, FR-021]
      x-br: [BR-M01-07, BR-M01-11, BR-M01-12]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loai, nguonId]
              properties:
                loai: { type: string, enum: [DI_UNG, BENH_NEN, TIEN_SU] }
                diNguyenId: { type: integer, format: int64 }
                noiDungVanBan: { type: string, maxLength: 1000 }
                mucDoId: { type: integer, format: int64, description: Bắt buộc với DI_UNG }
                nguonId: { type: integer, format: int64 }
                xacNhanTrung: { type: boolean, default: false }
      responses:
        '201': { description: Đã ghi nhận, content: { application/json: { schema: { $ref: '#/components/schemas/KetQuaMucSucKhoe' } } } }
        '409': { $ref: '#/components/responses/Loi' }
        '422': { $ref: '#/components/responses/Loi' }
  /muc-suc-khoe/{id}/loai-tru:
    post:
      tags: [suc-khoe]
      summary: Loại trừ mục (Bác sĩ, Điều dưỡng); không có lệnh sửa hay xóa (DBR-04)
      x-fr: [FR-019, FR-020]
      x-br: [BR-M01-07]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MucSucKhoe' } } } }
        '409': { $ref: '#/components/responses/Loi' }

  /nguoi-cao-tuoi/{id}/nguyen-vong:
    get:
      tags: [nguyen-vong]
      summary: Phiên bản Hiệu lực và lịch sử; Hành chính, Kế toán chỉ nhận coNguyenVong (FR-023e)
      x-fr: [FR-023b, FR-023e]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NguyenVongTongHop' } } } }
    post:
      tags: [nguyen-vong]
      summary: Ghi phiên bản mới (Bác sĩ, Điều dưỡng); phiên bản cũ chuyển Được thay thế
      x-fr: [FR-023a, FR-023b, FR-023c]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [luaChon, nguoiLienHeTruoc, nguoiTraLoiLoai, bacSiNhanDinhId, duNangLuc, nguoiKyLoai, thoiDiemKy, banKyTepId, nguon]
              properties:
                luaChon: { type: string, enum: [CHUYEN_BENH_VIEN, DUA_VE_NHA, O_LAI_GIAM_NHE] }
                nguoiLienHeTruoc: { type: string }
                ghiChu: { type: string }
                nguoiTraLoiLoai: { type: string, enum: [NGUOI_CAO_TUOI, NGUOI_DAI_DIEN] }
                nguoiTraLoiNguoiThanId: { type: integer, format: int64 }
                quanHe: { type: string }
                bacSiNhanDinhId: { type: integer, format: int64 }
                duNangLuc: { type: boolean }
                nguoiKyLoai: { type: string, enum: [NGUOI_CAO_TUOI, NGUOI_DAI_DIEN] }
                nguoiKyNguoiThanId: { type: integer, format: int64 }
                thoiDiemKy: { type: string, format: date-time }
                banKyTepId: { type: integer, format: int64 }
                nguon: { type: string, enum: [TIEP_NHAN, YEU_CAU_GIA_DINH] }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NguyenVong' } } } }
        '409': { description: 'NGUOI_KY_KHONG_HOP_LE, HO_SO_DA_DONG', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } } }

  /nguoi-cao-tuoi/{id}/danh-gia:
    get:
      tags: [danh-gia]
      summary: Lịch sử đánh giá (chỉ vai trò có quyền xem Đánh giá; Nhân viên chăm sóc 403)
      x-fr: [FR-008, FR-025]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DanhGia' } } } } }
        '403': { $ref: '#/components/responses/Loi' }
    post:
      tags: [danh-gia]
      summary: Tạo lần đánh giá ở Nháp (Bác sĩ, Điều dưỡng)
      x-fr: [FR-026, FR-034, FR-035]
      x-br: [BR-M01-13]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loai]
              properties:
                loai: { type: string, enum: [DAU_VAO, DANH_GIA_LAI] }
                canCu: { type: string }
      responses:
        '201': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/DanhGiaChiTiet' } } } }
        '409': { description: 'DA_CO_BAN_NHAP, DA_CO_DANH_GIA_DAU_VAO, TRANG_THAI_KHONG_CHO_DANH_GIA, HO_SO_DA_DONG', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } } }
  /danh-gia/{id}:
    get:
      tags: [danh-gia]
      summary: Chi tiết lần đánh giá kèm dữ liệu tham khảo (hồ sơ ban đầu, mục Hiệu lực, chỉ số gần nhất)
      description: Không có điểm, không có mức đề xuất (FR-024).
      x-fr: [FR-024]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/DanhGiaChiTiet' } } } }
    put:
      tags: [danh-gia]
      summary: Sửa nháp (người tạo hoặc Bác sĩ)
      x-fr: [FR-025, FR-029, FR-032]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                canCu: { type: string }
                nhanXet: { type: string }
                luuYChamSoc: { type: string, maxLength: 1000 }
                mucChamSoc: { $ref: '#/components/schemas/MaMucChamSoc' }
                nhuCauChamSocIds: { type: array, items: { type: integer, format: int64 } }
                loaiLuuTruDeXuat: { type: string, enum: [NOI_TRU_DAI_HAN, NOI_TRU_NGAN_NGAY, BAN_TRU] }
      responses:
        '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/DanhGiaChiTiet' } } } }
        '409': { $ref: '#/components/responses/Loi' }
        '412': { $ref: '#/components/responses/Loi' }
  /danh-gia/{id}/xac-nhan:
    post:
      tags: [danh-gia]
      summary: Bác sĩ xác nhận
      description: |
        Thiếu nhận xét hoặc mức: 409 DIEU_KIEN_CHUA_THOA chỉ ra trường thiếu (FR-028, DBR-05).
        Điều dưỡng gọi: 403. Phản hồi nêu tacDong (mức hiện hành đổi, yêu cầu bị thay thế, Hành chính được báo).
      x-fr: [FR-028, FR-031, FR-033, FR-035, FR-036, FR-036a, FR-038, FR-043]
      x-br: [BR-M01-03, BR-M01-09, BR-M01-10]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/KetQuaXacNhanDanhGia' } } } }
        '403': { $ref: '#/components/responses/Loi' }
        '409': { $ref: '#/components/responses/Loi' }
  /danh-gia/{id}/huy-nhap:
    post:
      tags: [danh-gia]
      summary: Hủy nháp (người tạo hoặc Bác sĩ)
      x-fr: [FR-026]
      x-br: [BR-M01-13]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DanhGia' } } } }
  /danh-gia/{id}/dinh-chinh:
    post:
      tags: [danh-gia]
      summary: Đính chính lần đánh giá đã xác nhận (qua DinhChinhApi của 000)
      x-fr: [FR-032, FR-049a]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/DinhChinh' }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/KetQuaDinhChinh' } } } }
  /nguoi-cao-tuoi/{id}/danh-gia-lai:
    get:
      tags: [danh-gia]
      summary: Trạng thái cần / quá hạn đánh giá lại và các căn cứ đã báo
      x-fr: [FR-041, FR-042, FR-043]
      x-br: [BR-M01-02]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TrangThaiDanhGiaLai' } } } }
  /danh-gia-lai/can-thuc-hien:
    get:
      tags: [danh-gia]
      summary: Danh sách người cao tuổi cần đánh giá lại (Bác sĩ), sắp theo hạn
      x-fr: [FR-039, FR-041]
      parameters: [ { $ref: '#/components/parameters/Sau' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TrangThaiDanhGiaLai' } } } } }

  /danh-muc/{loai}:
    parameters:
      - { name: loai, in: path, required: true, schema: { type: string, enum: [di-nguyen, muc-do-di-ung, nguon-thong-tin, nhu-cau-cham-soc, muc-cham-soc] } }
    get:
      tags: [danh-muc]
      summary: Danh sách mục (muc-cham-soc cố định, chỉ đọc)
      parameters:
        - { name: nhom, in: query, description: 'Chỉ với di-nguyen', schema: { type: string, enum: [THUOC_HOAT_CHAT, THUC_PHAM, KHAC] } }
        - { name: trangThai, in: query, schema: { type: string, enum: [HIEU_LUC, NGUNG_HIEU_LUC] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MucDanhMuc' } } } } }
    post:
      tags: [danh-muc]
      summary: Tạo mục (quyền theo data-model mục 5)
      x-fr: [FR-018, FR-018a]
      x-br: [BR-M01-11, BR-M15-06]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MucDanhMuc' } } } }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MucDanhMuc' } } } }
        '409': { $ref: '#/components/responses/Loi' }
  /danh-muc/{loai}/{id}:
    put:
      tags: [danh-muc]
      summary: Sửa mục
      parameters:
        - { name: loai, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MucDanhMuc' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MucDanhMuc' } } } }
  /danh-muc/{loai}/{id}/ngung-hieu-luc:
    post:
      tags: [danh-muc]
      summary: Ngừng hiệu lực (mục đã được tham chiếu không xóa được)
      parameters:
        - { name: loai, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Id' }
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: OK } }
  /danh-muc/{loai}/{id}/kich-hoat-lai:
    post:
      tags: [danh-muc]
      summary: Kích hoạt lại (trùng tên mục đang Hiệu lực thì 409)
      parameters:
        - { name: loai, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Id' }
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Loi' } }

  /tep:
    post:
      tags: [tep]
      summary: Tải tệp lên (PDF, JPEG, PNG; tối đa 10 MB); tệp chưa gắn sau 24 giờ bị dọn
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [tep], properties: { tep: { type: string, format: binary } } }
      responses:
        '201': { description: OK, content: { application/json: { schema: { type: object, properties: { tepId: { type: integer, format: int64 } } } } } }
        '422': { description: 'TEP_SAI_KIEU, TEP_QUA_LON', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } } }
  /tep/{id}:
    get:
      tags: [tep]
      summary: Tải tệp xuống; quyền theo bản ghi chủ sở hữu (QuyenTepProvider)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Nội dung tệp, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/Loi' }

components:
  securitySchemes:
    phien: { type: http, scheme: bearer, description: 'Token phiên opaque của 002 (A-02)' }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    Sau: { name: sau, in: query, description: Khóa trang kế tiếp, schema: { type: string } }
  headers:
    ETag: { schema: { type: string } }
  requestBodies:
    LyDo:
      required: true
      content: { application/json: { schema: { type: object, required: [lyDo], properties: { lyDo: { $ref: '#/components/schemas/LyDo' } } } } }
    LenhTrangThai:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [lyDo]
            properties:
              lyDo: { $ref: '#/components/schemas/LyDo' }
              chiTiet:
                type: object
                description: |
                  Nội dung chi tiết của lệnh, do module sở hữu kiểm tra (research H-02 mục 5):
                  CHO_TAM_VANG, GHI_NHAN_TRO_VE, KET_THUC_LUU_TRU, GHI_NHAN_QUA_DOI theo plan 004;
                  HOAN_TAT_TIEP_NHAN.doiPhanBoSangGiuongId theo plan 003; CHUYEN_VIEN.canCu theo bảng ở mô tả endpoint.
                additionalProperties: true
    DinhChinh:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [kieu, lyDo]
            properties:
              kieu: { type: string, enum: [SUA_NOI_DUNG, HUY_GHI_NHAN] }
              noiDungDung: { type: object, additionalProperties: true }
              lyDo: { $ref: '#/components/schemas/LyDo' }
  responses:
    Loi:
      description: Lỗi theo RFC 9457 (research R-03 của 000)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } }
    LenhOk:
      description: Đã chuyển trạng thái
      content: { application/json: { schema: { $ref: '#/components/schemas/KetQuaLenhTrangThai' } } }
    LenhLoi409:
      description: 'DIEU_KIEN_CHUA_THOA (đủ danh sách), CHUYEN_KHONG_HOP_LE, HO_SO_DA_DONG'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } }
    LenhLoi422:
      description: 'THIEU_LY_DO, CHI_TIET_KHONG_HOP_LE'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } }
  schemas:
    LyDo: { type: string, minLength: 1, maxLength: 2000 }
    TrangThaiNct: { type: string, enum: [DANG_TIEP_NHAN, DANG_LUU_TRU, TAM_VANG, HOAT_DONG_BEN_NGOAI, DIEU_TRI_BENH_VIEN, KET_THUC_LUU_TRU, QUA_DOI, HUY_TIEP_NHAN] }
    LenhNguoiDung: { type: string, enum: [HOAN_TAT_TIEP_NHAN, HUY_TIEP_NHAN, CHO_TAM_VANG, GHI_NHAN_TRO_VE, CHUYEN_VIEN, KET_THUC_LUU_TRU, GHI_NHAN_QUA_DOI] }
    MaMucChamSoc: { type: string, enum: [CO_BAN, THUONG_XUYEN, DAC_BIET] }
    Loi:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        maLoi: { type: string }
        dieuKienChuaThoa: { type: array, items: { $ref: '#/components/schemas/DieuKien' } }
        giaTriHienHanh: { type: object }
        ungVien: { type: array, description: 'CO_THE_TRUNG_HO_SO, MUC_SUC_KHOE_TRUNG', items: { type: object } }
    DieuKien:
      type: object
      properties:
        ma: { type: string }
        moTa: { type: string }
        canCu: { type: string, description: 'BR/FR, ví dụ BR-M12-03' }
        module: { type: string, description: 'Feature sở hữu điều kiện, ví dụ 013' }
        coTheMien: { type: boolean }
    CanhBao:
      type: object
      properties:
        ma: { type: string, enum: [THIEU_BAN_DONG_Y, THIEU_NGUYEN_VONG, CCCD_TRUNG_HO_SO_QUA_DOI, DI_UNG_KHONG_KIEM_TRA_TU_DONG] }
        moTa: { type: string }
    ThongTinCaNhan:
      type: object
      required: [hoTen, ngaySinh, gioiTinh]
      properties:
        hoTen: { type: string, maxLength: 200 }
        ngaySinh: { type: string, format: date }
        gioiTinh: { type: string, enum: [NAM, NU] }
        loaiGiayTo: { type: string, enum: [CCCD, KHAC] }
        soGiayTo: { type: string }
        anhTepId: { type: integer, format: int64 }
        diaChiThuongTru: { type: string }
        diaChiLienHe: { type: string }
        lienHe: { type: object, properties: { soDienThoai: { type: string }, email: { type: string } } }
        thongTinDacBiet: { type: string }
    HoSo:
      type: object
      properties:
        id: { type: integer, format: int64 }
        maHoSo: { type: string }
        thongTin: { $ref: '#/components/schemas/ThongTinCaNhan' }
        trangThai: { $ref: '#/components/schemas/TrangThaiNct' }
        trangThaiTuLuc: { type: string, format: date-time }
        loaiLuuTruHienHanh: { type: [string, 'null'], description: 'Từ hợp đồng Hiệu lực (004); rỗng khi chưa có' }
        mucChamSocHienHanh: { $ref: '#/components/schemas/MaMucChamSoc' }
        nhuCauChamSoc: { type: array, items: { type: string } }
        luuYChamSoc: { type: [string, 'null'], description: 'Lần đánh giá Đã xác nhận gần nhất (FR-009, FR-038)' }
        mucSucKhoeHieuLuc: { type: array, items: { $ref: '#/components/schemas/MucSucKhoe' }, description: 'Nhóm SUC_KHOE' }
        coBanDongYHieuLuc: { type: boolean }
        coNguyenVong: { type: boolean }
        hoSoTruocId: { type: [integer, 'null'], format: int64 }
        lenhDuocPhep: { type: array, items: { type: string }, description: 'Chỉ để client ẩn hiện nút (002 FR-042)' }
        truongBiAn: { type: array, items: { type: string } }
    HoSoChoNguoiThan:
      type: object
      properties:
        id: { type: integer, format: int64 }
        thongTin: { $ref: '#/components/schemas/ThongTinCaNhan' }
        trangThai: { $ref: '#/components/schemas/TrangThaiNct' }
        mucChamSocHienHanh: { $ref: '#/components/schemas/MaMucChamSoc' }
        mucSucKhoeHieuLuc: { type: array, items: { $ref: '#/components/schemas/MucSucKhoe' }, description: 'Chỉ khi thỏa chú thích ¹' }
        truongBiAn: { type: array, items: { type: string } }
    KetQuaTaoHoSo:
      type: object
      properties:
        hoSo: { $ref: '#/components/schemas/HoSo' }
        canhBao: { type: array, items: { $ref: '#/components/schemas/CanhBao' } }
    TrangHoSo:
      type: object
      properties:
        muc: { type: array, items: { $ref: '#/components/schemas/HoSo' } }
        sau: { type: [string, 'null'] }
    HoSoLienKet:
      type: object
      properties:
        id: { type: integer, format: int64 }
