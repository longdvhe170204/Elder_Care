      responses:
        '201': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AssessmentDetail' } } } }
        '409': { description: 'DRAFT_ALREADY_EXISTS, INITIAL_ASSESSMENT_EXISTS, STATUS_NOT_ASSESSABLE, PROFILE_CLOSED', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /assessments/{id}:
    get:
      tags: [assessments]
