      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AssessmentDetail' } } } }
    put:
      tags: [assessments]
      summary: Sửa nháp (người tạo hoặc Bác sĩ)
      x-fr: [FR-025, FR-029, FR-032]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
