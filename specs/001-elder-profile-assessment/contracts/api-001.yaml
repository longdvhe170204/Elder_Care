      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/CorrectionBody' }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CorrectionResult' } } } }
  /residents/{id}/reassessment:
    get:
      tags: [assessments]
      summary: Trạng thái cần / quá hạn đánh giá lại và các căn cứ đã báo
      x-fr: [FR-041, FR-042, FR-043]
      x-br: [BR-M01-02]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReassessmentStatus' } } } }
  /reassessments/due:
    get:
      tags: [assessments]
      summary: Danh sách người cao tuổi cần đánh giá lại (Bác sĩ), sắp theo hạn
      x-fr: [FR-039, FR-041]
      description: Trả đủ danh sách trong phạm vi của người gọi, không phân trang (bỏ tham số cursor 2026-10-24, theo mã đã cài)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ReassessmentStatus' } } } } }

  /catalogs/{type}:
    get:
      tags: [catalogs]
