        Điều dưỡng gọi: 403. Phản hồi nêu effects (mức hiện hành đổi, yêu cầu bị thay thế, Hành chính được báo).
      x-fr: [FR-028, FR-031, FR-033, FR-035, FR-036, FR-036a, FR-038, FR-043]
      x-br: [BR-M01-03, BR-M01-09, BR-M01-10]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConfirmAssessmentResult' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /assessments/{id}/discard-draft:
