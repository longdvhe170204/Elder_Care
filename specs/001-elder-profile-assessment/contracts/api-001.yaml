openapi: 3.1.0
info:
  title: Elder Care – Feature 001 (hồ sơ và đánh giá người cao tuổi)
  version: 1.0.0-design
  description: |
    Hợp đồng REST của feature 001 (module M01). Tên định danh tiếng Anh theo glossary.md của 000, mục 8 (dịch 2026-10-21; bản tên logic tiếng Việt ở lịch sử git).
    Quy ước chung theo research R-03 của feature 000:
    tiền tố /api/v1, lỗi RFC 9457 có errorCode và unmetConditions[], If-Match cho lệnh sửa nháp và cập nhật,
    Idempotency-Key cho mọi lệnh ghi. Xác thực và giới hạn trường theo feature 002 (A-02, A-08):
    trường không được xem bị bỏ khỏi phản hồi và liệt kê trong hiddenFields.
    Lệnh trạng thái không dùng If-Match; backend khóa dòng và kiểm tra lại trên trạng thái mới (FR-048, research H-02).
    Truy vết: mỗi operation có x-fr (FR của spec 001) và x-br khi có.
servers:
  - url: /api/v1
tags:
  - name: profiles
    description: UC-01, UC-02; mục A
  - name: status
    description: UC-08 cùng UC-15 → UC-18 (nội dung chi tiết do 004); mục F, G
  - name: consents
    description: UC-03; mục B
  - name: health
    description: UC-04; mục C
  - name: end-of-life-wishes
    description: UC-82; mục C1; UC-103, mục C1a (bổ sung 2026-10-22)
  - name: assessments
    description: UC-05 → UC-07; mục D, E
  - name: catalogs
    description: Danh mục nhóm 1 của M01
  - name: files
    description: Tệp đính kèm dùng chung (common.file, research H-13)

paths:
  /residents:
    get:
      tags: [profiles]
      summary: Tra cứu hồ sơ trong phạm vi (UC-02)
      description: Kết quả lọc theo ScopeApi.filter của 002; Nhân viên bếp nhận 403 (FR-007).
      x-fr: [FR-007]
      x-br: [BR-M15-01]
      parameters:
        - { name: q, in: query, description: 'Họ tên, mã hồ sơ hoặc số giấy tờ', schema: { type: string } }
        - { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/ResidentStatus' } } }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProfilePage' } } } }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [profiles]
      summary: Tạo hồ sơ người cao tuổi (Hành chính)
      description: |
        CCCD trùng hồ sơ chưa ở trạng thái cuối: 409 CITIZEN_ID_IN_USE kèm mã hồ sơ (DBR-01).
        Không có CCCD và trùng họ tên + ngày sinh: 409 POSSIBLE_DUPLICATE_PROFILE kèm danh sách; gửi lại với confirmNotDuplicate=true (FR-005).
        CCCD trùng hồ sơ Kết thúc lưu trú / Hủy tiếp nhận: tạo và liên kết previousProfile (FR-004).
        CCCD trùng hồ sơ Qua đời: tạo, không liên kết, warnings chứa CITIZEN_ID_MATCHES_DECEASED_PROFILE.
      x-fr: [FR-001, FR-002, FR-003, FR-004, FR-005]
      x-br: [BR-M01-04]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PersonalInfo'
                - type: object
                  properties:
                    confirmNotDuplicate: { type: boolean, default: false }
      responses:
        '201':
          description: Đã tạo, trạng thái ADMISSION_IN_PROGRESS
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/CreateProfileResult' } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /residents/{id}:
    get:
      tags: [profiles]
      summary: Xem hồ sơ
      description: |
        Nhân viên nhận Profile: trường bị bỏ theo 19.3 (Hành chính không thấy activeHealthItems; nguyện vọng chỉ hasEndOfLifeWish).
        Người thân nhận cùng schema Profile ở dạng tập con FamilyProfile: không có careNote; phần sức khỏe chỉ có khi thỏa chú thích ¹ (FR-022);
        trường bị bỏ khỏi phản hồi và liệt kê trong hiddenFields (002 A-08), nên một schema Profile mô tả cả hai.
        Ngoài phạm vi: 404.
      x-fr: [FR-007, FR-008, FR-009, FR-022, FR-023e]
      x-br: [BR-M01-08, BR-M15-01]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '404': { $ref: '#/components/responses/Problem' }
  /residents/{id}/update-personal-info:
    post:
      tags: [profiles]
      summary: Cập nhật thông tin cá nhân (Hành chính)
      x-fr: [FR-006]
      x-br: [BR-M01-05]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PersonalInfo'
                - type: object
                  required: [reason]
                  properties: { reason: { $ref: '#/components/schemas/Reason' } }
      responses:
        '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '409': { description: PROFILE_CLOSED, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { $ref: '#/components/responses/Problem' }
  /residents/{id}/linked-profiles:
    get:
      tags: [profiles]
      summary: Chuỗi hồ sơ trước của cùng người (FR-004)
      description: Mỗi phần tử chỉ trả khi người xem có quyền trên chính hồ sơ đó; còn lại chỉ có profileCode và viewable=false.
      x-fr: [FR-004]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LinkedProfile' } } } } }
  /residents/{id}/status-history:
    get:
      tags: [status]
      summary: Lịch sử trạng thái
      x-fr: [FR-046]
      x-br: [BR-M01-04]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StatusHistoryEntry' } } } } }
  /residents/{id}/conditions/{command}:
    get:
      tags: [status]
      summary: Xem trước điều kiện của một lệnh (không đổi dữ liệu)
      description: Chạy cùng bộ kiểm tra như lệnh thật (research H-02 mục 6). Dùng cho danh sách điều kiện tiếp nhận (004 FR-004).
      x-fr: [FR-045]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: command, in: path, required: true, schema: { $ref: '#/components/schemas/UserCommand' } }
      responses:
        '200': { description: 'Danh sách điều kiện; rỗng là đủ điều kiện', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Condition' } } } } }
  /residents/{id}/complete-admission:
    post:
      tags: [status]
      summary: Hoàn tất tiếp nhận (Đang tiếp nhận → Đang lưu trú)
      description: |
        Thiếu điều kiện: 409 UNMET_CONDITIONS liệt kê đủ (FR-045). Thiếu bản đồng ý hoặc nguyện vọng không chặn;
        phản hồi có warnings MISSING_CONSENT, MISSING_END_OF_LIFE_WISH (FR-012, FR-023d).
        details.switchAllocationToBedId: đổi phân bổ sang giường Trống khác date trong lệnh (003 FR-023, Q-50).
      x-fr: [FR-012, FR-023d, FR-034a, FR-044, FR-045, FR-046, FR-047]
      x-br: [BR-M01-04, BR-M01-06, BR-M02-22]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/StatusCommandBody' }
      responses:
        '200': { $ref: '#/components/responses/CommandOk' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/CommandConflict' }
        '422': { $ref: '#/components/responses/CommandInvalid' }
  /residents/{id}/cancel-admission:
    post:
      tags: [status]
      summary: Hủy tiếp nhận
      x-fr: [FR-044, FR-046, FR-047]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/StatusCommandBody' }
      responses:
        '200': { $ref: '#/components/responses/CommandOk' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/CommandConflict' }
        '422': { $ref: '#/components/responses/CommandInvalid' }
  /residents/{id}/grant-temporary-absence:
    post:
      tags: [status]
      summary: Cho tạm vắng (Hành chính, Trưởng tầng; không qua duyệt)
      description: details theo schema của 004 (loại vắng, dự kiến trở lại, bản ghi đón, có mang thuốc).
      x-fr: [FR-044, FR-047, FR-047a]
      x-br: [BR-M01-06, BR-M10-03]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/StatusCommandBody' }
      responses:
        '200': { $ref: '#/components/responses/CommandOk' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/CommandConflict' }
        '422': { $ref: '#/components/responses/CommandInvalid' }
  /residents/{id}/record-return:
    post:
      tags: [status]
      summary: Ghi nhận trở về (từ Tạm vắng hoặc Điều trị tại bệnh viện)
      x-fr: [FR-040, FR-041, FR-044, FR-047a, FR-047c]
      x-br: [BR-M01-02, BR-M07-09, BR-M05-32]
      description: Từ DIEU_TRI_BENH_VIEN nhận attachmentFileIds (giấy ra viện, đơn thuốc; không bắt buộc, FR-047c).
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/StatusCommandBody' }
      responses:
        '200': { $ref: '#/components/responses/CommandOk' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/CommandConflict' }
        '422': { $ref: '#/components/responses/CommandInvalid' }
  /residents/{id}/transfer-out:
    post:
      tags: [status]
      summary: Chuyển viện (Điều dưỡng, Bác sĩ)
      description: details.basis bắt buộc - incidentId, hoặc doctorOrder của Bác sĩ, hoặc thông tin gia đình / cơ sở y tế khi đang Tạm vắng (CHK016).
      x-fr: [FR-044, FR-047]
      x-br: [BR-M01-06]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/StatusCommandBody' }
      responses:
        '200': { $ref: '#/components/responses/CommandOk' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/CommandConflict' }
        '422': { $ref: '#/components/responses/CommandInvalid' }
  /residents/{id}/end-residency:
    post:
      tags: [status]
      summary: Kết thúc lưu trú (Hành chính, Bác sĩ)
      description: Điều kiện được miễn bởi yêu cầu ngoại lệ đã duyệt của 004; lịch sử ghi tham chiếu (US4 #10).
      x-fr: [FR-044, FR-045, FR-047]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/StatusCommandBody' }
      responses:
        '200': { $ref: '#/components/responses/CommandOk' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/CommandConflict' }
        '422': { $ref: '#/components/responses/CommandInvalid' }
  /residents/{id}/record-death:
    post:
      tags: [status]
      summary: Ghi nhận qua đời
      description: |
        Bác sĩ khi Đang lưu trú; Bác sĩ hoặc Hành chính khi Tạm vắng, Hoạt động bên ngoài, Điều trị tại bệnh viện.
        Hành chính bắt buộc details.evidenceFileId (FR-047b). Nội dung khác theo 004 FR-069.
      x-fr: [FR-044, FR-047, FR-047b]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/StatusCommandBody' }
      responses:
        '200': { $ref: '#/components/responses/CommandOk' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/CommandConflict' }
        '422': { $ref: '#/components/responses/CommandInvalid' }
  /residents/{id}/care-level:
    get:
      tags: [status]
      summary: Mức chăm sóc tại một ngày (mặc định hôm nay) kèm căn cứ
      x-fr: [FR-052, FR-053]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CareLevelAtDate' } } } }
  /residents/{id}/care-level-history:
    get:
      tags: [status]
      summary: Lịch sử mức chăm sóc
      x-fr: [FR-053]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CareLevelAtDate' } } } } }

  /residents/{id}/consents:
    get:
      tags: [consents]
      summary: Bản đồng ý hiện hành và lịch sử
      x-fr: [FR-010, FR-016]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Consent' } } } } }
    post:
      tags: [consents]
      summary: Ghi nhận bản đồng ý (Hành chính); thay thế bản Hiệu lực cũ trong cùng lệnh
      x-fr: [FR-010, FR-011, FR-013, FR-014a]
      description: |
        Sửa 2026-10-18 (Q-348): người ký thay chỉ là người đại diện theo pháp luật, kèm đủ courtDecision.
        Vai trò "người đại diện" của 012 không cho quyền ký thay. notificationConsent áp cho thông báo không khẩn về người cao tuổi (Q-353).
      x-br: [BR-M01-08]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consenterType, familyMemberIdsAllowedHealthView, photoConsent, notificationConsent, consentedAt, evidenceFileId]
              properties:
                consenterType: { type: string, enum: [RESIDENT, LEGAL_REPRESENTATIVE] }
                consenterFamilyMemberId: { type: integer, format: int64, description: Bắt buộc khi LEGAL_REPRESENTATIVE }
                courtDecision: { $ref: '#/components/schemas/CourtDecision' }
                familyMemberIdsAllowedHealthView: { type: array, items: { type: integer, format: int64 } }
                photoConsent: { type: boolean }
                notificationConsent: { type: boolean }
                consentedAt: { type: string, format: date-time }
                evidenceFileId: { type: integer, format: int64 }
      responses:
        '201': { description: Đã ghi nhận, content: { application/json: { schema: { $ref: '#/components/schemas/Consent' } } } }
        '409': { description: 'PROFILE_CLOSED, INVALID_SIGNER', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /consents/{id}/withdraw:
    post:
      tags: [consents]
      summary: Rút lại đồng ý (được làm cả trên hồ sơ trạng thái cuối)
      x-fr: [FR-014, FR-014a, FR-015]
      x-br: [BR-M01-05, BR-M01-08]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, evidenceFileId]
              properties:
                reason: { $ref: '#/components/schemas/Reason' }
                evidenceFileId: { type: integer, format: int64 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Consent' } } } }
        '409': { $ref: '#/components/responses/Problem' }

  /residents/{id}/initial-health-record:
    get:
      tags: [health]
      summary: Hồ sơ sức khỏe ban đầu (kèm đính chính hiện hành)
      x-fr: [FR-017]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/InitialHealthRecord' } } } }
    put:
      tags: [health]
      summary: Lập hoặc sửa bản nháp (Bác sĩ, Điều dưỡng); If-Match khi sửa
      x-fr: [FR-017]
      parameters: [ { $ref: '#/components/parameters/Id' }, { name: If-Match, in: header, required: false, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HealthRecordContent' } } } }
      responses:
        '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/InitialHealthRecord' } } } }
        '409': { description: 'ALREADY_CONFIRMED, PROFILE_CLOSED', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { $ref: '#/components/responses/Problem' }
  /residents/{id}/initial-health-record/confirm:
    post:
      tags: [health]
      summary: Bác sĩ xác nhận hồ sơ sức khỏe ban đầu
      x-fr: [FR-017]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/InitialHealthRecord' } } } }
  /initial-health-records/{id}/correct:
    post:
      tags: [health]
      summary: Đính chính (chuyển tới CorrectionApi của 000; trạng thái cuối luôn qua phê duyệt)
      x-fr: [FR-017, FR-049a]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/CorrectionBody' }
      responses:
        '201': { description: 'Đã lưu (cách a, b) hoặc yêu cầu phê duyệt Chờ duyệt (cách c)', content: { application/json: { schema: { $ref: '#/components/schemas/CorrectionResult' } } } }
  /residents/{id}/health-items:
    get:
      tags: [health]
      summary: Danh sách mục sức khỏe (người thân chỉ thấy mục Hiệu lực, FR-022)
      x-fr: [FR-018, FR-022]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, EXCLUDED, ALL], default: ACTIVE } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HealthItem' } } } } }
    post:
      tags: [health]
      summary: Ghi nhận mục dị ứng, bệnh nền, tiền sử bệnh (Bác sĩ, Điều dưỡng)
      description: |
        Trùng mục Hiệu lực: 409 DUPLICATE_HEALTH_ITEM; gửi lại với confirmDuplicate=true (FR-021).
        Dị ứng loại "khác": phản hồi có warnings ALLERGY_NOT_AUTO_CHECKED (FR-018a).
        Dị ứng từ danh mục: pendingCheck=true tới khi 006, 011 kiểm xong (BR-M01-12).
      x-fr: [FR-018, FR-018a, FR-019, FR-020, FR-021]
      x-br: [BR-M01-07, BR-M01-11, BR-M01-12]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, sourceId]
              properties:
                type: { type: string, enum: [ALLERGY, CHRONIC_CONDITION, MEDICAL_HISTORY] }
                allergenId: { type: integer, format: int64 }
                freeText: { type: string, maxLength: 1000 }
                severityId: { type: integer, format: int64, description: Bắt buộc với ALLERGY }
                sourceId: { type: integer, format: int64 }
                confirmDuplicate: { type: boolean, default: false }
      responses:
        '201': { description: Đã ghi nhận, content: { application/json: { schema: { $ref: '#/components/schemas/HealthItemResult' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /health-items/{id}/exclude:
    post:
      tags: [health]
      summary: Loại trừ mục (Bác sĩ, Điều dưỡng); không có lệnh sửa hay xóa (DBR-04)
      x-fr: [FR-019, FR-020]
      x-br: [BR-M01-07]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HealthItem' } } } }
        '409': { $ref: '#/components/responses/Problem' }

  /residents/{id}/end-of-life-wishes:
    get:
      tags: [end-of-life-wishes]
      summary: Phiên bản Hiệu lực và lịch sử; Hành chính, Kế toán chỉ nhận hasEndOfLifeWish (FR-023e)
      x-fr: [FR-023b, FR-023e]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EndOfLifeWishSummary' } } } }
    post:
      tags: [end-of-life-wishes]
      summary: Ghi phiên bản mới (Bác sĩ, Điều dưỡng); phiên bản cũ chuyển Được thay thế
      x-fr: [FR-023a, FR-023b, FR-023c, FR-023g, FR-023h]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice, firstContact, respondentType, assessingDoctorId, selfDeterminationAssessment, signerType, signedAt, signedCopyFileId, source]
              properties:
                choice: { type: string, enum: [TRANSFER_TO_HOSPITAL, RETURN_HOME, STAY_PALLIATIVE] }
                firstContact: { type: string }
                note: { type: string }
                respondentType: { type: string, enum: [RESIDENT, PATIENT_REPRESENTATIVE, LEGAL_REPRESENTATIVE] }
                respondentFamilyMemberId: { type: integer, format: int64 }
                relationship: { type: string }
                assessingDoctorId: { type: integer, format: int64 }
                selfDeterminationAssessment: { $ref: '#/components/schemas/SelfDeterminationAssessment' }
                signerType: { type: string, enum: [RESIDENT, PATIENT_REPRESENTATIVE, LEGAL_REPRESENTATIVE] }
                signerFamilyMemberId: { type: integer, format: int64 }
                representativeSelection: { type: string, enum: [CHOSEN_BY_RESIDENT, CHOSEN_BY_FAMILY], description: Bắt buộc khi PATIENT_REPRESENTATIVE }
                courtDecision: { $ref: '#/components/schemas/CourtDecision' }
                otherOpinions:
                  type: array
                  description: Ý kiến khác với lựa chọn (thường của gia đình), mỗi ý kiến một mục có nguồn (FR-023c, FR-023g)
                  items:
                    type: object
                    required: [source, content]
                    properties:
                      source: { $ref: '#/components/schemas/OpinionSource' }
                      content: { type: string }
                signedAt: { type: string, format: date-time }
                signedCopyFileId: { type: integer, format: int64 }
                source: { type: string, enum: [ADMISSION, FAMILY_REQUEST] }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EndOfLifeWish' } } } }
        '422': { description: 'INVALID_OPINION_SOURCE, COURT_DECISION_REQUIRED, thiếu selfDeterminationAssessment', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'INVALID_SIGNER, PROFILE_CLOSED', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /residents/{id}/treatment-wishes:
    get:
      tags: [end-of-life-wishes]
      summary: Phiếu nguyện vọng khi điều trị — phiên bản Hiệu lực và lịch sử (bổ sung 2026-10-22)
      description: Nội dung nhóm HEALTH; Hành chính, Kế toán bị chặn (dùng cờ hasTreatmentWish của Profile); người thân theo chú thích ¹ (FR-023m).
      x-fr: [FR-023k, FR-023m]
      x-br: [BR-M01-16]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TreatmentWishSummary' } } } }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [end-of-life-wishes]
      summary: Ghi phiên bản mới (Bác sĩ, Điều dưỡng); phiên bản cũ chuyển Hết hiệu lực (bổ sung 2026-10-22)
      x-fr: [FR-023j, FR-023k, FR-023g]
      x-br: [BR-M01-16, BR-M01-14]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferredHospitals, askFamilyFirst, accompaniedBy, respondent]
              properties:
                preferredHospitals:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items: { $ref: '#/components/schemas/PreferredHospital' }
                healthInsurance: { $ref: '#/components/schemas/HealthInsurance' }
                askFamilyFirst: { type: boolean, description: Cần hỏi gia đình trước khi chuyển viện không khẩn cấp }
                notifyFamilyMemberIds:
                  type: array
                  description: Người thân có quan hệ Hiệu lực; 0..n (chủ dự án chọn 2026-10-22)
                  items: { type: integer, format: int64 }
                accompaniedBy: { type: string, enum: [FAMILY, FACILITY_STAFF, CASE_BY_CASE] }
                note: { type: string }
                respondent: { $ref: '#/components/schemas/OpinionSource' }
                otherOpinions:
                  type: array
                  description: Ý kiến gia đình khác ý kiến người cao tuổi, mỗi ý kiến một mục có nguồn (BR-M01-14, FR-023g)
                  items:
                    type: object
                    required: [source, content]
                    properties:
                      source: { $ref: '#/components/schemas/OpinionSource' }
                      content: { type: string }
                signedCopyFileId: { type: integer, format: int64, description: Không bắt buộc }
      responses:
        '201':
          description: OK; warnings có NO_FAMILY_MEMBER_TO_NOTIFY khi askFamilyFirst = true mà notifyFamilyMemberIds rỗng
          content: { application/json: { schema: { $ref: '#/components/schemas/TreatmentWishResult' } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { description: 'INVALID_OPINION_SOURCE, thiếu bệnh viện ưu tiên', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'INVALID_FAMILY_MEMBER, PROFILE_CLOSED', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /residents/{id}/assessments:
    get:
      tags: [assessments]
      summary: Lịch sử đánh giá (chỉ vai trò có quyền xem Đánh giá; Nhân viên chăm sóc 403)
      x-fr: [FR-008, FR-025]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Assessment' } } } } }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [assessments]
