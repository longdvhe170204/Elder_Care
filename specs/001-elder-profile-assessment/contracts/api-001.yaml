      x-br: [BR-M01-13]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Assessment' } } } }
  /assessments/{id}/correct:
    post:
      tags: [assessments]
      summary: Đính chính lần đánh giá đã xác nhận (qua CorrectionApi của 000)
