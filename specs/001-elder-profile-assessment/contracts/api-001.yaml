      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [allergens, allergy-severities, information-sources, care-needs, care-levels] } }
        - { name: group, in: query, description: 'Chỉ với allergens', schema: { type: string, enum: [ACTIVE_INGREDIENT, FOOD, OTHER] } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, INACTIVE] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CatalogItem' } } } } }
    post:
      tags: [catalogs]
      summary: Tạo mục (quyền theo data-model mục 5)
      x-fr: [FR-018, FR-018a]
      x-br: [BR-M01-11, BR-M15-06]
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [allergens, allergy-severities, information-sources, care-needs, care-levels] } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogItem' } } } }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogItem' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /catalogs/{type}/{id}:
    put:
      tags: [catalogs]
      summary: Sửa mục
      parameters:
        - { name: type, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogItem' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogItem' } } } }
  /catalogs/{type}/{id}/deactivate:
    post:
      tags: [catalogs]
      summary: Ngừng hiệu lực (mục đã được tham chiếu không xóa được)
      parameters:
        - { name: type, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Id' }
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { description: OK } }
  /catalogs/{type}/{id}/reactivate:
    post:
      tags: [catalogs]
      summary: Kích hoạt lại (trùng tên mục đang Hiệu lực thì 409)
      parameters:
        - { name: type, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Id' }
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Problem' } }

  /files:
    post:
      tags: [files]
      summary: Tải tệp lên (PDF, JPEG, PNG; tối đa 10 MB); tệp chưa gắn sau 24 giờ bị dọn
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        '201': { description: OK, content: { application/json: { schema: { type: object, properties: { fileId: { type: integer, format: int64 } } } } } }
        '422': { description: 'FILE_TYPE_NOT_ALLOWED, FILE_TOO_LARGE', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /files/{id}:
    get:
      tags: [files]
      summary: Tải tệp xuống; quyền theo bản ghi chủ sở hữu (FilePermissionProvider)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Nội dung tệp, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    session: { type: http, scheme: bearer, description: 'Token phiên opaque của 002 (A-02)' }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    Cursor: { name: cursor, in: query, description: Khóa trang kế tiếp, schema: { type: string } }
  headers:
    ETag: { schema: { type: string } }
  requestBodies:
    Reason:
      required: true
      content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { $ref: '#/components/schemas/Reason' } } } } }
    StatusCommandBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason: { $ref: '#/components/schemas/Reason' }
              attachmentFileIds:
                type: array
                maxItems: 10
                items: { type: integer, format: int64 }
                description: |
                  (Bổ sung 2026-10-22, FR-047c, BR-M05-32) Ảnh hoặc bản scan giấy tờ của bệnh viện, không bắt buộc.
                  Chỉ nhận ở RECORD_RETURN từ HOSPITALIZED (giấy ra viện, đơn thuốc) và TRANSFER_OUT (giấy chuyển viện);
                  lệnh khác có trường này → 422 ATTACHMENTS_NOT_ACCEPTED. Tệp gắn vào dòng lịch sử trạng thái (research H-18).
              details:
                type: object
                description: |
                  Nội dung chi tiết của lệnh, do module sở hữu kiểm tra (research H-02 mục 5):
                  GRANT_TEMPORARY_ABSENCE, RECORD_RETURN, END_RESIDENCY, RECORD_DEATH theo plan 004;
                  COMPLETE_ADMISSION.switchAllocationToBedId theo plan 003; TRANSFER_OUT.basis theo bảng ở mô tả endpoint.
                additionalProperties: true
    CorrectionBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [type, reason]
            properties:
              type: { type: string, enum: [EDIT_CONTENT, CANCEL_RECORD] }
              correctedContent: { type: object, additionalProperties: true }
              reason: { $ref: '#/components/schemas/Reason' }
  responses:
    Problem:
      description: Lỗi theo RFC 9457 (research R-03 của 000)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    CommandOk:
      description: Đã chuyển trạng thái
      content: { application/json: { schema: { $ref: '#/components/schemas/StatusCommandResult' } } }
    CommandConflict:
      description: 'UNMET_CONDITIONS (đủ danh sách), INVALID_TRANSITION, PROFILE_CLOSED'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    CommandInvalid:
      description: 'REASON_REQUIRED, INVALID_DETAILS'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Reason: { type: string, minLength: 1, maxLength: 2000 }
    ResidentStatus: { type: string, enum: [ADMISSION_IN_PROGRESS, IN_RESIDENCE, TEMPORARILY_ABSENT, OFF_SITE_ACTIVITY, HOSPITALIZED, RESIDENCY_ENDED, DECEASED, ADMISSION_CANCELLED] }
    UserCommand: { type: string, enum: [COMPLETE_ADMISSION, CANCEL_ADMISSION, GRANT_TEMPORARY_ABSENCE, RECORD_RETURN, TRANSFER_OUT, END_RESIDENCY, RECORD_DEATH] }
    CareLevelCode: { type: string, enum: [BASIC, REGULAR, SPECIAL] }
    Problem:
      type: object
      description: Lỗi theo RFC 9457; cùng cấu trúc với Problem của api-000 (BL-23, chủ dự án chọn bản chung 2026-10-23)
      required: [type, title, status, errorCode]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errorCode: { type: string, example: CONDITION_NOT_MET }
        unmetConditions:
          type: array
          description: FR-006
          items: { type: object, properties: { code: { type: string, example: BR-M03-06 }, description: { type: string }, basis: { type: string, description: "BR/FR, ví dụ BR-M12-03" }, module: { type: string, description: "Feature sở hữu điều kiện, ví dụ 013" }, waivable: { type: boolean, description: "Miễn được qua yêu cầu phê duyệt (004)" } } }
        currentValue: { description: 'Khi 412: tài nguyên hiện hành (FR-021)' }
        candidates: { type: array, description: "POSSIBLE_DUPLICATE_PROFILE, DUPLICATE_HEALTH_ITEM (001)", items: { type: object } }
        failedLayer: { type: string, enum: [ROLE, SCOPE, LEGAL, SOURCE_DATA], description: 'Khi 403 của lớp quyền (002 FR-043)' }
        license: { type: object, description: 'Khi 403 LEGAL_CONDITION_NOT_MET (002 FR-043)', properties: { name: { type: string }, expiryDate: { type: string, format: date } } }
        unlocksAt: { type: string, format: date-time, description: 'Khi 423 ACCOUNT_TEMPORARILY_LOCKED (002 FR-014)' }
    Condition:
      type: object
      properties:
        code: { type: string }
        description: { type: string }
        basis: { type: string, description: 'BR/FR, ví dụ BR-M12-03' }
        module: { type: string, description: 'Feature sở hữu điều kiện, ví dụ 013' }
        waivable: { type: boolean }
    Warning:
      type: object
      properties:
        code: { type: string, enum: [MISSING_CONSENT, MISSING_END_OF_LIFE_WISH, CITIZEN_ID_MATCHES_DECEASED_PROFILE, ALLERGY_NOT_AUTO_CHECKED, MISSING_TREATMENT_WISH, NO_FAMILY_MEMBER_TO_NOTIFY] }
        description: { type: string }
    PersonalInfo:
      type: object
      required: [fullName, dateOfBirth, gender]
      properties:
        fullName: { type: string, maxLength: 200 }
        dateOfBirth: { type: string, format: date }
        gender: { type: string, enum: [MALE, FEMALE] }
        idDocumentType: { type: string, enum: [CITIZEN_ID, OTHER] }
        idDocumentNumber: { type: string }
        photoFileId: { type: integer, format: int64 }
        permanentAddress: { type: string }
        contactAddress: { type: string }
        contact: { type: object, properties: { phoneNumber: { type: string }, email: { type: string } } }
        specialNotes: { type: string }
    Profile:
      type: object
      properties:
        id: { type: integer, format: int64 }
        profileCode: { type: string }
        personalInfo: { $ref: '#/components/schemas/PersonalInfo' }
        status: { $ref: '#/components/schemas/ResidentStatus' }
        statusSince: { type: string, format: date-time }
        currentResidenceType: { type: [string, 'null'], description: 'Từ hợp đồng Hiệu lực (004); rỗng khi chưa có' }
        currentCareLevel: { $ref: '#/components/schemas/CareLevelCode' }
        careNeeds: { type: array, items: { type: string } }
        careNote: { type: [string, 'null'], description: 'Lần đánh giá Đã xác nhận gần nhất (FR-009, FR-038)' }
        activeHealthItems: { type: array, items: { $ref: '#/components/schemas/HealthItem' }, description: 'Nhóm HEALTH' }
        hasActiveConsent: { type: boolean }
        hasEndOfLifeWish: { type: boolean }
        hasTreatmentWish: { type: boolean, description: 'Bổ sung 2026-10-22 (FR-023m): Hành chính chỉ thấy cờ này, không thấy nội dung phiếu; Kế toán không có trường này (hiddenFields)' }
        previousProfileId: { type: [integer, 'null'], format: int64 }
        allowedCommands: { type: array, items: { type: string }, description: 'Chỉ để client ẩn hiện nút (002 FR-042)' }
        hiddenFields: { type: array, items: { type: string } }
    FamilyProfile:
      type: object
      description: Tập con của Profile mà người thân nhận (xem mô tả GET /residents/{id}); không dùng làm schema phản hồi riêng
      properties:
        id: { type: integer, format: int64 }
        personalInfo: { $ref: '#/components/schemas/PersonalInfo' }
        status: { $ref: '#/components/schemas/ResidentStatus' }
        currentCareLevel: { $ref: '#/components/schemas/CareLevelCode' }
        activeHealthItems: { type: array, items: { $ref: '#/components/schemas/HealthItem' }, description: 'Chỉ khi thỏa chú thích ¹' }
        hiddenFields: { type: array, items: { type: string } }
    CreateProfileResult:
      type: object
      properties:
        profile: { $ref: '#/components/schemas/Profile' }
        warnings: { type: array, items: { $ref: '#/components/schemas/Warning' } }
    ProfilePage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Profile' } }
        nextCursor: { type: [string, 'null'] }
    LinkedProfile:
      type: object
      properties:
        id: { type: integer, format: int64 }
        profileCode: { type: string }
        status: { $ref: '#/components/schemas/ResidentStatus' }
        viewable: { type: boolean }
    StatusHistoryEntry:
      type: object
      properties:
        from: { $ref: '#/components/schemas/ResidentStatus' }
        to: { $ref: '#/components/schemas/ResidentStatus' }
        command: { type: string }
        at: { type: string, format: date-time }
        performedBy: { type: string }
        bySystem: { type: boolean }
        reason: { type: [string, 'null'] }
        basis: { type: [object, 'null'] }
        conditionWaiver: { type: [object, 'null'] }
    StatusCommandResult:
      type: object
      properties:
        status: { $ref: '#/components/schemas/ResidentStatus' }
        history: { $ref: '#/components/schemas/StatusHistoryEntry' }
        warnings: { type: array, items: { $ref: '#/components/schemas/Warning' } }
    CareLevelAtDate:
      type: object
      properties:
        careLevel: { $ref: '#/components/schemas/CareLevelCode' }
        effectiveFrom: { type: string, format: date-time }
        basisType: { type: string, enum: [ASSESSMENT, RESIDENCY_CHANGE_REQUEST] }
        basisId: { type: integer, format: int64 }
    Consent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        consenterType: { type: string, enum: [RESIDENT, LEGAL_REPRESENTATIVE] }
        consenterFamilyMemberId: { type: [integer, 'null'], format: int64, description: 'Bổ sung 2026-10-23: người đại diện theo pháp luật ký thay (kể cả người ghi là người thân quan hệ Khác, Q-359); rỗng khi RESIDENT' }
        courtDecision: { $ref: '#/components/schemas/CourtDecision' }
        familyMemberIdsAllowedHealthView: { type: array, items: { type: integer, format: int64 } }
        photoConsent: { type: boolean }
        notificationConsent: { type: boolean }
        consentedAt: { type: string, format: date-time }
        evidenceFileId: { type: integer, format: int64, description: 'Bổ sung 2026-10-23: bản ký đã scan; tải bằng GET /files/{id} theo quyền xem bản đồng ý' }
        status: { type: string, enum: [ACTIVE, WITHDRAWN] }
        withdrawal: { type: [object, 'null'], properties: { at: { type: string, format: date-time }, reason: { type: string }, evidenceFileId: { type: [integer, 'null'], format: int64, description: 'Bổ sung 2026-10-23: bản yêu cầu rút lại; rỗng khi được thay thế' }, supersededById: { type: integer, format: int64 } } }
    HealthRecordContent:
      type: object
      properties:
        bloodType: { type: string }
        mobility: { type: string }
        selfCareAbility: { type: string }
        cognition: { type: string }
        initialNeedsNote: { type: string }
        nutritionNeeds: { type: string }
        currentMedications: { type: string }
        rehabilitationNeeds: { type: string }
    InitialHealthRecord:
      allOf:
        - $ref: '#/components/schemas/HealthRecordContent'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            confirmed: { type: boolean }
            confirmedBy: { type: [string, 'null'] }
            corrected: { type: boolean }
    HealthItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, enum: [ALLERGY, CHRONIC_CONDITION, MEDICAL_HISTORY] }
        allergen: { $ref: '#/components/schemas/AllergenRef' }
        freeText: { type: [string, 'null'] }
        notAutoChecked: { type: boolean }
        pendingCheck: { type: boolean }
        severity: { type: [string, 'null'] }
        source: { type: string }
        recordedBy: { type: string }
        at: { type: string, format: date-time }
        status: { type: string, enum: [ACTIVE, EXCLUDED] }
        exclusion: { type: [object, 'null'], properties: { at: { type: string, format: date-time }, by: { type: string }, reason: { type: string } } }
    AllergenRef:
      type: object
      description: Dị nguyên của mục sức khỏe (rỗng khi dị ứng nhập tay); nhóm, thứ tự lấy từ GET /catalogs/allergens
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    HealthItemResult:
      type: object
      properties:
        items: { $ref: '#/components/schemas/HealthItem' }
        warnings: { type: array, items: { $ref: '#/components/schemas/Warning' } }
    EndOfLifeWish:
      type: object
      properties:
        id: { type: integer, format: int64 }
        choice: { type: string, enum: [TRANSFER_TO_HOSPITAL, RETURN_HOME, STAY_PALLIATIVE] }
        firstContact: { type: string }
        note: { type: string }
        selfDeterminationAssessment: { $ref: '#/components/schemas/SelfDeterminationAssessment' }
        signer: { type: string }
        signerType: { type: string, enum: [RESIDENT, PATIENT_REPRESENTATIVE, LEGAL_REPRESENTATIVE] }
        representativeSelection: { type: [string, 'null'], enum: [CHOSEN_BY_RESIDENT, CHOSEN_BY_FAMILY] }
        otherOpinions:
          type: array
          items:
            type: object
            properties:
              source: { $ref: '#/components/schemas/OpinionSource' }
              content: { type: string }
              recordedBy: { type: string }
              at: { type: string, format: date-time }
        signedAt: { type: string, format: date-time }
        source: { type: string, enum: [ADMISSION, FAMILY_REQUEST, CRITICAL_RECONFIRMATION], description: 'CRITICAL_RECONFIRMATION do 007 ghi qua EndOfLifeWishApi (BR-M05-16); POST chỉ nhận ADMISSION, FAMILY_REQUEST' }
        status: { type: string, enum: [ACTIVE, SUPERSEDED] }
    PreferredHospital:
      type: object
      required: [name, address]
      properties:
        name: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
    HealthInsurance:
      type: object
      description: Không bắt buộc (FR-023j); căn cứ xử lý dữ liệu cá nhân chờ đối chiếu 24.4 (Q-384)
      properties:
        initialRegistrationPlace: { type: string }
        cardNumber: { type: string }
        cardExpiry: { type: string, format: date }
    TreatmentWish:
      type: object
      description: Phiếu nguyện vọng khi điều trị (bổ sung 2026-10-22; FR-023j, BR-M01-16)
      properties:
        id: { type: integer, format: int64 }
        preferredHospitals: { type: array, items: { $ref: '#/components/schemas/PreferredHospital' } }
        healthInsurance: { $ref: '#/components/schemas/HealthInsurance' }
        askFamilyFirst: { type: boolean }
        notifyFamilyMembers:
          type: array
          items:
            type: object
            properties:
              familyMemberId: { type: integer, format: int64 }
              fullName: { type: string }
              relationship: { type: string }
              phoneNumber: { type: string }
        accompaniedBy: { type: string, enum: [FAMILY, FACILITY_STAFF, CASE_BY_CASE] }
        note: { type: string }
        respondent: { $ref: '#/components/schemas/OpinionSource' }
        otherOpinions:
          type: array
          items:
            type: object
            properties:
              source: { $ref: '#/components/schemas/OpinionSource' }
              content: { type: string }
              recordedBy: { type: string }
              at: { type: string, format: date-time }
        signedCopyFileId: { type: [integer, 'null'], format: int64 }
        recordedBy: { type: string }
        at: { type: string, format: date-time }
        status: { type: string, enum: [ACTIVE, EXPIRED] }
    TreatmentWishSummary:
      type: object
      properties:
        active: { $ref: '#/components/schemas/TreatmentWish' }
        history: { type: array, items: { $ref: '#/components/schemas/TreatmentWish' } }
        hiddenFields: { type: array, items: { type: string } }
    TreatmentWishResult:
      type: object
      properties:
        wish: { $ref: '#/components/schemas/TreatmentWish' }
        warnings: { type: array, items: { $ref: '#/components/schemas/Warning' } }
    OpinionSource:
      type: object
      description: |
        Nguồn của ý kiến dùng chung (001 FR-023g, BR-M01-14); 004, 005, 012, 014 chép đúng schema này vào hợp đồng của mình.
        familyMemberId bắt buộc khi type = FAMILY_MEMBER và phải là người thân có quan hệ Hiệu lực; rỗng khi loại khác.
      required: [type]
      properties:
        type: { type: string, enum: [RESIDENT, FAMILY_MEMBER, OBSERVING_STAFF] }
        familyMemberId: { type: [integer, 'null'], format: int64 }
    SelfDeterminationAssessment:
      type: object
      description: Nhận định của Bác sĩ gắn với chính quyết định này, không phải dấu của người cao tuổi (FR-023h)
      required: [canSelfDetermine, supportMethod, reviewDate]
      properties:
        canSelfDetermine: { type: boolean }
        at: { type: string, format: date-time, readOnly: true }
        supportMethod: { type: string, minLength: 1 }
        reviewDate: { type: string, format: date }
    CourtDecision:
      type: [object, 'null']
      description: Bằng chứng quyết định của Tòa án tuyên mất năng lực hành vi dân sự hoặc khó khăn trong nhận thức, làm chủ hành vi (FR-011)
      required: [number, date, court, fileId]
      properties:
        number: { type: string }
        date: { type: string, format: date }
        court: { type: string }
        fileId: { type: integer, format: int64 }
    EndOfLifeWishSummary:
      type: object
      properties:
        hasEndOfLifeWish: { type: boolean }
        current: { $ref: '#/components/schemas/EndOfLifeWish' }
        history: { type: array, items: { $ref: '#/components/schemas/EndOfLifeWish' } }
        hiddenFields: { type: array, items: { type: string } }
    Assessment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, enum: [INITIAL, REASSESSMENT] }
        basis: { type: string }
        createdBy: { type: string }
        comment: { type: [string, 'null'] }
        careNote: { type: [string, 'null'] }
        careLevel: { $ref: '#/components/schemas/CareLevelCode' }
        careNeeds: { type: array, items: { $ref: '#/components/schemas/CatalogItem' } }
        proposedResidenceType: { type: [string, 'null'], enum: [LONG_TERM_RESIDENTIAL, SHORT_TERM_RESIDENTIAL, DAY_CARE] }
        status: { type: string, enum: [DRAFT, CONFIRMED, DISCARDED] }
        confirmedBy: { type: [string, 'null'] }
        confirmedAt: { type: [string, 'null'], format: date-time }
        corrected: { type: boolean }
    AssessmentDetail:
      allOf:
        - $ref: '#/components/schemas/Assessment'
        - type: object
          properties:
            reference:
              type: object
              description: FR-024; không có điểm hay mức đề xuất
              properties:
                initialHealthRecord: { $ref: '#/components/schemas/InitialHealthRecord' }
                activeHealthItems: { type: array, items: { $ref: '#/components/schemas/HealthItem' } }
                latestVitalSigns: { type: array, items: { type: object }, description: 'Từ 007' }
    ConfirmAssessmentResult:
      type: object
      properties:
        assessment: { $ref: '#/components/schemas/Assessment' }
        effects:
          type: object
          properties:
            currentCareLevelChanged: { type: boolean }
            supersededRequestIds: { type: array, items: { type: integer, format: int64 } }
            administratorNotified: { type: boolean }
            carePlanReviewNotified: { type: boolean }
    ReassessmentStatus:
      type: object
      properties:
        residentId: { type: integer, format: int64 }
        status: { type: string, enum: [NONE, DUE, OVERDUE, NOT_APPLICABLE] }
        dueAt: { type: [string, 'null'], format: date-time }
        overdueSince: { type: [string, 'null'], format: date-time }
        basis: { type: array, items: { type: object, properties: { basis: { type: string }, source: { type: string }, notifiedAt: { type: string, format: date-time } } } }
    CatalogItem:
      type: object
      required: [name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        group: { type: string, description: 'Chỉ với allergens' }
        order: { type: integer }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    CorrectionResult:
      type: object
      properties:
        creationMethod: { type: string, enum: [A_ORIGINAL_AUTHOR, B_FLOOR_LEAD, C_APPROVAL_REQUEST] }
        correctionId: { type: [integer, 'null'], format: int64 }
        approvalRequestId: { type: [integer, 'null'], format: int64 }
