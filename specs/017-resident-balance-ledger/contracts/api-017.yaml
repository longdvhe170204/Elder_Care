# Bản dịch tên tiếng Anh (research R-03 của 000), A lập 2026-11-08, chờ chủ dự án duyệt; bảng tên ở glossary mục 23. Chưa triển khai HTTP.
openapi: 3.1.0
info:
  title: Elder Care – Feature 017 (số dư và thu chi)
  version: 2.0.0-design
  description: |
    Hợp đồng REST của feature 017 (module M11, gói con của 017 trong billing), lập lại 2026-10-22 theo spec viết lại (Q-377 → Q-379, Q-381, Q-385, Q-386).
    Quy ước chung theo research R-03 của 000: tiền tố /api/v1, lỗi RFC 9457 có errorCode và unmetConditions[], Idempotency-Key cho mọi lệnh ghi.
    Không có endpoint sửa, xóa, hủy giao dịch Đã xác nhận; sai sót đi qua giao dịch điều chỉnh có duyệt (FR-011). Không có giao dịch đảo,
    số phiếu thu chi, chốt quỹ ngày, nhập sao kê ngân hàng (Q-385).
    Hoàn tiền, hoàn cọc, điều chỉnh là loại yêu cầu M11.BALANCE_TRANSACTION của 000; Quản lý viện duyệt, từ chối và Kế toán hủy qua API yêu cầu phê duyệt của 000
    (api-000); handler của 017 kiểm lại giới hạn và người nhận tại lúc duyệt (research E-06).
    Chứng từ (phiếu báo phí, bảng quyết toán) và file xuất được dựng một lần, lưu cùng bản ghi; tải lại trả đúng file đã lưu (FR-037).
    Không có thanh toán trực tuyến (Q-285). Người thân dùng /family-portal/** khi có quyền xem chi phí (chú thích ¹⁶).
    Truy vết: mỗi operation có x-fr (FR của spec 017) và x-br khi có.
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - { name: balance, description: 'UC-85; mục A' }
  - { name: payments, description: 'UC-12, UC-85, UC-86; mục B' }
  - { name: balance-transactions, description: 'Mục C' }
  - { name: balance-status, description: 'UC-87; mục D' }
  - { name: settlement, description: 'UC-101; mục E, J' }
  - { name: payment-notices, description: 'UC-100; mục J' }
  - { name: balance-exports, description: 'UC-88; mục F' }
  - { name: family-portal, description: 'FR-003, FR-026, FR-038' }

paths:
  # ---------------- Sổ ----------------
  /residents/{residentId}/balance:
    get:
      tags: [balance]
      summary: Số dư, số dư cọc, tình trạng, trạng thái đặt cọc, mã nộp tiền, thông tin nộp tiền (Kế toán, Hành chính, Quản lý viện)
      description: 'Hành chính chỉ nhận số dư, số dư cọc, trạng thái đặt cọc (hiddenFields liệt kê phần còn lại).'
      x-fr: [FR-002, FR-003, FR-004, FR-006]
      parameters: [ { $ref: '#/components/parameters/ResidentId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Balance' } } } }, '403': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' } }
  /residents/{residentId}/balance-transactions:
    get:
      tags: [balance]
      summary: Giao dịch của hồ sơ theo sổ, khoảng, trạng thái
      x-fr: [FR-010]
      parameters:
        - { $ref: '#/components/parameters/ResidentId' }
        - { name: ledger, in: query, schema: { $ref: '#/components/schemas/Ledger' } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TransactionStatus' } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BalanceTransaction' } } } } } }
  /banks:
    get:
      tags: [balance]
      summary: Danh mục ngân hàng (mã BIN NAPAS) còn hiệu lực, cho ô chọn ngân hàng của CFG-M11-10 (Quản lý viện; bổ sung 2026-10-22)
      x-fr: [FR-003]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Bank' } } } } } }
  /balances/by-payment-code:
    get:
      tags: [payments]
      summary: Tìm hồ sơ theo mã nộp tiền đọc từ nội dung chuyển khoản (Kế toán)
      description: 'Không phân biệt hoa thường, bỏ khoảng trắng và gạch nối; ký tự kiểm tra sai trả 404 (research E-04).'
      x-fr: [FR-007]
      parameters: [ { name: code, in: query, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Balance' } } } }, '404': { $ref: '#/components/responses/Problem' } }

  # ---------------- Ghi nhận tiền nộp ----------------
  /residents/{residentId}/cash-payments:
    post:
      tags: [payments]
      summary: Kế toán ghi nhận khoản nộp tiền mặt vào số dư hoặc sổ cọc; Đã xác nhận ngay; không cấp số phiếu
      x-fr: [FR-005, FR-006, FR-018]
      x-br: [BR-M11-16]
      parameters: [ { $ref: '#/components/parameters/ResidentId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ledger, amount, payerName, receivedAt]
              properties:
                ledger: { $ref: '#/components/schemas/Ledger' }
                amount: { type: integer, format: int64, minimum: 1 }
                payerName: { type: string, minLength: 1 }
                receivedAt: { type: string, format: date-time }
                note: { type: string, description: 'Ghi được số chứng từ của phần mềm kế toán' }
      responses:
        '201': { description: Giao dịch và tình trạng sau khi nộp, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResult' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/BlockingProblem' }
        '422': { $ref: '#/components/responses/Problem' }
  /residents/{residentId}/bank-transfer-payments:
    post:
      tags: [payments]
      summary: Kế toán ghi nhận khoản chuyển khoản đã về tài khoản của viện; nhiều dòng (khác sổ) cùng mã giao dịch ngân hàng
      description: 'Mã giao dịch ngân hàng đã dùng ở giao dịch khác → 409 BANK_TRANSACTION_CODE_USED kèm giao dịch trước; gửi lại với confirmDuplicateCode = true thì lưu (DBR-29). Không nhập file sao kê, không tự khớp.'
      x-fr: [FR-007, FR-006, FR-018]
      x-br: [BR-M11-12]
      parameters: [ { $ref: '#/components/parameters/ResidentId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines, receivedOn, bankTransactionCode]
              properties:
                lines:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items:
                    type: object
                    required: [ledger, amount]
                    properties:
                      ledger: { $ref: '#/components/schemas/Ledger' }
                      amount: { type: integer, format: int64, minimum: 1 }
                receivedOn: { type: string, format: date }
                bankTransactionCode: { type: string, minLength: 1 }
                payerName: { type: string }
                note: { type: string }
                confirmDuplicateCode: { type: boolean, default: false }
      responses:
        '201': { description: Các giao dịch và tình trạng sau khi nộp, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResult' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { description: 'BANK_TRANSACTION_CODE_USED (kèm duplicateTransactions), NO_LEDGER', content: { application/problem+json: { schema: { $ref: '#/components/schemas/DuplicateCodeProblem' } } } }
        '422': { $ref: '#/components/responses/Problem' }

  # ---------------- Giao dịch cần duyệt, cấn trừ ----------------
  /balance-transactions:
    post:
      tags: [balance-transactions]
      summary: Kế toán lập hoàn tiền, hoàn cọc hoặc điều chỉnh (Chờ duyệt); tạo yêu cầu M11.BALANCE_TRANSACTION của 000
      description: 'Duyệt, từ chối (Quản lý viện) và hủy (Kế toán) qua API yêu cầu phê duyệt của 000; lúc duyệt kiểm lại giới hạn, người nhận (FR-014). Điều chỉnh không trỏ giao dịch Thanh toán bảng chi phí (FR-011).'
      x-fr: [FR-010, FR-011, FR-013, FR-014]
      x-br: [BR-M11-10, BR-M11-14]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NewBalanceTransaction' } } } }
      responses:
        '201': { description: Giao dịch Chờ duyệt, content: { application/json: { schema: { $ref: '#/components/schemas/BalanceTransaction' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/BlockingProblem' }
        '422': { $ref: '#/components/responses/Problem' }
  /balance-transactions/pending-approval:
    get:
      tags: [balance-transactions]
      summary: Giao dịch Chờ duyệt (Quản lý viện, Kế toán) kèm kết quả kiểm tra hiện tại
      x-fr: [FR-013]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PendingBalanceTransaction' } } } } } }
  /residents/{residentId}/deposit-offsets:
    post:
      tags: [balance-transactions]
      summary: Kế toán cấn trừ tiền cọc vào số dư âm (cặp hai giao dịch liên kết, không duyệt)
      x-fr: [FR-015]
      parameters: [ { $ref: '#/components/parameters/ResidentId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [amount], properties: { amount: { type: integer, format: int64, minimum: 1 }, note: { type: string } } } } } }
      responses:
        '201': { description: Cặp giao dịch, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BalanceTransaction' } } } } }
        '409': { $ref: '#/components/responses/BlockingProblem' }

  # ---------------- Tình trạng ----------------
  /balance-statuses:
    get:
      tags: [balance-status]
      summary: Danh sách hồ sơ Sắp hết tiền, Còn nợ (Kế toán, Quản lý viện)
      x-fr: [FR-016, FR-017, FR-018]
      x-br: [BR-M11-13]
      parameters: [ { name: status, in: query, schema: { type: string, enum: [RUNNING_LOW, IN_DEBT] } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Balance' } } } } } }
  /residents/{residentId}/balance/stop-reminders:
    post:
      tags: [balance-status]
      summary: Quản lý viện ghi "dừng nhắc" cho hồ sơ trạng thái cuối còn nợ
      x-fr: [FR-020]
      parameters: [ { $ref: '#/components/parameters/ResidentId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/BlockingProblem' } }

  # ---------------- Quyết toán ----------------
  /residents/{residentId}/settlement:
    get:
      tags: [settlement]
      summary: Điều kiện quyết toán (hai mã) và các phiên bản bảng quyết toán
      x-fr: [FR-022, FR-023, FR-034]
      parameters: [ { $ref: '#/components/parameters/ResidentId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Settlement' } } } } }
  /residents/{residentId}/settlement/confirm:
    post:
      tags: [settlement]
      summary: Kế toán Xác nhận quyết toán; dựng bảng quyết toán PDF phiên bản mới
      description: 'Điều kiện: hồ sơ kết thúc Đang chuẩn bị, danh sách việc sau qua đời đang mở hoặc hồ sơ trạng thái cuối có giao dịch sau lần xác nhận trước; ba ý tiền đạt hoặc có ngoại lệ đã duyệt (chỉ hồ sơ kết thúc lưu trú); không còn giao dịch Chờ duyệt (không miễn được, BR-M11-22). Không đạt → 409 kèm unmetConditions.'
      x-fr: [FR-022, FR-024, FR-034, FR-037]
      x-br: [BR-M11-22, BR-M11-23]
      parameters: [ { $ref: '#/components/parameters/ResidentId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '201': { description: Phiên bản bảng quyết toán, content: { application/json: { schema: { $ref: '#/components/schemas/SettlementStatement' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/BlockingProblem' }
  /settlement-statements/{id}/signed-copy:
    post:
      tags: [settlement]
      summary: Kế toán đính kèm bản scan có chữ ký của người đại diện vào phiên bản hiện hành (một lần; không đổi điều kiện)
      x-fr: [FR-034]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [fileId], properties: { fileId: { type: integer, format: int64 } } } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/BlockingProblem' } }
  /settlement-statements/{id}/file:
    get:
      tags: [settlement]
      summary: Tải đúng file PDF đã lưu của phiên bản; ghi lần tải
      x-fr: [FR-037]
      x-br: [BR-M11-23]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }, '403': { $ref: '#/components/responses/Problem' } }

  # ---------------- Phiếu báo phí ----------------
  /payment-notices/pending-issue:
    get:
      tags: [payment-notices]
      summary: Bảng chi phí Đã chốt (đã có giao dịch thanh toán) chưa phát hành phiếu (Kế toán)
      x-fr: [FR-031]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StatementPendingNotice' } } } } } }
  /costs/statements/{statementId}/payment-notice:
    post:
      tags: [payment-notices]
      summary: Kế toán phát hành phiếu báo phí (PDF và Excel) cho một bảng Đã chốt; mỗi bảng tối đa một phiếu
      x-fr: [FR-031, FR-032, FR-037, FR-030]
      x-br: [BR-M11-21, BR-M11-23]
      parameters: [ { name: statementId, in: path, required: true, schema: { type: integer, format: int64 } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '201': { description: Phiếu, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentNotice' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { description: 'ALREADY_ISSUED, STATEMENT_NOT_PAID', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /residents/{residentId}/payment-notices:
    get:
      tags: [payment-notices]
      summary: Phiếu báo phí của hồ sơ (Kế toán, Quản lý viện)
      x-fr: [FR-031]
      parameters: [ { $ref: '#/components/parameters/ResidentId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PaymentNotice' } } } } } }
  /payment-notices/{id}/file:
    get:
      tags: [payment-notices]
      summary: Tải đúng file đã lưu (PDF hoặc XLSX); ghi lần tải
      x-fr: [FR-037]
      x-br: [BR-M11-23]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Format' } ]
      responses:
        '200':
          description: File
          content:
            application/pdf: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/Problem' }

  # ---------------- Xuất ----------------
  /balance-exports/statement:
    post:
      tags: [balance-exports]
      summary: Xuất sao kê số dư (gồm giao dịch tiền cọc) của một hoặc nhiều hồ sơ, Excel hoặc PDF (Kế toán; Quản lý viện xem được)
      x-fr: [FR-025, FR-027]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [residentIds, from, to, format]
              properties:
                residentIds: { type: array, minItems: 1, items: { type: integer, format: int64 } }
                from: { type: string, format: date }
                to: { type: string, format: date }
                format: { $ref: '#/components/schemas/ExportFormat' }
      responses: { '201': { description: Lần xuất, content: { application/json: { schema: { $ref: '#/components/schemas/BalanceExport' } } } }, '422': { description: 'EXPORT_RANGE_EXCEEDED (CFG-M14-01)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } } }
  /balance-exports/income-expense-report:
    post:
      tags: [balance-exports]
      summary: Xuất báo cáo thu chi thu gọn theo khoảng, Excel hoặc PDF (Q-386)
      x-fr: [FR-025, FR-027]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, format]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
                format: { $ref: '#/components/schemas/ExportFormat' }
      responses: { '201': { description: Lần xuất, content: { application/json: { schema: { $ref: '#/components/schemas/BalanceExport' } } } }, '403': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
  /balance-exports/{id}/file:
    get:
      tags: [balance-exports]
      summary: Tải file của một lần xuất (đúng file đã dựng)
      x-fr: [FR-027]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: File, content: { application/octet-stream: { schema: { type: string, format: binary } } } }, '403': { $ref: '#/components/responses/Problem' } }

  # ---------------- Cổng người thân ----------------
  /family-portal/residents/{residentId}/balance:
    get:
      tags: [family-portal]
      summary: Số dư, số dư cọc, giao dịch Đã xác nhận, thông tin nộp tiền (người thân có quyền xem chi phí)
      x-fr: [FR-003]
      parameters: [ { $ref: '#/components/parameters/ResidentId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PortalBalance' } } } }, '403': { $ref: '#/components/responses/Problem' } }
  /family-portal/residents/{residentId}/documents:
    get:
      tags: [family-portal]
      summary: Phiếu báo phí và phiên bản hiện hành của bảng quyết toán (người thân có quyền xem chi phí)
      x-fr: [FR-038]
      parameters: [ { $ref: '#/components/parameters/ResidentId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BalanceDocument' } } } } }, '403': { $ref: '#/components/responses/Problem' } }
  /family-portal/documents/{type}/{id}/file:
    get:
      tags: [family-portal]
      summary: Người thân tải chứng từ (đúng file đã lưu); ghi lần tải
      x-fr: [FR-038, FR-037]
      parameters:
        - { name: type, in: path, required: true, schema: { $ref: '#/components/schemas/DocumentType' } }
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Format' }
      responses:
        '200':
          description: File
          content:
            application/pdf: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/Problem' }
  /family-portal/residents/{residentId}/balance-statement:
    post:
      tags: [family-portal]
      summary: Người thân có quyền xem chi phí xuất sao kê của người cao tuổi (Excel hoặc PDF, khoảng ≤ CFG-M14-01)
      x-fr: [FR-026, FR-027]
      parameters: [ { $ref: '#/components/parameters/ResidentId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, format]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
                format: { $ref: '#/components/schemas/ExportFormat' }
      responses:
        '200':
          description: File sao kê
          content:
            application/pdf: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    session: { type: http, scheme: bearer, description: 'Token phiên opaque của 002 (A-02)' }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    ResidentId: { name: residentId, in: path, required: true, schema: { type: integer, format: int64 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    Format: { name: format, in: query, schema: { type: string, enum: [PDF, XLSX], default: PDF } }
  requestBodies:
    Reason:
      required: true
      content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { $ref: '#/components/schemas/Reason' } } } } }
  responses:
    Problem:
      description: Lỗi theo RFC 9457 (research R-03 của 000)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    BlockingProblem:
      description: 'STATE_CHANGED, NO_LEDGER, INVALID_AMOUNT, BALANCE_EXCEEDED, DEPOSIT_BALANCE_EXCEEDED, REFUND_LIMIT_EXCEEDED, RECIPIENT_NO_LONGER_REPRESENTATIVE, STATEMENT_PAYMENT_NOT_ADJUSTABLE, OFFSET_CONDITIONS_NOT_MET, SETTLEMENT_CONDITIONS_NOT_MET, PENDING_TRANSACTIONS_REMAIN, NOT_FINAL_STATUS, SIGNED_COPY_EXISTS, NOT_CURRENT_VERSION'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Reason: { type: string, minLength: 1, maxLength: 2000 }
    Problem:
      type: object
      description: RFC 9457 cùng errorCode (000 R-03), giống schema Problem của api-004, api-013 (khớp ProblemBody chung). Với 403 có failedLayer, license (002 FR-043).
      required: [type, title, status, errorCode]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errorCode: { type: string }
        unmetConditions: { type: array, items: { type: object, properties: { code: { type: string }, description: { type: string }, basis: { type: string, description: 'Mã BR, CFG hoặc mã nghiệp vụ' }, module: { type: string }, waivable: { type: boolean } } } }
        currentValue: { description: 'Khi 412: tài nguyên hiện hành' }
        candidates: { type: array, description: "POSSIBLE_DUPLICATE_PROFILE, DUPLICATE_HEALTH_ITEM (001)", items: { type: object } }
        failedLayer: { type: string, enum: [ROLE, SCOPE, LEGAL, SOURCE_DATA] }
        license: { type: object, properties: { name: { type: string }, expiryDate: { type: string, format: date } } }
        unlocksAt: { type: string, format: date-time, description: 'Khi 423 ACCOUNT_TEMPORARILY_LOCKED (FR-014)' }
    DuplicateCodeProblem:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          properties:
            duplicateTransactions: { type: array, items: { $ref: '#/components/schemas/BalanceTransaction' } }
    Ledger: { type: string, enum: [BALANCE, DEPOSIT], description: 'Sổ: số dư hoặc sổ cọc' }
    TransactionStatus: { type: string, enum: [PENDING_APPROVAL, CONFIRMED, REJECTED, CANCELLED] }
    ExportFormat: { type: string, enum: [XLSX, PDF] }
    DocumentType: { type: string, enum: [PAYMENT_NOTICE, SETTLEMENT_STATEMENT] }
    StatementType: { type: string, enum: [REGULAR, SUPPLEMENTARY, FINAL_PERIOD], description: 'Loại bảng chi phí của 010 (thường, bổ sung) và bảng kỳ cuối' }
    Bank:
      type: object
      properties:
        bin: { type: string, pattern: '^[0-9]{6}$' }
        shortName: { type: string }
        fullName: { type: string }
    PaymentInstructions:
      type: object
      description: CFG-M11-10 và mã nộp tiền; vietQr là chuỗi payload EMVCo (không số tiền), client vẽ ảnh
      properties:
        bank: { type: string }
        accountNumber: { type: string }
        accountHolder: { type: string }
        paymentCode: { type: string }
        vietQr: { type: string }
    Balance:
      type: object
      properties:
        residentId: { type: integer, format: int64 }
        paymentCode: { type: string }
        balance: { type: integer, format: int64 }
        depositBalance: { type: integer, format: int64 }
        debt: { type: [integer, 'null'], format: int64, description: 'Khi số dư âm (FR-002)' }
        status: { type: string, enum: [NORMAL, RUNNING_LOW, IN_DEBT] }
        daysCovered: { type: [integer, 'null'] }
        unfinalizedTotal: { type: integer, format: int64 }
        depositStatus: { type: string, enum: [NOT_REQUIRED, SATISFIED, NOT_SATISFIED] }
        remindersStopped: { type: boolean }
        paymentInstructions: { $ref: '#/components/schemas/PaymentInstructions' }
        hiddenFields: { type: array, items: { type: string } }
    PortalBalance:
      type: object
      properties:
        balance: { type: integer, format: int64 }
        depositBalance: { type: integer, format: int64 }
        debt: { type: [integer, 'null'], format: int64 }
        transactions: { type: array, items: { $ref: '#/components/schemas/BalanceTransaction' }, description: 'Chỉ Đã xác nhận; thanh toán bảng chỉ hiện tổng (Q-133)' }
        paymentInstructions: { $ref: '#/components/schemas/PaymentInstructions' }
    BalanceTransaction:
      type: object
      properties:
        id: { type: integer, format: int64 }
        ledger: { $ref: '#/components/schemas/Ledger' }
        type: { type: string, enum: [CASH_PAYMENT, BANK_TRANSFER_PAYMENT, STATEMENT_PAYMENT, REFUND, DEPOSIT_OFFSET, ADJUSTMENT, DEPOSIT_RECEIPT, DEPOSIT_REFUND] }
        amount: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        method: { type: string, enum: [CASH, BANK_TRANSFER, INTERNAL, OTHER] }
        bankTransactionCode: { type: [string, 'null'] }
        costStatementId: { type: [integer, 'null'], format: int64 }
        originalTransactionId: { type: [integer, 'null'], format: int64 }
        linkedTransactionId: { type: [integer, 'null'], format: int64 }
        createdBy: { type: string }
        approvedBy: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/TransactionStatus' }
        adjusted: { type: boolean }
        approvalRequestId: { type: [integer, 'null'], format: int64 }
    PendingBalanceTransaction:
      description: 'Giao dịch Chờ duyệt của danh sách chung (bổ sung 2026-11-08, chủ dự án duyệt): thêm người cao tuổi vì danh sách gồm mọi hồ sơ'
      allOf:
        - { $ref: '#/components/schemas/BalanceTransaction' }
        - type: object
          properties:
            residentId: { type: integer, format: int64 }
            residentName: { type: string }
    PaymentResult:
      type: object
      properties:
        transactions: { type: array, items: { $ref: '#/components/schemas/BalanceTransaction' } }
        balance: { $ref: '#/components/schemas/Balance' }
    NewBalanceTransaction:
      type: object
      required: [type, residentId, ledger, amount, reason]
      properties:
        type: { type: string, enum: [REFUND, DEPOSIT_REFUND, ADJUSTMENT] }
        residentId: { type: integer, format: int64 }
        ledger: { $ref: '#/components/schemas/Ledger' }
        amount: { type: integer, format: int64, description: 'Hoàn: số dương (ghi âm vào sổ); điều chỉnh: có dấu, khác 0' }
        originalTransactionId: { type: integer, format: int64, description: 'Điều chỉnh sửa một giao dịch cụ thể (FR-011)' }
        recipient:
          type: object
          description: 'Bắt buộc với hoàn tiền, hoàn cọc (FR-014): người đại diện Hiệu lực; không còn người đại diện thì người nhận khác kèm lý do'
          properties:
            familyMemberId: { type: integer, format: int64 }
            fullName: { type: string }
            identityDocument: { type: string }
        method: { type: string, enum: [CASH, BANK_TRANSFER, OTHER] }
        reason: { $ref: '#/components/schemas/Reason' }
        note: { type: string }
    SettlementCondition:
      type: object
      properties:
        code: { type: string, enum: [END_H_SETTLEMENT, END_H_SETTLEMENT_CONFIRMATION] }
        status: { type: string, enum: [MET, NOT_MET] }
        waivable: { type: boolean }
        reasons: { type: array, items: { type: string } }
    Settlement:
      type: object
      properties:
        conditions: { type: array, items: { $ref: '#/components/schemas/SettlementCondition' } }
        hasException: { type: boolean }
        versions: { type: array, items: { $ref: '#/components/schemas/SettlementStatement' } }
    SettlementStatement:
      type: object
      properties:
        id: { type: integer, format: int64 }
        version: { type: integer }
        current: { type: boolean }
        hasException: { type: boolean }
        debtOrRefundAmount: { type: integer, format: int64 }
        confirmedBy: { type: string }
        confirmedAt: { type: string, format: date-time }
        hasSignedCopy: { type: boolean }
    StatementPendingNotice:
      type: object
      properties:
        costStatementId: { type: integer, format: int64 }
        residentId: { type: integer, format: int64 }
        fullName: { type: string }
        period: { type: string }
        statementType: { $ref: '#/components/schemas/StatementType' }
        total: { type: integer, format: int64 }
        finalizedAt: { type: string, format: date-time }
    PaymentNotice:
      type: object
      properties:
        id: { type: integer, format: int64 }
        noticeCode: { type: string }
        costStatementId: { type: integer, format: int64 }
        period: { type: string }
        statementType: { $ref: '#/components/schemas/StatementType' }
        total: { type: integer, format: int64 }
        balanceBefore: { type: integer, format: int64 }
        balanceAfter: { type: integer, format: int64 }
        issuedBy: { type: string }
        issuedAt: { type: string, format: date-time }
    BalanceDocument:
      type: object
      properties:
        type: { $ref: '#/components/schemas/DocumentType' }
        id: { type: integer, format: int64 }
        code: { type: string, description: 'Mã phiếu hoặc số phiên bản' }
        date: { type: string, format: date }
        period: { type: [string, 'null'] }
        formats: { type: array, items: { type: string, enum: [PDF, XLSX] } }
    BalanceExport:
      type: object
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, enum: [BALANCE_STATEMENT, INCOME_EXPENSE] }
        format: { $ref: '#/components/schemas/ExportFormat' }
        from: { type: string, format: date }
        to: { type: string, format: date }
        rowCount: { type: integer }
        at: { type: string, format: date-time }
