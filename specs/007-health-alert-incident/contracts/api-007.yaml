openapi: 3.1.0
info:
  title: Elder Care – Feature 007 (sức khỏe, cảnh báo, sự cố)
  version: 1.0.0-design
  description: |
    Hợp đồng REST của feature 007 (module M06 – sức khỏe và M05 – sự cố, cảnh báo). Quy ước chung theo research R-03 của 000:
    tiền tố /api/v1, lỗi RFC 9457 có errorCode và unmetConditions[], If-Match cho lệnh sửa danh mục (nhóm 1),
    Idempotency-Key cho mọi lệnh ghi. Lệnh chuyển trạng thái không dùng If-Match; backend khóa dòng và kiểm tra lại (research S-03).
    Lần tiếp nhận thứ hai của một cảnh báo, sự cố trả 409 ALREADY_RECEIVED kèm người và thời điểm.
    Ghi chỉ số ngoại tuyến đi qua endpoint đồng bộ chung của api-002 với loại M06.VITAL_SIGN_RECORD; nội dung giống thân lệnh trực tuyến.
    Ghi sự cố và kích hoạt khẩn cấp bắt buộc trực tuyến (8.6, Q-01): không có loại ngoại tuyến tương ứng.
    Ghi chỉ số từ công việc đo của 005 đi qua VitalSignPort (module-interfaces), không qua REST.
    Đính chính đi qua khung của api-000 với loại M06.VITAL_SIGN_RECORD, M06.EXAMINATION_RECORD, M05.INCIDENT (Hủy ghi nhận, đổi loại),
    M05.INCIDENT_PROGRESSION, M05.WISH_RECONFIRMATION, M05.CHOICE_EXECUTION.
    Khoảng hợp lệ vật lý (CFG-M06-03) đổi qua màn tham số của api-000. Lệnh trạng thái người cao tuổi là endpoint của api-001.
    Trường HEALTH bị bỏ khỏi phản hồi theo 002 và liệt kê trong hiddenFields. Người thân xem sự cố, chỉ số, khám qua cổng 012.
    Truy vết: mỗi operation có x-fr (FR của spec 007) và x-br khi có.
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - { name: catalogs, description: 'FR-001, FR-002, FR-039, FR-042, FR-048a' }
  - { name: measurement-schedules, description: 'UC-33; mục A' }
  - { name: vital-signs, description: 'UC-32; mục B' }
  - { name: thresholds, description: 'UC-33; mục C' }
  - { name: alerts, description: 'UC-34, UC-38; mục D' }
  - { name: incidents, description: 'UC-35; mục F, H' }
  - { name: emergency, description: 'UC-36, UC-16; mục G' }
  - { name: critical-condition, description: 'UC-83, UC-84; mục G1' }
  - { name: infection, description: 'UC-37; mục I' }
  - { name: licenses-examinations, description: 'Mục J' }

paths:
  # ---------------- Danh mục ----------------
  /vital-sign-catalog:
    get:
      tags: [catalogs]
      summary: Danh mục chỉ số, kèm khoảng hợp lệ hiện hành từ CFG-M06-03 và dấu missingValidRange
      x-fr: [FR-001]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VitalSignIndicator' } } } } } }
    post:
      tags: [catalogs]
      summary: Thêm chỉ số (Quản lý viện); khoảng hợp lệ thêm ở CFG-M06-03
      x-fr: [FR-001, FR-002]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VitalSignIndicator' } } } }
      responses: { '201': { description: Đã thêm }, '403': { $ref: '#/components/responses/Problem' } }
  /vital-sign-catalog/{id}:
    put:
      tags: [catalogs]
      summary: Sửa tên, đơn vị, nhóm sinh hiệu (Quản lý viện)
      x-fr: [FR-002]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VitalSignIndicator' } } } }
      responses: { '200': { description: OK }, '412': { $ref: '#/components/responses/Problem' } }
  /vital-sign-catalog/{id}/deactivate:
    post:
      tags: [catalogs]
      summary: Ngừng hiệu lực chỉ số
      x-fr: [FR-002]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { description: OK } }
  /trend-rules:
    get:
      tags: [catalogs]
      summary: Danh mục quy tắc xu hướng
      x-fr: [FR-039]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TrendRule' } } } } } }
  /trend-rules/{code}:
    put:
      tags: [catalogs]
      summary: Bật/tắt, đổi mức (Quản lý viện; lý do bắt buộc)
      x-fr: [FR-039]
      x-br: [BR-M05-04, BR-M15-04]
      parameters: [ { name: code, in: path, required: true, schema: { type: string, enum: [WEIGHT_LOSS, MISSED_MEASUREMENT, PROLONGED_INSOMNIA, MEDICATION_REFUSAL] } }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled, level, reason], properties: { enabled: { type: boolean }, level: { $ref: '#/components/schemas/IncidentLevel' }, reason: { $ref: '#/components/schemas/Reason' } } } } } }
      responses: { '200': { description: OK }, '412': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
  /incident-types:
    get:
      tags: [catalogs]
      summary: Danh mục loại sự cố (mức mặc định, dấu không thuộc sức khỏe)
      x-fr: [FR-042]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/IncidentType' } } } } } }
    post:
      tags: [catalogs]
      summary: Thêm loại sự cố (Quản lý viện)
      x-fr: [FR-042]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IncidentType' } } } }
      responses: { '201': { description: Đã thêm } }
  /incident-types/{id}:
    put:
      tags: [catalogs]
      summary: Sửa loại sự cố, gồm dấu nonHealth (nhật ký trước/sau)
      x-fr: [FR-042]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IncidentType' } } } }
      responses: { '200': { description: OK } }
  /progression-types:
    get:
      tags: [catalogs]
      summary: Danh mục loại diễn biến, có dấu resuscitation
      x-fr: [FR-048a]
      x-br: [BR-M05-20]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProgressionType' } } } } } }
    post:
      tags: [catalogs]
      summary: Thêm loại diễn biến (Quản lý viện)
      x-fr: [FR-048a]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProgressionType' } } } }
      responses: { '201': { description: Đã thêm } }

  # ---------------- Lịch đo ----------------
  /residents/{residentId}/measurement-schedules:
    get:
      tags: [measurement-schedules]
      summary: Lịch đo của người cao tuổi (Bác sĩ, Điều dưỡng, Quản lý viện; Trưởng tầng trong phạm vi)
      x-fr: [FR-003, FR-080]
      parameters: [ { $ref: '#/components/parameters/ResidentId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MeasurementSchedule' } } } } } }
    post:
      tags: [measurement-schedules]
      summary: Tạo lịch đo (Bác sĩ)
      description: 'Hiệu lực nếu bắt đầu không sau thời điểm lệnh, ngược lại Chờ hiệu lực. Là căn cứ LAN_DO để Người phụ trách ca lập công việc; không sinh công việc (Q-306).'
      x-fr: [FR-003, FR-004, FR-006]
      parameters: [ { $ref: '#/components/parameters/ResidentId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NewMeasurementSchedule' } } } }
      responses: { '201': { description: Đã tạo }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' }, '422': { $ref: '#/components/responses/Problem' } }
  /measurement-schedules/{id}/measurement-times:
    get:
      tags: [measurement-schedules]
      summary: Các mốc đo dự kiến trong khoảng (tính, không lưu)
      x-fr: [FR-004]
      parameters: [ { $ref: '#/components/parameters/Id' }, { name: from, in: query, required: true, schema: { type: string, format: date-time } }, { name: to, in: query, required: true, schema: { type: string, format: date-time } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: string, format: date-time } } } } } }
  /measurement-schedules/{id}/change:
    post:
      tags: [measurement-schedules]
      summary: Thay đổi lịch đo (Bác sĩ; lý do bắt buộc)
      description: 'Lịch mới trỏ lịch cũ; lịch cũ Đã ngừng tại thời điểm hiệu lực của lịch mới, cùng một lệnh. 005 báo Người phụ trách ca, Trưởng tầng.'
      x-fr: [FR-005, FR-006]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/NewMeasurementSchedule' }, { type: object, required: [reason], properties: { reason: { $ref: '#/components/schemas/Reason' } } } ] } } } }
      responses: { '201': { description: Lịch mới }, '409': { $ref: '#/components/responses/Blocked' }, '422': { $ref: '#/components/responses/Problem' } }
  /measurement-schedules/{id}/stop:
    post:
      tags: [measurement-schedules]
      summary: Ngừng lịch đo (Bác sĩ; lý do bắt buộc)
      description: 'Công việc đo Chưa đến hạn có căn cứ lịch này bị 005 hủy theo 005 FR-022 (plan điểm báo lại 2).'
      x-fr: [FR-006]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }

  # ---------------- Chỉ số ----------------
  /residents/{residentId}/vital-signs:
    get:
      tags: [vital-signs]
      summary: Lịch sử chỉ số (giá trị hiện hành, giá trị gốc nếu đã đính chính, người đo, ngưỡng áp dụng, kết quả so)
      x-fr: [FR-010, FR-080]
      x-br: [BR-M06-06]
      parameters: [ { $ref: '#/components/parameters/ResidentId' }, { name: indicatorId, in: query, schema: { type: integer, format: int64 } }, { name: from, in: query, schema: { type: string, format: date-time } }, { name: to, in: query, schema: { type: string, format: date-time } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VitalSignRecord' } } } } }, '403': { $ref: '#/components/responses/Problem' } }
    post:
      tags: [vital-signs]
      summary: Ghi chỉ số ngoài lịch (Nhân viên chăm sóc, Điều dưỡng trong phạm vi)
      description: |
        Ngoài khoảng CFG-M06-03: 422 OUT_OF_PHYSICAL_RANGE kèm khoảng (không lưu). Chỉ số chưa có khoảng: 409 VALID_RANGE_MISSING.
        Nguy hiểm không "immediateAction": confirmationStatus = AWAITING_REMEASUREMENT kèm remeasurementDeadline; ngược lại xác nhận ngay.
      x-fr: [FR-010, FR-011, FR-012, FR-013, FR-015]
      x-br: [BR-M06-03, BR-M06-04, BR-M04-12]
      parameters: [ { $ref: '#/components/parameters/ResidentId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecordVitalSign' } } } }
      responses: { '201': { description: Đã lưu, content: { application/json: { schema: { $ref: '#/components/schemas/VitalSignRecord' } } } }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' }, '422': { $ref: '#/components/responses/Problem' } }
  /vital-sign-records/{id}/remeasure:
    post:
      tags: [vital-signs]
      summary: Ghi lần đo lại cho bản ghi "chờ đo lại"
      description: 'Bản ghi đã được xác nhận (đo lại trước đó, hết CFG-M06-04) trả 409 RECORD_NOT_AWAITING_REMEASUREMENT. Lần đo lại không yêu cầu đo lại thêm.'
      x-fr: [FR-016, FR-017, FR-018]
      x-br: [BR-M06-04]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ComponentValues' } } } }
      responses: { '201': { description: Lần đo lại đã xác nhận, content: { application/json: { schema: { $ref: '#/components/schemas/VitalSignRecord' } } } }, '409': { $ref: '#/components/responses/Blocked' }, '422': { $ref: '#/components/responses/Problem' } }
  /vital-signs/missing-personal-threshold:
    get:
      tags: [vital-signs]
      summary: Danh sách người cao tuổi quá CFG-M06-01 chưa có ngưỡng cá nhân (Bác sĩ)
      x-fr: [FR-025]
      x-br: [BR-M06-02]
      responses: { '200': { description: OK } }

  # ---------------- Ngưỡng ----------------
  /thresholds:
    get:
      tags: [thresholds]
      summary: Phiên bản ngưỡng (mặc định hoặc của một người), cả lịch sử
      x-fr: [FR-020, FR-022, FR-080]
      parameters: [ { name: scope, in: query, schema: { type: string, enum: [FACILITY, PERSONAL] } }, { name: residentId, in: query, schema: { type: integer, format: int64 } }, { name: indicatorId, in: query, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ThresholdVersion' } } } } } }
    post:
      tags: [thresholds]
      summary: Thiết lập ngưỡng (Bác sĩ)
      description: 'Kiểm FR-021 (trong khoảng vật lý, thứ tự bốn cận): 422 INVALID_THRESHOLD. Phiên bản Hiệu lực cũ hết hiệu lực tại thời điểm hiệu lực; Chờ hiệu lực cũ Đã hủy. Lý do bắt buộc khi đã có phiên bản trước.'
      x-fr: [FR-020, FR-021, FR-022, FR-023]
      x-br: [BR-M06-01]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NewThresholdVersion' } } } }
      responses: { '201': { description: Đã thiết lập }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' }, '422': { $ref: '#/components/responses/Problem' } }
  /thresholds/{id}/cancel:
    post:
      tags: [thresholds]
      summary: Hủy phiên bản Chờ hiệu lực (Bác sĩ; lý do)
      x-fr: [FR-022]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /thresholds/{id}/stop:
    post:
      tags: [thresholds]
      summary: Ngừng ngưỡng cá nhân Hiệu lực (Bác sĩ; lý do); từ đó so theo ngưỡng mặc định
      x-fr: [FR-022]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }

  # ---------------- Cảnh báo ----------------
  /alerts:
    get:
      tags: [alerts]
      summary: Danh sách cảnh báo theo phạm vi (lọc trạng thái, mức, tầng, người phụ trách, leo thang tối đa)
      x-fr: [FR-027, FR-034, FR-036, FR-080]
      parameters: [ { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/AlertStatus' } } }, { name: floorAreaId, in: query, schema: { type: integer, format: int64 } }, { name: residentId, in: query, schema: { type: integer, format: int64 } }, { name: maxEscalationReached, in: query, schema: { type: boolean } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Alert' } } } } } }
    post:
      tags: [alerts]
      summary: Tạo cảnh báo thủ công (Trưởng tầng, Bác sĩ, Điều dưỡng; mô tả bắt buộc)
      description: 'Có cảnh báo đang mở cùng khóa loại thì gộp (201 với merged = true).'
      x-fr: [FR-026, FR-028, FR-030]
      x-br: [BR-M05-02]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [residentId, incidentTypeId, level, description], properties: { residentId: { type: integer, format: int64 }, incidentTypeId: { type: integer, format: int64 }, level: { $ref: '#/components/schemas/IncidentLevel' }, description: { type: string, maxLength: 4000 } } } } } }
      responses: { '201': { description: Tạo hoặc gộp, content: { application/json: { schema: { $ref: '#/components/schemas/Alert' } } } }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }
  /alerts/{id}:
    get:
      tags: [alerts]
      summary: Chi tiết cảnh báo, nguồn, lịch sử, lần nhắc, allowedCommands[]
      x-fr: [FR-027, FR-033]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Alert' } } } } }
  /alerts/{id}/receive:
    post:
      tags: [alerts]
      summary: Tiếp nhận
      description: 'Điều dưỡng, Trưởng tầng trong phạm vi, Bác sĩ, Người phụ trách ca theo nhiệm vụ; Quản lý viện chỉ khi Leo thang cấp 2 (Q-71). Đã có người tiếp nhận: 409 ALREADY_RECEIVED. Gọi được từ "Xác nhận và tiếp nhận" của 009 (FR-026a của 009).'
      x-fr: [FR-029, FR-036]
      x-br: [BR-M05-01]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/AlreadyReceived' } }
  /alerts/{id}/assign:
    post:
      tags: [alerts]
      summary: Giao người phụ trách (Quản lý viện khi là người phụ trách; ghi chú bắt buộc)
      x-fr: [FR-029, FR-031, FR-036]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [staffId, note], properties: { staffId: { type: integer, format: int64 }, note: { type: string, minLength: 1 } } } } } }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }
  /alerts/{id}/start-handling:
    post:
      tags: [alerts]
      summary: Bắt đầu xử lý
      x-fr: [FR-029, FR-036]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }
  /alerts/{id}/change-level:
    post:
      tags: [alerts]
      summary: Nâng / hạ mức (lý do bắt buộc; hạ từ Khẩn cấp chỉ Bác sĩ)
      x-fr: [FR-029, FR-038a]
      x-br: [BR-M05-03]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [newLevel, reason], properties: { newLevel: { $ref: '#/components/schemas/IncidentLevel' }, reason: { $ref: '#/components/schemas/Reason' } } } } } }
