      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NguoiTiepXuc' } } } }
      responses: { '201': { description: OK }, '409': { $ref: '#/components/responses/LoiChan' }, '422': { $ref: '#/components/responses/Loi' } }
  /danh-sach-tiep-xuc/{id}/nguoi/{nguoiId}/bo:
    post:
      tags: [lay-nhiem]
      summary: Bỏ người khỏi danh sách Nháp
      x-fr: [FR-061]
      parameters: [ { $ref: '#/components/parameters/Id' }, { name: nguoiId, in: path, required: true, schema: { type: integer, format: int64 } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: OK } }
  /danh-sach-tiep-xuc/{id}/nguoi/{nguoiId}/loai:
    post:
      tags: [lay-nhiem]
      summary: Loại người khỏi danh sách Đã xác nhận (lý do); gỡ dấu tiếp xúc, công việc đo nhiệt độ Chưa đến hạn bị 005 hủy
      x-fr: [FR-061]
      parameters: [ { $ref: '#/components/parameters/Id' }, { name: nguoiId, in: path, required: true, schema: { type: integer, format: int64 } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: OK } }
  /danh-sach-tiep-xuc/{id}/xac-nhan:
    post:
      tags: [lay-nhiem]
      summary: Xác nhận danh sách (≥ 1 người, hoặc khongCoNguoiTiepXuc kèm lý do)
      x-fr: [FR-061, FR-062]
      x-br: [BR-M05-11]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { khongCoNguoiTiepXuc: { type: boolean }, lyDo: { $ref: '#/components/schemas/LyDo' } } } } } }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Loi' }, '409': { $ref: '#/components/responses/LoiChan' } }
  /su-co/{id}/nguoi-than-can-lien-he:
    get:
      tags: [lay-nhiem]
      summary: Người thân cần liên hệ trực tiếp (Hành chính; chỉ họ tên, quan hệ, số điện thoại, nội dung cần báo)
      x-fr: [FR-062]
      x-br: [BR-M05-24]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK } }
  /khoanh-vung:
    get:
      tags: [lay-nhiem]
      summary: Vùng đang khoanh và lịch sử (Bác sĩ, Quản lý viện, Trưởng tầng, Điều dưỡng, Hành chính)
      x-fr: [FR-064, FR-080]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/KhoanhVung' } } } } } }
    post:
      tags: [lay-nhiem]
      summary: Khoanh vùng (Bác sĩ, Quản lý viện; tầng hoặc một khu vực; lý do; gắn ≥ 1 sự cố lây nhiễm chưa đóng)
      x-fr: [FR-063, FR-064, FR-065]
      x-br: [BR-M05-11]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/KhoanhVungMoi' } } } }
      responses: { '201': { description: OK }, '403': { $ref: '#/components/responses/Loi' }, '409': { $ref: '#/components/responses/LoiChan' }, '422': { $ref: '#/components/responses/Loi' } }
  /khoanh-vung/{id}/gan-su-co:
    post:
      tags: [lay-nhiem]
      summary: Gắn thêm sự cố lây nhiễm chưa đóng vào vùng
      x-fr: [FR-066]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [suCoId], properties: { suCoId: { type: integer, format: int64 } } } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/LoiChan' } }
  /khoanh-vung/{id}/go:
    post:
      tags: [lay-nhiem]
      summary: Gỡ khoanh vùng (Bác sĩ, Quản lý viện; lý do)
      x-fr: [FR-064]
      x-br: [BR-M05-12]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Loi' } }

  # ---------------- Giấy phép cơ sở, khám ----------------
  /giay-phep-co-so:
    get:
      tags: [giay-phep-kham]
      summary: Giấy phép cơ sở và lịch sử (Quản lý viện, Bác sĩ)
      x-fr: [FR-070, FR-075]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/GiayPhepCoSo' } } } } } }
    post:
      tags: [giay-phep-kham]
      summary: Lưu giấy phép mới (gia hạn, đổi phạm vi, sửa sai thay thế bản cũ; Quản lý viện)
      x-fr: [FR-070, FR-071, FR-075]
      x-br: [BR-M06-05]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GiayPhepCoSo' } } } }
      responses: { '201': { description: OK }, '403': { $ref: '#/components/responses/Loi' }, '422': { $ref: '#/components/responses/Loi' } }
  /so-lien-he-vien:
    get:
      tags: [giay-phep-kham]
      summary: Số liên hệ của viện
      x-fr: [FR-070]
      responses: { '200': { description: OK } }
    put:
      tags: [giay-phep-kham]
      summary: Đổi số liên hệ của viện (Quản lý viện; nhật ký)
      x-fr: [FR-070]
      x-br: [BR-M05-24]
      parameters: [ { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [soDienThoai], properties: { soDienThoai: { type: string }, ghiChu: { type: string } } } } } }
      responses: { '200': { description: OK }, '412': { $ref: '#/components/responses/Loi' } }
  /nguoi-cao-tuoi/{nctId}/kham-dieu-tri:
    get:
      tags: [giay-phep-kham]
      summary: Bản ghi khám và điều trị
      x-fr: [FR-072, FR-080]
      parameters: [ { $ref: '#/components/parameters/NctId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BanGhiKham' } } } } } }
    post:
      tags: [giay-phep-kham]
      summary: Ghi khám, đánh giá, chẩn đoán, chỉ định, điều trị, kết quả
      description: 'Chẩn đoán, chỉ định, điều trị tại viện: 403 DIEU_KIEN_PHAP_LY khi cơ sở hoặc bác sĩ thiếu giấy phép đúng phạm vi còn hiệu lực (FR-073). Điều dưỡng: cơ sở ngoài hoặc khám, kết quả tại viện với người thực hiện là Bác sĩ (CHK019).'
      x-fr: [FR-072, FR-073]
      x-br: [BR-M06-05]
      parameters: [ { $ref: '#/components/parameters/NctId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BanGhiKham' } } } }
      responses: { '201': { description: OK }, '403': { $ref: '#/components/responses/Loi' }, '422': { $ref: '#/components/responses/Loi' } }

  # ---------------- Nút SOS (bổ sung 2026-10-18, Q-369) ----------------
  /sos:
    post:
      tags: [canh-bao, khan-cap]
      summary: Người cao tuổi bấm nút SOS; tạo hoặc gộp cảnh báo Khẩn cấp
      description: |
        Không cần phiên đăng nhập; xác định người cao tuổi bằng token thiết bị (research S-23).
        Từ chối khi Tạm vắng, Điều trị tại bệnh viện, trạng thái cuối, hoặc người bán trú không Có mặt; lỗi kèm lienHe.
      x-fr: [FR-026, FR-047d, FR-047e]
      x-br: [BR-M05-27]
      security: [ { tokenThietBi: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '201': { description: Đã gửi, content: { application/json: { schema: { $ref: '#/components/schemas/TrangThaiSos' } } } }
        '401': { description: 'THIET_BI_KHONG_HOP_LE', content: { application/problem+json: { schema: { $ref: '#/components/schemas/LoiSos' } } } }
        '409': { description: 'KHONG_O_VIEN, KHONG_CO_MAT', content: { application/problem+json: { schema: { $ref: '#/components/schemas/LoiSos' } } } }
  /sos/hien-tai:
    get:
      tags: [canh-bao]
      summary: Trạng thái cảnh báo SOS đang mở gần nhất của người cao tuổi
      x-fr: [FR-047f]
      security: [ { tokenThietBi: [] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TrangThaiSos' } } } }
        '204': { description: Không có cảnh báo SOS đang mở }
  /sos/{id}/noi-dang-o:
    post:
      tags: [canh-bao]
      summary: Người cao tuổi chọn nhanh nơi đang ở sau khi bấm (một lần)
      x-fr: [FR-047f]
      security: [ { tokenThietBi: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [noi], properties: { noi: { type: string, enum: [PHONG, NHA_VE_SINH, SAN, KHAC] } } } } }
      responses: { '204': { description: Đã ghi }, '409': { $ref: '#/components/responses/Loi' } }

components:
  securitySchemes:
    phien: { type: http, scheme: bearer, description: 'Token phiên opaque của 002 (A-02)' }
    tokenThietBi: { type: apiKey, in: header, name: X-Token-Thiet-Bi, description: 'Token thiết bị của người cao tuổi (002 research A-15); chỉ dùng cho /sos' }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    NctId: { name: nctId, in: path, required: true, schema: { type: integer, format: int64 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  requestBodies:
    LyDo:
      required: true
      content: { application/json: { schema: { type: object, required: [lyDo], properties: { lyDo: { $ref: '#/components/schemas/LyDo' } } } } }
  responses:
    Loi:
      description: Lỗi theo RFC 9457 (research R-03 của 000)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } }
    LoiChan:
      description: 'DIEU_KIEN_CHUA_THOA, CHUYEN_KHONG_HOP_LE, CHUA_CO_KHOANG_HOP_LE, DA_XAC_NHAN_KHONG_DO_LAI, DA_CO_SU_CO_KHAN_CAP_MO, CHUA_DOI_CHIEU_NGUYEN_VONG, CON_VUNG_KHOANH_CHI_GAN_SU_CO, DA_CO_DAU_NGUY_KICH, DANG_CO_BAC_SI_TRUC, CHUA_XAC_NHAN_LAI, CHUA_CO_LUA_CHON, CHUA_DU_DIEN_BIEN, NGUOI_CAO_TUOI_TRANG_THAI_CUOI…'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } }
    LoiTiepNhan:
      description: 'DA_CO_NGUOI_TIEP_NHAN: kèm người và thời điểm tiếp nhận'
      content: { application/problem+json: { schema: { allOf: [ { $ref: '#/components/schemas/Loi' }, { type: object, properties: { tiepNhanBoi: { type: string }, tiepNhanLuc: { type: string, format: date-time } } } ] } } }
  schemas:
    TrangThaiSos:
      type: object
      description: Bổ sung 2026-10-18 (FR-047f)
      properties:
        lanBamId: { type: integer, format: int64 }
        canhBaoId: { type: integer, format: int64 }
        trangThai: { type: string, enum: [DA_GUI, DA_TIEP_NHAN] }
        nguoiTiepNhan: { type: string, description: Họ tên người đã tiếp nhận }
        lienHe: { $ref: '#/components/schemas/LienHeKhiKhongGuiDuoc' }
    LienHeKhiKhongGuiDuoc:
      type: object
      properties:
        soLienHeVien: { type: string }
        soCapCuu: { type: string, const: '115' }
    LoiSos:
      type: object
      description: Lỗi RFC 9457 kèm số liên hệ để app hiện (012 FR-085)
      properties:
        maLoi: { type: string }
        detail: { type: string }
        lienHe: { $ref: '#/components/schemas/LienHeKhiKhongGuiDuoc' }
    LyDo: { type: string, minLength: 1, maxLength: 2000 }
    Muc: { type: string, enum: [NHE, TRUNG_BINH, KHAN_CAP] }
    TrangThaiCanhBao: { type: string, enum: [MOI, LEO_THANG, DA_TIEP_NHAN, DANG_XU_LY, DA_DONG, CHUYEN_SU_CO] }
    TrangThaiSuCo: { type: string, enum: [MOI, DANG_XU_LY, DANG_THEO_DOI, DA_DONG, DA_HUY] }
    Loi:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        maLoi: { type: string }
        dieuKienChuaThoa: { type: array, items: { type: object, properties: { ma: { type: string }, moTa: { type: string }, canCu: { type: string } } } }
        khoangHopLe: { type: object, description: 'NGOAI_KHOANG_VAT_LY: { maThanhPhan: { min, max } }' }
        suCoDangMo: { type: integer, format: int64, description: 'DA_CO_SU_CO_KHAN_CAP_MO' }
        nguyenVong: { type: object, description: 'CHUA_DOI_CHIEU_NGUYEN_VONG' }
    ChiSo:
      type: object
      required: [ma, ten, donVi, thanhPhan]
      properties:
        id: { type: integer, format: int64 }
        ma: { type: string }
        ten: { type: string }
        donVi: { type: string }
        sinhHieu: { type: boolean }
        thanhPhan: { type: array, minItems: 1, items: { type: object, properties: { ma: { type: string }, ten: { type: string }, soChuSoThapPhan: { type: integer } } } }
        khoangHopLe: { type: object, readOnly: true, description: 'Từ CFG-M06-03' }
        chuaCoKhoangHopLe: { type: boolean, readOnly: true }
        hieuLuc: { type: boolean }
    QuyTacXuHuong:
      type: object
      properties: { ma: { type: string }, ten: { type: string }, bat: { type: boolean }, muc: { $ref: '#/components/schemas/Muc' }, maThamSo: { type: string } }
    LoaiSuCo:
      type: object
      required: [ma, ten, mucMacDinh]
      properties: { id: { type: integer, format: int64 }, ma: { type: string }, ten: { type: string }, mucMacDinh: { $ref: '#/components/schemas/Muc' }, khongThuocSucKhoe: { type: boolean }, choPhepKhongNct: { type: boolean, readOnly: true }, hieuLuc: { type: boolean } }
    LoaiDienBien:
      type: object
      properties: { id: { type: integer, format: int64 }, ma: { type: string }, ten: { type: string }, nhom: { type: string, enum: [DANH_GIA, HANH_DONG, THONG_BAO, THEO_DOI, HE_THONG] }, bienPhapHoiSuc: { type: boolean } }
    LichDoMoi:
      type: object
      required: [chiSoIds, tanSuat, batDau]
      properties:
        chiSoIds: { type: array, minItems: 1, items: { type: integer, format: int64 } }
        tanSuat:
          type: object
          required: [kieu]
          properties:
            kieu: { type: string, enum: [MOC_GIO, MOI_N_GIO, THEO_THU] }
            cacMoc: { type: array, items: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' } }
            nGio: { type: integer, minimum: 1 }
            mocGoc: { type: string, format: date-time }
            thu: { type: array, items: { type: integer, minimum: 1, maximum: 7 } }
        batDau: { type: string, format: date-time }
        ketThuc: { type: string, format: date-time }
        mucQuanTrong: { type: string, enum: [THUONG, QUAN_TRONG, BAT_BUOC], default: BAT_BUOC }
        ghiChu: { type: string }
    LichDo:
      allOf:
        - $ref: '#/components/schemas/LichDoMoi'
        - type: object
          properties: { id: { type: integer, format: int64 }, trangThai: { type: string, enum: [CHO_HIEU_LUC, HIEU_LUC, DA_NGUNG, HET_HAN] }, thayTheCho: { type: integer, format: int64 }, ngungLuc: { type: string, format: date-time }, lyDoNgung: { type: string } }
    GiaTriThanhPhan:
      type: object
      required: [giaTri]
      properties:
        giaTri: { type: object, additionalProperties: { type: number }, description: '{ maThanhPhan: giá trị }' }
        thoiDiemDo: { type: string, format: date-time }
        ghiChu: { type: string }
    GhiChiSo:
      allOf:
        - $ref: '#/components/schemas/GiaTriThanhPhan'
        - type: object
          required: [chiSoId]
          properties: { chiSoId: { type: integer, format: int64 }, xuLyNgay: { type: boolean, default: false } }
    BanGhiChiSo:
      type: object
      properties:
        id: { type: integer, format: int64 }
        chiSoId: { type: integer, format: int64 }
        giaTri: { type: object, additionalProperties: { type: number } }
        giaTriGoc: { type: object, additionalProperties: { type: number }, description: 'Có khi đã đính chính' }
        thoiDiemDo: { type: string, format: date-time }
        nguoiDo: { type: string }
        nguong: { type: object, properties: { phienBanId: { type: integer, format: int64 }, phamVi: { type: string, enum: [CO_SO, CA_NHAN] } } }
        muc: { type: string, enum: [BINH_THUONG, CANH_BAO, NGUY_HIEM, CHUA_CO_NGUONG] }
        trangThaiXacNhan: { type: string, enum: [CHO_DO_LAI, DA_XAC_NHAN, DA_DO_LAI] }
        hanDoLai: { type: string, format: date-time }
        nhan: { type: array, items: { type: string, enum: [XU_LY_NGAY, CHUA_DO_LAI, GHI_NHAN_MUON, GHI_NGOAI_TUYEN] } }
        doLaiCho: { type: integer, format: int64 }
        truongBiAn: { type: array, items: { type: string } }
    PhienBanNguongMoi:
      type: object
      required: [phamVi, chiSoId, hieuLucTu, thanhPhan]
      properties:
        phamVi: { type: string, enum: [CO_SO, CA_NHAN] }
        nctId: { type: integer, format: int64 }
        chiSoId: { type: integer, format: int64 }
        hieuLucTu: { type: string, format: date-time }
        lyDo: { $ref: '#/components/schemas/LyDo' }
        thanhPhan:
          type: array
          items: { type: object, required: [ma], properties: { ma: { type: string }, duoiNguyHiem: { type: number }, duoiCanhBao: { type: number }, trenCanhBao: { type: number }, trenNguyHiem: { type: number } } }
    PhienBanNguong:
      allOf:
        - $ref: '#/components/schemas/PhienBanNguongMoi'
        - type: object
          properties: { id: { type: integer, format: int64 }, trangThai: { type: string, enum: [CHO_HIEU_LUC, HIEU_LUC, HET_HIEU_LUC, DA_HUY] }, hieuLucDen: { type: string, format: date-time }, nguoiThietLap: { type: string } }
    CanhBao:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nctId: { type: integer, format: int64 }
        loai: { type: string }
        khoaLoai: { type: string }
        muc: { $ref: '#/components/schemas/Muc' }
        soLan: { type: integer }
        lanDauLuc: { type: string, format: date-time }
        ganNhatLuc: { type: string, format: date-time }
        trangThai: { $ref: '#/components/schemas/TrangThaiCanhBao' }
        capLeoThang: { type: integer }
        leoThangToiDa: { type: boolean }
        hanTiepNhan: { type: string, format: date-time }
        nguoiPhuTrach: { type: string }
        tamNhanBanGiao: { type: boolean }
        khongCoBacSiTruc: { type: boolean }
        suCoId: { type: integer, format: int64 }
        gop: { type: boolean, readOnly: true }
        nguon: { type: array, items: { type: object, properties: { loaiNguon: { type: string }, nguonId: { type: integer, format: int64 }, muc: { $ref: '#/components/schemas/Muc' }, thoiDiem: { type: string, format: date-time }, daXuLyLuc: { type: string, format: date-time } } } }
        lenhDuocPhep: { type: array, items: { type: string } }
    SuCoTuCanhBao:
      type: object
      properties: { loaiSuCoId: { type: integer, format: int64 }, moTa: { type: string }, xuLyBanDau: { type: string } }
    GhiNhanSuCo:
      type: object
      required: [loaiSuCoId, phatHienLuc, moTa, muc]
      properties:
        nctId: { type: integer, format: int64, description: 'Trống chỉ với loại CO_SO_VAT_CHAT' }
        loaiSuCoId: { type: integer, format: int64 }
        nguonPhatSinh: { type: string, enum: [CHAM_SOC, AN_UONG, THUOC, VAN_DONG, HOAT_DONG, DI_LAI, DIEU_TRI, HOAT_DONG_NGOAI_VIEN, PHUC_VU_SAI_SUAT_AN, DO_GUI] }
        xayRaLuc: { type: string, format: date-time }
        phatHienLuc: { type: string, format: date-time }
