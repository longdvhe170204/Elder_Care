openapi: 3.1.0
info:
  title: Elder Care – Feature 007 (sức khỏe, cảnh báo, sự cố)
  version: 1.0.0-design
  description: |
    Hợp đồng REST của feature 007 (module M06 – sức khỏe và M05 – sự cố, cảnh báo). Quy ước chung theo research R-03 của 000:
    tiền tố /api/v1, lỗi RFC 9457 có maLoi và dieuKienChuaThoa[], If-Match cho lệnh sửa danh mục (nhóm 1),
    Idempotency-Key cho mọi lệnh ghi. Lệnh chuyển trạng thái không dùng If-Match; backend khóa dòng và kiểm tra lại (research S-03).
    Lần tiếp nhận thứ hai của một cảnh báo, sự cố trả 409 DA_CO_NGUOI_TIEP_NHAN kèm người và thời điểm.
    Ghi chỉ số ngoại tuyến đi qua endpoint đồng bộ chung của api-002 với loại M06.BAN_GHI_CHI_SO; nội dung giống thân lệnh trực tuyến.
    Ghi sự cố và kích hoạt khẩn cấp bắt buộc trực tuyến (8.6, Q-01): không có loại ngoại tuyến tương ứng.
    Ghi chỉ số từ công việc đo của 005 đi qua ChiSoPort (module-interfaces), không qua REST.
    Đính chính đi qua khung của api-000 với loại M06.BAN_GHI_CHI_SO, M06.BAN_GHI_KHAM, M05.SU_CO (Hủy ghi nhận, đổi loại),
    M05.DIEN_BIEN_SU_CO, M05.KET_QUA_XAC_NHAN_LAI, M05.LUA_CHON_THUC_HIEN.
    Khoảng hợp lệ vật lý (CFG-M06-03) đổi qua màn tham số của api-000. Lệnh trạng thái người cao tuổi là endpoint của api-001.
    Trường SUC_KHOE bị bỏ khỏi phản hồi theo 002 và liệt kê trong truongBiAn. Người thân xem sự cố, chỉ số, khám qua cổng 012.
    Truy vết: mỗi operation có x-fr (FR của spec 007) và x-br khi có.
servers:
  - url: /api/v1
security:
  - phien: []
tags:
  - { name: danh-muc, description: 'FR-001, FR-002, FR-039, FR-042, FR-048a' }
  - { name: lich-do, description: 'UC-33; mục A' }
  - { name: chi-so, description: 'UC-32; mục B' }
  - { name: nguong, description: 'UC-33; mục C' }
  - { name: canh-bao, description: 'UC-34, UC-38; mục D' }
  - { name: su-co, description: 'UC-35; mục F, H' }
  - { name: khan-cap, description: 'UC-36, UC-16; mục G' }
  - { name: nguy-kich, description: 'UC-83, UC-84; mục G1' }
  - { name: lay-nhiem, description: 'UC-37; mục I' }
  - { name: giay-phep-kham, description: 'Mục J' }

paths:
  # ---------------- Danh mục ----------------
  /chi-so-danh-muc:
    get:
      tags: [danh-muc]
      summary: Danh mục chỉ số, kèm khoảng hợp lệ hiện hành từ CFG-M06-03 và dấu chuaCoKhoangHopLe
      x-fr: [FR-001]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ChiSo' } } } } } }
    post:
      tags: [danh-muc]
      summary: Thêm chỉ số (Quản lý viện); khoảng hợp lệ thêm ở CFG-M06-03
      x-fr: [FR-001, FR-002]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChiSo' } } } }
      responses: { '201': { description: Đã thêm }, '403': { $ref: '#/components/responses/Loi' } }
  /chi-so-danh-muc/{id}:
    put:
      tags: [danh-muc]
      summary: Sửa tên, đơn vị, nhóm sinh hiệu (Quản lý viện)
      x-fr: [FR-002]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChiSo' } } } }
      responses: { '200': { description: OK }, '412': { $ref: '#/components/responses/Loi' } }
  /chi-so-danh-muc/{id}/ngung-hieu-luc:
    post:
      tags: [danh-muc]
      summary: Ngừng hiệu lực chỉ số
      x-fr: [FR-002]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: OK } }
  /quy-tac-xu-huong:
    get:
      tags: [danh-muc]
      summary: Danh mục quy tắc xu hướng
      x-fr: [FR-039]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/QuyTacXuHuong' } } } } } }
  /quy-tac-xu-huong/{ma}:
    put:
      tags: [danh-muc]
      summary: Bật/tắt, đổi mức (Quản lý viện; lý do bắt buộc)
      x-fr: [FR-039]
      x-br: [BR-M05-04, BR-M15-04]
      parameters: [ { name: ma, in: path, required: true, schema: { type: string, enum: [SUT_CAN, BO_LO_LAN_DO, MAT_NGU_KEO_DAI, TU_CHOI_THUOC] } }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [bat, muc, lyDo], properties: { bat: { type: boolean }, muc: { $ref: '#/components/schemas/Muc' }, lyDo: { $ref: '#/components/schemas/LyDo' } } } } } }
      responses: { '200': { description: OK }, '412': { $ref: '#/components/responses/Loi' }, '422': { $ref: '#/components/responses/Loi' } }
  /loai-su-co:
    get:
      tags: [danh-muc]
      summary: Danh mục loại sự cố (mức mặc định, dấu không thuộc sức khỏe)
      x-fr: [FR-042]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LoaiSuCo' } } } } } }
    post:
      tags: [danh-muc]
      summary: Thêm loại sự cố (Quản lý viện)
      x-fr: [FR-042]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoaiSuCo' } } } }
      responses: { '201': { description: Đã thêm } }
  /loai-su-co/{id}:
    put:
      tags: [danh-muc]
      summary: Sửa loại sự cố, gồm dấu khongThuocSucKhoe (nhật ký trước/sau)
      x-fr: [FR-042]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoaiSuCo' } } } }
      responses: { '200': { description: OK } }
  /loai-dien-bien:
    get:
      tags: [danh-muc]
      summary: Danh mục loại diễn biến, có dấu bienPhapHoiSuc
      x-fr: [FR-048a]
      x-br: [BR-M05-20]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LoaiDienBien' } } } } } }
    post:
      tags: [danh-muc]
      summary: Thêm loại diễn biến (Quản lý viện)
      x-fr: [FR-048a]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoaiDienBien' } } } }
      responses: { '201': { description: Đã thêm } }

  # ---------------- Lịch đo ----------------
  /nguoi-cao-tuoi/{nctId}/lich-do:
    get:
      tags: [lich-do]
      summary: Lịch đo của người cao tuổi (Bác sĩ, Điều dưỡng, Quản lý viện; Trưởng tầng trong phạm vi)
      x-fr: [FR-003, FR-080]
      parameters: [ { $ref: '#/components/parameters/NctId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LichDo' } } } } } }
    post:
      tags: [lich-do]
      summary: Tạo lịch đo (Bác sĩ)
      description: 'Hiệu lực nếu bắt đầu không sau thời điểm lệnh, ngược lại Chờ hiệu lực. Là căn cứ LAN_DO để Người phụ trách ca lập công việc; không sinh công việc (Q-306).'
      x-fr: [FR-003, FR-004, FR-006]
      parameters: [ { $ref: '#/components/parameters/NctId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LichDoMoi' } } } }
      responses: { '201': { description: Đã tạo }, '403': { $ref: '#/components/responses/Loi' }, '409': { $ref: '#/components/responses/LoiChan' }, '422': { $ref: '#/components/responses/Loi' } }
  /lich-do/{id}/moc-do:
    get:
      tags: [lich-do]
      summary: Các mốc đo dự kiến trong khoảng (tính, không lưu)
      x-fr: [FR-004]
      parameters: [ { $ref: '#/components/parameters/Id' }, { name: tu, in: query, required: true, schema: { type: string, format: date-time } }, { name: den, in: query, required: true, schema: { type: string, format: date-time } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: string, format: date-time } } } } } }
  /lich-do/{id}/thay-doi:
    post:
      tags: [lich-do]
      summary: Thay đổi lịch đo (Bác sĩ; lý do bắt buộc)
      description: 'Lịch mới trỏ lịch cũ; lịch cũ Đã ngừng tại thời điểm hiệu lực của lịch mới, cùng một lệnh. 005 báo Người phụ trách ca, Trưởng tầng.'
      x-fr: [FR-005, FR-006]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/LichDoMoi' }, { type: object, required: [lyDo], properties: { lyDo: { $ref: '#/components/schemas/LyDo' } } } ] } } } }
      responses: { '201': { description: Lịch mới }, '409': { $ref: '#/components/responses/LoiChan' }, '422': { $ref: '#/components/responses/Loi' } }
  /lich-do/{id}/ngung:
    post:
      tags: [lich-do]
      summary: Ngừng lịch đo (Bác sĩ; lý do bắt buộc)
      description: 'Công việc đo Chưa đến hạn có căn cứ lịch này bị 005 hủy theo 005 FR-022 (plan điểm báo lại 2).'
      x-fr: [FR-006]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/LoiChan' } }

  # ---------------- Chỉ số ----------------
  /nguoi-cao-tuoi/{nctId}/chi-so:
    get:
      tags: [chi-so]
      summary: Lịch sử chỉ số (giá trị hiện hành, giá trị gốc nếu đã đính chính, người đo, ngưỡng áp dụng, kết quả so)
      x-fr: [FR-010, FR-080]
      x-br: [BR-M06-06]
      parameters: [ { $ref: '#/components/parameters/NctId' }, { name: chiSoId, in: query, schema: { type: integer, format: int64 } }, { name: tu, in: query, schema: { type: string, format: date-time } }, { name: den, in: query, schema: { type: string, format: date-time } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BanGhiChiSo' } } } } }, '403': { $ref: '#/components/responses/Loi' } }
    post:
      tags: [chi-so]
      summary: Ghi chỉ số ngoài lịch (Nhân viên chăm sóc, Điều dưỡng trong phạm vi)
      description: |
        Ngoài khoảng CFG-M06-03: 422 NGOAI_KHOANG_VAT_LY kèm khoảng (không lưu). Chỉ số chưa có khoảng: 409 CHUA_CO_KHOANG_HOP_LE.
        Nguy hiểm không "xuLyNgay": trangThaiXacNhan = CHO_DO_LAI kèm hanDoLai; ngược lại xác nhận ngay.
      x-fr: [FR-010, FR-011, FR-012, FR-013, FR-015]
      x-br: [BR-M06-03, BR-M06-04, BR-M04-12]
      parameters: [ { $ref: '#/components/parameters/NctId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GhiChiSo' } } } }
      responses: { '201': { description: Đã lưu, content: { application/json: { schema: { $ref: '#/components/schemas/BanGhiChiSo' } } } }, '403': { $ref: '#/components/responses/Loi' }, '409': { $ref: '#/components/responses/LoiChan' }, '422': { $ref: '#/components/responses/Loi' } }
  /ban-ghi-chi-so/{id}/do-lai:
    post:
      tags: [chi-so]
      summary: Ghi lần đo lại cho bản ghi "chờ đo lại"
      description: 'Bản ghi đã được xác nhận (đo lại trước đó, hết CFG-M06-04) trả 409 DA_XAC_NHAN_KHONG_DO_LAI. Lần đo lại không yêu cầu đo lại thêm.'
      x-fr: [FR-016, FR-017, FR-018]
      x-br: [BR-M06-04]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GiaTriThanhPhan' } } } }
      responses: { '201': { description: Lần đo lại đã xác nhận, content: { application/json: { schema: { $ref: '#/components/schemas/BanGhiChiSo' } } } }, '409': { $ref: '#/components/responses/LoiChan' }, '422': { $ref: '#/components/responses/Loi' } }
  /chi-so/chua-co-nguong-ca-nhan:
    get:
      tags: [chi-so]
      summary: Danh sách người cao tuổi quá CFG-M06-01 chưa có ngưỡng cá nhân (Bác sĩ)
      x-fr: [FR-025]
      x-br: [BR-M06-02]
      responses: { '200': { description: OK } }

  # ---------------- Ngưỡng ----------------
  /nguong:
    get:
      tags: [nguong]
      summary: Phiên bản ngưỡng (mặc định hoặc của một người), cả lịch sử
      x-fr: [FR-020, FR-022, FR-080]
      parameters: [ { name: phamVi, in: query, schema: { type: string, enum: [CO_SO, CA_NHAN] } }, { name: nctId, in: query, schema: { type: integer, format: int64 } }, { name: chiSoId, in: query, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PhienBanNguong' } } } } } }
    post:
      tags: [nguong]
      summary: Thiết lập ngưỡng (Bác sĩ)
      description: 'Kiểm FR-021 (trong khoảng vật lý, thứ tự bốn cận): 422 NGUONG_KHONG_HOP_LE. Phiên bản Hiệu lực cũ hết hiệu lực tại thời điểm hiệu lực; Chờ hiệu lực cũ Đã hủy. Lý do bắt buộc khi đã có phiên bản trước.'
      x-fr: [FR-020, FR-021, FR-022, FR-023]
      x-br: [BR-M06-01]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PhienBanNguongMoi' } } } }
      responses: { '201': { description: Đã thiết lập }, '403': { $ref: '#/components/responses/Loi' }, '409': { $ref: '#/components/responses/LoiChan' }, '422': { $ref: '#/components/responses/Loi' } }
  /nguong/{id}/huy:
    post:
      tags: [nguong]
      summary: Hủy phiên bản Chờ hiệu lực (Bác sĩ; lý do)
      x-fr: [FR-022]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/LoiChan' } }
  /nguong/{id}/ngung:
    post:
      tags: [nguong]
      summary: Ngừng ngưỡng cá nhân Hiệu lực (Bác sĩ; lý do); từ đó so theo ngưỡng mặc định
      x-fr: [FR-022]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/LoiChan' } }

  # ---------------- Cảnh báo ----------------
  /canh-bao:
    get:
      tags: [canh-bao]
      summary: Danh sách cảnh báo theo phạm vi (lọc trạng thái, mức, tầng, người phụ trách, leo thang tối đa)
      x-fr: [FR-027, FR-034, FR-036, FR-080]
      parameters: [ { name: trangThai, in: query, schema: { type: array, items: { $ref: '#/components/schemas/TrangThaiCanhBao' } } }, { name: tangKhuVucId, in: query, schema: { type: integer, format: int64 } }, { name: nctId, in: query, schema: { type: integer, format: int64 } }, { name: leoThangToiDa, in: query, schema: { type: boolean } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CanhBao' } } } } } }
    post:
      tags: [canh-bao]
      summary: Tạo cảnh báo thủ công (Trưởng tầng, Bác sĩ, Điều dưỡng; mô tả bắt buộc)
      description: 'Có cảnh báo đang mở cùng khóa loại thì gộp (201 với gop = true).'
      x-fr: [FR-026, FR-028, FR-030]
      x-br: [BR-M05-02]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [nctId, loaiSuCoId, muc, moTa], properties: { nctId: { type: integer, format: int64 }, loaiSuCoId: { type: integer, format: int64 }, muc: { $ref: '#/components/schemas/Muc' }, moTa: { type: string, maxLength: 4000 } } } } } }
      responses: { '201': { description: Tạo hoặc gộp, content: { application/json: { schema: { $ref: '#/components/schemas/CanhBao' } } } }, '403': { $ref: '#/components/responses/Loi' }, '409': { $ref: '#/components/responses/LoiChan' } }
  /canh-bao/{id}:
    get:
      tags: [canh-bao]
      summary: Chi tiết cảnh báo, nguồn, lịch sử, lần nhắc, lenhDuocPhep[]
      x-fr: [FR-027, FR-033]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CanhBao' } } } } }
  /canh-bao/{id}/tiep-nhan:
    post:
      tags: [canh-bao]
      summary: Tiếp nhận
      description: 'Điều dưỡng, Trưởng tầng trong phạm vi, Bác sĩ, Người phụ trách ca theo nhiệm vụ; Quản lý viện chỉ khi Leo thang cấp 2 (Q-71). Đã có người tiếp nhận: 409 DA_CO_NGUOI_TIEP_NHAN. Gọi được từ "Xác nhận và tiếp nhận" của 009 (FR-026a của 009).'
      x-fr: [FR-029, FR-036]
      x-br: [BR-M05-01]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Loi' }, '409': { $ref: '#/components/responses/LoiTiepNhan' } }
  /canh-bao/{id}/giao-nguoi-phu-trach:
    post:
      tags: [canh-bao]
      summary: Giao người phụ trách (Quản lý viện khi là người phụ trách; ghi chú bắt buộc)
      x-fr: [FR-029, FR-031, FR-036]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [nhanVienId, ghiChu], properties: { nhanVienId: { type: integer, format: int64 }, ghiChu: { type: string, minLength: 1 } } } } } }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Loi' }, '409': { $ref: '#/components/responses/LoiChan' } }
  /canh-bao/{id}/bat-dau-xu-ly:
    post:
      tags: [canh-bao]
      summary: Bắt đầu xử lý
      x-fr: [FR-029, FR-036]
