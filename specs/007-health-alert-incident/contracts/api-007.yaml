      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { noContacts: { type: boolean }, reason: { $ref: '#/components/schemas/Reason' } } } } } }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }
  /incidents/{id}/family-contacts-to-notify:
    get:
      tags: [infection]
      summary: Người thân cần liên hệ trực tiếp (Hành chính; chỉ họ tên, quan hệ, số điện thoại, nội dung cần báo)
      x-fr: [FR-062]
      x-br: [BR-M05-24]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FamilyContactToNotify' } } } } } }
  /isolations:
    get:
      tags: [infection]
      summary: Vùng đang khoanh và lịch sử (Bác sĩ, Quản lý viện, Trưởng tầng, Điều dưỡng, Hành chính)
      x-fr: [FR-064, FR-080]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Isolation' } } } } } }
    post:
      tags: [infection]
      summary: Khoanh vùng (Bác sĩ, Quản lý viện; tầng hoặc một khu vực; lý do; gắn ≥ 1 sự cố lây nhiễm chưa đóng)
      x-fr: [FR-063, FR-064, FR-065]
      x-br: [BR-M05-11]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NewIsolation' } } } }
      responses: { '201': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' }, '422': { $ref: '#/components/responses/Problem' } }
  /isolations/{id}/attach-incident:
    post:
      tags: [infection]
      summary: Gắn thêm sự cố lây nhiễm chưa đóng vào vùng
      x-fr: [FR-066]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [incidentId], properties: { incidentId: { type: integer, format: int64 } } } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /isolations/{id}/lift:
    post:
      tags: [infection]
      summary: Gỡ khoanh vùng (Bác sĩ, Quản lý viện; lý do)
      x-fr: [FR-064]
      x-br: [BR-M05-12]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' } }

  # ---------------- Giấy phép cơ sở, khám ----------------
  /facility-licenses:
    get:
      tags: [licenses-examinations]
      summary: Giấy phép cơ sở và lịch sử (Quản lý viện, Bác sĩ)
      x-fr: [FR-070, FR-075]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FacilityLicense' } } } } } }
    post:
      tags: [licenses-examinations]
      summary: Lưu giấy phép mới (gia hạn, đổi phạm vi, sửa sai thay thế bản cũ; Quản lý viện)
      x-fr: [FR-070, FR-071, FR-075]
      x-br: [BR-M06-05]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FacilityLicense' } } } }
      responses: { '201': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
  /facility-contact:
    get:
      tags: [licenses-examinations]
      summary: Số liên hệ của viện
      x-fr: [FR-070]
      responses: { '200': { description: OK } }
    put:
      tags: [licenses-examinations]
      summary: Đổi số liên hệ của viện (Quản lý viện; nhật ký)
      x-fr: [FR-070]
      x-br: [BR-M05-24]
      parameters: [ { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [phoneNumber], properties: { phoneNumber: { type: string }, note: { type: string } } } } } }
      responses: { '200': { description: OK }, '412': { $ref: '#/components/responses/Problem' } }
  /residents/{residentId}/examinations:
    get:
      tags: [licenses-examinations]
      summary: Bản ghi khám và điều trị
      x-fr: [FR-072, FR-080]
      parameters: [ { $ref: '#/components/parameters/ResidentId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ExaminationRecord' } } } } } }
    post:
      tags: [licenses-examinations]
      summary: Ghi khám, đánh giá, chẩn đoán, chỉ định, điều trị, kết quả
      description: 'Chẩn đoán, chỉ định, điều trị tại viện: 403 LEGAL_CONDITION_NOT_MET khi cơ sở hoặc bác sĩ thiếu giấy phép đúng phạm vi còn hiệu lực (FR-073). Điều dưỡng: cơ sở ngoài hoặc khám, kết quả tại viện với người thực hiện là Bác sĩ (CHK019).'
      x-fr: [FR-072, FR-073]
      x-br: [BR-M06-05]
      parameters: [ { $ref: '#/components/parameters/ResidentId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExaminationRecord' } } } }
      responses: { '201': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }

  # ---------------- Nút SOS (bổ sung 2026-10-18, Q-369) ----------------
  /sos:
    post:
      tags: [alerts, emergency]
      summary: Người cao tuổi bấm nút SOS; tạo hoặc gộp cảnh báo Khẩn cấp
      description: |
        Không cần phiên đăng nhập; xác định người cao tuổi bằng token thiết bị (research S-23).
        Từ chối khi Tạm vắng, Điều trị tại bệnh viện, trạng thái cuối, hoặc người bán trú không Có mặt; lỗi kèm contacts.
      x-fr: [FR-026, FR-047d, FR-047e]
      x-br: [BR-M05-27]
      security: [ { deviceToken: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '201': { description: Đã gửi, content: { application/json: { schema: { $ref: '#/components/schemas/SosStatus' } } } }
        '401': { description: 'INVALID_DEVICE', content: { application/problem+json: { schema: { $ref: '#/components/schemas/SosProblem' } } } }
        '409': { description: 'NOT_AT_FACILITY, NOT_PRESENT', content: { application/problem+json: { schema: { $ref: '#/components/schemas/SosProblem' } } } }
  /sos/current:
    get:
      tags: [alerts]
      summary: Trạng thái cảnh báo SOS đang mở gần nhất của người cao tuổi
      x-fr: [FR-047f]
      security: [ { deviceToken: [] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SosStatus' } } } }
        '204': { description: Không có cảnh báo SOS đang mở }
  /sos/{id}/place:
    post:
      tags: [alerts]
      summary: Người cao tuổi chọn nhanh nơi đang ở sau khi bấm (một lần)
      x-fr: [FR-047f]
      security: [ { deviceToken: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [place], properties: { place: { type: string, enum: [ROOM, RESTROOM, CORRIDOR, COMMON_ROOM, YARD, OTHER], description: "CORRIDOR, COMMON_ROOM bổ sung 2026-10-22 (Q-373)" } } } } }
      responses: { '204': { description: Đã ghi }, '409': { $ref: '#/components/responses/Problem' } }
  /sos/{id}/location:
    post:
      tags: [alerts]
      summary: App người cao tuổi gửi vị trí GPS cho lần bấm SOS (bổ sung 2026-10-22, Q-373)
      description: 'Nhận khi cảnh báo đang mở và chưa ghi đã tới nơi; ngược lại 409 STOP_SENDING_LOCATION để app dừng. Gửi lại mỗi locationIntervalSeconds (CFG-M05-09). Lệnh /sos không chờ vị trí (BR-M05-28).'
      x-fr: [FR-047h]
      x-br: [BR-M05-28]
      security: [ { deviceToken: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LocationReport' } } } }
      responses: { '204': { description: Đã lưu }, '409': { $ref: '#/components/responses/Problem' } }

  # ---------------- Nút hỗ trợ khẩn cấp của nhân viên (bổ sung 2026-10-22, Q-375) ----------------
  /emergency-assist:
    post:
      tags: [alerts, emergency]
      summary: Nhân viên đang trong ca bấm nút hỗ trợ khẩn cấp; tạo hoặc gộp cảnh báo Khẩn cấp STAFF_ASSIST_REQUEST
      description: 'Quyền EMERGENCY_ASSIST_BUTTON (EMERGENCY_ASSIST_BUTTON); chỉ trực tuyến. Không trong ca: 409 NOT_ON_SHIFT kèm contacts. Không tự tạo sự cố (Q-67); không báo người thân. Đếm ngược 3 giây và Hủy là việc của app.'
      x-fr: [FR-026, FR-047i]
      x-br: [BR-M05-29]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '201': { description: Đã gửi, content: { application/json: { schema: { $ref: '#/components/schemas/SosStatus' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { description: 'NOT_ON_SHIFT', content: { application/problem+json: { schema: { $ref: '#/components/schemas/SosProblem' } } } }
  /emergency-assist/current:
    get:
      tags: [alerts]
      summary: Trạng thái cảnh báo nút hỗ trợ đang mở gần nhất của người bấm (đang tới, đã tới)
      x-fr: [FR-047j]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SosStatus' } } } }
        '204': { description: Không có cảnh báo đang mở }
  /emergency-assist/{id}/details:
    post:
      tags: [alerts]
      summary: Người bấm chọn loại sự việc, tầng, nơi, người cao tuổi sau khi gửi (mỗi trường đặt một lần)
      description: 'Có tầng mới thì báo thêm Người phụ trách ca, nhân viên trong ca của tầng; có residentId thì gắn cảnh báo với người cao tuổi và báo thêm người nhận FR-047a (research S-24).'
      x-fr: [FR-047i]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventType: { type: string, enum: [CARDIAC_ARREST_OR_FAINTING, FALL, AGITATION_OR_VIOLENCE, OTHER] }
                floorAreaId: { type: integer, format: int64 }
                place: { type: string, enum: [ROOM, RESTROOM, CORRIDOR, COMMON_ROOM, YARD, OTHER] }
                residentId: { type: integer, format: int64 }
      responses: { '204': { description: Đã ghi }, '409': { $ref: '#/components/responses/Problem' } }
  /emergency-assist/{id}/location:
    post:
      tags: [alerts]
      summary: App nhân viên gửi vị trí GPS cho lần bấm nút hỗ trợ (như /sos/{id}/location)
      x-fr: [FR-047h]
      x-br: [BR-M05-28]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LocationReport' } } } }
      responses: { '204': { description: Đã lưu }, '409': { $ref: '#/components/responses/Problem' } }

  # ---------------- Mốc tới nơi, gọi 115 (bổ sung 2026-10-22, Q-374, Q-376) ----------------
  /alerts/{id}/mark-arrived:
    post:
      tags: [alerts]
      summary: Người phụ trách ghi "Đã tới nơi" (cảnh báo từ nút SOS hoặc nút hỗ trợ; một lần; không đổi trạng thái)
      x-fr: [FR-047j, FR-029]
      x-br: [BR-M05-30]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }
  /alerts/{id}/call-115-info:
    get:
      tags: [emergency]
      summary: Thông tin đọc cho tổng đài 115 (cảnh báo Khẩn cấp)
      description: 'Dị ứng, bệnh nền chỉ khi người xem có quyền xem sức khỏe; ngược lại liệt kê ở hiddenFields.'
      x-fr: [FR-047k]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Call115Info' } } } } }
  /alerts/{id}/call-115:
    post:
      tags: [emergency]
      summary: Ghi lượt bấm "Gọi 115" trước khi app mở trình quay số (cảnh báo Khẩn cấp)
      x-fr: [FR-047k]
      x-br: [BR-M05-31]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '201': { description: Lượt gọi, content: { application/json: { schema: { $ref: '#/components/schemas/Call115Attempt' } } } }, '403': { $ref: '#/components/responses/Problem' } }
  /incidents/{id}/call-115-info:
    get:
      tags: [emergency]
      summary: Thông tin đọc cho tổng đài 115 (sự cố Khẩn cấp)
      x-fr: [FR-047k]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Call115Info' } } } } }
  /incidents/{id}/call-115:
    post:
      tags: [emergency]
      summary: Ghi lượt bấm "Gọi 115" (sự cố Khẩn cấp)
      x-fr: [FR-047k, FR-048b]
      x-br: [BR-M05-31]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '201': { description: Lượt gọi, content: { application/json: { schema: { $ref: '#/components/schemas/Call115Attempt' } } } }, '403': { $ref: '#/components/responses/Problem' } }
  /call-115-attempts/{id}/result:
    post:
      tags: [emergency]
      summary: Người bấm chọn kết quả gọi (một lần); Đã gọi được thì thêm diễn biến CALL_EMERGENCY vào sự cố liên kết
      x-fr: [FR-047k, FR-048b]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [result], properties: { result: { type: string, enum: [CONNECTED, NOT_CONNECTED] } } } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Problem' } }

  # ---------------- Chuyển viện, phiếu tóm tắt (bổ sung 2026-10-22, Q-383, Q-384) ----------------
  /incidents/{id}/transfer-out/info:
    get:
      tags: [emergency]
      summary: Thông tin hiện ở màn lệnh Chuyển viện (nguyện vọng khi điều trị, nguyện vọng cuối đời, người liên hệ chính); không gợi ý cơ sở
      x-fr: [FR-049]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TransferOutInfo' } } } } }
  /transfer-summaries/{id}/document:
    get:
      tags: [emergency]
      summary: Tải phiếu tóm tắt chuyển viện PDF đã lưu (đúng file đã dựng trong lệnh)
      x-fr: [FR-050h]
      x-br: [BR-M05-32]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }, '403': { $ref: '#/components/responses/Problem' } }
  /transfer-summaries/{id}/reprint:
    post:
      tags: [emergency]
      summary: In lại phiếu; trả file đã lưu có dấu "Bản in lại"; ghi lần in và nhật ký
      x-fr: [FR-050h]
      x-br: [BR-M05-32]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }, '403': { $ref: '#/components/responses/Problem' } }

components:
  securitySchemes:
    session: { type: http, scheme: bearer, description: 'Token phiên opaque của 002 (A-02)' }
    deviceToken: { type: apiKey, in: header, name: X-Device-Token, description: 'Token thiết bị của người cao tuổi (002 research A-15); chỉ dùng cho /sos' }
  parameters:
    ResidentId: { name: residentId, in: path, required: true, schema: { type: integer, format: int64 } }
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  requestBodies:
    Reason:
      required: true
      content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { $ref: '#/components/schemas/Reason' } } } } }
  responses:
    Problem:
      description: Lỗi theo RFC 9457 (research R-03 của 000)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Blocked:
      description: 'CONDITION_NOT_MET, INVALID_TRANSITION, VALID_RANGE_MISSING, RECORD_NOT_AWAITING_REMEASUREMENT, OPEN_EMERGENCY_INCIDENT_EXISTS, WISH_NOT_CHECKED, ISOLATION_ONLY_FOR_THIS_INCIDENT, CRITICAL_FLAG_EXISTS, ON_DUTY_DOCTOR_AVAILABLE, WISH_NOT_RECONFIRMED, CHOICE_NOT_RECORDED, INSUFFICIENT_PROGRESSIONS, FINAL_STATE…'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    AlreadyReceived:
      description: 'ALREADY_RECEIVED: kèm người và thời điểm tiếp nhận'
      content: { application/problem+json: { schema: { allOf: [ { $ref: '#/components/schemas/Problem' }, { type: object, properties: { receivedBy: { type: string }, receivedAt: { type: string, format: date-time } } } ] } } }
  schemas:
    SosStatus:
      type: object
      description: Bổ sung 2026-10-18 (FR-047f)
      properties:
        pressId: { type: integer, format: int64 }
        alertId: { type: integer, format: int64 }
        status: { type: string, enum: [SENT, RECEIVED, ARRIVED], description: 'RECEIVED hiện "[họ tên] đang tới"; ARRIVED bổ sung 2026-10-22 (FR-047j)' }
        receiverName: { type: string, description: Họ tên người đã tiếp nhận }
        arrivedAt: { type: string, format: date-time }
        sendLocation: { type: boolean, description: 'Bổ sung 2026-10-22 (FR-047h): app gửi vị trí khi true' }
        locationIntervalSeconds: { type: integer, description: 'CFG-M05-09' }
        contacts: { $ref: '#/components/schemas/FallbackContacts' }
    FallbackContacts:
      type: object
      properties:
        facilityPhone: { type: string }
        emergencyNumber: { type: string, const: '115' }
    SosProblem:
      type: object
      description: Lỗi RFC 9457 kèm số liên hệ để app hiện (012 FR-085)
      properties:
        errorCode: { type: string }
        detail: { type: string }
        contacts: { $ref: '#/components/schemas/FallbackContacts' }
    LocationReport:
      type: object
      description: Bổ sung 2026-10-22 (FR-047h)
      required: [latitude, longitude, accuracyMeters, measuredAt]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracyMeters: { type: number, minimum: 0 }
        measuredAt: { type: string, format: date-time }
    LocationView:
      type: object
      properties:
        latitude: { type: number }
        longitude: { type: number }
        accuracyMeters: { type: number }
        measuredAt: { type: string, format: date-time }
        possiblyStale: { type: boolean, description: 'Quá hai chu kỳ CFG-M05-09 không cập nhật' }
        isPrimary: { type: boolean, description: 'Người cao tuổi đang ở Hoạt động bên ngoài; ngược lại là tham khảo' }
    Call115Info:
      type: object
      description: Bổ sung 2026-10-22 (FR-047k)
      properties:
        facility: { type: object, properties: { name: { type: string }, address: { type: string }, phone: { type: string } } }
        floor: { type: string }
        roomOrPlace: { type: string }
        location: { $ref: '#/components/schemas/LocationView' }
        resident: { type: object, properties: { fullName: { type: string }, age: { type: integer }, gender: { type: string } } }
