# Bản dịch đã được A/chủ dự án duyệt, 2026-10-29; chưa triển khai HTTP.
openapi: 3.1.0
info:
  title: Elder Care – Feature 010 (chi phí phát sinh)
  version: 1.0.0-design
  description: |
    Hợp đồng REST của feature 010 (module M11). Quy ước chung theo research R-03 của 000:
    tiền tố /api/v1, lỗi RFC 9457 có errorCode và unmetConditions[], Idempotency-Key cho mọi lệnh ghi.
    Lệnh chốt bảng dùng If-Match (phiên bản bảng) để từ chối chốt dựa trên trạng thái cũ (FR-033); lệnh khác khóa dòng và kiểm tra lại (research P-03).
    Khoản theo sự kiện không có trường số lượng, đơn giá, hệ số, số tiền trong thân lệnh: hệ thống tính (FR-013, FR-016).
    Lệnh hàng loạt trả từng nguồn hoặc khoản bị bỏ qua kèm lý do (FR-005, FR-015).
    Không có endpoint sửa hay xóa khoản; khoản Đã chốt chỉ nhận khoản điều chỉnh (DBR-17). Đính chính của 000 không áp cho khoản đã chốt.
    Tên thuốc bị bỏ khỏi phản hồi với người không có quyền xem thuốc (FR-019), liệt kê trong hiddenFields.
    Người thân dùng các GET bảng, tạm tính và lệnh đồng ý/từ chối mua hộ; backend kiểm quyền xem chi phí và người đại diện qua 002, 012.
    Truy vết: mỗi operation có x-fr (FR của spec 010) và x-br khi có.
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - { name: source, description: 'UC-61; mục B' }
  - { name: items, description: 'UC-61, UC-62, UC-63; mục C, D, F' }
  - { name: statements, description: 'UC-62; mục A, G' }
  - { name: purchase-assistance, description: 'UC-79; mục E' }
  - { name: cost-access, description: 'UC-64; mục H' }

paths:
  /costs/billing-sources:
    get:
      tags: [source]
      summary: Tra cứu bản ghi nguồn tính phí theo người cao tuổi, loại sự kiện, khoảng ngày (không có bộ lọc "chưa lập khoản", không gợi ý)
      x-fr: [FR-005, FR-005a, FR-005b]
      x-br: [BR-M11-01]
      parameters:
        - { name: residentId, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: type, in: query, required: true, schema: { $ref: '#/components/schemas/BillingSourceType' } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BillingSource' } } } } }, '403': { $ref: '#/components/responses/Problem' } }
  /costs/items/from-events:
    post:
      tags: [source]
      summary: Lập khoản theo sự kiện, một hoặc hàng loạt (Hành chính)
      description: |
        Kiểm FR-006 (đã có khoản: COST_ITEM_ALREADY_EXISTS), FR-007 (ngày chưa kết thúc; ngoại lệ lập trước kỳ cuối), FR-011 (OUTSIDE_BILLING_PERIOD),
        FR-005b (buổi chưa có trạng thái, ngày khu nghỉ), nguồn gia đình gửi / thuốc mua hộ (NOT_A_BILLABLE_EVENT).
        Nguồn không đạt bị bỏ qua kèm lý do; nguồn đạt được lập trong cùng lệnh. Bảng chưa có thì lập cùng lệnh.
      x-fr: [FR-002, FR-003, FR-005, FR-006, FR-007, FR-008, FR-009, FR-010, FR-011, FR-012]
      x-br: [BR-M11-01, BR-M11-02, BR-M11-03, BR-M11-09]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateCostsFromEvents' } } } }
      responses: { '200': { description: Kết quả từng nguồn, content: { application/json: { schema: { $ref: '#/components/schemas/CostBatchResult' } } } }, '403': { $ref: '#/components/responses/Problem' } }
  /costs/items/manual:
    post:
      tags: [items]
      summary: Lập khoản nhập tay (mục ngoài danh mục; lý do bắt buộc)
      x-fr: [FR-021, FR-013]
      x-br: [BR-M11-04]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ManualCostItem' } } } }
      responses: { '201': { description: OK }, '409': { $ref: '#/components/responses/BlockingProblem' }, '422': { $ref: '#/components/responses/Problem' } }
  /costs/items/{id}/adjust:
    post:
      tags: [items]
      summary: Lập khoản điều chỉnh cho khoản gốc (số tiền do Hành chính nhập; tổng gốc + điều chỉnh không âm)
      description: 'Gốc chưa chốt: cùng bảng. Gốc đã chốt: bảng chưa chốt của kỳ hiện tại hoặc bảng bổ sung (lập cùng lệnh). sourceChangeId trỏ biến động nguồn sau chốt khi có (FR-027).'
      x-fr: [FR-025, FR-026, FR-027, FR-002a, FR-003]
      x-br: [BR-M11-05]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CostAdjustment' } } } }
      responses: { '201': { description: OK }, '409': { $ref: '#/components/responses/BlockingProblem' }, '422': { $ref: '#/components/responses/Problem' } }
  /costs/items/{id}:
    get:
      tags: [items]
      summary: Chi tiết khoản, bản ghi nguồn, lịch sử tính lại, kiểm tra, duyệt, trả lại, khoản điều chỉnh và tổng hiện hành
      x-fr: [FR-014, FR-018, FR-019]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CostItem' } } } } }
  /costs/items/check:
    post:
      tags: [items]
      summary: Kiểm tra từng khoản hoặc hàng loạt theo bộ lọc (Hành chính); khoản thiếu đơn giá bị bỏ qua
      x-fr: [FR-015]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CostItemSelection' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CostBatchResult' } } } } }
  /costs/items/{id}/uncheck:
    post:
      tags: [items]
      summary: Bỏ kiểm tra (bảng Đang mở; lý do)
      x-fr: [FR-015]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/BlockingProblem' } }
  /costs/items/approve:
    post:
      tags: [items]
      summary: Duyệt từng khoản hoặc hàng loạt theo bảng (Quản lý viện); nhập tay, mua hộ, điều chỉnh phải duyệt riêng
      description: 'Khoản mua hộ vượt số đã đồng ý cần excessApprovalReason (FR-024).'
      x-fr: [FR-015, FR-024]
      x-br: [BR-M11-04]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/CostItemSelection' }, { type: object, properties: { excessApprovalReason: { type: string } } } ] } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CostBatchResult' } } } }, '403': { $ref: '#/components/responses/Problem' } }
  /costs/items/{id}/return:
    post:
      tags: [items]
      summary: Trả lại khoản Đã kiểm tra hoặc Đã duyệt về Nháp (Quản lý viện; lý do)
      x-fr: [FR-015]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/BlockingProblem' } }
  /costs/items/{id}/cancel:
    post:
      tags: [items]
      summary: Hủy khoản Nháp do Hành chính lập (lý do)
      x-fr: [FR-016]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/BlockingProblem' } }
  /costs/post-finalization-changes:
    get:
      tags: [items]
      summary: Biến động nguồn của khoản đã chốt (Hành chính dùng để lập điều chỉnh; không có số chênh lệch tính sẵn)
      x-fr: [FR-027]
      parameters: [ { name: residentId, in: query, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK } }

  # ---------------- Bảng ----------------
  /costs/statements:
    get:
      tags: [statements]
      summary: Danh sách bảng theo kỳ, người cao tuổi, trạng thái, dấu
      x-fr: [FR-002, FR-002a]
      parameters: [ { name: periodId, in: query, schema: { type: integer, format: int64 } }, { name: residentId, in: query, schema: { type: integer, format: int64 } }, { name: status, in: query, schema: { type: string, enum: [OPEN, AWAITING_FINALIZATION, FINALIZED] } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CostStatement' } } } } } }
  /costs/statements/{id}:
    get:
      tags: [statements]
      summary: Bảng chi phí với khoản (lọc dấu, nguồn sinh, loại), tổng theo loại, tổng cộng
      x-fr: [FR-002, FR-015]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CostStatement' } } } } }
  /costs/statements/{id}/submit-for-finalization:
    post:
      tags: [statements]
      summary: Gửi chốt (Hành chính); trả cảnh báo biến động nếu có (không chặn)
      x-fr: [FR-030, FR-032]
      x-br: [BR-M11-06, BR-M11-07]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { changeWarning: { $ref: '#/components/schemas/CostChangeWarning' } } } } } }, '409': { $ref: '#/components/responses/BlockingProblem' } }
  /costs/statements/{id}/return:
    post:
      tags: [statements]
      summary: Trả lại bảng Chờ chốt (Quản lý viện; lý do; chọn khoản về Nháp)
      x-fr: [FR-015]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason, itemIds], properties: { reason: { $ref: '#/components/schemas/Reason' }, itemIds: { type: array, items: { type: integer, format: int64 } } } } } } }
      responses: { '200': { description: OK } }
  /costs/statements/{id}/finalize:
    post:
      tags: [statements]
      summary: Chốt bảng (Quản lý viện); hoặc toàn bộ, hoặc không
      x-fr: [FR-030, FR-033, FR-034a, FR-040, FR-042]
      x-br: [BR-M11-06]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/BlockingProblem' }, '412': { $ref: '#/components/responses/Problem' } }
  /costs/periods:
    get:
      tags: [statements]
      summary: Kỳ chi phí của viện và trạng thái
      x-fr: [FR-001]
      responses: { '200': { description: OK } }

  # ---------------- Mua hộ ----------------
  /purchase-assistance-requests:
    get:
      tags: [purchase-assistance]
      summary: Đề nghị mua hộ (Hành chính, Quản lý viện; người đại diện thấy đề nghị cần mình đồng ý)
      x-fr: [FR-023, FR-023a]
      parameters: [ { name: residentId, in: query, schema: { type: integer, format: int64 } }, { name: status, in: query, schema: { type: string } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PurchaseAssistanceRequest' } } } } } }
    post:
      tags: [purchase-assistance]
      summary: Lập đề nghị mua hộ (Hành chính)
      x-fr: [FR-023]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NewPurchaseAssistanceRequest' } } } }
      responses: { '201': { description: OK } }
  /purchase-assistance-requests/{id}/send:
    post:
      tags: [purchase-assistance]
      summary: Gửi (≤ CFG-M11-02 → Được phép mua; lớn hơn → Chờ đồng ý)
      x-fr: [FR-023, FR-023a]
      x-br: [BR-M11-07]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: OK } }
  /purchase-assistance-requests/{id}/agree:
    post:
      tags: [purchase-assistance]
      summary: Đồng ý (người đại diện qua cổng hoặc Quản lý viện); quyết định đầu tiên thắng
      x-fr: [FR-023, FR-023a]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/BlockingProblem' } }
  /purchase-assistance-requests/{id}/reject:
    post:
      tags: [purchase-assistance]
      summary: Từ chối (lý do)
      x-fr: [FR-023]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/BlockingProblem' } }
  /purchase-assistance-requests/{id}/request-additional-consent:
    post:
      tags: [purchase-assistance]
      summary: Xin đồng ý bổ sung (số mới lớn hơn số được phép; lý do)
      x-fr: [FR-024]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [newAmount, reason], properties: { newAmount: { type: integer, format: int64 }, reason: { $ref: '#/components/schemas/Reason' } } } } } }
      responses: { '200': { description: OK } }
  /purchase-assistance-requests/{id}/withdraw-additional-consent:
    post:
      tags: [purchase-assistance]
      summary: Rút yêu cầu bổ sung khi chưa có quyết định (lý do)
      x-fr: [FR-024]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { description: OK } }
  /purchase-assistance-requests/{id}/cancel:
    post:
      tags: [purchase-assistance]
      summary: Hủy đề nghị chưa ghi đã mua (lý do)
      x-fr: [FR-023]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { description: OK } }
  /purchase-assistance-requests/{id}/record-purchased:
    post:
      tags: [purchase-assistance]
      summary: 'Ghi đã mua; lập khoản Mua hộ Nháp (vượt ngoài CFG-M11-06 thì chặn, trừ lý do mua gấp thuốc, vật tư y tế)'
      x-fr: [FR-024]
      x-br: [BR-M11-07]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecordPurchased' } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/BlockingProblem' } }

  # ---------------- Cung cấp ----------------
  /residents/{residentId}/costs/statements:
    get:
      tags: [cost-access]
      summary: Bảng chi phí đã chốt cho cổng người thân (quyền xem chi phí; tên thuốc theo quyền sức khỏe)
      x-fr: [FR-037, FR-019]
      parameters: [ { $ref: '#/components/parameters/ResidentId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CostStatement' } } } } }, '403': { $ref: '#/components/responses/Problem' } }
  /residents/{residentId}/costs/provisional:
    get:
      tags: [cost-access]
      summary: Chi phí tạm tính theo loại cho khoảng ngày (nhãn "tạm tính, chưa chốt")
      x-fr: [FR-038, FR-022]
      parameters: [ { $ref: '#/components/parameters/ResidentId' }, { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProvisionalCostSummary' } } } } }
  /costs/periods/{id}/export:
    post:
      tags: [cost-access]
      summary: Xuất dữ liệu đã chốt của kỳ cho kế toán (Kế toán); tệp XLSX hoặc CSV
      x-fr: [FR-039, FR-041]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [scope, format], properties: { scope: { type: string, enum: [ALL, NEVER_EXPORTED] }, format: { type: string, enum: [XLSX, CSV] } } } } } }
      responses:
        '200': { description: Tệp, content: { application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }, text/csv: { schema: { type: string } } } }
        '403': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    session: { type: http, scheme: bearer, description: 'Token phiên opaque của 002 (A-02)' }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    ResidentId: { name: residentId, in: path, required: true, schema: { type: integer, format: int64 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  headers:
    ETag: { schema: { type: string } }
  requestBodies:
    Reason:
      required: true
      content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { $ref: '#/components/schemas/Reason' } } } } }
  responses:
    Problem:
      description: Lỗi theo RFC 9457 (research R-03 của 000)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    BlockingProblem:
      description: 'CONDITION_NOT_MET, COST_ITEM_ALREADY_EXISTS, OUTSIDE_BILLING_PERIOD, DAY_NOT_ENDED, NOT_A_BILLABLE_EVENT, ITEM_IN_CATALOG, NEGATIVE_TOTAL, DRAFT_ITEMS_REMAIN, UNAPPROVED_ITEMS_REMAIN, PERIOD_NOT_ENDED, STATEMENT_FINALIZED, ALLOWED_AMOUNT_EXCEEDED, ALREADY_PROCESSED, EXCESS_APPROVAL_REASON_REQUIRED, CORRECTION_NOT_SUPPORTED'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Reason: { type: string, minLength: 1, maxLength: 2000 }
    BillingSourceType: { type: string, enum: [RESIDENCY_DAY, DAY_CARE_SESSION, CARE_TASK_RESULT, DOSE, PRN_ADMINISTRATION, DISPENSE_RECORD, FAMILY_MEAL, OVERNIGHT_STAY, ACTIVITY_ATTENDANCE] }
    CostType: { type: string, enum: [RESIDENCY_FEE, DAY_CARE_SESSION_FEE, SERVICE, CONSUMABLE, ACTIVITY, MEDICATION, FAMILY_OVERNIGHT_STAY, FAMILY_MEAL, PURCHASE_ASSISTANCE, OTHER] }
    Problem:
      type: object
      properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string }, errorCode: { type: string }, unmetConditions: { type: array, items: { type: object } } }
    BillingSource:
      type: object
      properties:
        sourceType: { $ref: '#/components/schemas/BillingSourceType' }
        sourceId: { type: string }
        unit: { type: string }
        incurredOn: { type: string, format: date }
        occurredAt: { type: string, format: date-time }
        description: { type: string, description: 'Thuốc: mã vật phẩm với người không có quyền xem thuốc' }
        quantity: { type: number }
        factor: { type: number }
        flags: { type: array, items: { type: string } }
        existingItemId: { type: integer, format: int64, description: 'Khoản đang hiệu lực, nếu có' }
    CreateCostsFromEvents:
