openapi: 3.1.0
info:
  title: Elder Care – Feature 010 (chi phí phát sinh)
  version: 1.0.0-design
  description: |
    Hợp đồng REST của feature 010 (module M11). Quy ước chung theo research R-03 của 000:
    tiền tố /api/v1, lỗi RFC 9457 có maLoi và dieuKienChuaThoa[], Idempotency-Key cho mọi lệnh ghi.
    Lệnh chốt bảng dùng If-Match (phiên bản bảng) để từ chối chốt dựa trên trạng thái cũ (FR-033); lệnh khác khóa dòng và kiểm tra lại (research P-03).
    Khoản theo sự kiện không có trường số lượng, đơn giá, hệ số, số tiền trong thân lệnh: hệ thống tính (FR-013, FR-016).
    Lệnh hàng loạt trả từng nguồn hoặc khoản bị bỏ qua kèm lý do (FR-005, FR-015).
    Không có endpoint sửa hay xóa khoản; khoản Đã chốt chỉ nhận khoản điều chỉnh (DBR-17). Đính chính của 000 không áp cho khoản đã chốt.
    Tên thuốc bị bỏ khỏi phản hồi với người không có quyền xem thuốc (FR-019), liệt kê trong truongBiAn.
    Người thân dùng các GET bảng, tạm tính và lệnh đồng ý/từ chối mua hộ; backend kiểm quyền xem chi phí và người đại diện qua 002, 012.
    Truy vết: mỗi operation có x-fr (FR của spec 010) và x-br khi có.
servers:
  - url: /api/v1
security:
  - phien: []
tags:
  - { name: nguon, description: 'UC-61; mục B' }
  - { name: khoan, description: 'UC-61, UC-62, UC-63; mục C, D, F' }
  - { name: bang, description: 'UC-62; mục A, G' }
  - { name: mua-ho, description: 'UC-79; mục E' }
  - { name: cung-cap, description: 'UC-64; mục H' }

paths:
  /chi-phi/ban-ghi-nguon:
    get:
      tags: [nguon]
      summary: Tra cứu bản ghi nguồn tính phí theo người cao tuổi, loại sự kiện, khoảng ngày (không có bộ lọc "chưa lập khoản", không gợi ý)
      x-fr: [FR-005, FR-005a, FR-005b]
      x-br: [BR-M11-01]
      parameters:
        - { name: nctId, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: loai, in: query, required: true, schema: { $ref: '#/components/schemas/LoaiNguon' } }
        - { name: tu, in: query, required: true, schema: { type: string, format: date } }
        - { name: den, in: query, required: true, schema: { type: string, format: date } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BanGhiNguon' } } } } }, '403': { $ref: '#/components/responses/Loi' } }
  /chi-phi/khoan/theo-su-kien:
    post:
      tags: [nguon]
      summary: Lập khoản theo sự kiện, một hoặc hàng loạt (Hành chính)
      description: |
        Kiểm FR-006 (đã có khoản: DA_CO_KHOAN), FR-007 (ngày chưa kết thúc; ngoại lệ lập trước kỳ cuối), FR-011 (NGOAI_THOI_GIAN_TINH_PHI),
        FR-005b (buổi chưa có trạng thái, ngày khu nghỉ), nguồn gia đình gửi / thuốc mua hộ (KHONG_PHAI_SU_KIEN_TINH_PHI).
        Nguồn không đạt bị bỏ qua kèm lý do; nguồn đạt được lập trong cùng lệnh. Bảng chưa có thì lập cùng lệnh.
      x-fr: [FR-002, FR-003, FR-005, FR-006, FR-007, FR-008, FR-009, FR-010, FR-011, FR-012]
      x-br: [BR-M11-01, BR-M11-02, BR-M11-03, BR-M11-09]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LapTheoSuKien' } } } }
      responses: { '200': { description: Kết quả từng nguồn, content: { application/json: { schema: { $ref: '#/components/schemas/KetQuaHangLoat' } } } }, '403': { $ref: '#/components/responses/Loi' } }
  /chi-phi/khoan/nhap-tay:
    post:
      tags: [khoan]
      summary: Lập khoản nhập tay (mục ngoài danh mục; lý do bắt buộc)
      x-fr: [FR-021, FR-013]
      x-br: [BR-M11-04]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NhapTay' } } } }
      responses: { '201': { description: OK }, '409': { $ref: '#/components/responses/LoiChan' }, '422': { $ref: '#/components/responses/Loi' } }
  /chi-phi/khoan/{id}/dieu-chinh:
    post:
      tags: [khoan]
      summary: Lập khoản điều chỉnh cho khoản gốc (số tiền do Hành chính nhập; tổng gốc + điều chỉnh không âm)
      description: 'Gốc chưa chốt: cùng bảng. Gốc đã chốt: bảng chưa chốt của kỳ hiện tại hoặc bảng bổ sung (lập cùng lệnh). bienDongId trỏ biến động nguồn sau chốt khi có (FR-027).'
      x-fr: [FR-025, FR-026, FR-027, FR-002a, FR-003]
      x-br: [BR-M11-05]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DieuChinh' } } } }
      responses: { '201': { description: OK }, '409': { $ref: '#/components/responses/LoiChan' }, '422': { $ref: '#/components/responses/Loi' } }
  /chi-phi/khoan/{id}:
    get:
      tags: [khoan]
      summary: Chi tiết khoản, bản ghi nguồn, lịch sử tính lại, kiểm tra, duyệt, trả lại, khoản điều chỉnh và tổng hiện hành
      x-fr: [FR-014, FR-018, FR-019]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Khoan' } } } } }
  /chi-phi/khoan/kiem-tra:
    post:
      tags: [khoan]
      summary: Kiểm tra từng khoản hoặc hàng loạt theo bộ lọc (Hành chính); khoản thiếu đơn giá bị bỏ qua
      x-fr: [FR-015]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChonKhoan' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/KetQuaHangLoat' } } } } }
  /chi-phi/khoan/{id}/bo-kiem-tra:
    post:
      tags: [khoan]
      summary: Bỏ kiểm tra (bảng Đang mở; lý do)
      x-fr: [FR-015]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/LoiChan' } }
  /chi-phi/khoan/duyet:
    post:
      tags: [khoan]
      summary: Duyệt từng khoản hoặc hàng loạt theo bảng (Quản lý viện); nhập tay, mua hộ, điều chỉnh phải duyệt riêng
      description: 'Khoản mua hộ vượt số đã đồng ý cần lyDoChapNhanVuot (FR-024).'
      x-fr: [FR-015, FR-024]
      x-br: [BR-M11-04]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/ChonKhoan' }, { type: object, properties: { lyDoChapNhanVuot: { type: string } } } ] } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/KetQuaHangLoat' } } } }, '403': { $ref: '#/components/responses/Loi' } }
  /chi-phi/khoan/{id}/tra-lai:
    post:
      tags: [khoan]
      summary: Trả lại khoản Đã kiểm tra hoặc Đã duyệt về Nháp (Quản lý viện; lý do)
      x-fr: [FR-015]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/LoiChan' } }
  /chi-phi/khoan/{id}/huy:
    post:
      tags: [khoan]
      summary: Hủy khoản Nháp do Hành chính lập (lý do)
      x-fr: [FR-016]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/LoiChan' } }
  /chi-phi/bien-dong-sau-chot:
    get:
      tags: [khoan]
      summary: Biến động nguồn của khoản đã chốt (Hành chính dùng để lập điều chỉnh; không có số chênh lệch tính sẵn)
      x-fr: [FR-027]
      parameters: [ { name: nctId, in: query, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK } }

  # ---------------- Bảng ----------------
  /chi-phi/bang:
    get:
      tags: [bang]
      summary: Danh sách bảng theo kỳ, người cao tuổi, trạng thái, dấu
      x-fr: [FR-002, FR-002a]
      parameters: [ { name: kyId, in: query, schema: { type: integer, format: int64 } }, { name: nctId, in: query, schema: { type: integer, format: int64 } }, { name: trangThai, in: query, schema: { type: string, enum: [DANG_MO, CHO_CHOT, DA_CHOT] } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Bang' } } } } } }
  /chi-phi/bang/{id}:
    get:
      tags: [bang]
      summary: Bảng chi phí với khoản (lọc dấu, nguồn sinh, loại), tổng theo loại, tổng cộng
      x-fr: [FR-002, FR-015]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Bang' } } } } }
  /chi-phi/bang/{id}/gui-chot:
    post:
      tags: [bang]
      summary: Gửi chốt (Hành chính); trả cảnh báo biến động nếu có (không chặn)
      x-fr: [FR-030, FR-032]
      x-br: [BR-M11-06, BR-M11-07]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { canhBaoBienDong: { $ref: '#/components/schemas/CanhBaoBienDong' } } } } } }, '409': { $ref: '#/components/responses/LoiChan' } }
  /chi-phi/bang/{id}/tra-lai:
    post:
      tags: [bang]
      summary: Trả lại bảng Chờ chốt (Quản lý viện; lý do; chọn khoản về Nháp)
      x-fr: [FR-015]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [lyDo, khoanIds], properties: { lyDo: { $ref: '#/components/schemas/LyDo' }, khoanIds: { type: array, items: { type: integer, format: int64 } } } } } } }
      responses: { '200': { description: OK } }
  /chi-phi/bang/{id}/chot:
    post:
      tags: [bang]
      summary: Chốt bảng (Quản lý viện); hoặc toàn bộ, hoặc không
      x-fr: [FR-030, FR-033, FR-034a, FR-040, FR-042]
      x-br: [BR-M11-06]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/LoiChan' }, '412': { $ref: '#/components/responses/Loi' } }
  /chi-phi/ky:
    get:
      tags: [bang]
      summary: Kỳ chi phí của viện và trạng thái
      x-fr: [FR-001]
      responses: { '200': { description: OK } }

  # ---------------- Mua hộ ----------------
  /de-nghi-mua-ho:
    get:
      tags: [mua-ho]
      summary: Đề nghị mua hộ (Hành chính, Quản lý viện; người đại diện thấy đề nghị cần mình đồng ý)
      x-fr: [FR-023, FR-023a]
      parameters: [ { name: nctId, in: query, schema: { type: integer, format: int64 } }, { name: trangThai, in: query, schema: { type: string } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DeNghiMuaHo' } } } } } }
    post:
      tags: [mua-ho]
      summary: Lập đề nghị mua hộ (Hành chính)
      x-fr: [FR-023]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeNghiMuaHoMoi' } } } }
      responses: { '201': { description: OK } }
  /de-nghi-mua-ho/{id}/gui:
    post:
      tags: [mua-ho]
      summary: Gửi (≤ CFG-M11-02 → Được phép mua; lớn hơn → Chờ đồng ý)
      x-fr: [FR-023, FR-023a]
      x-br: [BR-M11-07]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: OK } }
  /de-nghi-mua-ho/{id}/dong-y:
    post:
      tags: [mua-ho]
      summary: Đồng ý (người đại diện qua cổng hoặc Quản lý viện); quyết định đầu tiên thắng
      x-fr: [FR-023, FR-023a]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Loi' }, '409': { $ref: '#/components/responses/LoiChan' } }
  /de-nghi-mua-ho/{id}/tu-choi:
    post:
      tags: [mua-ho]
      summary: Từ chối (lý do)
      x-fr: [FR-023]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/LoiChan' } }
  /de-nghi-mua-ho/{id}/xin-bo-sung:
    post:
      tags: [mua-ho]
      summary: Xin đồng ý bổ sung (số mới lớn hơn số được phép; lý do)
      x-fr: [FR-024]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [soTienMoi, lyDo], properties: { soTienMoi: { type: integer, format: int64 }, lyDo: { $ref: '#/components/schemas/LyDo' } } } } } }
      responses: { '200': { description: OK } }
  /de-nghi-mua-ho/{id}/rut-bo-sung:
    post:
      tags: [mua-ho]
      summary: Rút yêu cầu bổ sung khi chưa có quyết định (lý do)
      x-fr: [FR-024]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: OK } }
  /de-nghi-mua-ho/{id}/huy:
    post:
      tags: [mua-ho]
      summary: Hủy đề nghị chưa ghi đã mua (lý do)
      x-fr: [FR-023]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: OK } }
  /de-nghi-mua-ho/{id}/ghi-da-mua:
    post:
      tags: [mua-ho]
      summary: 'Ghi đã mua; lập khoản Mua hộ Nháp (vượt ngoài CFG-M11-06 thì chặn, trừ lý do mua gấp thuốc, vật tư y tế)'
      x-fr: [FR-024]
      x-br: [BR-M11-07]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GhiDaMua' } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/LoiChan' } }

  # ---------------- Cung cấp ----------------
  /nguoi-cao-tuoi/{nctId}/chi-phi/bang:
    get:
      tags: [cung-cap]
      summary: Bảng chi phí đã chốt cho cổng người thân (quyền xem chi phí; tên thuốc theo quyền sức khỏe)
      x-fr: [FR-037, FR-019]
      parameters: [ { $ref: '#/components/parameters/NctId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Bang' } } } } }, '403': { $ref: '#/components/responses/Loi' } }
  /nguoi-cao-tuoi/{nctId}/chi-phi/tam-tinh:
    get:
      tags: [cung-cap]
      summary: Chi phí tạm tính theo loại cho khoảng ngày (nhãn "tạm tính, chưa chốt")
      x-fr: [FR-038, FR-022]
      parameters: [ { $ref: '#/components/parameters/NctId' }, { name: tu, in: query, schema: { type: string, format: date } }, { name: den, in: query, schema: { type: string, format: date } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TamTinh' } } } } }
  /chi-phi/ky/{id}/xuat:
    post:
      tags: [cung-cap]
      summary: Xuất dữ liệu đã chốt của kỳ cho kế toán (Kế toán); tệp XLSX hoặc CSV
      x-fr: [FR-039, FR-041]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [phamVi, dinhDang], properties: { phamVi: { type: string, enum: [TOAN_BO, CHUA_TUNG_XUAT] }, dinhDang: { type: string, enum: [XLSX, CSV] } } } } } }
      responses:
        '200': { description: Tệp, content: { application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }, text/csv: { schema: { type: string } } } }
        '403': { $ref: '#/components/responses/Loi' }

components:
  securitySchemes:
    phien: { type: http, scheme: bearer, description: 'Token phiên opaque của 002 (A-02)' }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    NctId: { name: nctId, in: path, required: true, schema: { type: integer, format: int64 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  headers:
    ETag: { schema: { type: string } }
  requestBodies:
    LyDo:
      required: true
      content: { application/json: { schema: { type: object, required: [lyDo], properties: { lyDo: { $ref: '#/components/schemas/LyDo' } } } } }
  responses:
    Loi:
      description: Lỗi theo RFC 9457 (research R-03 của 000)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } }
    LoiChan:
      description: 'DIEU_KIEN_CHUA_THOA, DA_CO_KHOAN, NGOAI_THOI_GIAN_TINH_PHI, NGAY_CHUA_KET_THUC, KHONG_PHAI_SU_KIEN_TINH_PHI, CO_TRONG_DANH_MUC, TONG_AM, CON_KHOAN_NHAP, CON_KHOAN_CHUA_DUYET, CHUA_QUA_NGAY_CUOI, BANG_DA_CHOT, VUOT_SO_DUOC_PHEP, DA_DUOC_XU_LY, CAN_LY_DO_CHAP_NHAN_VUOT, KHONG_HO_TRO_DINH_CHINH'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } }
  schemas:
    LyDo: { type: string, minLength: 1, maxLength: 2000 }
    LoaiNguon: { type: string, enum: [NGAY_LUU_TRU, BUOI_BAN_TRU, KET_QUA_CONG_VIEC, LIEU, LAN_DUNG_PRN, LAN_GIAO, SUAT_AN_NGUOI_THAN, DEM_O_LAI, DIEM_DANH_HOAT_DONG] }
