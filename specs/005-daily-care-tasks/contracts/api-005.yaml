components:
  securitySchemes:
    phien: { type: http, scheme: bearer, description: 'Token phiên opaque của 002 (A-02)' }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    ResidentId: { name: residentId, in: path, required: true, schema: { type: integer, format: int64 } }
    NctId: { name: nctId, in: path, required: true, schema: { type: integer, format: int64 } }
    CaId: { name: caId, in: path, required: true, schema: { type: integer, format: int64 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  headers:
    ETag: { schema: { type: string } }
  requestBodies:
    CarePlanReason:
      required: true
      content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { $ref: '#/components/schemas/Reason' } } } } }
    CatalogReason:
      required: true
      content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { $ref: '#/components/schemas/Reason' } } } } }
    LyDo:
      required: true
      content: { application/json: { schema: { type: object, required: [lyDo], properties: { lyDo: { $ref: '#/components/schemas/LyDo' } } } } }
    DinhChinh:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [kieu, lyDo]
            properties:
              kieu: { type: string, enum: [SUA_NOI_DUNG, HUY_GHI_NHAN] }
              noiDungDung: { type: object, additionalProperties: true }
              lyDo: { $ref: '#/components/schemas/LyDo' }
  responses:
    CarePlanProblem:
      description: Lỗi kế hoạch theo RFC 9457
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/CareCatalogProblem' } } }
    CarePlanConditionProblem:
      description: 'OPEN_REVISION_EXISTS, REVISION_LOCKED, INVALID_EFFECTIVE_DATE và điều kiện chuyển trạng thái không thỏa'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/CareCatalogProblem' } } }

    CareCatalogProblem:
      description: Lỗi danh mục theo RFC 9457
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/CareCatalogProblem' } } }
    Loi:
      description: Lỗi theo RFC 9457 (research R-03 của 000)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } }
    LoiChan:
      description: 'DIEU_KIEN_CHUA_THOA, CHUYEN_KHONG_HOP_LE, DA_CO_PHIEN_BAN_MO, PHIEN_BAN_DA_KHOA, NGAY_HIEU_LUC_KHONG_HOP_LE, BAN_TRU_CHUA_CO_MAT…'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } }
    LoiTheoDong:
      description: 'Lô lập công việc bị từ chối; loiTheoDong liệt kê mọi dòng lỗi với mã ở research C-07'
      content: { application/problem+json: { schema: { allOf: [ { $ref: '#/components/schemas/Loi' }, { type: object, properties: { loiTheoDong: { type: array, items: { type: object, properties: { dong: { type: integer }, ma: { type: array, items: { type: string } } } } } } } ] } } }
    LoiDaDong:
      description: 'CONG_VIEC_DA_DONG (FR-036): kèm người đóng, thời điểm và nội dung bị từ chối để chuyển thành đính chính hoặc Ghi nhận phát sinh'
      content: { application/problem+json: { schema: { allOf: [ { $ref: '#/components/schemas/Loi' }, { type: object, properties: { dongBoi: { type: string }, dongLuc: { type: string, format: date-time }, trangThai: { $ref: '#/components/schemas/TrangThaiCongViec' }, noiDungBiTuChoi: { $ref: '#/components/schemas/GhiNhan' } } } ] } } }
  schemas:
    Importance: { type: string, enum: [NORMAL, IMPORTANT, MANDATORY] }
    Reason: { type: string, minLength: 1, maxLength: 2000 }
    CareCatalogProblem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errorCode: { type: string }
        unmetConditions: { type: array, items: { type: object, properties: { code: { type: string }, description: { type: string }, basis: { type: string } } } }
    LyDo: { type: string, minLength: 1, maxLength: 2000 }
    MucQuanTrong: { type: string, enum: [THUONG, QUAN_TRONG, BAT_BUOC] }
    TrangThaiCongViec: { type: string, enum: [CHUA_DEN_HAN, DEN_HAN, QUA_HAN, HOAN_THANH, HOAN_THANH_TRE, KHONG_THUC_HIEN, HUY] }
    CarePlanStatus: { type: string, enum: [DRAFT, PENDING_APPROVAL, PENDING_EFFECT, EFFECTIVE, EXPIRED, CANCELLED] }
    LoaiCanCu: { type: string, enum: [MUC_KE_HOACH, LAN_DO, BUA, BUOI_HOAT_DONG, THEO_DOI_SAU_NGA, THEO_DOI_TIEP_XUC, CANH_BAO_UONG_NUOC, KIEM_TRA_DAU_CA, GIAM_SAT, PHAT_SINH, GHI_NHAN_PHAT_SINH, LAM_LAI] }
    Loi:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        maLoi: { type: string }
        dieuKienChuaThoa: { type: array, items: { type: object, properties: { ma: { type: string }, moTa: { type: string }, canCu: { type: string } } } }
    CarePlanItem:
      type: object
      required: [taskTypeId, content, frequencyType, performerRole, importance, billable]
      properties:
        id: { type: integer, format: int64 }
        sourceItemId: { type: integer, format: int64 }
        taskTypeId: { type: integer, format: int64 }
        content: { type: string }
        frequencyType: { type: string, enum: [TIMES_PER_DAY, EVERY_N_HOURS, DAYS_OF_WEEK, ONCE_PER_SHIFT] }
        intervalHours: { type: integer }
        timesPerDay: { type: integer }
        startsAt: { type: string, description: 'HH:mm; bỏ trống = trong ca' }
        times: { type: array, items: { type: string } }
        weekdays: { type: array, items: { type: integer, minimum: 1, maximum: 7 } }
        windowBeforeMinutes: { type: integer }
        windowAfterMinutes: { type: integer }
        performerRole: { type: string }
        resultType: { type: string }
        importance: { $ref: '#/components/schemas/Importance' }
        billable: { type: boolean }
        waterTargetMl: { type: integer }
    RiskAgreement:
      type: object
      description: Thỏa thuận lựa chọn có rủi ro (FR-002a, bổ sung 2026-10-18)
      required: [choice, discussedRisks, residentParticipates, assessingDoctorId, selfDeterminationAssessment, decisionMaker, reviewDate]
      properties:
        id: { type: integer, format: int64 }
        sourceAgreementId: { type: integer, format: int64 }
        choice: { type: string, maxLength: 2000 }
        discussedRisks: { type: string, maxLength: 2000 }
        residentParticipates: { type: boolean }
        participants: { type: array, items: { type: object, required: [type, id], properties: { type: { type: string, enum: [FAMILY_MEMBER, STAFF] }, id: { type: integer, format: int64 } } } }
        assessingDoctorId: { type: integer, format: int64 }
        selfDeterminationAssessment: { $ref: '#/components/schemas/SelfDeterminationAssessment' }
        decisionMaker:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [RESIDENT, PATIENT_REPRESENTATIVE, DOCTOR] }
            familyMemberId: { type: integer, format: int64 }
            doctorId: { type: integer, format: int64 }
            reason: { type: string, maxLength: 1000, description: 'Bắt buộc khi DOCTOR: căn cứ không có văn bản nguyện vọng trước và không có người đại diện của người bệnh (bổ sung 2026-10-18)' }
        opinions:
          type: array
          items:
            type: object
            required: [source, content]
            properties:
              source: { $ref: '#/components/schemas/OpinionSource' }
              content: { type: string, maxLength: 2000 }
              recordedBy: { type: string, readOnly: true }
              at: { type: string, format: date-time, readOnly: true }
        reviewDate: { type: string, format: date }
    NonPerformanceReasonType:
      type: object
      properties: { id: { type: integer, format: int64 }, version: { type: integer, readOnly: true, description: 'Phiên bản để gửi If-Match khi sửa; chủ dự án duyệt 2026-10-31' }, name: { type: string }, fixed: { type: boolean }, status: { type: string, enum: [ACTIVE, INACTIVE] } }
    CarePlan:
      type: object
      properties:
