openapi: 3.1.0
info:
  title: Elder Care – Feature 005 (chăm sóc hằng ngày)
  version: 1.0.0-design
  description: |
    Hợp đồng REST của feature 005 (module M04). Quy ước chung theo research R-03 của 000:
    tiền tố /api/v1, lỗi RFC 9457 có maLoi và dieuKienChuaThoa[], If-Match cho lệnh sửa nội dung
    (mục kế hoạch ở Nháp, danh mục), Idempotency-Key cho mọi lệnh ghi.
    Lệnh chuyển trạng thái (phiên bản kế hoạch, công việc, có mặt) không dùng If-Match; backend khóa dòng và kiểm tra lại
    trên trạng thái mới (research C-03). Lần ghi thứ hai trên công việc đã đóng trả 409 CONG_VIEC_DA_DONG kèm dongBoi
    và noiDungBiTuChoi (FR-036).
    Bản ghi ngoại tuyến (ghi nhận, không thực hiện, Ghi nhận phát sinh) đi qua endpoint đồng bộ chung của api-002
    với loại M04.KET_QUA_CONG_VIEC, M04.GHI_NHAN_PHAT_SINH (research C-14); nội dung giống thân của lệnh trực tuyến.
    Các lệnh Cho tạm vắng, Ghi nhận trở về, Hoàn tất tiếp nhận, Kết thúc lưu trú, Qua đời là endpoint của api-001;
    005 chỉ tham gia bằng bean (module-interfaces mục 1.1). Đính chính đi qua khung của api-000 với loại của 005.
    Trường SUC_KHOE bị bỏ khỏi phản hồi theo 002 và liệt kê trong truongBiAn.
    Truy vết: mỗi operation có x-fr (FR của spec 005) và x-br khi có.
servers:
  - url: /api/v1
security:
  - phien: []
tags:
  - { name: ke-hoach, description: 'UC-22, UC-23; mục A' }
  - { name: co-mat, description: 'UC-28; mục B' }
  - { name: cong-viec, description: 'UC-24, UC-27; mục C, G' }
  - { name: checklist, description: 'UC-25, UC-26; mục D' }
  - { name: danh-muc, description: 'Loại công việc, giá trị kết quả; mục E' }
  - { name: thoi-khoa-bieu, description: '8.2; mục H' }

paths:
  # T002: hợp đồng công tắc được chủ dự án duyệt ngày 2026-10-26.
  /testing/fakes/{module}:
    put:
      tags: [testing]
      operationId: setDailyCareFakeEnabled
      summary: Bật hoặc tắt các nguồn giả cùng module
      description: |
        Chỉ đăng ký khi import FakeM04Config từ test classpath và có profile test hoặc demo.
        Không có trong JAR production hoặc ứng dụng chạy bình thường. Tắt nguồn gây lỗi rõ ràng
        khi SPI được gọi; bật lại giữ fixture đã đặt. Không ghi dữ liệu nghiệp vụ.
      parameters:
        - name: module
          in: path
          required: true
          schema: { type: string, enum: ['006', '007', '008', '011', '012', '014'] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '204': { description: Đã cập nhật công tắc }
        '400': { description: Module không hỗ trợ hoặc thiếu enabled hợp lệ }
  # ---------------- Kế hoạch chăm sóc ----------------
  /residents/{residentId}/care-plans:
    get:
      x-implementation-phase: 3
      operationId: listCarePlans
      tags: [ke-hoach]
      summary: Lịch sử phiên bản kế hoạch của một người cao tuổi
      description: 'Nhân viên chăm sóc chỉ thấy phiên bản Hiệu lực trong phạm vi; Hành chính, Bếp, Người thân 403 (FR-007). Kèm dấu noEffectivePlan (FR-009).'
      x-fr: [FR-007, FR-008, FR-009]
      parameters: [ { $ref: '#/components/parameters/ResidentId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CarePlan' } } } } }, '403': { $ref: '#/components/responses/CarePlanProblem' } }
    post:
      x-implementation-phase: 3
      operationId: createCarePlan
      tags: [ke-hoach]
      summary: Lập phiên bản Nháp (Điều dưỡng)
      description: 'Nội dung khởi đầu là bản sao phiên bản Hiệu lực (copyCurrent = true) hoặc trống. Đã có phiên bản Nháp/Chờ duyệt/Chờ hiệu lực thì 409 OPEN_REVISION_EXISTS. Không có đường tạo tự động từ đánh giá (Q-280).'
      x-fr: [FR-001, FR-003, FR-004]
      parameters: [ { $ref: '#/components/parameters/ResidentId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { copyCurrent: { type: boolean, default: true } } } } } }
      responses:
        '201': { description: Đã lập, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CarePlan' } } } }
        '409': { $ref: '#/components/responses/CarePlanConditionProblem' }
  /care-plans/{id}:
    get:
      x-implementation-phase: 3
      operationId: getCarePlan
      tags: [ke-hoach]
      summary: Xem phiên bản kèm mục
      x-fr: [FR-001, FR-002, FR-007]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CarePlan' } } } } }
  /care-plans/{id}/items:
    put:
      x-implementation-phase: 3
      operationId: replaceCarePlanItems
      tags: [ke-hoach]
      summary: Thay toàn bộ danh sách mục của bản Nháp
      description: 'Chỉ khi Nháp; phiên bản khác 409 REVISION_LOCKED (BR-M04-19). Mục thiếu khung nhận khung của loại công việc rồi CFG-M04-02.'
      x-fr: [FR-002, FR-003, FR-004]
      x-br: [BR-M04-19]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CarePlanItem' } } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/CarePlanConditionProblem' }, '412': { $ref: '#/components/responses/CarePlanProblem' }, '422': { $ref: '#/components/responses/CarePlanProblem' } }
  /care-plans/{id}/risk-agreements:
    put:
      x-implementation-phase: 3
      operationId: replaceCarePlanRiskAgreements
      tags: [ke-hoach]
      summary: Thay toàn bộ danh sách thỏa thuận lựa chọn có rủi ro của bản Nháp (bổ sung 2026-10-18)
      description: |
        Chỉ khi Nháp; phiên bản khác 409 REVISION_LOCKED. Thỏa thuận không tạo, không chặn công việc (FR-002a).
        Người quyết định khớp selfDeterminationAssessment.canSelfDetermine; ý kiến có nguồn (001 FR-023g); người cao tuổi tự quyết được thì residentParticipates = true.
      x-fr: [FR-002a, FR-004]
      x-br: [BR-M04-19, BR-M01-14, BR-M01-15]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RiskAgreement' } } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/CarePlanConditionProblem' }, '412': { $ref: '#/components/responses/CarePlanProblem' }, '422': { $ref: '#/components/responses/CarePlanProblem' } }
  /care-plans/{id}/submit:
    post:
      x-implementation-phase: 3
      operationId: submitCarePlan
      tags: [ke-hoach]
      summary: Gửi duyệt kèm ngày hiệu lực đề xuất
      description: 'Có ít nhất một mục, mọi mục đủ trường FR-002; ngày hiệu lực muộn hơn hôm nay; bắt buộc changeReason khi đã có phiên bản trước.'
      x-fr: [FR-003, FR-005]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [effectiveFrom], properties: { effectiveFrom: { type: string, format: date }, changeReason: { $ref: '#/components/schemas/Reason' } } } } } }
      responses: { '200': { description: Chờ duyệt }, '409': { $ref: '#/components/responses/CarePlanConditionProblem' } }
  /care-plans/{id}/approve:
    post:
      x-implementation-phase: 3
      operationId: approveCarePlan
      tags: [ke-hoach]
      summary: Duyệt (Bác sĩ; Điều dưỡng được gán quyền)
      description: 'Ngày hiệu lực phải muộn hơn ngày duyệt, ngược lại 409 INVALID_EFFECTIVE_DATE và người duyệt dùng Trả lại (Q-34, FR-004). Người lập tự duyệt: bắt buộc reason, đánh dấu tự duyệt (Q-10). Không sửa nội dung, ngày.'
      x-fr: [FR-003, FR-004, FR-005]
      x-br: [BR-M04-19]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { reason: { $ref: '#/components/schemas/Reason' } } } } } }
      responses: { '200': { description: Chờ hiệu lực }, '403': { $ref: '#/components/responses/CarePlanProblem' }, '409': { $ref: '#/components/responses/CarePlanConditionProblem' } }
  /care-plans/{id}/return:
    post:
      x-implementation-phase: 3
      operationId: returnCarePlan
      tags: [ke-hoach]
      summary: Trả lại về Nháp (bắt buộc lý do)
      x-fr: [FR-003]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/CarePlanReason' }
      responses: { '200': { description: Nháp }, '409': { $ref: '#/components/responses/CarePlanConditionProblem' }, '422': { $ref: '#/components/responses/CarePlanProblem' } }
  /care-plans/{id}/cancel:
    post:
      x-implementation-phase: 3
      operationId: cancelCarePlan
      tags: [ke-hoach]
      summary: Hủy phiên bản Nháp hoặc Chờ duyệt (người lập, người có quyền duyệt)
      x-fr: [FR-003]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/CarePlanReason' }
      responses: { '200': { description: Đã hủy }, '409': { $ref: '#/components/responses/CarePlanConditionProblem' } }
  /care-plans/{id}/withdraw-approval:
    post:
      x-implementation-phase: 3
      operationId: withdrawCarePlanApproval
      tags: [ke-hoach]
      summary: Thu hồi duyệt trước ngày hiệu lực
      x-fr: [FR-003]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/CarePlanReason' }
      responses: { '200': { description: Đã hủy }, '409': { $ref: '#/components/responses/CarePlanConditionProblem' } }
  /care-plans/compare:
    get:
      x-implementation-phase: 3
      operationId: compareCarePlans
      tags: [ke-hoach]
      summary: So sánh hai phiên bản (mục thêm, bớt, đổi)
      x-fr: [FR-008]
      parameters:
        - { name: from, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: to, in: query, required: true, schema: { type: integer, format: int64 } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CarePlanComparison' } } } } }

  # ---------------- Có mặt bán trú ----------------
  /co-mat-ban-tru:
    get:
      tags: [co-mat]
      summary: Trạng thái có mặt theo ngày của khu bán trú
      x-fr: [FR-012, FR-013, FR-016, FR-049]
      parameters: [ { name: ngay, in: query, required: true, schema: { type: string, format: date } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CoMat' } } } } } }
  /co-mat-ban-tru/diem-danh-den:
    post:
      tags: [co-mat]
      summary: Điểm danh đến (Hành chính, Nhân viên chăm sóc, Điều dưỡng)
      description: 'Từ Chưa đến, Vắng không báo; hoặc ngày không có lịch / ngày khu nghỉ (buổi phát sinh, Q-140). Người cao tuổi phải Đang lưu trú. Chỉ trực tuyến. Báo Người phụ trách ca khu bán trú (FR-018).'
      x-fr: [FR-013, FR-018, FR-016]
      x-br: [BR-M04-02]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [nctId], properties: { nctId: { type: integer, format: int64 }, thoiDiem: { type: string, format: date-time, description: 'Mặc định là lúc lệnh' } } } } } }
      responses: { '200': { description: Có mặt, content: { application/json: { schema: { $ref: '#/components/schemas/CoMat' } } } }, '409': { $ref: '#/components/responses/LoiChan' } }
  /co-mat-ban-tru/{id}/diem-danh-ve:
    post:
      tags: [co-mat]
      summary: Điểm danh về với bản ghi đón của 012
      description: 'Bản ghi đón hợp lệ hoặc loại Tự về khi dấu "được tự về" có tác dụng (Q-125). Viện đưa về đi qua lệnh ghi bàn giao của 012 (Q-295). Hủy công việc Chưa đến hạn sau giờ về (FR-019).'
      x-fr: [FR-013, FR-019]
      x-br: [BR-M04-02]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [banGhiDonId], properties: { banGhiDonId: { type: integer, format: int64 }, thoiDiem: { type: string, format: date-time } } } } } }
      responses: { '200': { description: Đã về, content: { application/json: { schema: { type: object, properties: { coMat: { $ref: '#/components/schemas/CoMat' }, congViecDaHuy: { type: array, items: { type: integer, format: int64 } } } } } } }, '409': { $ref: '#/components/responses/LoiChan' } }
  /diem-danh-ban-tru/{id}/dinh-chinh:
    post:
      tags: [co-mat]
      summary: Đính chính giờ đến/về (loại M04.DIEM_DANH_BAN_TRU)
      x-fr: [FR-015]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/DinhChinh' }
      responses: { '201': { description: Đã lưu hoặc tạo yêu cầu (000 cách C) }, '403': { $ref: '#/components/responses/Loi' } }

  # ---------------- Lập công việc, vòng đời ----------------
  /ca/{caId}/du-lieu-nguon:
    get:
      tags: [cong-viec]
      summary: Dữ liệu nguồn của ca để người lập đối chiếu
      description: 'Mục kế hoạch Hiệu lực, lần đo, bữa, buổi đã đăng ký, việc theo dõi, người có mặt và phân công. Chỉ là dữ liệu đã có; không có danh sách công việc đề xuất hay chép sẵn (Q-307).'
      x-fr: [FR-017]
      parameters: [ { $ref: '#/components/parameters/CaId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DuLieuNguonCa' } } } } }
  /ca/{caId}/cong-viec:
    get:
      tags: [cong-viec]
      summary: Công việc đã lập của ca (Người phụ trách ca, Trưởng tầng, Quản lý viện)
      x-fr: [FR-017, FR-045]
      parameters: [ { $ref: '#/components/parameters/CaId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CongViec' } } } } } }
  /ca/{caId}/cong-viec/lap:
    post:
      tags: [cong-viec]
      summary: Lập công việc của ca theo lô
      description: |
        Người phụ trách ca từ batDauCa − CFG-M04-01; Trưởng tầng cho mọi ca đã công bố của tầng. Mọi dòng được kiểm tra
        (research C-07); một dòng lỗi thì cả lô bị từ chối, 409 kèm loiTheoDong. Trạng thái lúc lập theo đồng hồ (BR-M04-26).
      x-fr: [FR-002, FR-006, FR-017, FR-018, FR-021, FR-023, FR-024, FR-029]
      x-br: [BR-M04-01, BR-M04-02, BR-M04-24, BR-M04-26, BR-M04-28, BR-M09-01]
      parameters: [ { $ref: '#/components/parameters/CaId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: array, minItems: 1, items: { $ref: '#/components/schemas/CongViecGhi' } } } } }
      responses:
        '201': { description: Đã lập, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CongViec' } } } } }
        '403': { $ref: '#/components/responses/Loi' }
        '409': { $ref: '#/components/responses/LoiTheoDong' }
  /cong-viec/phat-sinh:
    post:
      tags: [cong-viec]
      summary: Tạo công việc phát sinh (Trưởng tầng, Điều dưỡng)
      x-fr: [FR-025, FR-023]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CongViecGhi' } } } }
      responses: { '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/CongViec' } } } }, '409': { $ref: '#/components/responses/LoiChan' } }
  /cong-viec/{id}/lam-lai:
    post:
      tags: [cong-viec]
      summary: Lập công việc làm lại sau kiểm tra chất lượng Không đạt (người kiểm tra của 014)
      x-fr: [FR-026a]
      x-br: [BR-M04-23]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ketQuaKiemTraId, thoiDiemDuKien], properties: { ketQuaKiemTraId: { type: integer, format: int64 }, thoiDiemDuKien: { type: string, format: date-time }, nguoiThucHienId: { type: integer, format: int64 }, congViecChung: { type: boolean } } } } } }
      responses: { '201': { description: Đã lập }, '409': { $ref: '#/components/responses/LoiChan' } }
  /cong-viec/{id}:
    get:
      tags: [cong-viec]
      summary: Xem công việc, kết quả và lịch sử xử lý
      x-fr: [FR-023, FR-028, FR-046]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CongViecChiTiet' } } } } }
  /cong-viec/{id}/huy:
    post:
      tags: [cong-viec]
      summary: Hủy công việc Chưa đến hạn (chỉ Trưởng tầng, bắt buộc lý do)
      x-fr: [FR-026, FR-022]
      x-br: [BR-M04-03]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: Hủy }, '403': { $ref: '#/components/responses/Loi' }, '409': { $ref: '#/components/responses/LoiChan' } }
  /cong-viec/{id}/nhan-viec:
    post:
      tags: [checklist]
      summary: Nhận công việc chung, hoặc Người phụ trách ca nhận việc về mình
      x-fr: [FR-031, FR-033]
      x-br: [BR-M04-13, BR-M09-01]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: Đã nhận }, '409': { $ref: '#/components/responses/LoiChan' } }
  /cong-viec/{id}/phan-lai:
    post:
      tags: [cong-viec]
      summary: Phân lại công việc chưa đóng (Trưởng tầng; Người phụ trách ca trong phạm vi ca)
      x-fr: [FR-031, FR-045]
      x-br: [BR-M09-01]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [nguoiNhanId], properties: { nguoiNhanId: { type: integer, format: int64 }, lyDo: { $ref: '#/components/schemas/LyDo' } } } } } }
      responses: { '200': { description: Đã phân lại }, '403': { $ref: '#/components/responses/Loi' }, '409': { $ref: '#/components/responses/LoiChan' } }
  /cong-viec/qua-han:
    get:
      tags: [cong-viec]
      summary: Danh sách công việc Quá hạn (tầng của người gọi; Quản lý viện toàn viện)
      x-fr: [FR-045]
      parameters: [ { name: tangKhuVucId, in: query, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CongViec' } } } } } }

  # ---------------- Checklist, ghi nhận ----------------
  /checklist:
    get:
      tags: [checklist]
      summary: Checklist của tôi trong ca
      description: 'Công việc được giao, tồn, công việc chung phù hợp; điều dưỡng thêm liều thuốc, bàn giao, cảnh báo, kiểm tra đầu ca. Sắp theo thời điểm, Quá hạn lên đầu. Kèm taiLuc cho app lưu ngoại tuyến (FR-035).'
      x-fr: [FR-029, FR-030, FR-031, FR-035]
      parameters: [ { name: caId, in: query, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Checklist' } } } } }
  /cong-viec/{id}/ghi-nhan:
    post:
      tags: [checklist]
      summary: Ghi nhận hoàn thành
      description: |
        Quyền: được giao, Trưởng tầng; Người phụ trách ca chỉ khi Quá hạn và trong phạm vi ca (FR-033). Đến hạn → Hoàn thành;
        Quá hạn → Hoàn thành (thời điểm thực hiện trong khung) hoặc Hoàn thành trễ (bắt buộc lý do với Quan trọng, Bắt buộc).
        Đo chỉ số: 422 GIA_TRI_BI_CHAN, hoặc 202 CHO_DO_LAI (công việc chưa đóng). Ăn uống chưa xác nhận phục vụ: 409
        CHUA_XAC_NHAN_PHUC_VU (FR-040a). Công việc đã đóng: 409 CONG_VIEC_DA_DONG (FR-036).
      x-fr: [FR-026, FR-033, FR-034, FR-035, FR-036, FR-040a, FR-041, FR-044]
      x-br: [BR-M04-06, BR-M04-10, BR-M04-12]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GhiNhan' } } } }
      responses:
        '200': { description: Đã đóng, content: { application/json: { schema: { $ref: '#/components/schemas/CongViecChiTiet' } } } }
        '202': { description: Chờ xác nhận đo lại }
        '403': { $ref: '#/components/responses/Loi' }
        '409': { $ref: '#/components/responses/LoiDaDong' }
        '422': { $ref: '#/components/responses/Loi' }
  /cong-viec/{id}/khong-thuc-hien:
    post:
      tags: [checklist]
      summary: Ghi nhận không thực hiện (bắt buộc loại lý do; ghi chú tùy chọn)
      description: 'Sửa 2026-10-18 (Q-350): loaiLyDoId là loại đang hiệu lực của danh mục loai-ly-do-khong-thuc-hien; "Người cao tuổi từ chối" luôn có.'
      x-fr: [FR-026, FR-027, FR-028a, FR-033, FR-044]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [loaiLyDoId], properties: { loaiLyDoId: { type: integer, format: int64 }, ghiChu: { type: string, maxLength: 2000 } } } } } }
      responses: { '200': { description: Không thực hiện }, '409': { $ref: '#/components/responses/LoiDaDong' } }
  /ghi-nhan-phat-sinh:
    post:
      tags: [checklist]
      summary: Ghi nhận phát sinh (TT, ĐD, CS)
      description: 'Tạo công việc phát sinh giao cho người ghi và ghi kết quả trong một lệnh, vào thẳng Hoàn thành (Q-36). Có công việc cùng loại Đến hạn/Quá hạn mà chưa gửi daXemCongViecCungLoai thì 200 trả congViecCungLoai, chưa ghi gì.'
      x-fr: [FR-025, FR-026, FR-035]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/GhiNhan'
                - type: object
                  required: [nctId, loaiCongViecId]
                  properties:
                    nctId: { type: integer, format: int64 }
                    loaiCongViecId: { type: integer, format: int64 }
                    daXemCongViecCungLoai: { type: boolean }
                    congViecGocId: { type: integer, format: int64, description: 'Khi chuyển từ bản ghi bị từ chối vì trạng thái cuối (CHK056)' }
      responses:
        '200': { description: Có công việc cùng loại đang mở, content: { application/json: { schema: { type: object, properties: { congViecCungLoai: { type: array, items: { $ref: '#/components/schemas/CongViec' } } } } } } }
        '201': { description: Đã ghi, content: { application/json: { schema: { $ref: '#/components/schemas/CongViecChiTiet' } } } }
        '409': { $ref: '#/components/responses/LoiChan' }
  /ket-qua-ghi-nhan/{id}/dinh-chinh:
    post:
      tags: [checklist]
      summary: Đính chính kết quả (người ghi gốc, Trưởng tầng, Người phụ trách ca của tầng)
      description: 'Loại M04.KET_QUA_GHI_NHAN; kiểu SUA_NOI_DUNG hoặc HUY_GHI_NHAN; công việc giữ trạng thái (FR-037). Kết quả đo chỉ số đính chính ở 007.'
      x-fr: [FR-037]
      x-br: [BR-M04-14]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/DinhChinh' }
      responses: { '201': { description: Đã lưu }, '403': { $ref: '#/components/responses/Loi' } }
  /nguoi-cao-tuoi/{nctId}/ket-qua-ghi-nhan:
    get:
      tags: [checklist]
      summary: Lịch sử kết quả ghi nhận (gồm Bác sĩ chỉ xem)
      x-fr: [FR-037, FR-049]
      parameters:
        - { $ref: '#/components/parameters/NctId' }
        - { name: tu, in: query, schema: { type: string, format: date-time } }
        - { name: den, in: query, schema: { type: string, format: date-time } }
        - { name: loai, in: query, schema: { type: array, items: { type: string } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/KetQua' } } } } } }

