      x-fr: [FR-028a]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NonPerformanceReasonType' } } } } } }
    post:
      x-implementation-phase: 2
      tags: [danh-muc]
      summary: Tạo loại lý do (Quản lý viện)
      x-fr: [FR-028a]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
