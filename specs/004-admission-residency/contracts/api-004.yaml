  # ---------------- Kết thúc ----------------
  /residency-endings:
    post:
      tags: [residency-ending]
      summary: Lập hồ sơ kết thúc lưu trú (Hành chính; Bác sĩ với Xuất viện, Chuyển cơ sở vì lý do y tế)
      description: |
        Người cao tuổi Đang lưu trú, Tạm vắng hoặc Điều trị tại bệnh viện; tối đa một hồ sơ chưa ở trạng thái cuối (FR-062).
        Chuyển cơ sở thiếu nơi chuyển đến: 422. Trong cùng một lần tạo bảng kỳ cuối nháp ở 010 tới ngày kết thúc dự kiến (FR-066).
      x-fr: [FR-062, FR-063, FR-066]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [residentId, endCase, expectedEndDate, reason, requestedBy]
              properties:
                residentId: { type: integer, format: int64 }
                endCase: { type: string, enum: [CONTRACT_EXPIRED, DISCHARGE, TRANSFER_TO_ANOTHER_FACILITY, CONTRACT_TERMINATION] }
                medicalReason: { type: boolean, default: false }
                expectedEndDate: { type: string, format: date }
                destination: { type: string }
                requestedBy: { type: string }
                reason: { $ref: '#/components/schemas/Reason' }
      responses: { '201': { description: Đã lập, content: { application/json: { schema: { $ref: '#/components/schemas/ResidencyEnding' } } } }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Problem' } }
  /residency-endings/{id}:
    get:
      tags: [residency-ending]
      summary: Xem hồ sơ kết thúc
      x-fr: [FR-062, FR-067, FR-068]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ResidencyEnding' } } } } }
  /residency-endings/{id}/conditions:
    get:
      tags: [residency-ending]
      summary: Danh sách điều kiện kết thúc (a) → (h)
      description: 'Đạt / Chưa đạt / Đạt (ngoại lệ) / Tự động, kèm căn cứ; cùng nguồn với điều kiện của lệnh Kết thúc lưu trú (research T-09). (Bổ sung 2026-10-22, FR-063 (h), FR-064) Dòng (h) gộp END_H_SETTLEMENT và END_H_SETTLEMENT_CONFIRMATION của 017; Đạt (ngoại lệ) chỉ khi ý tiền được miễn và Kế toán đã xác nhận quyết toán.'
      x-fr: [FR-063, FR-064, FR-068]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConditionList' } } } } }
  /residency-endings/{id}/change-date:
    post:
      tags: [residency-ending]
      summary: Đổi ngày kết thúc dự kiến
      description: 'Mốc dừng tính phí và kỳ cuối nháp tính lại; gỡ dấu "quá ngày dự kiến" khi ngày mới không sớm hơn hôm nay (FR-066, FR-066a).'
      x-fr: [FR-066, FR-066a, FR-067]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
