      description: 'Hành chính, Trưởng tầng (phạm vi), Điều dưỡng xem; người thân xem lượt vắng của người mình liên quan (FR-049).'
      x-fr: [FR-048, FR-049]
      parameters: [ { name: nctId, in: query, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LuotVang' } } } } } }
  /luot-vang/{id}:
