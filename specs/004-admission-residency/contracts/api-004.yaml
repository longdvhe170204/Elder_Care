                sessionId: { type: integer, format: int64, description: 'Bỏ trống là cả ngày' }
                familyNotifiedAt: { type: string, format: date-time }
      responses: { '201': { description: Đã ghi, content: { application/json: { schema: { type: object, properties: { withinNoticePeriod: { type: boolean } } } } } } }
  /day-care-closure-days:
