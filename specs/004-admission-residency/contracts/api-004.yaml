      summary: Ghi nhận đã ký (hợp đồng Hiệu lực)
      description: |
        Bắt buộc ngày ký, người đại diện hợp lệ (012, DBR-02), bản scan. Nội trú: phải có phân bổ giường bắt đầu không muộn hơn ngày bắt đầu (FR-021).
        Chồng thời gian với hợp đồng Hiệu lực khác: 409 (FR-022, DBR-06). Bán trú: kiểm sức chứa khu nghỉ (003 FR-039).
        Thành công: ghi phiên bản nội dung 0 với đơn giá của mọi khoản (FR-036).
      x-fr: [FR-021, FR-022, FR-036]
      x-br: [BR-M02-08, BR-M03-03]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signedDate, signingRepresentativeId, scanFileId]
              properties:
                signedDate: { type: string, format: date }
                signingRepresentativeId: { type: integer, format: int64 }
                scanFileId: { type: integer, format: int64, description: 'Tệp đã tải lên qua FileApi (common.tep)' }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ContractResult' } } } }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Problem' } }
