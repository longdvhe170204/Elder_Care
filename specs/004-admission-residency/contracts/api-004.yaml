      x-fr: [FR-020]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/ReasonBody' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Problem' } }
  /contracts/{id}/content:
    get:
      tags: [contracts]
      summary: Nội dung hợp đồng hiệu lực tại ngày D
      description: 'Phiên bản nội dung có hiệu lực từ lớn nhất không muộn hơn D (FR-024, BR-M02-09).'
      x-fr: [FR-024]
      x-br: [BR-M02-09]
      parameters: [ { $ref: '#/components/parameters/Id' }, { name: date, in: query, required: true, schema: { type: string, format: date } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ContractContent' } } } }, '404': { $ref: '#/components/responses/Problem' } }
