      tags: [residency-ending]
      summary: Hủy hồ sơ kết thúc
      description: 'Các ngày sau mốc đã dừng lại là sự kiện tính phí (FR-066).'
      x-fr: [FR-066, FR-067]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/ReasonBody' }
      responses: { '200': { description: OK } }
  /residency-endings/{id}/handover:
    post:
      tags: [residency-ending]
      summary: Ghi nhận bàn giao người cao tuổi (điều kiện e)
      x-fr: [FR-063]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientType, handoverAt, handoverStaffId]
              properties:
                recipientType: { type: string, enum: [FAMILY_MEMBER, RECEIVING_FACILITY] }
                familyMemberId: { type: integer, format: int64 }
                facilityName: { type: string }
                handoverAt: { type: string, format: date-time }
                handoverStaffId: { type: integer, format: int64 }
      responses: { '201': { description: Đã ghi }, '422': { $ref: '#/components/responses/Problem' } }
  /residency-endings/{id}/request-exception:
    post:
      tags: [residency-ending]
      summary: Lập yêu cầu ngoại lệ cho một điều kiện (a)–(d), (h)
      description: 'Yêu cầu M02.ENDING_EXCEPTION; Kế toán chỉ với END_H_SETTLEMENT; END_E_HANDOVER và END_H_SETTLEMENT_CONFIRMATION (bổ sung 2026-10-22) không có ngoại lệ (FR-064).'
      x-fr: [FR-064]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conditionCode, reason]
              properties:
                conditionCode: { type: string, enum: [END_A_COSTS, END_B_BELONGINGS, END_C_STORED_MEDICATION, END_D_ALERTS_INCIDENTS, END_H_SETTLEMENT] }
                reason: { $ref: '#/components/schemas/Reason' }
      responses: { '201': { description: Đã lập yêu cầu, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRequestRef' } } } }, '403': { $ref: '#/components/responses/Problem' } }

  # ---------------- Qua đời ----------------
  /residents/{residentId}/death-record:
    get:
      tags: [death]
      summary: Bản ghi qua đời
      description: 'cause bị bỏ với Hành chính, Kế toán (kể cả người đã ghi) và người thân không thỏa chú thích ¹ (FR-069, BR-M02-21).'
      x-fr: [FR-069]
      x-br: [BR-M02-21]
      parameters: [ { name: residentId, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DeathRecord' } } } }, '404': { $ref: '#/components/responses/Problem' } }
  /death-records/{id}/correct:
    post:
      tags: [death]
      summary: Bổ sung nguyên nhân hoặc sửa sai bản ghi qua đời bằng đính chính
      x-fr: [FR-069]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/CorrectionBody' }
      responses: { '201': { description: Đã đính chính hoặc đã lập yêu cầu } }
  /residents/{residentId}/post-death-tasks:
    get:
      tags: [death]
      summary: Danh sách việc bắt buộc sau qua đời
      description: 'Trạng thái từng mục lấy từ module sở hữu tại lúc xem (FR-071); mọi mục xong thì hồ sơ lưu trú Đã đóng (FR-072).'
      x-fr: [FR-071, FR-072]
      parameters: [ { name: residentId, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PostDeathTaskList' } } } } }
  /residents/{residentId}/post-death-tasks/request-settlement-exception:
    post:
      tags: [death]
      summary: Lập yêu cầu ngoại lệ cho mục quyết toán số dư và tiền cọc khi gia đình còn nợ (Hành chính, Kế toán; bổ sung 2026-10-22, Q-387)
      description: 'Yêu cầu M02.ENDING_EXCEPTION mã END_H_SETTLEMENT, căn cứ là danh sách việc sau qua đời đang mở; Quản lý viện duyệt. Chỉ thay ba ý về tiền; Kế toán vẫn phải xác nhận quyết toán (017 FR-023, FR-034). Mục khác không có ngoại lệ.'
      x-fr: [FR-071a]
      parameters: [ { name: residentId, in: path, required: true, schema: { type: integer, format: int64 } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/ReasonBody' }
      responses: { '201': { description: Đã lập yêu cầu, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRequestRef' } } } }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' } }

components:
  securitySchemes:
    session: { type: http, scheme: bearer, description: 'Token phiên opaque của 002 (A-02)' }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    Cursor: { name: cursor, in: query, description: Khóa trang kế tiếp, schema: { type: string } }
  headers:
    ETag: { schema: { type: string } }
  requestBodies:
    ReasonBody:
      required: true
      content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { $ref: '#/components/schemas/Reason' } } } } }
    CorrectionBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [type, reason]
            properties:
              type: { type: string, enum: [EDIT_CONTENT, CANCEL_RECORD] }
              correctedContent: { type: object, additionalProperties: true }
              reason: { $ref: '#/components/schemas/Reason' }
  responses:
    Problem:
      description: Lỗi theo RFC 9457 (research R-03 của 000)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: 'CONDITION_NOT_MET (đủ danh sách), INVALID_TRANSITION, APPLICATION_ALREADY_EXISTS, CONTRACT_OVERLAP…'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Reason: { type: string, minLength: 1, maxLength: 2000 }
    CareLevelCode: { type: string, enum: [BASIC, REGULAR, SPECIAL] }
    ResidenceType: { type: string, enum: [LONG_TERM_RESIDENTIAL, SHORT_TERM_RESIDENTIAL, DAY_CARE] }
    ApplicationStatus: { type: string, enum: [IN_PROGRESS, WAITING, ADMITTED, CANCELLED] }
    WaitingListStatus: { type: string, enum: [WAITING, CONTACTED, ADMITTED, DECLINED, WAITING_CANCELLED] }
    ContractStatus: { type: string, enum: [DRAFT, PENDING_SIGNATURE, ACTIVE, ENDED, TERMINATED, CANCELLED] }
    ServiceType: { type: string, enum: [CARE, RESIDENCY_FEE, DAY_CARE_SESSION, REHABILITATION, ACTIVITY, MEDICAL_ESCORT, INJECTION, FAMILY_STAY, MEAL, FACILITY_SUPPLIED_MEDICATION, OTHER] }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errorCode: { type: string }
        unmetConditions: { type: array, items: { $ref: '#/components/schemas/Condition' } }
        currentValue: { type: object }
    Condition:
      type: object
      properties:
        code: { type: string, description: 'Ví dụ ADM_B_CONTRACT, ADM_C_DEPOSIT, ADM_E_CONTRACT_LEVEL, END_E_HANDOVER, CONTRACT_OVERLAP' }
        description: { type: string }
        basis: { type: string, description: 'BR/FR' }
        module: { type: string }
        waivable: { type: boolean }
    Warning:
      type: object
      properties: { code: { type: string }, description: { type: string } }
    ApprovalRequestRef:
      type: object
      properties: { approvalRequestId: { type: integer, format: int64 }, type: { type: string }, status: { type: string } }
    ConditionLine:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [MET, NOT_MET, NOT_APPLICABLE, MET_BY_EXCEPTION, AUTOMATIC] }
        basis: { type: string }
        module: { type: string }
        exception: { type: object, properties: { approvalRequestId: { type: integer, format: int64 }, approver: { type: string } } }
    ConditionList:
      type: object
      properties:
        conditions: { type: array, items: { $ref: '#/components/schemas/ConditionLine' } }
        warnings: { type: array, items: { $ref: '#/components/schemas/Warning' } }
        admissionOpinion: { oneOf: [ { $ref: '#/components/schemas/AdmissionOpinion' }, { type: 'null' } ], description: 'Chỉ có ở danh sách điều kiện tiếp nhận (FR-004a)' }
    OpinionSource:
      type: object
      description: Như api-001.yaml OpinionSource (001 FR-023g); bổ sung 2026-10-18
      required: [type]
      properties:
        type: { type: string, enum: [RESIDENT, FAMILY_MEMBER, OBSERVING_STAFF] }
        familyMemberId: { type: [integer, 'null'], format: int64 }
    AdmissionOpinion:
      type: object
      properties:
        id: { type: integer, format: int64 }
        opinion: { type: string, enum: [AGREE, DISAGREE, UNABLE_TO_EXPRESS] }
        source: { $ref: '#/components/schemas/OpinionSource' }
        note: { type: string }
        recordedBy: { type: string }
        at: { type: string, format: date-time }
        status: { type: string, enum: [ACTIVE, SUPERSEDED] }
    Progress:
      type: object
      properties:
        steps: { type: array, items: { type: object, properties: { name: { type: string, enum: [APPLICATION, INFORMATION_COLLECTION, ASSESSMENT, RESIDENCE_TYPE_DETERMINATION, CARE_DETERMINATION, SERVICE_DETERMINATION, CONDITION_CHECK, ADMISSION] }, done: { type: boolean }, basis: { type: string } } } }
    AdmissionApplicationInput:
      type: object
      required: [residentId, applicationDate, desiredResidenceType, expectedCareLevel]
      properties:
        residentId: { type: integer, format: int64 }
        applicationDate: { type: string, format: date }
        contactPerson: { type: string }
        needs: { type: string }
        desiredResidenceType: { $ref: '#/components/schemas/ResidenceType' }
        expectedCareLevel: { $ref: '#/components/schemas/CareLevelCode' }
        desiredAdmissionDate: { type: string, format: date }
        note: { type: string }
    AdmissionApplication:
      allOf:
        - $ref: '#/components/schemas/AdmissionApplicationInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            status: { $ref: '#/components/schemas/ApplicationStatus' }
            waitingListEntryId: { type: integer, format: int64 }
            admissionOpinion: { type: array, description: 'Ý kiến về việc vào ở, hiện hành trước rồi lịch sử (FR-001, bổ sung 2026-10-18)', items: { $ref: '#/components/schemas/AdmissionOpinion' } }
            opinionAtAdmissionId: { type: [integer, 'null'], format: int64 }
    WaitingListEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        residentId: { type: integer, format: int64 }
        fullName: { type: string }
        gender: { type: string }
        applicationDate: { type: string, format: date }
        residenceType: { $ref: '#/components/schemas/ResidenceType' }
        careLevel: { $ref: '#/components/schemas/CareLevelCode' }
        notAssessed: { type: boolean }
        circumstances: { type: array, items: { type: object, properties: { code: { type: string }, status: { type: string, enum: [CONFIRMED, PENDING_CONFIRMATION] } } } }
        score: { type: integer }
        scoreBreakdown: { type: object, properties: { careLevel: { type: integer }, waitingTime: { type: integer }, circumstances: { type: integer }, adjustment: { type: integer } } }
        heldBedId: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/WaitingListStatus' }
    ScoreHistoryEntry:
      type: object
      properties: { at: { type: string, format: date-time }, oldScore: { type: integer }, newScore: { type: integer }, cause: { type: string }, proposedBy: { type: string }, approver: { type: string }, reason: { type: string } }
    MatchingEntries:
      type: object
      properties:
        bedId: { type: integer, format: int64 }
        vacancyStart: { type: string, format: date-time }
        entries: { type: array, items: { $ref: '#/components/schemas/WaitingListEntry' } }
    ContractInput:
      type: object
      required: [residentId, residenceType, startDate, careLevel, residencyFeeBillingPeriod]
      properties:
        residentId: { type: integer, format: int64 }
        residenceType: { $ref: '#/components/schemas/ResidenceType' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, description: 'Bắt buộc với nội trú ngắn ngày' }
        careLevel: { $ref: '#/components/schemas/CareLevelCode' }
        roomTypeId: { type: integer, format: int64 }
        bedId: { type: integer, format: int64 }
        residencyFeeBillingPeriod: { type: string, enum: [MONTH, DAY, SESSION] }
        services: { type: array, items: { type: object, required: [serviceId], properties: { serviceId: { type: integer, format: int64 }, inPackage: { type: boolean }, quantity: { type: number }, customUnitPrice: { type: integer, format: int64 } } } }
        noDepositRequired: { type: boolean }
        depositAmount: { type: integer, format: int64 }
        bedHoldPolicy: { type: string }
        absencePolicyOverrides: { type: array, items: { $ref: '#/components/schemas/AbsencePolicyLine' } }
        arrivalSchedule: { type: array, items: { type: object, properties: { dayOfWeek: { type: integer, minimum: 1, maximum: 7 }, date: { type: string, format: date }, arrivalTime: { type: string, example: '07:30' }, departureTime: { type: string, example: '16:30' } } } }
        terminationCondition: { type: string }
    AbsencePolicyLine:
      type: object
      properties:
        residenceType: { $ref: '#/components/schemas/ResidenceType' }
        absenceType: { type: string }
        fromDay: { type: integer }
        toDay: { type: integer, description: 'Bỏ trống là không giới hạn' }
        coefficient: { type: string, description: 'Số phần trăm, PER_CONTRACT hoặc MANAGER_DECIDES' }
        holdBed: { type: string, enum: [YES, NO, PER_CONTRACT, MANAGER_DECIDES] }
    Contract:
      allOf:
        - $ref: '#/components/schemas/ContractInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            contractNumber: { type: string }
            status: { $ref: '#/components/schemas/ContractStatus' }
            currentEndDate: { type: string, format: date }
            awaitingTermsApproval: { type: boolean }
            overdueSince: { type: string, format: date }
            signedDate: { type: string, format: date }
            terminationReason: { type: string }
            hiddenFields: { type: array, items: { type: string } }
            allowedCommands: { type: array, items: { type: string } }
    ContractResult:
      type: object
      properties: { contract: { $ref: '#/components/schemas/Contract' }, warnings: { type: array, items: { $ref: '#/components/schemas/Warning' } } }
    NonStandardTerm:
      type: object
      properties: { type: { type: string, enum: [PRICE, ABSENCE_POLICY, BED_HOLD_POLICY] }, description: { type: string }, standardValue: { type: string }, proposedValue: { type: string } }
    ContractContent:
      type: object
      properties:
        contractId: { type: integer, format: int64 }
        version: { type: integer }
        effectiveFrom: { type: string, format: date }
        addendumId: { type: integer, format: int64 }
        content: { $ref: '#/components/schemas/ContractInput' }
        recordedUnitPrices: { type: array, items: { type: object, properties: { serviceId: { type: integer, format: int64 }, unitPrice: { type: integer, format: int64 } } } }
    Addendum:
      type: object
      properties:
        id: { type: integer, format: int64 }
        approvalRequestId: { type: integer, format: int64 }
        changeTypes: { type: array, items: { type: string } }
        contentBefore: { type: object }
        contentAfter: { type: object }
        effectiveDate: { type: string, format: date }
        status: { type: string, enum: [PENDING_EFFECTIVE, APPLIED, NOT_APPLICABLE] }
    Deposit:
      type: object
      properties:
        notRequired: { type: boolean }
        requiredAmount: { type: integer, format: int64 }
        status: { type: string, enum: [NOT_SATISFIED, SATISFIED, NOT_REQUIRED] }
        basis: { type: object, properties: { at: { type: string, format: date-time }, transactionId: { type: integer, format: int64 }, accountant: { type: string }, receiptNumber: { type: string } } }
    ServiceInput:
      type: object
      required: [type, name, unit, billingPeriod]
      properties:
        type: { $ref: '#/components/schemas/ServiceType' }
        name: { type: string }
        unit: { type: string }
        billingPeriod: { type: string, enum: [MONTH, DAY, SESSION, OCCURRENCE, UNIT] }
        careLevelCode: { $ref: '#/components/schemas/CareLevelCode' }
        roomTypeId: { type: integer, format: int64 }
        medicationId: { type: integer, format: int64 }
    Service:
      allOf:
        - $ref: '#/components/schemas/ServiceInput'
        - type: object
          properties: { id: { type: integer, format: int64 }, status: { type: string } }
    PriceVersion:
      type: object
      properties: { id: { type: integer, format: int64 }, unitPrice: { type: integer, format: int64 }, effectiveFrom: { type: string, format: date }, effectiveTo: { type: string, format: date }, referenced: { type: boolean } }
    ResidencyChangeRequestInput:
      type: object
      required: [contractId, changeTypes, newValue, requestedEffectiveDate, reason]
      properties:
        contractId: { type: integer, format: int64 }
        changeTypes: { type: array, minItems: 1, items: { type: string, enum: [RESIDENCE_TYPE, CARE_LEVEL, SERVICE, DURATION, BED, ARRIVAL_SCHEDULE] } }
        newValue: { type: object, additionalProperties: true, description: 'Theo loại: residenceType, careLevel, services[], endDate, newBedId, arrivalSchedule[]' }
        requestedEffectiveDate: { type: string, format: date }
        reference: { type: object, properties: { type: { type: string, enum: [ASSESSMENT, BED_TRANSFER_ORDER] }, id: { type: integer, format: int64 } } }
        reason: { $ref: '#/components/schemas/Reason' }
    ResidencyChangeRequest:
      allOf:
        - $ref: '#/components/schemas/ResidencyChangeRequestInput'
        - type: object
          properties:
            approvalRequestId: { type: integer, format: int64 }
            previousValue: { type: object }
            costImpact: { type: array, items: { type: object, properties: { item: { type: string }, previousUnitPrice: { type: integer }, newUnitPrice: { type: integer } } } }
            minorChange: { type: boolean, readOnly: true, description: 'Hệ thống tính lúc đọc trên hợp đồng hiện hành, không lưu (FR-043, Q-338; research T-06): chỉ thêm/bớt dịch vụ thuộc gói, ảnh hưởng chi phí bằng 0' }
            status: { type: string }
            addendumId: { type: integer, format: int64 }
            requestedBy: { type: string }
    Absence:
      type: object
      properties:
        id: { type: integer, format: int64 }
        residentId: { type: integer, format: int64 }
        absenceType: { type: string, enum: [HOME_VISIT, FAMILY_OUTING, SAME_DAY_MEDICAL_VISIT, OTHER, HOSPITAL] }
        departedAt: { type: string, format: date-time }
        expectedReturnAt: { type: string, format: date-time }
        returnedAt: { type: string, format: date-time }
        pickedUpBy: { type: string }
        handoverStaff: { type: string }
        takesMedication: { type: boolean }
        holdBed: { type: boolean }
        status: { type: string, enum: [OPEN, CLOSED] }
    AbsenceDetail:
      allOf:
        - $ref: '#/components/schemas/Absence'
        - type: object
          properties:
            expectedReturnHistory: { type: array, items: { type: object, properties: { oldValue: { type: string, format: date-time }, newValue: { type: string, format: date-time }, reason: { type: string }, at: { type: string, format: date-time } } } }
            absenceDays: { type: array, items: { type: object, properties: { date: { type: string, format: date }, sequenceNo: { type: integer }, coefficient: { type: number }, holdBed: { type: boolean }, policyLineSource: { type: string }, pendingDecision: { type: boolean }, noPolicyLine: { type: boolean } } } }
            decisions: { type: array, items: { type: object, properties: { choice: { type: string }, coefficient: { type: number }, reviewDate: { type: string, format: date }, decidedBy: { type: string }, at: { type: string, format: date-time } } } }
            hiddenFields: { type: array, items: { type: string } }
    DayCareClosureDay:
      type: object
      properties: { id: { type: integer, format: int64 }, date: { type: string, format: date }, reason: { type: string }, lateDeclaration: { type: boolean }, status: { type: string, enum: [ACTIVE, CANCELLED] } }
    ResidencyEnding:
      type: object
      properties:
        id: { type: integer, format: int64 }
        residentId: { type: integer, format: int64 }
        endCase: { type: string }
        expectedEndDate: { type: string, format: date }
        actualEndedAt: { type: string, format: date-time }
        destination: { type: string }
        overdueSince: { type: string, format: date }
        handover: { type: object, properties: { recipientType: { type: string }, recipient: { type: string }, at: { type: string, format: date-time }, staff: { type: string } } }
        status: { type: string, enum: [PREPARING, COMPLETED, CANCELLED] }
    DeathRecord:
      type: object
      properties:
        id: { type: integer, format: int64 }
        deathAt: { type: string, format: date-time }
        place: { type: string }
        discoveredBy: { type: string }
        confirmedBy: { type: string }
        cause: { type: string, description: 'HEALTH; bị bỏ theo FR-069' }
        evidenceFileId: { type: integer, format: int64 }
        corrected: { type: boolean }
        hiddenFields: { type: array, items: { type: string } }
    PostDeathTaskList:
      type: object
      properties:
        items: { type: array, items: { type: object, properties: { code: { type: string, enum: [BELONGINGS, STORED_MEDICATION, FINAL_PERIOD_COSTS, ALERTS_INCIDENTS, SETTLEMENT] }, status: { type: string, enum: [NOT_COMPLETED, COMPLETED, NOT_APPLICABLE] }, basis: { type: string } } } }
        closedAt: { type: string, format: date-time }
