openapi: 3.1.0
info:
  title: Elder Care – Feature 004 (tiếp nhận và lưu trú)
  version: 1.0.0-design
  description: |
    Hợp đồng REST của feature 004 (module M02). Quy ước chung theo research R-03 của 000:
    tiền tố /api/v1, lỗi RFC 9457 có maLoi và dieuKienChuaThoa[], If-Match cho lệnh sửa nội dung
    (hợp đồng Nháp, lượt đăng ký, yêu cầu Nháp, danh mục), Idempotency-Key cho mọi lệnh ghi.
    Lệnh chuyển trạng thái (hồ sơ chờ, hợp đồng, hồ sơ kết thúc) không dùng If-Match; backend khóa dòng và
    kiểm tra lại trên trạng thái mới (research T-03).
    Các lệnh Hoàn tất tiếp nhận, Hủy tiếp nhận, Cho tạm vắng, Chuyển viện, Ghi nhận trở về, Kết thúc lưu trú,
    Ghi nhận qua đời là endpoint của api-001 (POST /nguoi-cao-tuoi/{id}/<lenh>); 004 sở hữu nội dung chiTiet
    theo contracts/module-interfaces.md mục 1.1.
    Vòng đời chung của yêu cầu phê duyệt (gửi duyệt, duyệt, từ chối, hủy) dùng endpoint của api-000.
    Trường tài chính bị bỏ khỏi phản hồi theo 002 (TAI_CHINH) và liệt kê trong truongBiAn.
    Truy vết: mỗi operation có x-fr (FR của spec 004) và x-br khi có.
servers:
  - url: /api/v1
security:
  - phien: []
tags:
  - { name: dang-ky, description: 'UC-09, UC-08 (điều kiện); mục A' }
  - { name: danh-sach-cho, description: 'UC-10; mục B' }
  - { name: hop-dong, description: 'UC-11, UC-12; mục C, D' }
  - { name: dich-vu, description: 'Danh mục dịch vụ, phiên bản đơn giá; mục E' }
  - { name: thay-doi, description: 'UC-13, UC-14; mục F' }
  - { name: vang, description: 'UC-15, UC-16 (nội dung lượt vắng), bán trú; mục G' }
  - { name: ket-thuc, description: 'UC-17; mục H' }
  - { name: qua-doi, description: 'UC-18; mục I' }

paths:
  # ---------------- Đăng ký ----------------
  /luot-dang-ky:
    get:
      tags: [dang-ky]
      summary: Danh sách lượt đăng ký (Hành chính, Quản lý viện)
      x-fr: [FR-006]
      parameters:
        - { name: trangThai, in: query, schema: { type: array, items: { $ref: '#/components/schemas/TrangThaiLuotDangKy' } } }
        - { $ref: '#/components/parameters/Sau' }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LuotDangKy' } } } } }, '403': { $ref: '#/components/responses/Loi' } }
    post:
      tags: [dang-ky]
      summary: Lập lượt đăng ký tiếp nhận (Hành chính)
      description: 'Người cao tuổi phải Đang tiếp nhận; đã có lượt Đang xử lý hoặc Đang chờ thì 409 DA_CO_LUOT_DANG_KY (FR-001).'
      x-fr: [FR-001, FR-006]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LuotDangKyGhi' } } } }
      responses:
        '201': { description: Đã lập, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/LuotDangKy' } } } }
        '403': { $ref: '#/components/responses/Loi' }
        '409': { $ref: '#/components/responses/LoiChan' }
  /luot-dang-ky/{id}:
    get:
      tags: [dang-ky]
      summary: Xem lượt đăng ký
      x-fr: [FR-001, FR-006]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/LuotDangKy' } } } } }
  /luot-dang-ky/{id}/cap-nhat:
    post:
      tags: [dang-ky]
      summary: Cập nhật lượt đăng ký
      description: 'Chỉ khi Đang xử lý hoặc Đang chờ; ngày đăng ký không đổi khi đã có hồ sơ chờ (FR-001, BR-M02-15).'
      x-fr: [FR-001]
      x-br: [BR-M02-15]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/LuotDangKyGhi'
                - { type: object, required: [lyDo], properties: { lyDo: { $ref: '#/components/schemas/LyDo' } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/LoiChan' }, '412': { $ref: '#/components/responses/Loi' } }
  /luot-dang-ky/{id}/y-kien-vao-o:
    post:
      tags: [dang-ky]
      summary: Ghi ý kiến của người cao tuổi về việc vào ở (Hành chính); ý kiến Hiệu lực cũ chuyển Được thay thế (bổ sung 2026-10-18)
      description: 'Chỉ khi lượt Đang xử lý hoặc Đang chờ. Ý kiến không là điều kiện tiếp nhận (FR-004a, Q-356).'
      x-fr: [FR-001, FR-004a]
      x-br: [BR-M01-14]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yKien, nguon]
              properties:
                yKien: { type: string, enum: [DONG_Y, KHONG_DONG_Y, KHONG_BAY_TO_DUOC] }
                nguon: { $ref: '#/components/schemas/NguonYKien' }
                ghiChu: { type: string, maxLength: 2000 }
      responses: { '201': { description: Đã ghi, content: { application/json: { schema: { $ref: '#/components/schemas/YKienVaoO' } } } }, '409': { $ref: '#/components/responses/LoiChan' }, '422': { $ref: '#/components/responses/Loi' } }
  /luot-dang-ky/{id}/dieu-kien-tiep-nhan:
    get:
      tags: [dang-ky]
      summary: Danh sách điều kiện tiếp nhận (a) → (f)
      description: |
        Mỗi điều kiện Đạt / Chưa đạt / Không áp dụng kèm căn cứ; cảnh báo lệch mức, lệch loại lưu trú (FR-005),
        cảnh báo "phí đang tính cho ngày chưa vào ở" (FR-076), "cần phân bổ lại giường" (FR-021).
        Cùng nguồn với điều kiện của lệnh Hoàn tất tiếp nhận (research T-09). (f) người liên hệ chính, người đại diện (DBR-02, Q-343) lấy từ điều kiện của 012.
        yKienVaoO: ý kiến hiện hành của người cao tuổi kèm nguồn, không phải điều kiện; canhBao có CHUA_GHI_Y_KIEN_VAO_O hoặc NCT_KHONG_DONG_Y_VAO_O (FR-004a, bổ sung 2026-10-18).
      x-fr: [FR-004, FR-004a, FR-005, FR-021, FR-075, FR-076]
      x-br: [BR-M02-22]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DanhSachDieuKien' } } } } }
  /luot-dang-ky/{id}/tien-trinh:
    get:
      tags: [dang-ky]
      summary: Tiến trình theo các bước 6.1, suy ra từ dữ liệu
      x-fr: [FR-003]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TienTrinh' } } } } }

  # ---------------- Danh sách chờ ----------------
  /ho-so-cho:
    get:
      tags: [danh-sach-cho]
      summary: Danh sách chờ (Hành chính, Quản lý viện)
      description: 'Sắp theo điểm giảm dần, ngày đăng ký, thời điểm tạo. Vai trò khác, kể cả người thân, 403 (FR-018).'
      x-fr: [FR-009, FR-018]
      parameters: [ { name: trangThai, in: query, schema: { type: array, items: { $ref: '#/components/schemas/TrangThaiHoSoCho' } } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HoSoCho' } } } } }, '403': { $ref: '#/components/responses/Loi' } }
    post:
      tags: [danh-sach-cho]
      summary: Đưa vào danh sách chờ (Hành chính)
      description: 'Tạo hồ sơ chờ từ lượt đăng ký Đang xử lý; tình huống "từng lưu trú tại viện" được đánh dấu sẵn ở trạng thái chờ xác nhận nếu có hồ sơ cũ Kết thúc lưu trú (FR-007).'
      x-fr: [FR-007, FR-008, FR-009]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [luotDangKyId]
              properties:
                luotDangKyId: { type: integer, format: int64 }
                tinhHuong: { type: array, items: { type: string, description: 'Mã tình huống trong bảng CFG-M02-08' } }
      responses: { '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/HoSoCho' } } } }, '409': { $ref: '#/components/responses/LoiChan' } }
  /ho-so-cho/{id}:
    get:
      tags: [danh-sach-cho]
      summary: Xem hồ sơ chờ, kèm chi tiết điểm
      x-fr: [FR-009]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HoSoCho' } } } } }
  /ho-so-cho/{id}/lich-su-diem:
    get:
      tags: [danh-sach-cho]
      summary: Lịch sử điểm và điều chỉnh
      x-fr: [FR-010, FR-011]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DongLichSuDiem' } } } } } }
  /ho-so-cho/{id}/cap-nhat-tinh-huong:
    post:
      tags: [danh-sach-cho]
      summary: Cập nhật tình huống đặc biệt (xác nhận hoặc bỏ dấu "từng lưu trú" kèm lý do)
      x-fr: [FR-007, FR-010]
      x-br: [BR-M02-15]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tinhHuong, lyDo]
              properties:
                tinhHuong: { type: array, items: { type: string } }
                lyDo: { $ref: '#/components/schemas/LyDo' }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HoSoCho' } } } } }
  /ho-so-cho/{id}/de-nghi-dieu-chinh-diem:
    post:
      tags: [danh-sach-cho]
      summary: Lập đề nghị điều chỉnh điểm (yêu cầu M02.DIEU_CHINH_DIEM, Quản lý viện duyệt)
      description: 'Điểm chỉ đổi khi yêu cầu được áp dụng (FR-011, SC-004). Gửi duyệt và duyệt qua api-000.'
      x-fr: [FR-011]
      x-br: [BR-M02-10]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [soDiem, lyDo]
              properties:
                soDiem: { type: integer, description: 'Dương là cộng, âm là trừ; khác 0' }
                lyDo: { $ref: '#/components/schemas/LyDo' }
      responses: { '201': { description: Đã lập yêu cầu, content: { application/json: { schema: { $ref: '#/components/schemas/ThamChieuYeuCau' } } } }, '422': { $ref: '#/components/responses/Loi' } }
  /giuong/{giuongId}/ho-so-phu-hop:
    get:
      tags: [danh-sach-cho]
      summary: Danh sách hồ sơ chờ phù hợp với một giường Trống
      description: |
        Lọc theo FR-012 trong lượt trống hiện tại, sắp theo điểm, ngày đăng ký, thời điểm tạo; kèm thành phần điểm.
        Không chọn sẵn, không giới hạn số hồ sơ (FR-013, Q-307). Danh sách rỗng nghĩa là "không có người phù hợp".
      x-fr: [FR-012, FR-013]
      x-br: [BR-M02-01, BR-M02-10]
      parameters: [ { name: giuongId, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DanhSachPhuHop' } } } } }
  /ho-so-cho/{id}/ghi-nhan-da-lien-he:
    post:
      tags: [danh-sach-cho]
      summary: Ghi nhận đã liên hệ, kèm giường được giữ
      description: |
        Giường phải Trống, không có phân bổ tương lai, hồ sơ thỏa FR-012 với giường đó. Giường chuyển Đang giữ chỗ hạn CFG-M02-02 (003).
        Chọn hồ sơ không đứng đầu danh sách (sau khi bỏ hồ sơ đã liên hệ, từ chối, hết hạn trong lượt): lyDoKhongTheoThuTu bắt buộc (FR-014).
      x-fr: [FR-014]
      x-br: [BR-M02-02, BR-M02-10]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [giuongId]
              properties:
                giuongId: { type: integer, format: int64 }
                lyDoKhongTheoThuTu: { $ref: '#/components/schemas/LyDo' }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HoSoCho' } } } }, '409': { $ref: '#/components/responses/LoiChan' }, '422': { $ref: '#/components/responses/Loi' } }
  /ho-so-cho/{id}/tu-choi-giuong:
    post:
      tags: [danh-sach-cho]
      summary: Gia đình từ chối giường này nhưng vẫn chờ
      description: 'Hồ sơ về Đang chờ, giữ ngày đăng ký và điểm; giường về Trống; Hành chính được báo chọn người tiếp theo (Edge Case).'
      x-fr: [FR-012, FR-013]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/LoiChan' } }
  /ho-so-cho/{id}/tu-choi:
    post:
      tags: [danh-sach-cho]
      summary: Ghi nhận gia đình không tiếp tục chờ (Từ chối)
      description: 'Trong cùng một lần thực hiện Hủy tiếp nhận (001) với cùng lý do; Hủy tiếp nhận không được thì lệnh bị từ chối (FR-002).'
      x-fr: [FR-002]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/LoiChan' } }
  /ho-so-cho/{id}/huy-cho:
    post:
      tags: [danh-sach-cho]
      summary: Hủy chờ
      description: 'Như Từ chối: kéo theo Hủy tiếp nhận (001) trong cùng một lần (FR-002).'
      x-fr: [FR-002]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/LoiChan' } }
  /ho-so-cho/{id}/xac-nhan-con-nhu-cau:
    post:
      tags: [danh-sach-cho]
      summary: Xác nhận gia đình còn nhu cầu (đặt lại mốc CFG-M02-03)
      x-fr: [FR-017]
      x-br: [BR-M02-03]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: OK } }

  # ---------------- Hợp đồng ----------------
  /hop-dong:
    get:
      tags: [hop-dong]
      summary: Danh sách hợp đồng
      description: 'Người đại diện chỉ thấy hợp đồng của người mình đại diện (chú thích ⁷); vai trò khác không thấy trường tài chính (FR-028).'
      x-fr: [FR-028, FR-029]
      parameters:
        - { name: nctId, in: query, schema: { type: integer, format: int64 } }
        - { name: trangThai, in: query, schema: { type: array, items: { $ref: '#/components/schemas/TrangThaiHopDong' } } }
        - { name: quaHan, in: query, schema: { type: boolean } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HopDong' } } } } } }
    post:
      tags: [hop-dong]
      summary: Lập hợp đồng Nháp (Hành chính)
      description: 'Được lập trước đánh giá đầu vào (Q-300); cảnh báo khi mức khác mức hiện hành (FR-025). Không có người đại diện: 409 THIEU_NGUOI_DAI_DIEN.'
      x-fr: [FR-019, FR-025]
      x-br: [BR-M02-22]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HopDongGhi' } } } }
      responses: { '201': { description: Đã lập, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/KetQuaHopDong' } } } }, '409': { $ref: '#/components/responses/LoiChan' } }
  /hop-dong/{id}:
    get:
      tags: [hop-dong]
      summary: Xem hợp đồng (bản nháp hoặc hợp đồng gốc kèm danh sách phụ lục)
      x-fr: [FR-019, FR-028]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/HopDong' } } } } }
    put:
      tags: [hop-dong]
      summary: Sửa nội dung hợp đồng Nháp
      description: |
        Chỉ khi Nháp và không đang chờ duyệt điều khoản; trạng thái khác: 409 HOP_DONG_DA_KHOA (FR-020, FR-023, BR-M02-09).
        Sửa sau khi điều khoản khác chuẩn đã được duyệt làm bản duyệt mất hiệu lực (FR-025a).
      x-fr: [FR-019, FR-020, FR-025, FR-025a]
      x-br: [BR-M02-09]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HopDongGhi' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/KetQuaHopDong' } } } }, '409': { $ref: '#/components/responses/Loi' }, '412': { $ref: '#/components/responses/Loi' } }
  /hop-dong/{id}/dieu-khoan-khac-chuan:
    get:
      tags: [hop-dong]
      summary: Điều khoản khác chuẩn của hợp đồng Nháp (giá trị chuẩn, giá trị đề xuất)
      x-fr: [FR-025a]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DieuKhoanKhacChuan' } } } } } }
  /hop-dong/{id}/gui-duyet-dieu-khoan:
    post:
      tags: [hop-dong]
      summary: Gửi Quản lý viện duyệt điều khoản khác chuẩn
      description: 'Lập yêu cầu M02.DUYET_DIEU_KHOAN_HOP_DONG ở Chờ duyệt, khóa nội dung (FR-025a). Không có điều khoản khác chuẩn: 409.'
      x-fr: [FR-025a]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '201': { description: Đã lập yêu cầu, content: { application/json: { schema: { $ref: '#/components/schemas/ThamChieuYeuCau' } } } }, '409': { $ref: '#/components/responses/Loi' } }
  /hop-dong/{id}/gui-ky:
    post:
      tags: [hop-dong]
      summary: Gửi ký
      description: |
        Chặn khi thiếu nội dung bắt buộc (FR-019), không có đúng một dịch vụ chăm sóc theo mức của hợp đồng (FR-025, Q-297),
        hoặc có điều khoản khác chuẩn chưa được duyệt cho đúng nội dung hiện tại (FR-025a). Cảnh báo theo FR-025 không chặn.
      x-fr: [FR-020, FR-025, FR-025a]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/KetQuaHopDong' } } } }, '409': { $ref: '#/components/responses/LoiChan' } }
  /hop-dong/{id}/tra-ve-nhap:
    post:
      tags: [hop-dong]
      summary: Trả về nháp
      x-fr: [FR-020]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Loi' } }
  /hop-dong/{id}/ghi-nhan-da-ky:
    post:
      tags: [hop-dong]
      summary: Ghi nhận đã ký (hợp đồng Hiệu lực)
      description: |
        Bắt buộc ngày ký, người đại diện hợp lệ (012, DBR-02), bản scan. Nội trú: phải có phân bổ giường bắt đầu không muộn hơn ngày bắt đầu (FR-021).
        Chồng thời gian với hợp đồng Hiệu lực khác: 409 (FR-022, DBR-06). Bán trú: kiểm sức chứa khu nghỉ (003 FR-039).
        Thành công: ghi phiên bản nội dung 0 với đơn giá của mọi khoản (FR-036).
      x-fr: [FR-021, FR-022, FR-036]
      x-br: [BR-M02-08, BR-M03-03]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ngayKy, nguoiDaiDienKyId, tepBanScanId]
              properties:
                ngayKy: { type: string, format: date }
                nguoiDaiDienKyId: { type: integer, format: int64 }
                tepBanScanId: { type: integer, format: int64, description: 'Tệp đã tải lên qua TepApi (common.tep)' }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/KetQuaHopDong' } } } }, '409': { $ref: '#/components/responses/LoiChan' }, '422': { $ref: '#/components/responses/Loi' } }
  /hop-dong/{id}/huy:
    post:
      tags: [hop-dong]
      summary: Hủy hợp đồng Nháp hoặc Chờ ký
      x-fr: [FR-020]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Loi' } }
  /hop-dong/{id}/noi-dung:
    get:
      tags: [hop-dong]
      summary: Nội dung hợp đồng hiệu lực tại ngày D
      description: 'Phiên bản nội dung có hiệu lực từ lớn nhất không muộn hơn D (FR-024, BR-M02-09).'
      x-fr: [FR-024]
      x-br: [BR-M02-09]
      parameters: [ { $ref: '#/components/parameters/Id' }, { name: ngay, in: query, required: true, schema: { type: string, format: date } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NoiDungHopDong' } } } }, '404': { $ref: '#/components/responses/Loi' } }
  /hop-dong/{id}/phu-luc:
    get:
      tags: [hop-dong]
      summary: Danh sách phụ lục của hợp đồng
      x-fr: [FR-042, FR-047]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PhuLuc' } } } } } }
  /hop-dong/{id}/dat-coc:
    get:
      tags: [hop-dong]
      summary: Khoản cần đặt cọc và trạng thái đặt cọc (do 017 tính)
      description: 'Không có lệnh thu hay xác nhận cọc ở 004 (FR-030, chú thích ²⁶).'
      x-fr: [FR-030, FR-031]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DatCoc' } } } } }

  # ---------------- Dịch vụ ----------------
  /dich-vu:
    get:
      tags: [dich-vu]
      summary: Danh mục dịch vụ
      x-fr: [FR-034]
      parameters: [ { name: loai, in: query, schema: { $ref: '#/components/schemas/LoaiDichVu' } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DichVu' } } } } } }
    post:
      tags: [dich-vu]
      summary: Tạo dịch vụ (Quản lý viện)
      description: 'Dịch vụ CHAM_SOC phải gắn đúng một mức; mỗi mức tối đa một dịch vụ chăm sóc Hiệu lực (Q-297).'
      x-fr: [FR-034]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DichVuGhi' } } } }
      responses: { '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/DichVu' } } } }, '409': { $ref: '#/components/responses/Loi' } }
  /dich-vu/{id}:
    put:
      tags: [dich-vu]
      summary: Sửa dịch vụ
      x-fr: [FR-034]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DichVuGhi' } } } }
      responses: { '200': { description: OK } }
  /dich-vu/{id}/ngung-hieu-luc:
    post:
      tags: [dich-vu]
      summary: Ngừng hiệu lực dịch vụ
      x-fr: [FR-034]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: OK } }
  /dich-vu/{id}/phien-ban-don-gia:
    get:
      tags: [dich-vu]
      summary: Các phiên bản đơn giá
      x-fr: [FR-035]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PhienBanDonGia' } } } } } }
    post:
      tags: [dich-vu]
      summary: Tạo phiên bản đơn giá
      description: |
        Phiên bản đang mở tự kết thúc ngày liền trước. Hiệu lực lùi chỉ cho khoảng chưa có phiên bản và bị cắt trước phiên bản kế tiếp;
        chồng lên phiên bản đã có: 409 (FR-035, DBR-08). Phiên bản đã tham chiếu không sửa được; không có PUT.
      x-fr: [FR-035, FR-036]
      x-br: [BR-M11-02]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [donGia, hieuLucTu]
              properties:
                donGia: { type: integer, format: int64, minimum: 0 }
                hieuLucTu: { type: string, format: date }
                hieuLucDen: { type: string, format: date }
      responses: { '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/PhienBanDonGia' } } } }, '409': { $ref: '#/components/responses/Loi' } }
  /dich-vu/{id}/hop-dong-lech-gia:
    get:
      tags: [dich-vu]
      summary: Hợp đồng Hiệu lực có đơn giá đã ghi khác phiên bản mới nhất
      description: 'Chỉ để Quản lý viện xem; hệ thống không đổi hợp đồng (FR-036).'
      x-fr: [FR-036]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object, properties: { hopDongId: { type: integer, format: int64 }, soHopDong: { type: string }, donGiaDaGhi: { type: integer }, donGiaMoi: { type: integer } } } } } } } }

  # ---------------- Thay đổi lưu trú ----------------
  /yeu-cau-thay-doi-luu-tru:
    post:
      tags: [thay-doi]
      summary: Lập yêu cầu thay đổi lưu trú ở Nháp
      description: |
        Hành chính mọi loại; Bác sĩ chỉ đổi mức chăm sóc; người đại diện qua cổng tạo ở Nháp và Hành chính được báo (FR-039).
        Giá trị trước và ảnh hưởng chi phí do hệ thống điền (FR-038). Ngày hiệu lực mong muốn sớm hơn ngày bắt đầu hợp đồng: 422 (FR-040).
        thamChieu là lần đánh giá (BR-M01-03) hoặc lệnh chuyển giường gấp (003 FR-030). Hệ thống không tự lập yêu cầu (Q-306).
        Gửi duyệt, duyệt, từ chối, hủy qua api-000; khi duyệt, kiểm FR-041, FR-046 và tạo phụ lục (FR-042).
        thayDoiNho do hệ thống tính (FR-043): Quản lý viện duyệt mọi yêu cầu, Hành chính chỉ duyệt yêu cầu là thay đổi nhỏ; kiểm lại lúc duyệt.
      x-fr: [FR-037, FR-038, FR-039, FR-040, FR-043]
      x-br: [BR-M01-03, BR-M02-16]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/YeuCauThayDoiGhi' } } } }
      responses: { '201': { description: Đã lập, content: { application/json: { schema: { $ref: '#/components/schemas/YeuCauThayDoi' } } } }, '403': { $ref: '#/components/responses/Loi' }, '422': { $ref: '#/components/responses/Loi' } }
  /yeu-cau-thay-doi-luu-tru/{id}:
    get:
      tags: [thay-doi]
      summary: Xem yêu cầu thay đổi lưu trú
      x-fr: [FR-038]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/YeuCauThayDoi' } } } } }
    put:
      tags: [thay-doi]
      summary: Sửa yêu cầu ở Nháp (Hành chính hoàn thiện yêu cầu của người đại diện)
      x-fr: [FR-038, FR-039]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/YeuCauThayDoiGhi' } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Loi' }, '412': { $ref: '#/components/responses/Loi' } }

  # ---------------- Vắng ----------------
  /luot-vang:
    get:
      tags: [vang]
