      summary: Quyết định giữ giường (Quản lý viện)
      description: |
        GIU_TIEP bắt buộc heSo và ngayXemXetLai; GIAI_PHONG bắt buộc heSo (mặc định 0%), giường giải phóng ngay (003);
        lượt vắng đã đóng chỉ nhận CHI_DAT_HE_SO cho các ngày bị ảnh hưởng (FR-061). Các ngày "chờ quyết định" được tính lại (FR-056).
      x-fr: [FR-055, FR-056, FR-061]
      x-br: [BR-M02-07, BR-M02-18]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [luaChon, heSo, lyDo]
              properties:
                luaChon: { type: string, enum: [GIU_TIEP, GIAI_PHONG, CHI_DAT_HE_SO] }
                heSo: { type: number, minimum: 0, maximum: 100 }
                ngayXemXetLai: { type: string, format: date }
                lyDo: { $ref: '#/components/schemas/LyDo' }
      responses: { '201': { description: Đã ghi, content: { application/json: { schema: { $ref: '#/components/schemas/LuotVangChiTiet' } } } }, '403': { $ref: '#/components/responses/Loi' }, '409': { $ref: '#/components/responses/Loi' } }
  /luot-vang/{id}/dinh-chinh:
    post:
      tags: [vang]
      summary: Đính chính lượt vắng đã đóng (thời điểm rời, về)
      description: 'Theo 000 FR-026; kích hoạt tính lại ngày vắng và báo 010; vượt ngưỡng "Quản lý quyết định" thì báo Quản lý viện (FR-061, BR-M02-18).'
      x-fr: [FR-061]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/DinhChinh' }
      responses: { '201': { description: Đã đính chính hoặc đã lập yêu cầu }, '409': { $ref: '#/components/responses/Loi' } }
  /bao-vang-ban-tru:
    post:
      tags: [vang]
      summary: Ghi nhận gia đình báo vắng bán trú (Hành chính)
      description: 'Hệ thống tự xác định báo trước đủ CFG-M02-06 hay không (FR-060).'
      x-fr: [FR-060]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nctId, ngay, thoiDiemGiaDinhBao]
              properties:
                nctId: { type: integer, format: int64 }
                ngay: { type: string, format: date }
                buoiId: { type: integer, format: int64, description: 'Bỏ trống là cả ngày' }
                thoiDiemGiaDinhBao: { type: string, format: date-time }
      responses: { '201': { description: Đã ghi, content: { application/json: { schema: { type: object, properties: { duHan: { type: boolean } } } } } } }
  /ngay-nghi-ban-tru:
    get:
      tags: [vang]
      summary: Danh sách ngày khu bán trú nghỉ
      x-fr: [FR-060a]
      parameters: [ { name: tu, in: query, schema: { type: string, format: date } }, { name: den, in: query, schema: { type: string, format: date } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NgayNghiBanTru' } } } } } }
    post:
      tags: [vang]
      summary: Khai báo ngày khu bán trú nghỉ (Hành chính)
      description: 'Ngày đã qua bắt buộc lý do; 010 tính lại hoặc điều chỉnh khoản đã lập; 011 không tính suất (FR-060a).'
      x-fr: [FR-060a]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ngay, lyDo]
              properties:
                ngay: { type: string, format: date }
                lyDo: { $ref: '#/components/schemas/LyDo' }
      responses: { '201': { description: Đã khai báo }, '409': { description: NGAY_DA_KHAI_BAO, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } } } }
  /ngay-nghi-ban-tru/{id}/huy:
    post:
      tags: [vang]
      summary: Hủy khai báo ngày nghỉ
      x-fr: [FR-060a]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: OK } }

  # ---------------- Kết thúc ----------------
  /ho-so-ket-thuc:
    post:
      tags: [ket-thuc]
      summary: Lập hồ sơ kết thúc lưu trú (Hành chính; Bác sĩ với Xuất viện, Chuyển cơ sở vì lý do y tế)
      description: |
        Người cao tuổi Đang lưu trú, Tạm vắng hoặc Điều trị tại bệnh viện; tối đa một hồ sơ chưa ở trạng thái cuối (FR-062).
        Chuyển cơ sở thiếu nơi chuyển đến: 422. Trong cùng một lần tạo bảng kỳ cuối nháp ở 010 tới ngày kết thúc dự kiến (FR-066).
      x-fr: [FR-062, FR-063, FR-066]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nctId, truongHop, ngayKetThucDuKien, lyDo, nguoiYeuCau]
              properties:
                nctId: { type: integer, format: int64 }
                truongHop: { type: string, enum: [HET_HOP_DONG, XUAT_VIEN, CHUYEN_CO_SO, CHAM_DUT_HOP_DONG] }
                lyDoYTe: { type: boolean, default: false }
                ngayKetThucDuKien: { type: string, format: date }
                noiChuyenDen: { type: string }
                nguoiYeuCau: { type: string }
                lyDo: { $ref: '#/components/schemas/LyDo' }
      responses: { '201': { description: Đã lập, content: { application/json: { schema: { $ref: '#/components/schemas/HoSoKetThuc' } } } }, '403': { $ref: '#/components/responses/Loi' }, '409': { $ref: '#/components/responses/LoiChan' }, '422': { $ref: '#/components/responses/Loi' } }
  /ho-so-ket-thuc/{id}:
    get:
      tags: [ket-thuc]
      summary: Xem hồ sơ kết thúc
      x-fr: [FR-062, FR-067, FR-068]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HoSoKetThuc' } } } } }
  /ho-so-ket-thuc/{id}/dieu-kien:
    get:
      tags: [ket-thuc]
      summary: Danh sách điều kiện kết thúc (a) → (h)
      description: 'Đạt / Chưa đạt / Đạt (ngoại lệ) / Tự động, kèm căn cứ; cùng nguồn với điều kiện của lệnh Kết thúc lưu trú (research T-09). (Bổ sung 2026-10-22, FR-063 (h), FR-064) Dòng (h) gộp KT_H_QUYET_TOAN và KT_H_XAC_NHAN_QUYET_TOAN của 017; Đạt (ngoại lệ) chỉ khi ý tiền được miễn và Kế toán đã xác nhận quyết toán.'
      x-fr: [FR-063, FR-064, FR-068]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DanhSachDieuKien' } } } } }
  /ho-so-ket-thuc/{id}/doi-ngay:
    post:
      tags: [ket-thuc]
      summary: Đổi ngày kết thúc dự kiến
      description: 'Mốc dừng tính phí và kỳ cuối nháp tính lại; gỡ dấu "quá ngày dự kiến" khi ngày mới không sớm hơn hôm nay (FR-066, FR-066a).'
      x-fr: [FR-066, FR-066a, FR-067]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ngayKetThucDuKien, lyDo]
              properties:
                ngayKetThucDuKien: { type: string, format: date }
                lyDo: { $ref: '#/components/schemas/LyDo' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Loi' } }
  /ho-so-ket-thuc/{id}/huy:
    post:
      tags: [ket-thuc]
      summary: Hủy hồ sơ kết thúc
      description: 'Các ngày sau mốc đã dừng lại là sự kiện tính phí (FR-066).'
      x-fr: [FR-066, FR-067]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '200': { description: OK } }
  /ho-so-ket-thuc/{id}/ban-giao:
    post:
      tags: [ket-thuc]
      summary: Ghi nhận bàn giao người cao tuổi (điều kiện e)
      x-fr: [FR-063]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loaiNguoiNhan, thoiDiemBanGiao, nhanVienBanGiaoId]
              properties:
                loaiNguoiNhan: { type: string, enum: [NGUOI_THAN, CO_SO_TIEP_NHAN] }
                nguoiThanId: { type: integer, format: int64 }
                tenCoSo: { type: string }
                thoiDiemBanGiao: { type: string, format: date-time }
                nhanVienBanGiaoId: { type: integer, format: int64 }
      responses: { '201': { description: Đã ghi }, '422': { $ref: '#/components/responses/Loi' } }
  /ho-so-ket-thuc/{id}/yeu-cau-ngoai-le:
    post:
      tags: [ket-thuc]
      summary: Lập yêu cầu ngoại lệ cho một điều kiện (a)–(d), (h)
      description: 'Yêu cầu M02.NGOAI_LE_KET_THUC; Kế toán chỉ với KT_H_QUYET_TOAN; KT_E_BAN_GIAO và KT_H_XAC_NHAN_QUYET_TOAN (bổ sung 2026-10-22) không có ngoại lệ (FR-064).'
      x-fr: [FR-064]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [maDieuKien, lyDo]
              properties:
                maDieuKien: { type: string, enum: [KT_A_CHI_PHI, KT_B_DO_GUI, KT_C_THUOC_GUI, KT_D_CANH_BAO_SU_CO, KT_H_QUYET_TOAN] }
                lyDo: { $ref: '#/components/schemas/LyDo' }
      responses: { '201': { description: Đã lập yêu cầu, content: { application/json: { schema: { $ref: '#/components/schemas/ThamChieuYeuCau' } } } }, '403': { $ref: '#/components/responses/Loi' } }

  # ---------------- Qua đời ----------------
  /nguoi-cao-tuoi/{nctId}/ban-ghi-qua-doi:
    get:
      tags: [qua-doi]
      summary: Bản ghi qua đời
      description: 'nguyenNhan bị bỏ với Hành chính, Kế toán (kể cả người đã ghi) và người thân không thỏa chú thích ¹ (FR-069, BR-M02-21).'
      x-fr: [FR-069]
      x-br: [BR-M02-21]
      parameters: [ { name: nctId, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BanGhiQuaDoi' } } } }, '404': { $ref: '#/components/responses/Loi' } }
  /ban-ghi-qua-doi/{id}/dinh-chinh:
    post:
      tags: [qua-doi]
      summary: Bổ sung nguyên nhân hoặc sửa sai bản ghi qua đời bằng đính chính
      x-fr: [FR-069]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/DinhChinh' }
      responses: { '201': { description: Đã đính chính hoặc đã lập yêu cầu } }
  /nguoi-cao-tuoi/{nctId}/viec-sau-qua-doi:
    get:
      tags: [qua-doi]
      summary: Danh sách việc bắt buộc sau qua đời
      description: 'Trạng thái từng mục lấy từ module sở hữu tại lúc xem (FR-071); mọi mục xong thì hồ sơ lưu trú Đã đóng (FR-072).'
      x-fr: [FR-071, FR-072]
      parameters: [ { name: nctId, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DanhSachViecSauQuaDoi' } } } } }
  /nguoi-cao-tuoi/{nctId}/viec-sau-qua-doi/yeu-cau-ngoai-le-quyet-toan:
    post:
      tags: [qua-doi]
      summary: Lập yêu cầu ngoại lệ cho mục quyết toán số dư và tiền cọc khi gia đình còn nợ (Hành chính, Kế toán; bổ sung 2026-10-22, Q-387)
      description: 'Yêu cầu M02.NGOAI_LE_KET_THUC mã KT_H_QUYET_TOAN, căn cứ là danh sách việc sau qua đời đang mở; Quản lý viện duyệt. Chỉ thay ba ý về tiền; Kế toán vẫn phải xác nhận quyết toán (017 FR-023, FR-034). Mục khác không có ngoại lệ.'
      x-fr: [FR-071a]
      parameters: [ { name: nctId, in: path, required: true, schema: { type: integer, format: int64 } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/LyDo' }
      responses: { '201': { description: Đã lập yêu cầu, content: { application/json: { schema: { $ref: '#/components/schemas/ThamChieuYeuCau' } } } }, '403': { $ref: '#/components/responses/Loi' }, '409': { $ref: '#/components/responses/Loi' } }

components:
  securitySchemes:
    phien: { type: http, scheme: bearer, description: 'Token phiên opaque của 002 (A-02)' }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    Sau: { name: sau, in: query, description: Khóa trang kế tiếp, schema: { type: string } }
  headers:
    ETag: { schema: { type: string } }
  requestBodies:
    LyDo:
      required: true
      content: { application/json: { schema: { type: object, required: [lyDo], properties: { lyDo: { $ref: '#/components/schemas/LyDo' } } } } }
    DinhChinh:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [kieu, lyDo]
            properties:
              kieu: { type: string, enum: [SUA_NOI_DUNG, HUY_GHI_NHAN] }
              noiDungDung: { type: object, additionalProperties: true }
              lyDo: { $ref: '#/components/schemas/LyDo' }
  responses:
    Loi:
      description: Lỗi theo RFC 9457 (research R-03 của 000)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } }
    LoiChan:
      description: 'DIEU_KIEN_CHUA_THOA (đủ danh sách), CHUYEN_KHONG_HOP_LE, DA_CO_LUOT_DANG_KY, HOP_DONG_CHONG_THOI_GIAN…'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } }
  schemas:
    LyDo: { type: string, minLength: 1, maxLength: 2000 }
    MaMucChamSoc: { type: string, enum: [CO_BAN, THUONG_XUYEN, DAC_BIET] }
    LoaiLuuTru: { type: string, enum: [NOI_TRU_DAI_HAN, NOI_TRU_NGAN_NGAY, BAN_TRU] }
    TrangThaiLuotDangKy: { type: string, enum: [DANG_XU_LY, DANG_CHO, DA_TIEP_NHAN, DA_HUY] }
    TrangThaiHoSoCho: { type: string, enum: [DANG_CHO, DA_LIEN_HE, DA_TIEP_NHAN, TU_CHOI, HUY_CHO] }
    TrangThaiHopDong: { type: string, enum: [NHAP, CHO_KY, HIEU_LUC, KET_THUC, CHAM_DUT, DA_HUY] }
    LoaiDichVu: { type: string, enum: [CHAM_SOC, PHI_LUU_TRU, BUOI_BAN_TRU, PHUC_HOI, HOAT_DONG, DUA_DI_KHAM, TIEM, NGUOI_THAN_O_LAI, SUAT_AN, THUOC_NGUON_VIEN, KHAC] }
    Loi:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        maLoi: { type: string }
        dieuKienChuaThoa: { type: array, items: { $ref: '#/components/schemas/DieuKien' } }
        giaTriHienHanh: { type: object }
    DieuKien:
      type: object
      properties:
        ma: { type: string, description: 'Ví dụ TN_B_HOP_DONG, TN_C_DAT_COC, TN_E_MUC_HOP_DONG, KT_E_BAN_GIAO, HOP_DONG_CHONG_THOI_GIAN' }
        moTa: { type: string }
        canCu: { type: string, description: 'BR/FR' }
        module: { type: string }
        coTheMien: { type: boolean }
    CanhBao:
      type: object
      properties: { ma: { type: string }, moTa: { type: string } }
    ThamChieuYeuCau:
      type: object
      properties: { yeuCauPheDuyetId: { type: integer, format: int64 }, loai: { type: string }, trangThai: { type: string } }
    DongDieuKien:
      type: object
      properties:
        ma: { type: string }
        ten: { type: string }
        trangThai: { type: string, enum: [DAT, CHUA_DAT, KHONG_AP_DUNG, DAT_NGOAI_LE, TU_DONG] }
        canCu: { type: string }
        module: { type: string }
        ngoaiLe: { type: object, properties: { yeuCauPheDuyetId: { type: integer, format: int64 }, nguoiDuyet: { type: string } } }
    DanhSachDieuKien:
      type: object
      properties:
        dieuKien: { type: array, items: { $ref: '#/components/schemas/DongDieuKien' } }
        canhBao: { type: array, items: { $ref: '#/components/schemas/CanhBao' } }
        yKienVaoO: { oneOf: [ { $ref: '#/components/schemas/YKienVaoO' }, { type: 'null' } ], description: 'Chỉ có ở danh sách điều kiện tiếp nhận (FR-004a)' }
    NguonYKien:
      type: object
      description: Như api-001.yaml NguonYKien (001 FR-023g); bổ sung 2026-10-18
      required: [loai]
      properties:
        loai: { type: string, enum: [NGUOI_CAO_TUOI, NGUOI_THAN, NHAN_VIEN_QUAN_SAT] }
        nguoiThanId: { type: [integer, 'null'], format: int64 }
    YKienVaoO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        yKien: { type: string, enum: [DONG_Y, KHONG_DONG_Y, KHONG_BAY_TO_DUOC] }
        nguon: { $ref: '#/components/schemas/NguonYKien' }
        ghiChu: { type: string }
        nguoiGhi: { type: string }
        thoiDiem: { type: string, format: date-time }
        trangThai: { type: string, enum: [HIEU_LUC, DUOC_THAY_THE] }
    TienTrinh:
      type: object
      properties:
        buoc: { type: array, items: { type: object, properties: { ten: { type: string, enum: [DANG_KY, THU_THAP_THONG_TIN, DANH_GIA, XAC_DINH_LUU_TRU, XAC_DINH_CHAM_SOC, XAC_DINH_DICH_VU, KIEM_TRA_DIEU_KIEN, TIEP_NHAN] }, xong: { type: boolean }, canCu: { type: string } } } }
    LuotDangKyGhi:
      type: object
      required: [nctId, ngayDangKy, loaiLuuTruMongMuon, mucDuKien]
      properties:
        nctId: { type: integer, format: int64 }
        ngayDangKy: { type: string, format: date }
        nguoiLienHe: { type: string }
        nhuCau: { type: string }
        loaiLuuTruMongMuon: { $ref: '#/components/schemas/LoaiLuuTru' }
        mucDuKien: { $ref: '#/components/schemas/MaMucChamSoc' }
        ngayMongMuonVao: { type: string, format: date }
        ghiChu: { type: string }
    LuotDangKy:
      allOf:
        - $ref: '#/components/schemas/LuotDangKyGhi'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            trangThai: { $ref: '#/components/schemas/TrangThaiLuotDangKy' }
            hoSoChoId: { type: integer, format: int64 }
            yKienVaoO: { type: array, description: 'Ý kiến về việc vào ở, hiện hành trước rồi lịch sử (FR-001, bổ sung 2026-10-18)', items: { $ref: '#/components/schemas/YKienVaoO' } }
            yKienLucTiepNhanId: { type: [integer, 'null'], format: int64 }
    HoSoCho:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nctId: { type: integer, format: int64 }
        hoTen: { type: string }
        gioiTinh: { type: string }
        ngayDangKy: { type: string, format: date }
        loaiLuuTru: { $ref: '#/components/schemas/LoaiLuuTru' }
        mucChamSoc: { $ref: '#/components/schemas/MaMucChamSoc' }
        chuaDanhGia: { type: boolean }
        tinhHuong: { type: array, items: { type: object, properties: { ma: { type: string }, trangThai: { type: string, enum: [XAC_NHAN, CHO_XAC_NHAN] } } } }
        diem: { type: integer }
        diemChiTiet: { type: object, properties: { mucChamSoc: { type: integer }, thoiGianCho: { type: integer }, tinhHuong: { type: integer }, dieuChinh: { type: integer } } }
        giuongDangGiuId: { type: integer, format: int64 }
        trangThai: { $ref: '#/components/schemas/TrangThaiHoSoCho' }
    DongLichSuDiem:
      type: object
      properties: { thoiDiem: { type: string, format: date-time }, diemCu: { type: integer }, diemMoi: { type: integer }, nguyenNhan: { type: string }, nguoiDeNghi: { type: string }, nguoiDuyet: { type: string }, lyDo: { type: string } }
    DanhSachPhuHop:
      type: object
      properties:
        giuongId: { type: integer, format: int64 }
        batDauLuotTrong: { type: string, format: date-time }
        hoSo: { type: array, items: { $ref: '#/components/schemas/HoSoCho' } }
    HopDongGhi:
      type: object
      required: [nctId, loaiLuuTru, ngayBatDau, mucChamSoc, kyTinhPhiLuuTru]
      properties:
        nctId: { type: integer, format: int64 }
        loaiLuuTru: { $ref: '#/components/schemas/LoaiLuuTru' }
        ngayBatDau: { type: string, format: date }
        ngayKetThuc: { type: string, format: date, description: 'Bắt buộc với nội trú ngắn ngày' }
        mucChamSoc: { $ref: '#/components/schemas/MaMucChamSoc' }
        loaiPhongId: { type: integer, format: int64 }
        giuongId: { type: integer, format: int64 }
        kyTinhPhiLuuTru: { type: string, enum: [THANG, NGAY, BUOI] }
        dichVu: { type: array, items: { type: object, required: [dichVuId], properties: { dichVuId: { type: integer, format: int64 }, thuocGoi: { type: boolean }, soLuong: { type: number }, donGiaRieng: { type: integer, format: int64 } } } }
        khongYeuCauCoc: { type: boolean }
        khoanDatCoc: { type: integer, format: int64 }
        chinhSachGiuGiuong: { type: string }
        chinhSachVangGhiDe: { type: array, items: { $ref: '#/components/schemas/DongChinhSachVang' } }
        lichDen: { type: array, items: { type: object, properties: { thuTrongTuan: { type: integer, minimum: 1, maximum: 7 }, ngay: { type: string, format: date }, gioDen: { type: string, example: '07:30' }, gioVe: { type: string, example: '16:30' } } } }
        dieuKienChamDut: { type: string }
    DongChinhSachVang:
      type: object
      properties:
        loaiLuuTru: { $ref: '#/components/schemas/LoaiLuuTru' }
        loaiVang: { type: string }
        tuNgayThu: { type: integer }
        denNgayThu: { type: integer, description: 'Bỏ trống là không giới hạn' }
        heSo: { type: string, description: 'Số phần trăm, THEO_HOP_DONG hoặc QUAN_LY_QUYET_DINH' }
        giuGiuong: { type: string, enum: [CO, KHONG, THEO_HOP_DONG, QUAN_LY_QUYET_DINH] }
    HopDong:
      allOf:
        - $ref: '#/components/schemas/HopDongGhi'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            soHopDong: { type: string }
            trangThai: { $ref: '#/components/schemas/TrangThaiHopDong' }
            ngayKetThucHienHanh: { type: string, format: date }
            dangChoDuyetDieuKhoan: { type: boolean }
            dauQuaHanTu: { type: string, format: date }
            ngayKy: { type: string, format: date }
            lyDoChamDut: { type: string }
            truongBiAn: { type: array, items: { type: string } }
            lenhDuocPhep: { type: array, items: { type: string } }
    KetQuaHopDong:
      type: object
      properties: { hopDong: { $ref: '#/components/schemas/HopDong' }, canhBao: { type: array, items: { $ref: '#/components/schemas/CanhBao' } } }
    DieuKhoanKhacChuan:
      type: object
      properties: { loai: { type: string, enum: [GIA, CHINH_SACH_VANG, CHINH_SACH_GIU_GIUONG] }, moTa: { type: string }, giaTriChuan: { type: string }, giaTriDeXuat: { type: string } }
    NoiDungHopDong:
      type: object
      properties:
        hopDongId: { type: integer, format: int64 }
        phienBan: { type: integer }
        hieuLucTu: { type: string, format: date }
        phuLucId: { type: integer, format: int64 }
        noiDung: { $ref: '#/components/schemas/HopDongGhi' }
        donGiaDaGhi: { type: array, items: { type: object, properties: { dichVuId: { type: integer, format: int64 }, donGia: { type: integer, format: int64 } } } }
    PhuLuc:
      type: object
      properties:
        id: { type: integer, format: int64 }
        yeuCauPheDuyetId: { type: integer, format: int64 }
        loaiThayDoi: { type: array, items: { type: string } }
        noiDungTruoc: { type: object }
        noiDungSau: { type: object }
        ngayHieuLuc: { type: string, format: date }
        trangThai: { type: string, enum: [CHO_HIEU_LUC, DA_AP_DUNG, KHONG_AP_DUNG] }
    DatCoc:
      type: object
      properties:
        khongYeuCau: { type: boolean }
        khoanCanDatCoc: { type: integer, format: int64 }
        trangThai: { type: string, enum: [CHUA_DAP_UNG, DA_DAP_UNG, KHONG_YEU_CAU] }
        canCu: { type: object, properties: { thoiDiem: { type: string, format: date-time }, giaoDichId: { type: integer, format: int64 }, keToan: { type: string }, soPhieuThu: { type: string } } }
    DichVuGhi:
      type: object
      required: [loai, ten, donViTinh, kyTinh]
      properties:
        loai: { $ref: '#/components/schemas/LoaiDichVu' }
        ten: { type: string }
        donViTinh: { type: string }
        kyTinh: { type: string, enum: [THANG, NGAY, BUOI, LAN, DON_VI] }
        maMuc: { $ref: '#/components/schemas/MaMucChamSoc' }
        loaiPhongId: { type: integer, format: int64 }
        thuocId: { type: integer, format: int64 }
    DichVu:
      allOf:
        - $ref: '#/components/schemas/DichVuGhi'
        - type: object
          properties: { id: { type: integer, format: int64 }, trangThai: { type: string } }
    PhienBanDonGia:
      type: object
      properties: { id: { type: integer, format: int64 }, donGia: { type: integer, format: int64 }, hieuLucTu: { type: string, format: date }, hieuLucDen: { type: string, format: date }, daThamChieu: { type: boolean } }
    YeuCauThayDoiGhi:
      type: object
      required: [hopDongId, loaiThayDoi, giaTriSau, ngayHieuLucMongMuon, lyDo]
      properties:
        hopDongId: { type: integer, format: int64 }
        loaiThayDoi: { type: array, minItems: 1, items: { type: string, enum: [LOAI_LUU_TRU, MUC_CHAM_SOC, DICH_VU, THOI_GIAN, GIUONG, LICH_DEN] } }
