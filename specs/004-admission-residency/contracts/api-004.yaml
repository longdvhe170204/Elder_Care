      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LuotVangChiTiet' } } } } }
  /luot-vang/{id}/gia-han-du-kien:
    post:
