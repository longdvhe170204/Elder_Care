      parameters: [ { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DayCareClosureDay' } } } } } }
    post:
      tags: [absences]
      summary: Khai báo ngày khu bán trú nghỉ (Hành chính)
      description: 'Ngày đã qua bắt buộc lý do; 010 tính lại hoặc điều chỉnh khoản đã lập; 011 không tính suất (FR-060a).'
      x-fr: [FR-060a]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
