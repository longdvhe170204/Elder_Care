        lượt vắng đã đóng chỉ nhận COEFFICIENT_ONLY cho các ngày bị ảnh hưởng (FR-061). Các ngày "chờ quyết định" được tính lại (FR-056).
      x-fr: [FR-055, FR-056, FR-061]
