  # ---------------- Thay đổi lưu trú ----------------
  /residency-change-requests:
    post:
      tags: [change-requests]
      summary: Lập yêu cầu thay đổi lưu trú ở Nháp
      description: |
        Hành chính mọi loại; Bác sĩ chỉ đổi mức chăm sóc; người đại diện qua cổng tạo ở Nháp và Hành chính được báo (FR-039).
        Giá trị trước và ảnh hưởng chi phí do hệ thống điền (FR-038). Ngày hiệu lực mong muốn sớm hơn ngày bắt đầu hợp đồng: 422 (FR-040).
        reference là lần đánh giá (BR-M01-03) hoặc lệnh chuyển giường gấp (003 FR-030). Hệ thống không tự lập yêu cầu (Q-306).
        Gửi duyệt, duyệt, từ chối, hủy qua api-000; khi duyệt, kiểm FR-041, FR-046 và tạo phụ lục (FR-042).
        minorChange do hệ thống tính (FR-043): Quản lý viện duyệt mọi yêu cầu, Hành chính chỉ duyệt yêu cầu là thay đổi nhỏ; kiểm lại lúc duyệt.
      x-fr: [FR-037, FR-038, FR-039, FR-040, FR-043]
      x-br: [BR-M01-03, BR-M02-16]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResidencyChangeRequestInput' } } } }
      responses: { '201': { description: Đã lập, content: { application/json: { schema: { $ref: '#/components/schemas/ResidencyChangeRequest' } } } }, '403': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
  /residency-change-requests/{id}:
    get:
      tags: [change-requests]
      summary: Xem yêu cầu thay đổi lưu trú
      x-fr: [FR-038]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ResidencyChangeRequest' } } } } }
    put:
      tags: [change-requests]
      summary: Sửa yêu cầu ở Nháp (Hành chính hoàn thiện yêu cầu của người đại diện)
      x-fr: [FR-038, FR-039]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResidencyChangeRequestInput' } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Problem' }, '412': { $ref: '#/components/responses/Problem' } }

