openapi: 3.1.0
info:
  title: Elder Care – Feature 004 (tiếp nhận và lưu trú)
  version: 1.0.0-design
  description: |
    Hợp đồng REST của feature 004 (module M02). Quy ước chung theo research R-03 của 000:
    tiền tố /api/v1, lỗi RFC 9457 có errorCode và unmetConditions[], If-Match cho lệnh sửa nội dung
    (hợp đồng Nháp, lượt đăng ký, yêu cầu Nháp, danh mục), Idempotency-Key cho mọi lệnh ghi.
    Lệnh chuyển trạng thái (hồ sơ chờ, hợp đồng, hồ sơ kết thúc) không dùng If-Match; backend khóa dòng và
    kiểm tra lại trên trạng thái mới (research T-03).
    Các lệnh Hoàn tất tiếp nhận, Hủy tiếp nhận, Cho tạm vắng, Chuyển viện, Ghi nhận trở về, Kết thúc lưu trú,
    Ghi nhận qua đời là endpoint của api-001 (POST /residents/{id}/<command>); 004 sở hữu nội dung details
    theo contracts/module-interfaces.md mục 1.1.
    Vòng đời chung của yêu cầu phê duyệt (gửi duyệt, duyệt, từ chối, hủy) dùng endpoint của api-000.
    Trường tài chính bị bỏ khỏi phản hồi theo 002 (FINANCE) và liệt kê trong hiddenFields.
    Tên định danh tiếng Anh theo glossary.md của 000, mục 10 (dịch 2026-10-25; bản tên logic tiếng Việt ở lịch sử git).
    Truy vết: mỗi operation có x-fr (FR của spec 004) và x-br khi có.
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - { name: applications, description: 'UC-09, UC-08 (điều kiện); mục A' }
  - { name: waiting-list, description: 'UC-10; mục B' }
  - { name: contracts, description: 'UC-11, UC-12; mục C, D' }
  - { name: services, description: 'Danh mục dịch vụ, phiên bản đơn giá; mục E' }
  - { name: change-requests, description: 'UC-13, UC-14; mục F' }
  - { name: absences, description: 'UC-15, UC-16 (nội dung lượt vắng), bán trú; mục G' }
  - { name: residency-ending, description: 'UC-17; mục H' }
  - { name: death, description: 'UC-18; mục I' }

paths:
  # ---------------- Đăng ký ----------------
  /admission-applications:
    get:
      tags: [applications]
      summary: Danh sách lượt đăng ký (Hành chính, Quản lý viện)
      x-fr: [FR-006]
      parameters:
        - { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/ApplicationStatus' } } }
        - { $ref: '#/components/parameters/Cursor' }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdmissionApplication' } } } } }, '403': { $ref: '#/components/responses/Problem' } }
    post:
      tags: [applications]
      summary: Lập lượt đăng ký tiếp nhận (Hành chính)
      description: 'Người cao tuổi phải Đang tiếp nhận; đã có lượt Đang xử lý hoặc Đang chờ thì 409 APPLICATION_ALREADY_EXISTS (FR-001).'
      x-fr: [FR-001, FR-006]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdmissionApplicationInput' } } } }
      responses:
        '201': { description: Đã lập, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AdmissionApplication' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admission-applications/{id}:
    get:
      tags: [applications]
      summary: Xem lượt đăng ký
      x-fr: [FR-001, FR-006]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AdmissionApplication' } } } } }
  /admission-applications/{id}/update:
    post:
      tags: [applications]
      summary: Cập nhật lượt đăng ký
      description: 'Chỉ khi Đang xử lý hoặc Đang chờ; ngày đăng ký không đổi khi đã có hồ sơ chờ (FR-001, BR-M02-15).'
      x-fr: [FR-001]
      x-br: [BR-M02-15]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AdmissionApplicationInput'
                - { type: object, required: [reason], properties: { reason: { $ref: '#/components/schemas/Reason' } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Conflict' }, '412': { $ref: '#/components/responses/Problem' } }
  /admission-applications/{id}/admission-opinion:
    post:
      tags: [applications]
      summary: Ghi ý kiến của người cao tuổi về việc vào ở (Hành chính); ý kiến Hiệu lực cũ chuyển Được thay thế (bổ sung 2026-10-18)
      description: 'Chỉ khi lượt Đang xử lý hoặc Đang chờ. Ý kiến không là điều kiện tiếp nhận (FR-004a, Q-356).'
      x-fr: [FR-001, FR-004a]
      x-br: [BR-M01-14]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opinion, source]
              properties:
                opinion: { type: string, enum: [AGREE, DISAGREE, UNABLE_TO_EXPRESS] }
                source: { $ref: '#/components/schemas/OpinionSource' }
                note: { type: string, maxLength: 2000 }
      responses: { '201': { description: Đã ghi, content: { application/json: { schema: { $ref: '#/components/schemas/AdmissionOpinion' } } } }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Problem' } }
  /admission-applications/{id}/admission-conditions:
    get:
      tags: [applications]
      summary: Danh sách điều kiện tiếp nhận (a) → (f)
      description: |
        Mỗi điều kiện Đạt / Chưa đạt / Không áp dụng kèm căn cứ; cảnh báo lệch mức, lệch loại lưu trú (FR-005),
        cảnh báo "phí đang tính cho ngày chưa vào ở" (FR-076), "cần phân bổ lại giường" (FR-021).
        Cùng nguồn với điều kiện của lệnh Hoàn tất tiếp nhận (research T-09). (f) người liên hệ chính, người đại diện (DBR-02, Q-343) lấy từ điều kiện của 012.
        admissionOpinion: ý kiến hiện hành của người cao tuổi kèm nguồn, không phải điều kiện; warnings có ADMISSION_OPINION_MISSING hoặc RESIDENT_DISAGREES_WITH_ADMISSION (FR-004a, bổ sung 2026-10-18).
      x-fr: [FR-004, FR-004a, FR-005, FR-021, FR-075, FR-076]
      x-br: [BR-M02-22]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConditionList' } } } } }
  /admission-applications/{id}/progress:
    get:
      tags: [applications]
      summary: Tiến trình theo các bước 6.1, suy ra từ dữ liệu
      x-fr: [FR-003]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Progress' } } } } }

  # ---------------- Danh sách chờ ----------------
  /waiting-list-entries:
    get:
      tags: [waiting-list]
      summary: Danh sách chờ (Hành chính, Quản lý viện)
      description: 'Sắp theo điểm giảm dần, ngày đăng ký, thời điểm tạo. Vai trò khác, kể cả người thân, 403 (FR-018).'
      x-fr: [FR-009, FR-018]
      parameters: [ { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/WaitingListStatus' } } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/WaitingListEntry' } } } } }, '403': { $ref: '#/components/responses/Problem' } }
    post:
      tags: [waiting-list]
      summary: Đưa vào danh sách chờ (Hành chính)
      description: 'Tạo hồ sơ chờ từ lượt đăng ký Đang xử lý; tình huống "từng lưu trú tại viện" được đánh dấu sẵn ở trạng thái chờ xác nhận nếu có hồ sơ cũ Kết thúc lưu trú (FR-007).'
      x-fr: [FR-007, FR-008, FR-009]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicationId]
              properties:
                applicationId: { type: integer, format: int64 }
                circumstances: { type: array, items: { type: string, description: 'Mã tình huống trong bảng CFG-M02-08' } }
      responses: { '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/WaitingListEntry' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /waiting-list-entries/{id}:
    get:
      tags: [waiting-list]
      summary: Xem hồ sơ chờ, kèm chi tiết điểm
      x-fr: [FR-009]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WaitingListEntry' } } } } }
  /waiting-list-entries/{id}/score-history:
    get:
      tags: [waiting-list]
      summary: Lịch sử điểm và điều chỉnh
      x-fr: [FR-010, FR-011]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ScoreHistoryEntry' } } } } } }
  /waiting-list-entries/{id}/update-circumstances:
    post:
      tags: [waiting-list]
      summary: Cập nhật tình huống đặc biệt (xác nhận hoặc bỏ dấu "từng lưu trú" kèm lý do)
      x-fr: [FR-007, FR-010]
      x-br: [BR-M02-15]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [circumstances, reason]
              properties:
                circumstances: { type: array, items: { type: string } }
                reason: { $ref: '#/components/schemas/Reason' }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WaitingListEntry' } } } } }
  /waiting-list-entries/{id}/propose-score-adjustment:
    post:
      tags: [waiting-list]
      summary: Lập đề nghị điều chỉnh điểm (yêu cầu M02.SCORE_ADJUSTMENT, Quản lý viện duyệt)
      description: 'Điểm chỉ đổi khi yêu cầu được áp dụng (FR-011, SC-004). Gửi duyệt và duyệt qua api-000.'
      x-fr: [FR-011]
      x-br: [BR-M02-10]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points, reason]
              properties:
                points: { type: integer, description: 'Dương là cộng, âm là trừ; khác 0' }
                reason: { $ref: '#/components/schemas/Reason' }
      responses: { '201': { description: Đã lập yêu cầu, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRequestRef' } } } }, '422': { $ref: '#/components/responses/Problem' } }
  /beds/{bedId}/matching-entries:
    get:
      tags: [waiting-list]
      summary: Danh sách hồ sơ chờ phù hợp với một giường Trống
      description: |
        Lọc theo FR-012 trong lượt trống hiện tại, sắp theo điểm, ngày đăng ký, thời điểm tạo; kèm thành phần điểm.
        Không chọn sẵn, không giới hạn số hồ sơ (FR-013, Q-307). Danh sách rỗng nghĩa là "không có người phù hợp".
      x-fr: [FR-012, FR-013]
      x-br: [BR-M02-01, BR-M02-10]
      parameters: [ { name: bedId, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MatchingEntries' } } } } }
  /waiting-list-entries/{id}/record-contacted:
    post:
      tags: [waiting-list]
      summary: Ghi nhận đã liên hệ, kèm giường được giữ
      description: |
        Giường phải Trống, không có phân bổ tương lai, hồ sơ thỏa FR-012 với giường đó. Giường chuyển Đang giữ chỗ hạn CFG-M02-02 (003).
        Chọn hồ sơ không đứng đầu danh sách (sau khi bỏ hồ sơ đã liên hệ, từ chối, hết hạn trong lượt): outOfOrderReason bắt buộc (FR-014).
      x-fr: [FR-014]
      x-br: [BR-M02-02, BR-M02-10]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bedId]
              properties:
                bedId: { type: integer, format: int64 }
                outOfOrderReason: { $ref: '#/components/schemas/Reason' }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WaitingListEntry' } } } }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Problem' } }
  /waiting-list-entries/{id}/decline-bed:
    post:
      tags: [waiting-list]
      summary: Gia đình từ chối giường này nhưng vẫn chờ
      description: 'Hồ sơ về Đang chờ, giữ ngày đăng ký và điểm; giường về Trống; Hành chính được báo chọn người tiếp theo (Edge Case).'
      x-fr: [FR-012, FR-013]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/ReasonBody' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Conflict' } }
  /waiting-list-entries/{id}/decline:
    post:
      tags: [waiting-list]
      summary: Ghi nhận gia đình không tiếp tục chờ (Từ chối)
      description: 'Trong cùng một lần thực hiện Hủy tiếp nhận (001) với cùng lý do; Hủy tiếp nhận không được thì lệnh bị từ chối (FR-002).'
      x-fr: [FR-002]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/ReasonBody' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Conflict' } }
  /waiting-list-entries/{id}/cancel-waiting:
    post:
      tags: [waiting-list]
      summary: Hủy chờ
      description: 'Như Từ chối: kéo theo Hủy tiếp nhận (001) trong cùng một lần (FR-002).'
      x-fr: [FR-002]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/ReasonBody' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Conflict' } }
  /waiting-list-entries/{id}/confirm-still-needed:
    post:
      tags: [waiting-list]
      summary: Xác nhận gia đình còn nhu cầu (đặt lại mốc CFG-M02-03)
      x-fr: [FR-017]
      x-br: [BR-M02-03]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: OK } }

  # ---------------- Hợp đồng ----------------
  /contracts:
    get:
      tags: [contracts]
      summary: Danh sách hợp đồng
      description: 'Người đại diện chỉ thấy hợp đồng của người mình đại diện (chú thích ⁷); vai trò khác không thấy trường tài chính (FR-028).'
      x-fr: [FR-028, FR-029]
      parameters:
        - { name: residentId, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/ContractStatus' } } }
        - { name: overdue, in: query, schema: { type: boolean } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Contract' } } } } } }
    post:
      tags: [contracts]
      summary: Lập hợp đồng Nháp (Hành chính)
      description: 'Được lập trước đánh giá đầu vào (Q-300); cảnh báo khi mức khác mức hiện hành (FR-025). Không có người đại diện: 409 REPRESENTATIVE_REQUIRED.'
      x-fr: [FR-019, FR-025]
      x-br: [BR-M02-22]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContractInput' } } } }
      responses: { '201': { description: Đã lập, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ContractResult' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /contracts/{id}:
    get:
      tags: [contracts]
      summary: Xem hợp đồng (bản nháp hoặc hợp đồng gốc kèm danh sách phụ lục)
      x-fr: [FR-019, FR-028]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Contract' } } } } }
    put:
      tags: [contracts]
      summary: Sửa nội dung hợp đồng Nháp
      description: |
        Chỉ khi Nháp và không đang chờ duyệt điều khoản; trạng thái khác: 409 CONTRACT_LOCKED (FR-020, FR-023, BR-M02-09).
        Sửa sau khi điều khoản khác chuẩn đã được duyệt làm bản duyệt mất hiệu lực (FR-025a).
      x-fr: [FR-019, FR-020, FR-025, FR-025a]
      x-br: [BR-M02-09]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContractInput' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ContractResult' } } } }, '409': { $ref: '#/components/responses/Problem' }, '412': { $ref: '#/components/responses/Problem' } }
  /contracts/{id}/non-standard-terms:
    get:
      tags: [contracts]
      summary: Điều khoản khác chuẩn của hợp đồng Nháp (giá trị chuẩn, giá trị đề xuất)
      x-fr: [FR-025a]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NonStandardTerm' } } } } } }
  /contracts/{id}/submit-terms-for-approval:
    post:
      tags: [contracts]
      summary: Gửi Quản lý viện duyệt điều khoản khác chuẩn
      description: 'Lập yêu cầu M02.CONTRACT_TERMS_APPROVAL ở Chờ duyệt, khóa nội dung (FR-025a). Không có điều khoản khác chuẩn: 409.'
      x-fr: [FR-025a]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/ReasonBody' }
      responses: { '201': { description: Đã lập yêu cầu, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRequestRef' } } } }, '409': { $ref: '#/components/responses/Problem' } }
  /contracts/{id}/send-for-signature:
    post:
      tags: [contracts]
      summary: Gửi ký
      description: |
        Chặn khi thiếu nội dung bắt buộc (FR-019), không có đúng một dịch vụ chăm sóc theo mức của hợp đồng (FR-025, Q-297),
        hoặc có điều khoản khác chuẩn chưa được duyệt cho đúng nội dung hiện tại (FR-025a). Cảnh báo theo FR-025 không chặn.
      x-fr: [FR-020, FR-025, FR-025a]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ContractResult' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
