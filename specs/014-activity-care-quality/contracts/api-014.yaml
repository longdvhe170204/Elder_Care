openapi: 3.1.0
info:
  title: Elder Care – Feature 014 (hoạt động và chất lượng chăm sóc)
  version: 1.0.0-design
  description: |
    Hợp đồng REST của feature 014 (module M04, phần 8.8 → 8.10 và BR-M04-23). Quy ước chung theo research R-03 của 000:
    tiền tố /api/v1, lỗi RFC 9457 có errorCode và unmetConditions[], Idempotency-Key cho mọi lệnh ghi.
    Lệnh trên buổi, chuyến, đăng ký, mục kiểm tra khóa dòng và kiểm tra lại (research L-03).
    Hệ thống không tạo buổi, danh sách kiểm tra, công việc làm lại, sự cố (Q-306, Q-307).
    Điểm danh buổi, rời viện, về thông thường ghi ngoại tuyến được (Q-01) qua kênh đồng bộ của 002 với cùng thân lệnh;
    Báo thiếu người, Kết thúc điểm danh về, ghi sự cố thiếu người chỉ trực tuyến (FR-046a).
    Đăng ký có cảnh báo cần acknowledgeWarnings = true, nếu không trả 409 WARNING_ACKNOWLEDGEMENT_REQUIRED kèm danh sách cảnh báo.
    Truy vết: mỗi operation có x-fr (FR của spec 014) và x-br khi có.
    Bản dịch tiếng Anh chủ dự án duyệt 2026-11-05 (glossary mục 20).
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - { name: activities, description: 'UC-29; mục A, B' }
  - { name: activity-sessions, description: 'UC-29; mục C, D, F' }
  - { name: trips, description: 'UC-30; mục G, H' }
  - { name: wellbeing, description: 'UC-29; mục I' }
  - { name: quality-checks, description: 'UC-31; mục J' }
  - { name: family-portal, description: 'FR-068, FR-016a' }

paths:
  /activity-types:
    get:
      tags: [activities]
      summary: Loại hoạt động, nhóm sở thích liên quan
      x-fr: [FR-001]
      responses: { '200': { description: OK } }
    post:
      tags: [activities]
      summary: Tạo, sửa, ngừng loại hoạt động (Quản lý viện)
      x-fr: [FR-001]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { id: { type: integer, format: int64 }, name: { type: string }, groupActivity: { type: boolean }, offSite: { type: boolean }, interestGroupIds: { type: array, items: { type: integer, format: int64 } }, status: { type: string } } } } } }
      responses: { '200': { description: OK } }
  /activities:
    get:
      tags: [activities]
      summary: Hoạt động theo tầng hoặc toàn viện
      x-fr: [FR-002]
      parameters: [ { name: floorAreaId, in: query, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ActivityView' } } } } } }
    post:
      tags: [activities]
      summary: Khai báo hoạt động (Trưởng tầng)
      x-fr: [FR-002, FR-002a]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Activity' } } } }
      responses: { '201': { description: OK }, '422': { $ref: '#/components/responses/Problem' } }
  /activities/{id}:
    put:
      tags: [activities]
      summary: Sửa hoạt động; giảm số lượng dưới số đăng ký cần chọn đăng ký cần hủy kèm lý do
      x-fr: [FR-002b, FR-003]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Activity' } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /activities/{id}/{command}:
    post:
      tags: [activities]
      summary: "deactivate (hủy buổi chưa điểm danh từ ngày ngừng), change-template (phiên bản mẫu mới, lý do, ngày áp dụng ≥ hôm nay), create-sessions-from-template (khoảng ngày), add-regular-participant, remove-regular-participant"
      x-fr: [FR-004, FR-005, FR-006, FR-007, FR-008, FR-009, FR-010]
      x-br: [BR-M04-21]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: command, in: path, required: true, schema: { type: string, enum: [deactivate, change-template, create-sessions-from-template, add-regular-participant, remove-regular-participant] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActivityCommand' } } } }
      responses: { '200': { description: 'Kết quả: buổi đã tạo, thời điểm đã có buổi, người thường xuyên không được đăng ký kèm lý do' }, '409': { $ref: '#/components/responses/Blocked' } }

  /activity-sessions:
    get:
      tags: [activity-sessions]
      summary: Buổi theo ngày, tầng, hoạt động
      x-fr: [FR-011]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: floorAreaId, in: query, schema: { type: integer, format: int64 } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ActivitySession' } } } } } }
    post:
      tags: [activity-sessions]
      summary: Tạo buổi lẻ (Trưởng tầng); chuyến đi kèm điểm đến, giờ rời, giờ về, phương tiện
      x-fr: [FR-011, FR-034]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActivitySessionCreate' } } } }
      responses: { '201': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /activity-sessions/{id}:
    get:
      tags: [activity-sessions]
      summary: Chi tiết buổi, đăng ký, điểm danh
      x-fr: [FR-019, FR-028]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ActivitySessionDetail' } } } } }
  /activity-sessions/{id}/{command}:
    post:
      tags: [activity-sessions]
      summary: "reschedule (thời điểm, địa điểm, người phụ trách; lý do), cancel (lý do), complete-attendance"
      x-fr: [FR-012, FR-013, FR-014, FR-029, FR-038a]
      x-br: [BR-M04-15]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: command, in: path, required: true, schema: { type: string, enum: [reschedule, cancel, complete-attendance] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { $ref: '#/components/schemas/Reason' }, startsAt: { type: string, format: date-time }, endsAt: { type: string, format: date-time }, locationId: { type: integer, format: int64 }, responsibleStaffId: { type: integer, format: int64 } } } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /activity-sessions/{id}/registrations:
    post:
      tags: [activity-sessions]
      summary: Đăng ký người cao tuổi vào buổi
      x-fr: [FR-015, FR-016, FR-016a, FR-017, FR-018, FR-052]
      x-br: [BR-M04-15, BR-M05-11]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [residentId], properties: { residentId: { type: integer, format: int64 }, acknowledgeWarnings: { type: boolean } } } } } }
      responses: { '201': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /activity-registrations/{id}/cancel:
    post:
      tags: [activity-sessions]
      summary: Hủy đăng ký trước giờ bắt đầu (lý do)
      x-fr: [FR-017]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /activity-sessions/{id}/attendance:
    post:
      tags: [activity-sessions]
      summary: Ghi kết quả điểm danh (một hoặc nhiều người; thêm người lúc điểm danh)
      x-fr: [FR-027, FR-028, FR-029, FR-030, FR-032, FR-033]
      x-br: [BR-M04-18]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SessionAttendance' } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /late-return-consents:
    post:
      tags: [activity-sessions]
      summary: Hành chính ghi nhận đồng ý về muộn của người đại diện (bản ký) cho đúng một buổi
      x-fr: [FR-016a]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LateReturnConsent' } } } }
      responses: { '201': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /late-return-consents/{id}/withdraw:
    post:
      tags: [activity-sessions]
      summary: Hành chính ghi rút đồng ý theo yêu cầu người đại diện (trước giờ bắt đầu)
      x-fr: [FR-016a]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }

  /trips/{id}:
    get:
      tags: [trips]
      summary: Danh sách chuyến cho trưởng đoàn, người đi cùng, trưởng tầng (trạng thái từng người, liên hệ chính, thuốc mang theo theo quyền)
      x-fr: [FR-039]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK } }
  /trips/{id}/assignment:
    post:
      tags: [trips]
      summary: Phân công trưởng đoàn, người đi cùng (Trưởng tầng)
      x-fr: [FR-035]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { leaderId: { type: integer, format: int64 }, companionIds: { type: array, items: { type: integer, format: int64 } } } } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /trips/{id}/eligibility-assessments:
    post:
      tags: [trips]
      summary: Đánh giá khả năng tham gia (Trưởng tầng của tầng người cao tuổi)
      x-fr: [FR-036, FR-038]
      x-br: [BR-M04-16]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [residentId, result], properties: { residentId: { type: integer, format: int64 }, result: { type: string, enum: [PASS, FAIL] }, reason: { type: string } } } } } }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' } }
  /trips/{id}/{command}:
    post:
      tags: [trips]
      summary: Lệnh trên chuyến đi
      description: |
        depart (danh sách người; trưởng đoàn hoặc Trưởng tầng thay kèm lý do; FR-040, FR-041), return (danh sách người; FR-044),
        extend (giờ về mới, lý do; FR-043), transfer-leader (người đi cùng đủ vai trò, lý do; FR-035a),
        report-missing (người, nơi và lúc thấy lần cuối, mô tả; ghi sự cố Khẩn cấp; chỉ trực tuyến; FR-046),
        record-missing-incident (người Thiếu khi về chưa có sự cố; FR-047), finish-return (FR-047; chỉ trực tuyến khi có người thiếu).
      x-fr: [FR-035a, FR-040, FR-041, FR-042, FR-043, FR-044, FR-046, FR-046a, FR-047, FR-048, FR-050]
      x-br: [BR-M04-16, BR-M04-17]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: command, in: path, required: true, schema: { type: string, enum: [depart, return, extend, transfer-leader, report-missing, record-missing-incident, finish-return] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TripCommand' } } } }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }

  /residents/{residentId}/preferences:
    get:
      tags: [wellbeing]
      summary: Sở thích hiện hành và lịch sử
      x-fr: [FR-051]
      parameters: [ { $ref: '#/components/parameters/ResidentId' } ]
      responses: { '200': { description: OK } }
    post:
      tags: [wellbeing]
      summary: Ghi sở thích; nhóm và nguồn đã có mục hiện hành cần confirmReplacement (sửa 2026-10-18, Q-363)
      x-fr: [FR-051]
      parameters: [ { $ref: '#/components/parameters/ResidentId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [interestGroupId, level, source], properties: { interestGroupId: { type: integer, format: int64 }, description: { type: string }, level: { type: string, enum: [LIKE, DISLIKE] }, source: { $ref: '#/components/schemas/OpinionSource' }, confirmReplacement: { type: boolean } } } } } }
      responses: { '201': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /preferences/{id}/remove:
    post:
      tags: [wellbeing]
      summary: Bỏ sở thích (lý do)
      x-fr: [FR-051]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { description: OK } }
  /residents/{residentId}/wellbeing-profile:
    get:
      tags: [wellbeing]
      summary: Hồ sơ tinh thần theo khoảng (chỉ xem)
      x-fr: [FR-053]
      parameters: [ { $ref: '#/components/parameters/ResidentId' }, { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } } ]
      responses: { '200': { description: OK } }

  /quality-checks/shifts/{shiftId}:
    get:
      tags: [quality-checks]
      summary: Công việc đủ điều kiện của ca theo tầng, số mục tối thiểu, danh sách hiện có (chỉ người kiểm tra, Quản lý viện); không xếp hạng hay gợi ý
      x-fr: [FR-059, FR-060]
      parameters: [ { name: shiftId, in: path, required: true, schema: { type: integer, format: int64 } }, { name: floorAreaId, in: query, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' } }
    post:
      tags: [quality-checks]
      summary: Lập danh sách kiểm tra (đủ tỷ lệ CFG-M04-11) hoặc thêm mục
      x-fr: [FR-059, FR-060]
      x-br: [BR-M04-23]
      parameters: [ { name: shiftId, in: path, required: true, schema: { type: integer, format: int64 } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [floorAreaId, careTaskIds], properties: { floorAreaId: { type: integer, format: int64 }, careTaskIds: { type: array, minItems: 1, items: { type: integer, format: int64 } } } } } } }
      responses: { '201': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }
  /quality-check-items/{id}/result:
    post:
      tags: [quality-checks]
      summary: Ghi kết quả Đạt / Không đạt (kèm công việc làm lại) / Không kiểm tra được
      x-fr: [FR-061, FR-062, FR-064, FR-066]
      x-br: [BR-M04-23]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QualityCheckResult' } } } }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }

  /family-portal/residents/{residentId}/activities:
    get:
      tags: [family-portal]
      summary: Buổi đã đăng ký, chuyến đi, số buổi đã tham gia (loại "chung"); không có mức tham gia, cảnh báo, kết quả kiểm tra
      x-fr: [FR-068]
      parameters: [ { $ref: '#/components/parameters/ResidentId' } ]
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' } }
  /family-portal/late-return-consents:
    post:
      tags: [family-portal]
      summary: Người đại diện ghi đồng ý về muộn cho một buổi của người bán trú
      x-fr: [FR-016a]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [residentId, sessionId], properties: { residentId: { type: integer, format: int64 }, sessionId: { type: integer, format: int64 } } } } } }
      responses: { '201': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }
  /family-portal/late-return-consents/{id}/withdraw:
    post:
      tags: [family-portal]
      summary: Người đại diện rút đồng ý trước giờ bắt đầu
      x-fr: [FR-016a]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }

components:
  securitySchemes:
    session: { type: http, scheme: bearer, description: 'Token phiên opaque của 002 (A-02)' }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    ResidentId: { name: residentId, in: path, required: true, schema: { type: integer, format: int64 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  requestBodies:
    Reason:
      required: true
      content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { $ref: '#/components/schemas/Reason' } } } } }
  responses:
    Problem:
      description: Lỗi theo RFC 9457 (research R-03 của 000)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Blocked:
      description: 'STATE_CHANGED, SESSION_ALREADY_EXISTS, AFTER_TEMPLATE_END_DATE, CAPACITY_FULL, ISOLATION_ACTIVE, RESIDENT_STATUS_INVALID, SESSION_ALREADY_STARTED, TIME_OVERLAP, OUTSIDE_DAY_CARE_SCHEDULE, LATE_RETURN_CONSENT_REQUIRED, INFECTION_SUSPECTED, WARNING_ACKNOWLEDGEMENT_REQUIRED, NOT_YET_STARTED, REGISTRATIONS_WITHOUT_RESULT, ATTENDANCE_ALREADY_RECORDED, TRIP_LEADER_REQUIRED, ROLE_NOT_ELIGIBLE, NOT_ON_SHIFT, ELIGIBILITY_NOT_PASSED, MEDICATION_NOT_HANDLED, VEHICLE_SCHEDULE_REQUIRED, VEHICLE_ALREADY_SCHEDULED, DEPARTURE_TOO_EARLY, MISSING_INCIDENT_ALREADY_RECORDED, REQUIRES_ONLINE, SAMPLE_RATIO_NOT_MET, CHECKLIST_ALREADY_EXISTS, TASK_NOT_ELIGIBLE, REWORK_TASK_REQUIRED, SELF_CHECK_NOT_ALLOWED, OUTSIDE_SHIFT_TIME, PREFERENCE_REPLACEMENT_CONFIRMATION_REQUIRED'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    OpinionSource:
      type: object
      description: Như api-001.yaml OpinionSource (001 FR-023g); bổ sung 2026-10-18, Q-363
      required: [type]
      properties:
        type: { type: string, enum: [RESIDENT, FAMILY_MEMBER, OBSERVING_STAFF] }
        familyMemberId: { type: [integer, 'null'], format: int64 }
    Reason: { type: string, minLength: 1, maxLength: 2000 }
    Problem:
      type: object
      properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string }, errorCode: { type: string }, unmetConditions: { type: array, items: { type: object } } }
    Activity:
      type: object
      required: [name, typeId, scope, maxParticipants]
      properties:
        name: { type: string }
        typeId: { type: integer, format: int64 }
        scope: { type: string, enum: [FLOOR, FACILITY] }
        floorAreaId: { type: integer, format: int64 }
        defaultLocation: { type: object, properties: { roomId: { type: integer, format: int64 }, areaId: { type: integer, format: int64 }, destination: { type: string } } }
        defaultResponsibleStaffId: { type: integer, format: int64 }
        durationMinutes: { type: integer }
        maxParticipants: { type: integer, minimum: 1 }
        targetGroup: { type: object }
        charged: { type: boolean }
        serviceId: { type: integer, format: int64 }
