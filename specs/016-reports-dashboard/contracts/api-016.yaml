openapi: 3.1.0
info:
  title: Elder Care – Feature 016 (báo cáo và dashboard)
  version: 1.0.0-design
  description: |
    Hợp đồng REST của feature 016 (module M14). Chỉ đọc: mọi endpoint là GET, trừ lệnh xuất (ghi nhật ký "Xuất báo cáo" của 000 và tệp).
    Quy ước chung theo research R-03 của 000: tiền tố /api/v1, lỗi RFC 9457 có errorCode.
    Tên định danh tiếng Anh theo glossary.md của 000, mục 22 (dịch 2026-10-24; bản tên logic tiếng Việt ở lịch sử git).
    Phạm vi, giới hạn trường xét lại mỗi lần gọi (FR-017). Mỗi giá trị có tử số, mẫu số (với tỷ lệ), nhãn và "tính đến".
    Dashboard hỗ trợ ETag / If-None-Match để client làm mới mỗi 30 giây (research O-06).
    Mã chỉ tiêu: contracts/chi-tieu.md (mã tiếng Anh ở glossary mục 22.4). Truy vết: mỗi operation có x-fr.
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - { name: dashboard, description: '18.5' }
  - { name: reports, description: '18.1 → 18.6' }
  - { name: export, description: 'FR-060 → FR-062' }

paths:
  /dashboard:
    get:
      tags: [dashboard]
      summary: Dashboard theo vai trò và phạm vi hiện hành; khối không được phép không có trong phản hồi
      x-fr: [FR-010, FR-012, FR-013, FR-020, FR-021]
      parameters: [ { name: If-None-Match, in: header, schema: { type: string } } ]
      responses:
        '200': { description: OK, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }
        '304': { description: Không đổi }
        '403': { $ref: '#/components/responses/Problem' }
  /metrics:
    get:
      tags: [reports]
      summary: Danh mục chỉ tiêu người xem được thấy, kèm định nghĩa hiển thị
      x-fr: [FR-003, FR-010]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Metric' } } } } } }
  /reports/{group}:
    get:
      tags: [reports]
      summary: Báo cáo một nhóm theo khoảng và bộ lọc; khoảng dài hơn CFG-M14-01 bị từ chối
      x-fr: [FR-022, FR-023, FR-024, FR-025, FR-030, FR-031, FR-032, FR-033, FR-034, FR-035, FR-036, FR-037, FR-040, FR-041, FR-042, FR-042a, FR-043, FR-044, FR-050, FR-051, FR-052, FR-053, FR-054, FR-055, FR-055a, FR-060, FR-070, FR-071, FR-072, FR-073]
      parameters:
        - { $ref: '#/components/parameters/ReportGroup' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: date, in: query, description: 'Báo cáo tại một ngày (FR-022, FR-024)', schema: { type: string, format: date } }
        - { name: floorAreaId, in: query, schema: { type: array, items: { type: integer, format: int64 } } }
        - { name: residenceType, in: query, schema: { type: string } }
        - { name: careLevelId, in: query, schema: { type: integer, format: int64 } }
        - { name: residentId, in: query, schema: { type: integer, format: int64 } }
        - { name: staffId, in: query, schema: { type: integer, format: int64 } }
        - { name: shiftId, in: query, schema: { type: integer, format: int64 } }
        - { name: costMode, in: query, schema: { $ref: '#/components/schemas/CostMode' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { description: 'RANGE_EXCEEDS_MAXIMUM (CFG-M14-01)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /metric-details/{metricCode}:
    get:
      tags: [reports]
      summary: Danh sách bản ghi tạo nên một con số (cùng phạm vi, bộ lọc, mốc tính); dòng người ngoài phạm vi hiện hành ở dạng rút gọn (Q-196)
      x-fr: [FR-009, FR-012, FR-014]
      parameters:
        - { name: metricCode, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: breakdownKey, in: query, description: 'Ô cụ thể (ví dụ trạng thái, tầng, nhân viên)', schema: { type: string } }
        - { name: asOf, in: query, description: 'Mốc "tính đến" của con số để danh sách khớp số', schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MetricDetail' } } } }, '403': { $ref: '#/components/responses/Problem' } }
  /reports/{group}/export:
    post:
      tags: [export]
      summary: Xuất báo cáo (XLSX); Quản lý viện xuất có định danh phải nhập mục đích; vai trò khác chỉ tổng hợp
      description: Tệp chỉ được giao sau khi bản ghi nhật ký "Xuất báo cáo" đã lưu (FR-062). Tệp không đổi khi dữ liệu nguồn đổi.
      x-fr: [FR-060, FR-061, FR-062]
      parameters:
        - { $ref: '#/components/parameters/ReportGroup' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExportRequest' } } } }
      responses:
        '201': { description: 'Mã tệp để tải (GET /files/{id}) và mã nhật ký', content: { application/json: { schema: { $ref: '#/components/schemas/ExportResult' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { description: 'RANGE_EXCEEDS_MAXIMUM, PURPOSE_REQUIRED', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /reports/exports:
    get:
      tags: [export]
      summary: Lần xuất (Quản lý viện thấy mọi lần; người khác thấy lần của mình)
      x-fr: [FR-062]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ExportRecord' } } } } } }

components:
  securitySchemes:
    session: { type: http, scheme: bearer, description: 'Token phiên opaque của 002 (A-02)' }
  parameters:
    ReportGroup: { name: group, in: path, required: true, schema: { type: string, enum: [RESIDENTS, CARE, QUALITY, HEALTH_MEDICATION, INCURRED_COSTS, STAFFING_SHIFTS] } }
    From: { name: from, in: query, schema: { type: string, format: date } }
    To: { name: to, in: query, schema: { type: string, format: date } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  responses:
    Problem:
      description: 'Lỗi theo RFC 9457 (PERMISSION_DENIED; không xác định được phạm vi FR-016 thì PERMISSION_DENIED kèm failedLayer SOURCE_DATA như 002)'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    CostMode: { type: string, enum: [FINALIZED, PROVISIONAL], default: FINALIZED }
    Problem:
      type: object
      description: RFC 9457 cùng errorCode (000 R-03), giống schema Problem của api-000, api-002, api-009 (sửa 2026-10-24 cho khớp ProblemBody chung, BL-23).
      required: [type, title, status, errorCode]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errorCode: { type: string }
        unmetConditions: { type: array, items: { type: object, properties: { code: { type: string }, description: { type: string }, basis: { type: string, description: "BR/FR, ví dụ BR-M12-03" }, module: { type: string, description: "Feature sở hữu điều kiện, ví dụ 013" }, waivable: { type: boolean, description: "Miễn được qua yêu cầu phê duyệt (004)" } } } }
        currentValue: { description: 'Khi 412: tài nguyên hiện hành' }
        candidates: { type: array, description: "POSSIBLE_DUPLICATE_PROFILE, DUPLICATE_HEALTH_ITEM (001)", items: { type: object } }
        failedLayer: { type: string, enum: [ROLE, SCOPE, LEGAL, SOURCE_DATA] }
        license: { type: object, properties: { name: { type: string }, expiryDate: { type: string, format: date } } }
        unlocksAt: { type: string, format: date-time, description: 'Khi 423 ACCOUNT_TEMPORARILY_LOCKED (FR-014)' }
    Metric:
      type: object
      properties: { code: { type: string }, group: { type: string }, name: { type: string }, definition: { type: string }, source: { type: string } }
    MetricValue:
      type: object
      properties:
        metricCode: { type: string }
        value: { type: [number, 'null'] }
        numerator: { type: number }
        denominator: { type: number }
        labels: { type: array, items: { type: string, enum: [NO_DATA, NOT_CONFIGURED, DAY_NOT_ENDED, PENDING_REVIEW, PURGED_BY_RETENTION, PROVISIONAL, WITHIN_YOUR_SCOPE] } }
        pendingReviewCount: { type: integer }
        breakdown: { type: array, items: { type: object, properties: { key: { type: string }, value: { type: number }, numerator: { type: number }, denominator: { type: number } } } }
    Dashboard:
      type: object
      properties:
        asOf: { type: string, format: date-time }
        blocks: { type: array, items: { type: object, properties: { group: { type: string }, status: { type: string, enum: [COMPLETE, UPDATING] }, values: { type: array, items: { $ref: '#/components/schemas/MetricValue' } } } } }
        message: { type: string, description: '"hiện không có phạm vi phân công" khi trống' }
    Report:
      type: object
      properties:
        group: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        asOf: { type: string, format: date-time }
        filters: { type: object }
        values: { type: array, items: { $ref: '#/components/schemas/MetricValue' } }
        notes: { type: array, items: { type: string }, description: 'Ví dụ "chi phí phát sinh của người cao tuổi, không phải báo cáo tài chính của viện"' }
    MetricDetail:
      type: object
      properties:
        metricCode: { type: string }
        total: { type: integer }
        rows: { type: array, items: { type: object, properties: { sourceKey: { type: string }, feature: { type: string }, type: { type: string }, status: { type: string }, referenceTime: { type: string, format: date-time }, floorArea: { type: string }, resident: { type: string }, reduced: { type: boolean }, performedBy: { type: string }, result: { type: object }, pendingReview: { type: boolean }, canOpenRecord: { type: boolean } } } }
    ExportRequest:
      type: object
      required: [from, to]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        filters: { type: object }
        costMode: { $ref: '#/components/schemas/CostMode' }
        includeIdentity: { type: boolean, description: 'Chỉ Quản lý viện' }
        purpose: { type: string, description: 'Bắt buộc khi includeIdentity' }
        format: { type: string, enum: [XLSX, CSV], default: XLSX }
    ExportResult:
      type: object
      description: 'Bổ sung 2026-10-24 (chủ dự án duyệt): kết quả lệnh xuất'
      properties:
        fileId: { type: integer, format: int64, description: 'Tải bằng GET /files/{id} (người xuất, Quản lý viện)' }
        auditLogId: { type: integer, format: int64, description: 'Bản ghi nhật ký "Xuất báo cáo"' }
    ExportRecord:
      type: object
      description: 'Bổ sung 2026-10-24 (chủ dự án duyệt): một lần xuất, đọc từ nhật ký (FR-062)'
      properties:
        auditLogId: { type: integer, format: int64 }
        fileId: { type: integer, format: int64 }
        exportedAt: { type: string, format: date-time }
        exportedBy: { type: [integer, 'null'], format: int64, description: 'Tài khoản người xuất' }
        role: { type: string, description: 'Vai trò lúc xuất (mã AC-xx)' }
        group: { type: string, description: 'Nhóm báo cáo (ReportGroup)' }
        from: { type: string, format: date }
        to: { type: string, format: date }
        includeIdentity: { type: boolean }
        purpose: { type: [string, 'null'], description: 'Mục đích xuất (lý do của bản ghi nhật ký)' }
        rowCount: { type: [integer, 'null'] }
