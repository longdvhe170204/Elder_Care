openapi: 3.1.0
info:
  title: Elder Care – Feature 016 (báo cáo và dashboard)
  version: 1.0.0-design
  description: |
    Hợp đồng REST của feature 016 (module M14). Chỉ đọc: mọi endpoint là GET, trừ lệnh xuất (ghi nhật ký "Xuất báo cáo" của 000 và tệp).
    Quy ước chung theo research R-03 của 000: tiền tố /api/v1, lỗi RFC 9457 có maLoi.
    Phạm vi, giới hạn trường xét lại mỗi lần gọi (FR-017). Mỗi giá trị có tử số, mẫu số (với tỷ lệ), nhãn và "tính đến".
    Dashboard hỗ trợ ETag / If-None-Match để client làm mới mỗi 30 giây (research O-06).
    Mã chỉ tiêu: contracts/chi-tieu.md. Truy vết: mỗi operation có x-fr.
servers:
  - url: /api/v1
security:
  - phien: []
tags:
  - { name: dashboard, description: '18.5' }
  - { name: bao-cao, description: '18.1 → 18.6' }
  - { name: xuat, description: 'FR-060 → FR-062' }

paths:
  /dashboard:
    get:
      tags: [dashboard]
      summary: Dashboard theo vai trò và phạm vi hiện hành; khối không được phép không có trong phản hồi
      x-fr: [FR-010, FR-012, FR-013, FR-020, FR-021]
      parameters: [ { name: If-None-Match, in: header, schema: { type: string } } ]
      responses:
        '200': { description: OK, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }
        '304': { description: Không đổi }
        '403': { $ref: '#/components/responses/Loi' }
  /chi-tieu:
    get:
      tags: [bao-cao]
      summary: Danh mục chỉ tiêu người xem được thấy, kèm định nghĩa hiển thị
      x-fr: [FR-003, FR-010]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ChiTieu' } } } } } }
  /bao-cao/{nhom}:
    get:
      tags: [bao-cao]
      summary: Báo cáo một nhóm theo khoảng và bộ lọc; khoảng dài hơn CFG-M14-01 bị từ chối
      x-fr: [FR-022, FR-023, FR-024, FR-025, FR-030, FR-031, FR-032, FR-033, FR-034, FR-035, FR-036, FR-037, FR-040, FR-041, FR-042, FR-042a, FR-043, FR-044, FR-050, FR-051, FR-052, FR-053, FR-054, FR-055, FR-055a, FR-060, FR-070, FR-071, FR-072, FR-073]
      parameters:
        - { name: nhom, in: path, required: true, schema: { type: string, enum: [NGUOI_CAO_TUOI, CHAM_SOC, CHAT_LUONG, SUC_KHOE_THUOC, CHI_PHI, NHAN_SU_CA] } }
        - { $ref: '#/components/parameters/Tu' }
        - { $ref: '#/components/parameters/Den' }
        - { name: ngay, in: query, description: 'Báo cáo tại một ngày (FR-022, FR-024)', schema: { type: string, format: date } }
        - { name: tangKhuVucId, in: query, schema: { type: array, items: { type: integer, format: int64 } } }
        - { name: loaiLuuTru, in: query, schema: { type: string } }
        - { name: mucChamSocId, in: query, schema: { type: integer, format: int64 } }
        - { name: nctId, in: query, schema: { type: integer, format: int64 } }
        - { name: nhanVienId, in: query, schema: { type: integer, format: int64 } }
        - { name: caId, in: query, schema: { type: integer, format: int64 } }
        - { name: cheDoChiPhi, in: query, schema: { type: string, enum: [DA_CHOT, TAM_TINH], default: DA_CHOT } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BaoCao' } } } }
        '403': { $ref: '#/components/responses/Loi' }
        '422': { description: 'VUOT_KHOANG_TOI_DA (CFG-M14-01)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } } }
  /chi-tiet/{maChiTieu}:
    get:
      tags: [bao-cao]
      summary: Danh sách bản ghi tạo nên một con số (cùng phạm vi, bộ lọc, mốc tính); dòng người ngoài phạm vi hiện hành ở dạng rút gọn (Q-196)
      x-fr: [FR-009, FR-012, FR-014]
      parameters:
        - { name: maChiTieu, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Tu' }
        - { $ref: '#/components/parameters/Den' }
        - { name: nhomCon, in: query, description: 'Ô cụ thể (ví dụ trạng thái, tầng, nhân viên)', schema: { type: string } }
        - { name: tinhDen, in: query, description: 'Mốc "tính đến" của con số để danh sách khớp số', schema: { type: string, format: date-time } }
        - { name: trang, in: query, schema: { type: integer, minimum: 1 } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ChiTiet' } } } }, '403': { $ref: '#/components/responses/Loi' } }
  /bao-cao/{nhom}/xuat:
    post:
      tags: [xuat]
      summary: Xuất báo cáo (XLSX); Quản lý viện xuất có định danh phải nhập mục đích; vai trò khác chỉ tổng hợp
      description: Tệp chỉ được giao sau khi bản ghi nhật ký "Xuất báo cáo" đã lưu (FR-062). Tệp không đổi khi dữ liệu nguồn đổi.
      x-fr: [FR-060, FR-061, FR-062]
      parameters:
        - { name: nhom, in: path, required: true, schema: { type: string, enum: [NGUOI_CAO_TUOI, CHAM_SOC, CHAT_LUONG, SUC_KHOE_THUOC, CHI_PHI, NHAN_SU_CA] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/YeuCauXuat' } } } }
      responses:
        '201': { description: 'Mã tệp để tải và mã nhật ký' }
        '403': { $ref: '#/components/responses/Loi' }
        '422': { description: 'VUOT_KHOANG_TOI_DA, THIEU_MUC_DICH', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } } }
  /bao-cao/lan-xuat:
    get:
      tags: [xuat]
      summary: Lần xuất (Quản lý viện thấy mọi lần; người khác thấy lần của mình)
      x-fr: [FR-062]
      responses: { '200': { description: OK } }

components:
  securitySchemes:
    phien: { type: http, scheme: bearer, description: 'Token phiên opaque của 002 (A-02)' }
  parameters:
    Tu: { name: tu, in: query, schema: { type: string, format: date } }
    Den: { name: den, in: query, schema: { type: string, format: date } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  responses:
    Loi:
      description: 'Lỗi theo RFC 9457 (KHONG_CO_QUYEN, KHONG_XAC_DINH_PHAM_VI)'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Loi' } } }
  schemas:
    Loi:
      type: object
      properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string }, maLoi: { type: string } }
    ChiTieu:
      type: object
      properties: { ma: { type: string }, nhom: { type: string }, ten: { type: string }, dinhNghia: { type: string }, nguon: { type: string } }
    GiaTri:
      type: object
      properties:
        maChiTieu: { type: string }
        giaTri: { type: [number, 'null'] }
        tuSo: { type: number }
        mauSo: { type: number }
        nhan: { type: array, items: { type: string, enum: [KHONG_CO_DU_LIEU, CHUA_CAU_HINH, NGAY_CHUA_KET_THUC, CHO_XEM_LAI, LOAI_BO_LUU_TRU, TAM_TINH, TRONG_PHAM_VI_CUA_BAN] } }
        soChoXemLai: { type: integer }
        chiaNhom: { type: array, items: { type: object, properties: { khoa: { type: string }, giaTri: { type: number }, tuSo: { type: number }, mauSo: { type: number } } } }
    Dashboard:
      type: object
      properties:
        tinhDen: { type: string, format: date-time }
        khoi: { type: array, items: { type: object, properties: { nhom: { type: string }, trangThai: { type: string, enum: [DU, DANG_CAP_NHAT] }, giaTri: { type: array, items: { $ref: '#/components/schemas/GiaTri' } } } } }
        thongDiep: { type: string, description: '"hiện không có phạm vi phân công" khi trống' }
    BaoCao:
      type: object
      properties:
        nhom: { type: string }
        tu: { type: string, format: date }
        den: { type: string, format: date }
        tinhDen: { type: string, format: date-time }
        boLoc: { type: object }
        giaTri: { type: array, items: { $ref: '#/components/schemas/GiaTri' } }
        ghiChu: { type: array, items: { type: string }, description: 'Ví dụ "chi phí phát sinh của người cao tuổi, không phải báo cáo tài chính của viện"' }
    ChiTiet:
      type: object
      properties:
        maChiTieu: { type: string }
        tongSo: { type: integer }
        dong: { type: array, items: { type: object, properties: { khoaNguon: { type: string }, feature: { type: string }, loai: { type: string }, trangThai: { type: string }, moc: { type: string, format: date-time }, tangKhuVuc: { type: string }, nguoiCaoTuoi: { type: string }, rutGon: { type: boolean }, nguoiThucHien: { type: string }, ketQua: { type: object }, choXemLai: { type: boolean }, moDuocBanGhi: { type: boolean } } } }
    YeuCauXuat:
      type: object
      required: [tu, den]
      properties:
        tu: { type: string, format: date }
        den: { type: string, format: date }
        boLoc: { type: object }
        cheDoChiPhi: { type: string, enum: [DA_CHOT, TAM_TINH] }
        coDinhDanh: { type: boolean, description: 'Chỉ Quản lý viện' }
        mucDich: { type: string, description: 'Bắt buộc khi coDinhDanh' }
        dinhDang: { type: string, enum: [XLSX, CSV], default: XLSX }
