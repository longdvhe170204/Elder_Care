openapi: 3.1.0
info:
  title: Elder Care – Feature 011 (dinh dưỡng và suất ăn)
  version: 1.0.0-design
  description: |
    Hợp đồng REST của feature 011 (module M08). Quy ước chung theo research R-03 của 000:
    tiền tố /api/v1, lỗi RFC 9457 có errorCode và unmetConditions[], Idempotency-Key cho mọi lệnh ghi.
    Sửa nội dung Nháp (món, thực đơn) dùng If-Match; lệnh chuyển trạng thái khóa dòng và kiểm tra lại (research M-03).
    Hệ thống không tự chốt suất, không tự lập phiếu (Q-306): lệnh Chốt suất của Nhân viên bếp tính lại tại lúc lệnh,
    không tin số đã xem ở màn tính sẵn.
    Phản hồi cho Nhân viên bếp dùng DTO riêng (KitchenMealSlip, KitchenMenuWarning) không có dị ứng, bệnh lý,
    tên người trong cảnh báo dị ứng (FR-025 c, FR-046, SC-008).
    Tên định danh tiếng Anh theo glossary.md của 000, mục 17 (dịch 2026-11-06, chủ dự án duyệt; bản tên logic tiếng Việt ở lịch sử git).
    Truy vết: mỗi operation có x-fr (FR của spec 011) và x-br khi có.
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - { name: catalog, description: 'UC-45; mục A' }
  - { name: diet, description: 'UC-45; mục B, C' }
  - { name: menu, description: 'UC-46; mục D' }
  - { name: portion-closing, description: 'UC-47; mục E' }
  - { name: meal-slip, description: 'UC-47, UC-48; mục F, G' }
  - { name: family-food, description: 'UC-75, UC-76; mục H' }
  - { name: review-and-sample, description: 'UC-77, UC-78; mục I, J' }

paths:
  /nutrition/diets:
    get:
      tags: [catalog]
      summary: Danh mục chế độ ăn (hạn chế, món an toàn, mặc định)
      x-fr: [FR-001]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Diet' } } } } } }
    post:
      tags: [catalog]
      summary: Tạo chế độ ăn (Bác sĩ); bắt buộc món an toàn hợp lệ theo FR-005
      x-fr: [FR-001, FR-005, FR-037a]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DietCommand' } } } }
      responses: { '201': { description: OK }, '409': { $ref: '#/components/responses/Blocked' }, '422': { $ref: '#/components/responses/Problem' } }
  /nutrition/diets/{id}:
    put:
      tags: [catalog]
      summary: Sửa chế độ ăn; đổi hạn chế chạy lại FR-005 với thực đơn chưa hết tuần, báo Bác sĩ và Bếp
      x-fr: [FR-001, FR-005]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DietCommand' } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /nutrition/diets/{id}/deactivate:
    post:
      tags: [catalog]
      summary: Ngừng chế độ ăn; chặn STILL_ASSIGNED, STILL_IN_MENU
      x-fr: [FR-002]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /nutrition/food-ingredients:
    post:
      tags: [catalog]
      summary: Bác sĩ thêm thành phần thực phẩm vào danh mục dị nguyên (qua 001 DiNguyenApi.themDiNguyen)
      x-fr: [FR-003]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, description: { type: string } } } } } }
      responses: { '201': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /nutrition/dishes:
    get:
      tags: [catalog]
      summary: Danh mục món (lọc trạng thái, chế độ ăn phù hợp); kèm bản sửa chờ nếu có
      x-fr: [FR-004, FR-004a]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/DishStatus' } }
        - { name: dietId, in: query, schema: { type: integer, format: int64 } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Dish' } } } } } }
    post:
      tags: [catalog]
      summary: Tạo món Nháp (Nhân viên bếp)
      x-fr: [FR-004]
      x-br: [BR-M08-02]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DishCommand' } } } }
      responses: { '201': { description: OK }, '422': { $ref: '#/components/responses/Problem' } }
  /nutrition/dishes/{id}:
    put:
      tags: [catalog]
      summary: Sửa món Nháp; với món Hiệu lực chỉ sửa tên, ghi chú (nội dung đổi qua bản sửa)
      x-fr: [FR-004, FR-004a]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DishCommand' } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /nutrition/dishes/{id}/{command}:
    post:
      tags: [catalog]
      summary: Lệnh trên món theo bảng trạng thái
      description: |
        submit, withdraw, cancel (Nhân viên bếp); confirm, return (Bác sĩ, return cần lý do);
        submit-revision (kèm nội dung), confirm-revision, return-revision, withdraw-revision; deactivate (Nhân viên bếp, Bác sĩ; lý do;
        chặn IS_SAFE_DISH). Xác nhận bản sửa chạy lại kiểm tra thực đơn chưa hết tuần (FR-004a).
      x-fr: [FR-004, FR-004a]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: command, in: path, required: true, schema: { type: string, enum: [submit, withdraw, cancel, confirm, return, submit-revision, confirm-revision, return-revision, withdraw-revision, deactivate] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { $ref: '#/components/schemas/Reason' }, content: { $ref: '#/components/schemas/DishCommand' } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MenuCheckResult' } } } }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }
  /nutrition/meals:
    get:
      tags: [catalog]
      summary: Danh mục bữa ăn (giờ dự kiến, ngưỡng giao trễ từ CFG-M08-04)
      x-fr: [FR-006]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Meal' } } } } } }
    post:
      tags: [catalog]
      summary: Tạo bữa (Quản lý viện)
      x-fr: [FR-006]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Meal' } } } }
      responses: { '201': { description: OK } }
  /nutrition/meals/{id}:
    put:
      tags: [catalog]
      summary: Sửa, ngừng bữa; bữa đã có lần chốt không xóa được
      x-fr: [FR-006]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Meal' } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /nutrition/forbidden-food-types:
    get:
      tags: [catalog]
      summary: Danh mục loại đồ ăn bị cấm
      x-fr: [FR-007]
      responses: { '200': { description: OK } }
    post:
      tags: [catalog]
      summary: Thêm, ngừng loại đồ ăn bị cấm (Quản lý viện)
      x-fr: [FR-007]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, description: { type: string }, status: { type: string, enum: [ACTIVE, INACTIVE] } } } } } }
      responses: { '201': { description: OK } }

  /residents/{residentId}/diet-assignments:
    get:
      tags: [diet]
      summary: Bản gán hiện hành và lịch sử (Bác sĩ, Điều dưỡng, Quản lý viện)
      x-fr: [FR-010, FR-014]
      parameters: [ { $ref: '#/components/parameters/ResidentId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DietAssignment' } } } } }, '403': { $ref: '#/components/responses/Problem' } }
    post:
      tags: [diet]
      summary: Lập đề xuất bản gán (Bác sĩ); trả kết quả đối chiếu FR-016 và có cần lý do chuyên môn
      x-fr: [FR-010, FR-012, FR-013, FR-016]
      x-br: [BR-M08-03]
      parameters: [ { $ref: '#/components/parameters/ResidentId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DietAssignmentCommand' } } } }
      responses: { '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MenuCheckResult' } } } }, '409': { $ref: '#/components/responses/Blocked' } }
  /diet-assignments/{id}/apply:
    post:
      tags: [diet]
      summary: Áp dụng bản gán; Hiệu lực ngay hoặc Chờ hiệu lực (FR-017); bản cũ Ngừng cùng lệnh
      description: Chặn PROFESSIONAL_REASON_REQUIRED khi thuộc FR-013 (a)–(d); WARNINGS_NOT_CONFIRMED khi chưa gửi danh sách cảnh báo đã xem.
      x-fr: [FR-011, FR-013, FR-016, FR-017, FR-039]
      x-br: [BR-M08-03]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { professionalReason: { type: string }, confirmedWarnings: { type: array, items: { type: string } } } } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /diet-assignments/{id}/cancel:
    post:
      tags: [diet]
      summary: Hủy bản gán Đề xuất hoặc Chờ hiệu lực (lý do)
      x-fr: [FR-012]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /residents/{residentId}/dish-conflict-check:
    get:
      tags: [diet]
      summary: Kết quả đối chiếu xung đột của một người với thực đơn chưa hết tuần (Bác sĩ)
      x-fr: [FR-020, FR-022]
      x-br: [BR-M08-02, BR-M01-07]
      parameters: [ { $ref: '#/components/parameters/ResidentId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Conflict' } } } } } }

  /menus:
    get:
      tags: [menu]
      summary: Thực đơn theo tuần
      x-fr: [FR-023]
      parameters: [ { name: week, in: query, schema: { type: string, format: date } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Menu' } } } } } }
    post:
      tags: [menu]
      summary: Tạo thực đơn Nháp, tùy chọn sao chép từ thực đơn trước (Nhân viên bếp)
      x-fr: [FR-023, FR-024]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [weekStart], properties: { weekStart: { type: string, format: date }, copyFromId: { type: integer, format: int64 } } } } } }
      responses: { '201': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /menus/{id}:
    get:
      tags: [menu]
      summary: Chi tiết thực đơn (nội dung, kết quả kiểm tra, lịch sử đổi món)
      x-fr: [FR-024, FR-031]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } } } }
    put:
      tags: [menu]
      summary: Sửa nội dung thực đơn Nháp
      x-fr: [FR-024]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MenuContent' } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' }, '412': { $ref: '#/components/responses/Problem' } }
  /menus/{id}/pre-submit-info:
    get:
      tags: [menu]
      summary: "Thông tin trước khi gửi: số người theo chế độ ăn (không tên); tồn kho bỏ theo Q-392"
      x-fr: [FR-025a]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK } }
  /menus/{id}/check:
    post:
      tags: [menu]
      summary: Chạy kiểm tra độ phủ, lặp món, dị ứng trong một lần (không đổi trạng thái)
      x-fr: [FR-025, FR-026, FR-027]
      x-br: [BR-M08-06, BR-M08-07, BR-M08-08]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: 'Bếp nhận KitchenMenuWarning; Bác sĩ nhận kèm tên người', content: { application/json: { schema: { $ref: '#/components/schemas/MenuCheckResult' } } } } }
  /menus/{id}/{command}:
    post:
      tags: [menu]
      summary: Lệnh trên thực đơn theo bảng trạng thái
      description: |
        submit (Nhân viên bếp; processingCheckConfirmed bắt buộc; chặn INSUFFICIENT_COVERAGE, DISH_NOT_ACTIVE, WARNINGS_NOT_CONFIRMED);
        withdraw, cancel (Nhân viên bếp; cancel cần lý do); return (Bác sĩ, lý do); publish (Bác sĩ; chạy lại kiểm tra, tuần đã bắt đầu thì Đã áp dụng).
      x-fr: [FR-025, FR-025a, FR-028, FR-029]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: command, in: path, required: true, schema: { type: string, enum: [submit, withdraw, cancel, return, publish] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { $ref: '#/components/schemas/Reason' }, processingCheckConfirmed: { type: boolean }, processingNote: { type: string }, confirmedWarnings: { type: array, items: { type: string } } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MenuCheckResult' } } } }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }
  /menus/{id}/dish-swaps:
    post:
      tags: [menu]
      summary: Đổi món (thay, thêm, bớt món; đổi món thay thế) trên thực đơn Công bố hoặc Đã áp dụng (Nhân viên bếp; lý do); sau chốt tạo phát sinh
      x-fr: [FR-031, FR-032, FR-039]
      x-br: [BR-M08-08, BR-M08-13]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DishSwap' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MenuCheckResult' } } } }, '409': { $ref: '#/components/responses/Blocked' } }

  /daily-meals:
    get:
      tags: [portion-closing]
      summary: Các bữa trong ngày, đã chốt chưa, mốc mở chốt (giờ bữa − CFG-M08-01)
      x-fr: [FR-033]
      parameters: [ { name: date, in: query, required: true, schema: { type: string, format: date } } ]
      responses: { '200': { description: OK } }
  /daily-meals/{id}/precomputed:
    get:
      tags: [portion-closing]
      summary: Tính sẵn người được tính, số suất theo tầng và chế độ ăn, suất đặc biệt (chỉ xem; không lưu)
      x-fr: [FR-034, FR-035, FR-036, FR-036a, FR-038]
      x-br: [BR-M08-01]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ClosingResult' } } } } }
  /daily-meals/{id}/close-portions:
    post:
      tags: [portion-closing]
      summary: Chốt suất (Nhân viên bếp); tính lại tại lúc lệnh, lập phiếu mỗi tầng/khu và suất ăn người thân trong cùng lệnh
      description: Chặn BEFORE_CLOSING_TIME (trước giờ bữa − CFG-M08-01), CLOSED. Chốt sau giờ bữa được phép, mang dấu CLOSED_AFTER_MEAL_TIME.
      x-fr: [FR-033, FR-035, FR-037a, FR-038, FR-043, FR-044]
      x-br: [BR-M08-01, BR-M08-09]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ClosingResult' } } } }, '409': { $ref: '#/components/responses/Blocked' } }
  /daily-meals/{id}/adjustments:
    get:
      tags: [portion-closing]
      summary: Danh sách phát sinh của bữa (bếp thấy dạng không có thông tin sức khỏe)
      x-fr: [FR-039, FR-041]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Adjustment' } } } } } }
  /adjustments/{id}/confirm:
    post:
      tags: [portion-closing]
      summary: Bếp xác nhận phát sinh; phát sinh "+" của tầng/khu chưa có phiếu lập phiếu cùng lệnh
      x-fr: [FR-039, FR-041, FR-044]
      x-br: [BR-M08-13]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /daily-meals/{id}/extra-portions:
    post:
      tags: [portion-closing]
      summary: Người nhận tại tầng yêu cầu suất bổ sung sau giờ bữa, trong ngưỡng giao trễ
      x-fr: [FR-040]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [residentId, floorAreaId, reason], properties: { residentId: { type: integer, format: int64 }, floorAreaId: { type: integer, format: int64 }, reason: { $ref: '#/components/schemas/Reason' } } } } } }
      responses: { '201': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /special-portions/{id}/serve-held-portion:
    post:
      tags: [portion-closing]
      summary: Phục vụ suất giữ cho người trở về trong ngưỡng (tạo phát sinh "+1" không cần giao)
      x-fr: [FR-040a]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /special-portions/{id}/discard-held-portion:
    post:
      tags: [portion-closing]
      summary: Ghi hủy bỏ suất giữ khi hết ngưỡng
      x-fr: [FR-040a]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /special-portions/{id}/assign-dish:
    post:
      tags: [portion-closing]
      summary: Bác sĩ chỉ định món thay thế riêng cho bữa chưa qua giờ; sau chốt tạo phát sinh đổi suất
      x-fr: [FR-037, FR-039]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [dishId], properties: { dishId: { type: integer, format: int64 }, note: { type: string } } } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }

  /meal-slips:
    get:
      tags: [meal-slip]
      summary: Phiếu theo bữa ngày, tầng/khu (bếp nhận KitchenMealSlip; tầng nhận FloorMealSlip trong phạm vi)
      x-fr: [FR-044, FR-045, FR-046]
      x-br: [BR-M08-09, BR-M08-10]
      parameters:
        - { name: dailyMealId, in: query, schema: { type: integer, format: int64 } }
        - { name: floorAreaId, in: query, schema: { type: integer, format: int64 } }
      responses: { '200': { description: OK, content: { application/json: { schema: { oneOf: [ { type: array, items: { $ref: '#/components/schemas/KitchenMealSlip' } }, { type: array, items: { $ref: '#/components/schemas/FloorMealSlip' } } ] } } } } }
  /special-portions/{id}/mark-prepared:
    post:
      tags: [meal-slip]
      summary: Bếp đánh dấu suất đặc biệt đã chuẩn bị
      x-fr: [FR-045]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /meal-slips/{id}/{command}:
    post:
      tags: [meal-slip]
      summary: Lệnh trên phiếu theo bảng trạng thái
      description: |
        mark-prepared, deliver (Nhân viên bếp; deliver chặn theo FR-047: NOT_PREPARED, MISSING_SUBSTITUTE_DISH, ADJUSTMENTS_NOT_CONFIRMED, SAMPLE_NOT_RETAINED);
        receive, report-discrepancy (người nhận tại tầng, FR-048; report-discrepancy cần nội dung); resolve-discrepancy (Nhân viên bếp; cách xử lý).
      x-fr: [FR-047, FR-048]
      x-br: [BR-M08-10, BR-M08-11, BR-M08-15]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: command, in: path, required: true, schema: { type: string, enum: [mark-prepared, deliver, receive, report-discrepancy, resolve-discrepancy] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { content: { application/json: { schema: { type: object, properties: { content: { type: string }, resolution: { type: string, enum: [ADD_PORTION, REPLACE_PORTION, OTHER] }, description: { type: string } } } } } }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Blocked' } }
  /supplementary-portions/{id}/{command}:
    post:
      tags: [meal-slip]
      summary: Giao (bếp), nhận hoặc báo sai lệch (người nhận tại tầng) phần bổ sung của phiếu
      description: |
        report-discrepancy cần nội dung; sai lệch lưu như sai lệch của phiếu, bếp xử lý bằng resolve-discrepancy của phiếu, phiếu giữ trạng thái
        (bổ sung 2026-11-07, chủ dự án chọn, FR-048b).
      x-fr: [FR-048b]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: command, in: path, required: true, schema: { type: string, enum: [deliver, receive, report-discrepancy] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { content: { application/json: { schema: { type: object, properties: { content: { type: string } } } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /special-portions/{id}/confirm-serving:
    post:
      tags: [meal-slip]
      summary: Xác nhận phục vụ suất đặc biệt (Nhân viên chăm sóc, Điều dưỡng); ghi ngoại tuyến được
      description: |
        PORTION_WRONG_RESIDENT: chặn, không sự cố. PORTION_HAS_ALLERGEN: chặn, cảnh báo 007 mức Trung bình đã được tạo,
        yêu cầu gửi lại với hasEaten. hasEaten = true bắt buộc incident (triệu chứng, xử trí); 011 gọi 007 ghi nhận sự cố trong cùng lệnh.
        PORTION_VIOLATES_RESTRICTION: chặn khi chỉ xung đột hạn chế.
      x-fr: [FR-049, FR-050, FR-051]
      x-br: [BR-M08-14]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ServingConfirmation' } } } }
      responses: { '201': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }

  /residents/{residentId}/family-foods:
    get:
      tags: [family-food]
      summary: Đồ ăn gia đình của một người
      x-fr: [FR-052]
      parameters: [ { $ref: '#/components/parameters/ResidentId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FamilyFood' } } } } } }
    post:
      tags: [family-food]
      summary: Ghi nhận đồ ăn gia đình; hệ thống gán trạng thái theo đối chiếu (FR-053)
      x-fr: [FR-052, FR-053, FR-054, FR-057]
      x-br: [BR-M08-04]
      parameters: [ { $ref: '#/components/parameters/ResidentId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FamilyFoodCommand' } } } }
      responses: { '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FamilyFood' } } } }, '422': { $ref: '#/components/responses/Problem' } }
  /family-foods/{id}/{command}:
    post:
      tags: [family-food]
      summary: "Lệnh: approve-use (ghi chú), reject-use (lý do), record-disposal, end"
      x-fr: [FR-055, FR-057]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: command, in: path, required: true, schema: { type: string, enum: [approve-use, reject-use, record-disposal, end] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { content: { application/json: { schema: { type: object, properties: { note: { type: string }, reason: { $ref: '#/components/schemas/Reason' }, method: { type: string, enum: [RETURNED, DISCARDED, CONSUMED] }, returnedTo: { type: string } } } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }

  /nutrition/review-notices:
    get:
      tags: [review-and-sample]
      summary: Thông báo xem lại chế độ ăn đã gửi Bác sĩ (để chọn căn cứ khi lập bản gán)
      x-fr: [FR-058, FR-059]
      x-br: [BR-M08-05]
      parameters: [ { name: residentId, in: query, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK } }
  /daily-meals/{id}/retained-samples:
    get:
      tags: [review-and-sample]
      summary: Món cần lưu mẫu và bản ghi lưu mẫu
      x-fr: [FR-060, FR-061]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK } }
    post:
      tags: [review-and-sample]
      summary: Ghi lưu mẫu (Nhân viên bếp); gọi lại để thêm món mới sau phát sinh
      x-fr: [FR-060, FR-061]
      x-br: [BR-M08-15]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RetainedSampleCommand' } } } }
      responses: { '201': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }
  /retained-samples/{id}/discard:
    post:
      tags: [review-and-sample]
      summary: Ghi thời điểm hủy mẫu
      x-fr: [FR-062]
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Blocked' } }

components:
  securitySchemes:
    session: { type: http, scheme: bearer, description: 'Token phiên opaque của 002 (A-02)' }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    ResidentId: { name: residentId, in: path, required: true, schema: { type: integer, format: int64 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  headers:
    ETag: { schema: { type: string } }
  requestBodies:
    Reason:
      required: true
      content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { $ref: '#/components/schemas/Reason' } } } } }
  responses:
    Problem:
      description: Lỗi theo RFC 9457 (research R-03 của 000)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Blocked:
      description: 'STATE_CHANGED, CONDITION_NOT_MET, STILL_ASSIGNED, STILL_IN_MENU, IS_SAFE_DISH, REVISION_EXISTS, DISH_NOT_SUITABLE, PROFESSIONAL_REASON_REQUIRED, WARNINGS_NOT_CONFIRMED, MENU_EXISTS_FOR_WEEK, INSUFFICIENT_COVERAGE, DISH_NOT_ACTIVE, PAST_MEAL_TIME, BEFORE_CLOSING_TIME, CLOSED, NOT_PREPARED, MISSING_SUBSTITUTE_DISH, ADJUSTMENTS_NOT_CONFIRMED, SAMPLE_NOT_RETAINED, OUT_OF_RECEIVING_SCOPE, PAST_LATE_DELIVERY_THRESHOLD, PORTION_WRONG_RESIDENT, PORTION_HAS_ALLERGEN, PORTION_VIOLATES_RESTRICTION, NOT_ALLOWED_TO_USE'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Reason: { type: string, minLength: 1, maxLength: 2000 }
    Problem:
      type: object
      properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string }, errorCode: { type: string }, unmetConditions: { type: array, items: { type: object } } }
    Texture: { type: string, enum: [REGULAR, SOFT, PUREED] }
    DishStatus: { type: string, enum: [DRAFT, PENDING_CONFIRMATION, ACTIVE, INACTIVE, CANCELLED] }
    Diet:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        treatmentRelated: { type: boolean }
        isDefault: { type: boolean }
        restrictions: { type: array, items: { type: integer, format: int64 }, description: 'Id dị nguyên' }
        safeDishId: { type: integer, format: int64 }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    DietCommand:
      type: object
      required: [name, safeDishId]
      properties: { name: { type: string }, description: { type: string }, treatmentRelated: { type: boolean }, isDefault: { type: boolean }, restrictions: { type: array, items: { type: integer, format: int64 } }, safeDishId: { type: integer, format: int64 } }
    DishCommand:
      type: object
      required: [name, suitableDietIds, texture]
      properties:
        name: { type: string }
        note: { type: string }
        ingredients: { type: array, items: { type: integer, format: int64 } }
        noCatalogIngredient: { type: boolean }
        suitableDietIds: { type: array, minItems: 1, items: { type: integer, format: int64 } }
        texture: { $ref: '#/components/schemas/Texture' }
    Dish:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        status: { $ref: '#/components/schemas/DishStatus' }
        effective: { $ref: '#/components/schemas/DishCommand' }
        pendingRevision: { $ref: '#/components/schemas/DishCommand' }
        version: { type: integer }
    Meal:
      type: object
      required: [code, name]
      properties: { id: { type: integer, format: int64 }, code: { type: string }, name: { type: string }, servesResidential: { type: boolean }, servesDayCare: { type: boolean }, sortOrder: { type: integer }, expectedTime: { type: string, readOnly: true }, lateDeliveryThresholdMinutes: { type: integer, readOnly: true }, status: { type: string } }
    DietAssignmentCommand:
      type: object
      required: [dietId, texture, basis, effectiveFrom]
      properties:
        dietId: { type: integer, format: int64 }
        texture: { $ref: '#/components/schemas/Texture' }
        personalRestrictions: { type: array, items: { type: integer, format: int64 } }
        personalInstruction: { type: string }
        basis: { type: string, enum: [ASSESSMENT, REVIEW, OTHER] }
        basisId: { type: integer, format: int64 }
        reviewNoticeId: { type: integer, format: int64 }
        effectiveFrom: { type: string, format: date-time }
    DietAssignment:
      allOf:
        - { $ref: '#/components/schemas/DietAssignmentCommand' }
        - type: object
          properties: { id: { type: integer, format: int64 }, status: { type: string, enum: [PROPOSED, PENDING_EFFECTIVE, ACTIVE, DISCONTINUED, CANCELLED] }, actualEffectiveAt: { type: string, format: date-time }, professionalReason: { type: string }, isDefault: { type: boolean, description: 'Chế độ ăn mặc định do chưa gán (FR-014)' } }
    Conflict:
      type: object
      properties: { date: { type: string, format: date }, mealId: { type: integer, format: int64 }, dishId: { type: integer, format: int64 }, ingredients: { type: array, items: { type: integer, format: int64 } }, type: { type: string, enum: [ALLERGY, PERSONAL_RESTRICTION, DIET_RESTRICTION] }, hasSuitableSubstitute: { type: boolean } }
    MenuCheckResult:
      type: object
      properties:
        coverageGaps: { type: array, items: { type: object, properties: { dietId: { type: integer, format: int64 }, date: { type: string, format: date }, mealId: { type: integer, format: int64 } } } }
        dishRepetitions: { type: array, items: { type: object } }
        allergies: { type: array, items: { type: object, description: 'Bếp: residentCount; Bác sĩ: kèm tên người' } }
        professionalReasonRequired: { type: boolean }
        warningCodes: { type: array, items: { type: string } }
    MenuContent:
      type: object
      properties:
        dishes: { type: array, items: { type: object, required: [date, mealId, dietId, dishId], properties: { date: { type: string, format: date }, mealId: { type: integer, format: int64 }, dietId: { type: integer, format: int64 }, dishId: { type: integer, format: int64 }, substituteDishIds: { type: array, items: { type: integer, format: int64 } } } } }
    Menu:
      type: object
      properties: { id: { type: integer, format: int64 }, weekStart: { type: string, format: date }, status: { type: string, enum: [DRAFT, PENDING_PUBLICATION, PUBLISHED, APPLIED, CANCELLED] }, version: { type: integer } }
    DishSwap:
      type: object
      description: |
        Sửa 2026-11-06 (chủ dự án chọn, FR-031, FR-032): oldDishId và newDishId là thay món; chỉ newDishId là thêm món (bổ sung bữa
        trống); chỉ oldDishId là bớt món; oldDishId = newDishId kèm substituteDishIds là chỉ đổi món thay thế. Cần ít nhất một
        trong hai. substituteDishIds là danh sách món thay thế mới của món sau (vắng thì giữ danh sách cũ, thêm món thì rỗng).
      required: [date, mealId, dietId, reason]
      properties: { date: { type: string, format: date }, mealId: { type: integer, format: int64 }, dietId: { type: integer, format: int64 }, oldDishId: { type: integer, format: int64 }, newDishId: { type: integer, format: int64 }, substituteDishIds: { type: array, items: { type: integer, format: int64 } }, reason: { $ref: '#/components/schemas/Reason' }, confirmedWarnings: { type: array, items: { type: string } } }
    ClosingResult:
      type: object
      properties:
        dailyMealId: { type: integer, format: int64 }
        portionsByFloorArea: { type: array, items: { type: object, properties: { floorAreaId: { type: integer, format: int64 }, dietId: { type: integer, format: int64 }, portionCount: { type: integer } } } }
        specialPortions: { type: integer }
        familyMealPortions: { type: integer }
        flags: { type: array, items: { type: string, enum: [NO_MENU, CLOSED_AFTER_MEAL_TIME, MISSING_SUBSTITUTE_DISH, NO_DIET_ASSIGNED] } }
        missingData: { type: array, items: { type: string, enum: [STAY, TRIP] } }
    Adjustment:
      type: object
      properties: { id: { type: integer, format: int64 }, floorAreaId: { type: integer, format: int64 }, dietId: { type: integer, format: int64 }, portionCount: { type: integer }, changeType: { type: string }, needsDelivery: { type: boolean }, kitchenConfirmedAt: { type: string, format: date-time } }
    KitchenMealSlip:
      type: object
      description: 'Chỉ trường FR-046; không có dị ứng, bệnh lý, thành phần xung đột'
      properties:
        id: { type: integer, format: int64 }
        floorArea: { type: string }
        meal: { type: string }
        portionsByDiet: { type: array, items: { type: object, properties: { diet: { type: string }, portionCount: { type: integer } } } }
        labels: { type: array, items: { type: object, properties: { id: { type: integer, format: int64 }, fullName: { type: string }, room: { type: string }, diet: { type: string }, texture: { $ref: '#/components/schemas/Texture' }, dishes: { type: string }, flags: { type: array, items: { type: string } }, prepared: { type: boolean } } } }
        status: { type: string, enum: [CLOSED, PREPARED, DELIVERED, HAS_DISCREPANCY, RECEIVED] }
        flags: { type: array, description: 'Dấu mức phiếu FR-046 (bổ sung 2026-11-07, chủ dự án chọn): NO_MENU = chưa có thực đơn công bố, CLOSED_AFTER_MEAL_TIME = chốt sau giờ bữa', items: { type: string, enum: [NO_MENU, CLOSED_AFTER_MEAL_TIME] } }
        supplementaryPortions: { type: array, description: 'Phần bổ sung FR-048b (bổ sung 2026-11-07, chủ dự án chọn; labels[].id cùng lần)', items: { type: object, properties: { id: { type: integer, format: int64 }, dietId: { type: integer, format: int64 }, portionCount: { type: integer }, deliveredAt: { type: string, format: date-time }, receivedAt: { type: string, format: date-time } } } }
    FloorMealSlip:
      allOf:
        - { $ref: '#/components/schemas/KitchenMealSlip' }
        - type: object
          properties: { needsCrossCheck: { type: array, items: { type: integer, format: int64 }, description: 'Người có dị ứng loại khác (FR-036a)' }, allergies: { type: array, items: { type: object }, description: 'Chỉ khi có quyền xem dị ứng' } }
    ServingConfirmation:
      type: object
      required: [residentId]
      properties:
        residentId: { type: integer, format: int64, description: Người đang được phục vụ }
        hasEaten: { type: boolean, description: 'Chỉ gửi sau khi bị chặn PORTION_HAS_ALLERGEN' }
        incident: { type: object, properties: { severity: { type: string }, symptoms: { type: string }, treatment: { type: string } } }
        deviceTime: { type: string, format: date-time }
    FamilyFoodCommand:
      type: object
      required: [senderName, type, description, expiresAt, storageMethod]
      properties: { senderName: { type: string }, familyMemberId: { type: integer, format: int64 }, type: { type: string }, description: { type: string }, ingredients: { type: array, items: { type: integer, format: int64 } }, ingredientsUnknown: { type: boolean }, expiresAt: { type: string, format: date-time }, storageMethod: { type: string } }
    FamilyFood:
      allOf:
        - { $ref: '#/components/schemas/FamilyFoodCommand' }
        - type: object
          properties: { id: { type: integer, format: int64 }, status: { type: string, enum: [NOT_ALLOWED, NEEDS_CONFIRMATION, ALLOWED, ENDED] }, systemReasons: { type: array, items: { type: string } } }
    RetainedSampleCommand:
      type: object
      required: [dishes]
      properties: { storageLocation: { type: string }, dishes: { type: array, items: { type: object, required: [dishId, retained], properties: { dishId: { type: integer, format: int64 }, retained: { type: boolean }, notRetainedReason: { type: string } } } } }
