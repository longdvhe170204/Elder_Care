name: verify

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Ho_Chi_Minh
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/eldercare_test
      TEST_DB_ADMIN_USER: root
      TEST_DB_ADMIN_PASSWORD: ci-root
      DB_PASSWORD: ci-app
      DB_RETENTION_PASSWORD: ci-retention
      JAVA_TOOL_OPTIONS: -Xmx2g
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Start MySQL
        run: |
          docker run -d --name mysql -p 3306:3306 -e MYSQL_ROOT_PASSWORD=ci-root mysql:8.0 --lower-case-table-names=1 --default-time-zone=+00:00 --max-connections=500
          for i in $(seq 1 30); do
            docker exec mysql mysqladmin ping -h 127.0.0.1 -uroot -pci-root --silent && break
            sleep 2
          done
      - name: Verify
        run: sh ./mvnw -B clean verify -Dit.forkCount=3
      - name: Diagnostics
        if: always()
        run: |
          free -m
          df -h /
          docker ps -a
          docker logs --tail 40 mysql
          docker exec mysql mysql -uroot -pci-root -e "SHOW FULL PROCESSLIST" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          retention-days: 14