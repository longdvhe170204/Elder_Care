# Lint, định dạng của app (000 T008b). `flutter analyze` phải không có lỗi; `dart format lib test` theo độ rộng dưới.
include: package:flutter_lints/flutter.yaml

formatter:
  # Cùng độ rộng dòng với mã đã có và với backend, web (120 ký tự)
  page_width: 120

analyzer:
  exclude:
    # Mã sinh (drift, client API) không kiểm lint
    - "**/*.g.dart"
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_single_quotes
    - directives_ordering
    - always_declare_return_types
    - prefer_final_locals
    - unawaited_futures
    - avoid_dynamic_calls
